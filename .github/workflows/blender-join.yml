name: Blender-Teile nachtraeglich zusammenfuegen

# mg/blender_join_queue.txt: "<name> <run_id> [crf] [run_id2]" (run_id2: Lauf mit nachgerenderten Teilen) -> laedt part-*.mp4 eines blender-chunks-Laufs, kodiert neu (unter 100 MB) und legt
# renders/<name>/<name>_silent.mp4 im Branch "renders" ab.
on:
  push:
    branches: [main]
    paths: ["mg/blender_join_queue.txt"]
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  join:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - id: q
        run: |
          echo "n=$(grep -v '^#' mg/blender_join_queue.txt | awk 'NF{print $1; exit}')" >> "$GITHUB_OUTPUT"
          echo "r=$(grep -v '^#' mg/blender_join_queue.txt | awk 'NF{print $2; exit}')" >> "$GITHUB_OUTPUT"
          echo "c=$(grep -v '^#' mg/blender_join_queue.txt | awk 'NF{print ($3==""?18:$3); exit}')" >> "$GITHUB_OUTPUT"
          echo "r2=$(grep -v '^#' mg/blender_join_queue.txt | awk 'NF{print $4; exit}')" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with: { pattern: "part-*", path: parts, merge-multiple: true, run-id: "${{ steps.q.outputs.r }}", github-token: "${{ github.token }}" }
      - uses: actions/download-artifact@v4
        if: steps.q.outputs.r2 != ''
        with: { pattern: "part-*", path: parts, merge-multiple: true, run-id: "${{ steps.q.outputs.r2 }}", github-token: "${{ github.token }}" }
      - name: Zusammenfuegen + ablegen
        run: |
          sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends ffmpeg >/dev/null || true
          NAME=${{ steps.q.outputs.n }}
          ls parts; [ "$(ls parts | wc -l)" = "20" ] || { echo "nicht alle 20 Teile da"; exit 1; }
          for f in $(ls parts | sort); do echo "file 'parts/$f'" >> list.txt; done; cat list.txt
          ffmpeg -v error -y -f concat -safe 0 -i list.txt -c:v libx264 -crf ${{ steps.q.outputs.c }} -preset slow -pix_fmt yuv420p ${NAME}_silent.mp4
          ls -la ${NAME}_silent.mp4; ffprobe -v error -show_entries format=duration -of csv=p=0 ${NAME}_silent.mp4
          git config --global user.name "mg-bot"; git config --global user.email "mg-bot@users.noreply.github.com"
          for k in 1 2 3 4 5 6 7 8; do
            rm -rf rb
            git clone --depth 1 --branch renders "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" rb
            mkdir -p rb/renders/$NAME && cp ${NAME}_silent.mp4 rb/renders/$NAME/
            cd rb && git add -A && git commit -qm "blender-join $NAME" && git push -q origin renders && cd .. && exit 0
            cd ..; sleep $((k*7))
          done
          exit 1
