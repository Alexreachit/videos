name: Kino-Pipeline – Tests

on:
  push:
    paths: ["cine/**", "tests/**", "episodes/**", ".github/workflows/cine-*.yml"]
  workflow_dispatch:

concurrency:
  group: cine-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: cine/requirements.txt }
      - name: ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-dejavu-core >/dev/null
      - run: pip install -r cine/requirements.txt
      - name: Tests (kostenlos, ohne API-Aufrufe)
        run: python -m pytest -q tests/
