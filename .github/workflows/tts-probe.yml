name: TTS Probe
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -U edge-tts && pip list | grep -i edge
      - name: PyPI-Version
        run: python probe_tts.py
      - name: Entwicklerversion (git main)
        run: |
          pip install -U "git+https://github.com/rany2/edge-tts.git"
          python probe_tts.py
      - name: Neues Protokoll
        run: |
          pip install -U edge-tts certifi
          python probe_new.py
      - name: Patch-Test
        run: python probe_patch.py
