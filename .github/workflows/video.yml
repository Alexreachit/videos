name: Video bauen

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Testlauf mit stiller Tonspur und Platzhalterbildern?"
        type: boolean
        default: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Programme installieren
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core
          pip install edge-tts piper-tts

      - name: Video bauen
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            python build_video.py --dry-run
          else
            python build_video.py
          fi

      - name: Video zum Download bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: video
          path: output/*.mp4
          retention-days: 14
