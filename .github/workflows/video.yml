name: Video bauen

on:
  workflow_dispatch:
    inputs:
      modus:
        description: "Was soll passieren?"
        type: choice
        default: bilder
        options:
          - bilder
          - video
          - testlauf
      max_bilder:
        description: "Nur bei 'bilder': so viele neue Bilder pro Lauf (0 = alle fehlenden)"
        type: string
        default: "37"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Bilder erzeugen
        if: inputs.modus == 'bilder'
        env:
          POLLINATIONS_KEY: ${{ secrets.POLLINATIONS_KEY }}
        run: python generate_images.py --max "${{ inputs.max_bilder }}"

      - name: Neue Bilder im Repo speichern
        if: inputs.modus == 'bilder'
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add bilder
          if git diff --cached --quiet; then
            echo "Keine neuen Bilder."
          else
            git commit -m "Neue Bilder"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push
          fi

      - name: Programme installieren
        if: inputs.modus != 'bilder'
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core
          pip install edge-tts piper-tts

      - name: Video bauen
        if: inputs.modus != 'bilder'
        run: |
          if [ "${{ inputs.modus }}" = "testlauf" ]; then
            python build_video.py --dry-run
          else
            python build_video.py
          fi

      - name: Video zum Download bereitstellen
        if: inputs.modus != 'bilder'
        uses: actions/upload-artifact@v4
        with:
          name: video
          path: output/*.mp4
          retention-days: 14
