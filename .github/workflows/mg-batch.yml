name: Motion Graphics Warteschlange

# Rendert alle Projekte aus mg/render_queue.txt parallel (je ein Job) und legt die fertigen
# Videos im Branch "renders" unter renders/<projekt>/ ab. Start: Push, der mg/render_queue.txt aendert.
on:
  push:
    branches: [main]
    paths: ["mg/render_queue.txt"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      list: ${{ steps.q.outputs.list }}
    steps:
      - uses: actions/checkout@v4
      - id: q
        run: |
          L=$(grep -v '^#' mg/render_queue.txt | awk 'NF{print $1}' | python3 -c "import sys,json;print(json.dumps([l.strip() for l in sys.stdin if l.strip()]))")
          echo "list=$L" >> "$GITHUB_OUTPUT"; echo "$L"

  build:
    needs: plan
    if: needs.plan.outputs.list != '[]'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 12
      matrix:
        projekt: ${{ fromJson(needs.plan.outputs.list) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Programme installieren
        timeout-minutes: 25
        run: |
          set +e -o pipefail
          {
          APT="-o Acquire::Retries=5 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20"
          echo "== ffmpeg"; if ! command -v ffmpeg; then
            timeout 200 sudo apt-get $APT install -y --no-install-recommends ffmpeg || { timeout 150 sudo apt-get $APT update && timeout 200 sudo apt-get $APT install -y --no-install-recommends ffmpeg; } || true
          fi
          if ! command -v ffmpeg; then echo "apt failed -> static ffmpeg via pip"
            pip install static-ffmpeg && static_ffmpeg_paths && F=$(python -c "import static_ffmpeg.run as r;print(r.get_or_fetch_platform_executables_else_raise()[0])") && sudo ln -sf "$F" /usr/local/bin/ffmpeg && sudo ln -sf "$(dirname "$F")/ffprobe" /usr/local/bin/ffprobe
          fi
          echo "== fonts"; timeout 120 sudo apt-get $APT install -y --no-install-recommends fonts-dejavu-core fonts-liberation || echo "fonts skipped"
          echo "== pip"; for i in 1 2 3; do timeout 240 pip install edge-tts numpy playwright && break; sleep 5; done
          echo "== chromium"; for i in 1 2 3; do timeout 300 python -m playwright install chromium && break; sleep 5; done
          python -c "from playwright.sync_api import sync_playwright as s;p=s().start();p.chromium.launch().close();print('chromium ok')" || { echo "== deps"; timeout 400 sudo python -m playwright install-deps chromium; }
          ffmpeg -version | head -1
          } 2>&1 | tee install.log
          code=${PIPESTATUS[0]}; if [ $code -ne 0 ]; then tail -15 install.log | while read -r l; do echo "::warning::$l"; done; exit $code; fi
      - name: Video bauen (Stimme Andrew, Animation, Ton)
        run: python mg/produce.py "${{ matrix.projekt }}" --workers 4 2>&1 | tee build.log
      - name: Groesse pruefen (GitHub-Grenze 100 MB)
        run: |
          F=output/${{ matrix.projekt }}_final.mp4
          S=$(stat -c%s "$F"); echo "Groesse $S"
          # zu gross fuer GitHub: ohne Qualitaetsverlust in 90-MB-Teile splitten (zusammensetzen: cat *.part* > x.mp4)
          if [ "$S" -gt 95000000 ]; then
            split -b 90M -d --additional-suffix=.part "$F" "$F."
            rm "$F"; ls -la output/
          fi
      - name: In Branch renders ablegen
        run: |
          P=${{ matrix.projekt }}
          git config --global user.name "mg-bot"; git config --global user.email "mg-bot@users.noreply.github.com"
          for k in 1 2 3 4 5 6 7 8; do
            rm -rf rb
            if git ls-remote --exit-code --heads origin renders >/dev/null; then
              git clone --depth 1 --branch renders "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" rb
            else
              mkdir rb && cd rb && git init -q -b renders && git remote add origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" && cd ..
            fi
            mkdir -p rb/renders/$P
            cp output/${P}_final.mp4* rb/renders/$P/
            cp output/mg_${P}/timeline.json rb/renders/$P/ || true
            cp build.log rb/renders/$P/ || true
            cd rb && git add -A && git commit -qm "render $P (${{ github.sha }})" && git push -q origin renders && cd .. && exit 0
            cd ..; sleep $((k*7))
          done
          exit 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mg-${{ matrix.projekt }}
          path: |
            output/*_final.mp4*
            build.log
            install.log
          retention-days: 14
