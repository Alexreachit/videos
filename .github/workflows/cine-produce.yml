name: Kino-Pipeline – Produktion

# GitHub Actions orchestriert nur: Die Videoclips erzeugt der externe Anbieter
# (Replicate/Gemini Omni). Schnitt, Ton, Prüfung und Rendering laufen hier per ffmpeg.
#
# Ablauf für ein echtes Video:
#   1. modus = kosten_schaetzen  -> Zusammenfassung zeigt Kosten + Freigabe-Code
#   2. modus = produktion, freigabe_code + max_usd eintragen -> startet
# Ohne gültigen Code bleibt der Lauf VOR dem ersten kostenpflichtigen Aufruf stehen.

on:
  workflow_dispatch:
    inputs:
      modus:
        description: "Was soll passieren?"
        type: choice
        default: kosten_schaetzen
        options: [plan, kosten_schaetzen, testlauf_kostenlos, produktion, szene_neu]
      episode:
        description: "Episode-Datei"
        type: string
        default: episodes/zombie_ep01.yaml
      aufloesung:
        description: "Auflösung"
        type: choice
        default: 720p
        options: [720p, 1080p]
      freigabe_code:
        description: "Freigabe-Code aus der Kostenschätzung (nur bei produktion/szene_neu)"
        type: string
        default: ""
      max_usd:
        description: "Höchstbudget in USD für diese Freigabe"
        type: string
        default: "0"
      szene:
        description: "Nur bei szene_neu: Szenen-ID, z. B. s04"
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: cine-produce-${{ inputs.episode }}
  cancel-in-progress: false   # laufende (bezahlte) Produktion nie abbrechen

jobs:
  produce:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    env:
      VIDEO: ${{ inputs.modus == 'testlauf_kostenlos' && 'mock' || 'replicate' }}
      RES: ${{ inputs.modus == 'testlauf_kostenlos' && '360p' || inputs.aufloesung }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: cine/requirements.txt }
      - name: ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-dejavu-core >/dev/null
      - run: pip install -r cine/requirements.txt

      - name: Produktions-ID
        id: pid
        run: |
          EP=$(python -c "import yaml,sys;print(yaml.safe_load(open(sys.argv[1]))['id'])" "${{ inputs.episode }}")
          echo "id=${EP}_${VIDEO}" >> "$GITHUB_OUTPUT"

      # Zwischenstände (Clips, Freigabe, Kosten) überleben zwischen Läufen -> Wiederaufnahme
      - name: Zwischenstand laden
        uses: actions/cache/restore@v4
        with:
          path: productions/${{ steps.pid.outputs.id }}
          key: cine-${{ steps.pid.outputs.id }}-${{ github.run_id }}
          restore-keys: cine-${{ steps.pid.outputs.id }}-

      - name: Plan
        if: inputs.modus == 'plan'
        run: python -m cine plan "${{ inputs.episode }}" --video "$VIDEO" --resolution "$RES" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Kosten schätzen
        if: inputs.modus == 'kosten_schaetzen' || inputs.modus == 'produktion' || inputs.modus == 'szene_neu'
        run: |
          echo "## Kostenschätzung" >> "$GITHUB_STEP_SUMMARY"
          python -m cine estimate "${{ inputs.episode }}" --video "$VIDEO" --resolution "$RES" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Freigabe
        if: (inputs.modus == 'produktion' || inputs.modus == 'szene_neu') && inputs.freigabe_code != ''
        run: python -m cine approve "${{ inputs.episode }}" --video "$VIDEO" --resolution "$RES" --code "${{ inputs.freigabe_code }}" --max-usd "${{ inputs.max_usd }}"

      - name: Testlauf (kostenlos, Platzhalter-Clips)
        if: inputs.modus == 'testlauf_kostenlos'
        run: python -m cine run "${{ inputs.episode }}" --video mock --resolution 360p

      - name: Produktion
        if: inputs.modus == 'produktion'
        env:
          REPLICATE_API_TOKEN: ${{ secrets.REPLICATE_API_TOKEN }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python -m cine run "${{ inputs.episode }}" --video "$VIDEO" --resolution "$RES"

      - name: Szene neu
        if: inputs.modus == 'szene_neu' && inputs.szene != ''
        env:
          REPLICATE_API_TOKEN: ${{ secrets.REPLICATE_API_TOKEN }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python -m cine redo "${{ inputs.episode }}" --scene "${{ inputs.szene }}" --video "$VIDEO" --resolution "$RES"

      - name: Bericht
        if: always()
        run: |
          D="productions/${{ steps.pid.outputs.id }}"
          python -m cine status "${{ steps.pid.outputs.id }}" >> "$GITHUB_STEP_SUMMARY" || true
          [ -f "$D/output/bericht.md" ] && cat "$D/output/bericht.md" >> "$GITHUB_STEP_SUMMARY" || true

      - name: Zwischenstand speichern
        if: always()
        uses: actions/cache/save@v4
        with:
          path: productions/${{ steps.pid.outputs.id }}
          key: cine-${{ steps.pid.outputs.id }}-${{ github.run_id }}

      - name: Video + Dashboard herunterladen
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.pid.outputs.id }}
          if-no-files-found: ignore
          retention-days: 30
          path: |
            productions/${{ steps.pid.outputs.id }}/output/
            productions/${{ steps.pid.outputs.id }}/dashboard.html
            productions/${{ steps.pid.outputs.id }}/qc/
            productions/${{ steps.pid.outputs.id }}/prompts/
            productions/${{ steps.pid.outputs.id }}/handoff/
            productions/${{ steps.pid.outputs.id }}/estimate.md
            productions/${{ steps.pid.outputs.id }}/plan.md
            productions/${{ steps.pid.outputs.id }}/log.txt
