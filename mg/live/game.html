const mmss = s => { s = Math.max(0, Math.ceil(s)); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0') };

const esc2 = s => String(s).replace(/[<>&]/g, c => ({ '<': '&lt;', '>': '&gt;', '&': '&amp;' })[c]).slice(0, 220);
// ---------------- Hauptschleife ----------------
let last = null;
function tick(t) {
  const dt = last == null ? 0 : Math.min(.1, t - last); last = t; ST.t = t;
  if (SIM) simStep(t);

  if (t >= ST.hh.next) { ST.hh.until = t + 60; ST.hh.next = t + 240; banner('HAPPY HOUR!', '#ff8a3d', 'Alles zählt jetzt ×3!'); if (localComment) say('Happy Hour! Jetzt zählt alles dreifach!', 2) }

  if (!ST.say || t > ST.say.end + .4) { const e = ST.sayQ.shift(); if (e) { ST.say = { text: e.text, t, end: t + (e.dur || Math.max(2.2, e.text.length * .065)) }; ST.lastSay = t; playSay(e) } }

    if (!g.user) { g.m.vis = false; return }

    const cheer = ST.banners.length && t - ST.banners[ST.banners.length - 1].t < 2.5;
    g.m.pos = [g.x, iH(g.x, g.z) + hop + (cheer ? Math.max(0, Math.sin(t * 8 + g.k)) * .25 : 0), g.z]; g.m.rot = [0, g.yaw, 0]; g.m.scl = [s, s, s];
    g.aL.rot = [0, 0, cheer ? -2.5 : -.15 - Math.sin(t * 9 + g.k) * .3]; g.aR.rot = [0, 0, cheer ? 2.5 : .15 + Math.sin(t * 9 + g.k) * .3];
  });
  // Haeuser poppen / wachsen
  ST.users.forEach(u => { const h = u.house; if (!h || !h.m) return; const k = bo(cl(t, h.up, h.up + .5)); h.m.scl = [1, Math.max(.02, k), 1] });
  LM.forEach(l => { l.m.vis = l.done; if (l.done) { const k = bo(cl(t, l.t, l.t + .7)); l.m.scl = [k, k, k] } });
  w.render(t);

  let ov = '';
  topHouses(3).forEach((u, k) => { ov += labelAt([u.house.p.x, u.house.p.y + 2.6 + u.house.lv * .5, u.house.p.z], `<div class="pill" style="position:relative;font-size:26px;padding:4px 14px;border-width:4px;background:${['#ffd166', '#e9eef5', '#f0b27a'][k]};color:${OL}">${['🥇', '🥈', '🥉'][k]} ${esc(u.name)}</div>`) });
  if (ST.camFocus && t - ST.camFocus.t < ST.camFocus.dur) { const f = ST.camFocus.p; }
  POOL.forEach(g => { if (g.user && t - g.born < 4) ov += labelAt([g.x, iH(g.x, g.z) + 1.7, g.z], `<div class="pill" style="position:relative;font-size:22px;padding:2px 12px;border-width:3px;background:#fff;color:${OL}">${esc(g.user.name)}</div>`) });

    if (p) ov += labelAt(p, `<div style="text-align:center;transform:translateY(${-Math.abs(Math.sin(t * 6)) * 20}px)"><div class="pill" style="position:relative;font-size:34px;background:#ff5d5d;color:#fff">@${esc(u.name)} – HIER!</div><div style="font-size:90px;line-height:1">👇</div></div>`) }

  if (t < ST.hh.until) fx += `<div style="position:absolute;inset:0;box-shadow:inset 0 0 120px #ffb34788"></div>`;
  $('fx').innerHTML = fx;
