<!doctype html><meta charset=utf-8><style>
@font-face{font-family:P;src:url(fonts/Poppins-Bold.ttf);font-weight:700}
@font-face{font-family:P;src:url(fonts/Poppins-Medium.ttf);font-weight:500}
html,body{margin:0;background:#4fa6e6}
#stage{position:relative;width:1080px;height:1920px;overflow:hidden;font-family:P,Arial,sans-serif;background:linear-gradient(#5fb4ff 0%,#8fd3ff 45%,#c7ecff 72%,#e9f7ff 100%)}
#sky,#cam,#fx,#grade,#cap{position:absolute;inset:0}
#cam{transform-origin:540px 900px}
#cap{z-index:60}
</style>
<div id=stage><div id=sky></div><div id=cam><div id=fg style="position:absolute;inset:0"></div></div><div id=fx></div><div id=grade></div><div id=cap></div></div>
<script src="../lib/core.js"></script>
<script>
// Short 9:16 – GameStop squeeze. "Team look" upgrades: parallax night skyline (3 depths), camera shake + zoom punches,
// light rays, ambient + burst particles, kinetic typography, contact shadows, per-scene colour grade.
const {cl,ez,ei,bo,el,lerp}=MG,$=MG.$,W=1080,H=1920;
const C={cream:'#fff6e6',gold:'#ffc94a',green:'#3ddc84',green2:'#1fa45a',red:'#ff5b4a',red2:'#d6402e',ink:'#14202c',neon:'#16c172'};
let TL=null,fontsOk=false,imgReady=false,SHAKES=[],PUNCH=[],BURSTS=[];
const S=i=>TL.lines[i].start,E=i=>TL.lines[i].end,DU=i=>E(i)-S(i),SP=i=>TL.lines[i].spec;
const sg=(t,a,b)=>ei(cl(t,a,b)),R=MG.rnd;
const IM=k=>`img/${k}.png`;
const LW=w=>TL?2*Math.PI*Math.max(1,Math.round(w*TL.dur/(2*Math.PI)))/TL.dur:w;// loop-safe angular speed
const fl=(t,i,a=8)=>Math.sin(t*LW(2.1)+i*1.7)*a;
function obj(k,x,y,w,o={}){const op=o.op??1;if(op<=0.001||w<=1)return'';return `<img src="${IM(k)}" style="position:absolute;left:0;top:0;width:${w.toFixed(1)}px;transform:translate(${(x-w/2).toFixed(1)}px,${(y-w/2).toFixed(1)}px) rotate(${(o.rot||0).toFixed(2)}deg) scaleX(${o.flip?-1:1});opacity:${op.toFixed(3)};filter:drop-shadow(0 ${(w/22).toFixed(0)}px ${(w/14).toFixed(0)}px #000a)${o.glow?` drop-shadow(0 0 ${o.glow}px ${o.gcol||'#38ff9c'})`:''}">`}
function shadow(x,y,w,op=1){return `<div style="position:absolute;left:${x-w/2}px;top:${y-w*.06}px;width:${w}px;height:${w*.12}px;border-radius:50%;background:radial-gradient(#000a,#0000 70%);opacity:${op.toFixed(2)}"></div>`}
function TX(x,y,txt,o={}){const p=o.p??1;if(p<=0)return'';const sz=o.size||64,s=o.s??1;
 return `<div style="position:absolute;left:${x}px;top:${y}px;transform:translate(-50%,-50%) translateY(${((1-Math.min(1,p))*22).toFixed(1)}px) scale(${s.toFixed(3)}) rotate(${o.rot||0}deg);opacity:${Math.min(1,p).toFixed(3)};font:700 ${sz}px/1.05 P,Arial;color:${o.col||C.cream};white-space:nowrap;text-align:center;text-shadow:${MG.outline(o.ol||Math.max(3,Math.round(sz/13)))},0 ${sz/9}px ${sz/3}px #000c${o.glow?`,0 0 ${sz/3}px ${o.glow}`:''}">${txt}</div>`}
// kinetic type: words pop in one after another with overshoot + slight rotation
function KT(x,y,txt,t,t0,o={}){const ws=txt.split(' '),sz=o.size||80,gap=o.stag??.07;let h='';
 const spans=ws.map((w,i)=>{const q=cl(t,t0+i*gap,t0+i*gap+.28);if(q<=0)return `<span style="display:inline-block;opacity:0">${w}</span>`;const s=bo(q),r=(1-ez(q))*(i%2?8:-8);
  return `<span style="display:inline-block;transform:scale(${s.toFixed(3)}) rotate(${r.toFixed(1)}deg);opacity:${Math.min(1,q*3).toFixed(2)}">${w}</span>`}).join(' ');
 return `<div style="position:absolute;left:${x}px;top:${y}px;transform:translate(-50%,-50%);font:700 ${sz}px/1.05 P;color:${o.col||C.cream};white-space:nowrap;text-shadow:${MG.outline(Math.max(3,Math.round(sz/13)))},0 ${sz/9}px ${sz/3}px #000c${o.glow?`,0 0 ${sz/2.5}px ${o.glow}`:''}">${spans}</div>`}
function pill(x,y,txt,o={}){const p=o.p??1;if(p<=0)return'';const sz=o.size||36,s=bo(Math.min(1,p))*(o.s??1);
 const dot=o.dot?`<span style="display:inline-block;width:${sz*.62}px;height:${sz*.62}px;border-radius:50%;background:${o.dot};margin-right:${sz*.3}px;vertical-align:-${sz*.06}px;box-shadow:0 0 12px ${o.dot}"></span>`:'';
 return `<div style="position:absolute;left:${x}px;top:${y}px;transform:translate(-50%,-50%) scale(${s.toFixed(3)});opacity:${Math.min(1,p*2).toFixed(3)};padding:${sz*.34}px ${sz*.7}px;border-radius:${sz*1.2}px;background:${o.bg||'#ffffffee'};color:${o.fg||C.ink};font:700 ${sz}px/1.1 P,Arial;white-space:nowrap;box-shadow:0 10px 26px #000a">${dot}${txt}</div>`}
function stamp(x,y,txt,p,col=C.red,rot=-8,sz=70){if(p<=0)return'';const s=lerp(2.2,1,ez(Math.min(1,p)));return `<div style="position:absolute;left:${x}px;top:${y}px;transform:translate(-50%,-50%) rotate(${rot}deg) scale(${s.toFixed(3)});opacity:${Math.min(1,p*2.5).toFixed(3)};padding:10px 30px;border:8px solid ${col};border-radius:18px;color:${col};font:700 ${sz}px/1 P;letter-spacing:3px;background:#ffffffe6;white-space:nowrap;box-shadow:0 14px 30px #000a">${txt}</div>`}
const money=v=>'$'+MG.fmt(Math.round(v),0);
// ---------- WORLD: parallax night skyline (3 depths) + rays + stars
function skyline(t,depth,seed,base,hgt,col,win){let h='';const sp=[4,10,22][depth],n=[16,11,8][depth],w0=1400/n;
 for(let i=0;i<n+2;i++){const bw=w0*(.7+R(seed+i)*.5),bh=hgt*(.45+R(seed+i+50)*.55),x=i*w0-w0*.5+Math.sin(2*Math.PI*t/TL.dur+depth)*sp*6;
  let wins='';if(win){for(let r=0;r<Math.floor(bh/46);r++)for(let c=0;c<Math.floor(bw/38);c++){if(R(seed*7+i*31+r*5+c)>.62)wins+=`<div style="position:absolute;left:${10+c*38}px;top:${14+r*46}px;width:16px;height:22px;background:#e9f6ff;opacity:${(.45+.4*R(i+r+c+seed)).toFixed(2)}"></div>`}}
  h+=`<div style="position:absolute;left:${x.toFixed(1)}px;top:${(base-bh).toFixed(1)}px;width:${bw.toFixed(1)}px;height:${bh.toFixed(1)}px;background:${col};overflow:hidden">${wins}</div>`}
 return h}
function sky(t){let h='';for(let i=0;i<6;i++){const w=220+R(i)*260,x=R(i+4)*1200-200+Math.sin(2*Math.PI*t/TL.dur+i)*90,y=120+R(i+9)*640;h+=`<div style="position:absolute;left:${x.toFixed(0)}px;top:${y.toFixed(0)}px;width:${w.toFixed(0)}px;height:${(w*.32).toFixed(0)}px;border-radius:999px;background:#fff;opacity:.55;filter:blur(6px);box-shadow:${(w*.25).toFixed(0)}px -${(w*.12).toFixed(0)}px 0 ${(w*.02).toFixed(0)}px #fff"></div>`}
 h+=`<div style="position:absolute;left:-400px;top:-500px;width:1880px;height:1880px;opacity:.18;background:repeating-conic-gradient(from ${(t/TL.dur*44).toFixed(2)}deg at 50% 50%,#ffffff 0deg 6deg,transparent 6deg 22deg);-webkit-mask:radial-gradient(#000 20%,transparent 65%)"></div>`;
 h+=skyline(t,0,11,1420,900,'#b9dcf7',false)+skyline(t,1,23,1440,700,'#8fbfe6',true)+`<div style="position:absolute;left:0;right:0;top:1380px;height:600px;background:linear-gradient(#dfe9f4,#c3d3e6)"></div>`+skyline(t,2,37,1480,420,'#6f9ccc',true);
 h+=`<div style="position:absolute;left:0;right:0;top:1440px;height:8px;background:linear-gradient(90deg,transparent,#ffffffaa,transparent)"></div>`;return h}
// ---------- particles
function dust(t){let h='';for(let i=0;i<28;i++){const ph=(t/TL.dur*(1+Math.floor(R(i)*2))+R(i+5))%1,x=R(i+3)*1080+Math.sin(2*Math.PI*t/TL.dur+i)*20,y=1500-ph*1500;h+=`<div style="position:absolute;left:${x.toFixed(0)}px;top:${y.toFixed(0)}px;width:${(3+R(i)*5).toFixed(1)}px;height:${(3+R(i)*5).toFixed(1)}px;border-radius:50%;background:#ffffff;opacity:${(.25+.4*Math.sin(ph*Math.PI)).toFixed(2)}"></div>`}return h}
function bursts(t){let h='';for(const b of BURSTS){const q=(t-b.t)/.8;if(q<0||q>1)continue;for(let i=0;i<18;i++){const a=i/18*6.283+R(i+b.t*10),r=ez(q)*(160+R(i+3)*160),x=b.x+Math.cos(a)*r,y=b.y+Math.sin(a)*r+q*q*80;
  h+=`<div style="position:absolute;left:${x.toFixed(0)}px;top:${y.toFixed(0)}px;width:${(14*(1-q)+3).toFixed(1)}px;height:${(14*(1-q)+3).toFixed(1)}px;border-radius:50%;background:${b.col};box-shadow:0 0 12px ${b.col};opacity:${(1-q).toFixed(2)}"></div>`}}return h}
// ---------- SCENES
function hookTitle(t,t0=-9){return KT(540,200,'WHY YOU SHOULD NEVER',t,t0,{size:62})+KT(540,320,'KEEP ALL YOUR CRYPTO',t,t0+.2,{size:80,col:C.gold})+KT(540,440,'ON ONE EXCHANGE',t,t0+.35,{size:96,col:C.red,glow:'#ff5b4a66'})}
function chartUp(t,q,x0,y0,w,h,col){const pts=[];for(let i=0;i<=50;i++){const f=i/50,v=.04+.9*Math.pow(f,3.2)+Math.sin(i*1.7)*.012;pts.push([x0+f*w,y0-v*h])}
 const m=Math.max(2,Math.round(q*51)),d='M'+pts.slice(0,m).map(p=>p[0].toFixed(0)+','+p[1].toFixed(0)).join(' L'),lp=pts[m-1];
 return {svg:`<svg width="1080" height="1920" style="position:absolute;left:0;top:0"><path d="${d} L${lp[0].toFixed(0)},${y0} L${x0},${y0} Z" fill="${col}22" /><path d="${d}" fill="none" stroke="${col}" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" style="filter:drop-shadow(0 0 14px ${col})" /></svg>`,lp}}
const ANIM={
 hero(t,k){const sp=SP(k),a=S(k),D=DU(k);let h='';const p=k===0?1:el(cl(t,a-.25,a+.35));
  h+=shadow(700,1450,560,.8)+obj('vault',700,1130+fl(t,1,6),620);
  // coins leaking out of the vault (loop-safe phase)
  for(let i=0;i<6;i++){const ph=((t/TL.dur)*4+i/6)%1;h+=obj('coins',700+(i-2.5)*60+ph*120*(i%2?1:-1),1150+ph*300,90,{op:Math.sin(ph*Math.PI),rot:ph*200})}
  h+=obj('hacker',930,760+fl(t,2,6),300,{op:.95});
  h+=shadow(230,1470,300,.9)+obj('samthink',230,1240+fl(t,5,4),460*p);
  if(k===0){const q=1-cl(t,a+D*.86,a+D*.98);if(q>0)h+=`<div style="opacity:${q.toFixed(3)}">${hookTitle(t)}</div>`}
  if(sp.choice){const end=TL.dur,out=1-cl(t,end-.6,end-.2);
   h+=`<div style="opacity:${out.toFixed(3)}">`+KT(540,230,'WOULD YOUR CRYPTO BE SAFE?',t,a+.05,{size:62})+pill(540,400,'🔒 YES, IT\'S SAFE',{p:cl(t,a+D*.15,a+D*.3),size:52,bg:C.green2,fg:'#fff'})+pill(540,540,'😬 NOT SURE',{p:cl(t,a+D*.35,a+D*.5),size:52,bg:'#fff'})+`</div>`;
   const tin=cl(t,end-.5,end-.06);if(tin>0)h+=`<div style="opacity:${tin.toFixed(3)}">${hookTitle(t)}</div>`}
  return h},
 breakin(t,k){const a=S(k),D=DU(k);let h='';
  h+=shadow(540,1440,640,.9)+obj('vault',540,1080+fl(t,1,4),700);
  const lq=cl(t,a+D*.25,a+D*.45);h+=obj('lock',540,1000+fl(t,2,6)+lq*lq*200,lerp(0,320,el(cl(t,a,a+.3))),{rot:lq*25});
  h+=pill(540,200,'📅 October 29, 2026',{p:cl(t,a,a+.25),size:46});
  h+=KT(540,340,'HACKED',t,a+D*.3,{size:150,col:C.red,glow:'#ff5b4a88'});
  h+=pill(540,480,"world's biggest crypto exchange",{p:cl(t,a+D*.6,a+D*.75),size:42,dot:C.gold});return h},
 laptop(t,k){const a=S(k),D=DU(k);let h='';
  h+=shadow(540,1440,700,.9)+obj('skull',540,1040+fl(t,1,5)+Math.sin(t*28)*2,lerp(300,720,el(cl(t,a-.1,a+.4))),{glow:30,gcol:'#ff5b4a'});
  h+=pill(540,260,'🔎 early findings',{p:cl(t,a,a+.25),size:44});
  h+=KT(540,420,"1 ENGINEER'S LAPTOP",t,a+D*.45,{size:88,col:C.gold});return h},
 drain(t,k){const a=S(k),D=DU(k);let h='';const q=sg(t,a+.1,a+D*.85);
  h+=shadow(330,1460,420,.9)+obj('vault',330,1170+fl(t,1,4),480);
  h+=shadow(820,1470,360,.9)+obj('hacker',820,1200+fl(t,2,5),400);
  // coins stream from vault to hacker
  for(let i=0;i<10;i++){const ph=(t*1.4+i/10)%1;if(q<=0)break;const x=lerp(380,780,ph),y=1100-Math.sin(ph*Math.PI)*320;h+=obj('coins',x,y,110,{rot:ph*360,op:Math.min(1,q*3)})}
  h+=TX(540,280,'$'+(6.3*q).toFixed(1)+' BILLION',{size:118,col:C.red,glow:'#ff5b4a88',s:1+.12*cl(t,a+D*.85,a+D*.9)*(1-cl(t,a+D*.9,a+D))});
  h+=pill(540,440,'⏱ '+Math.round(20*q)+' minutes',{p:cl(t,a,a+.25),size:52,bg:C.ink,fg:'#fff'});return h},
 samyell(t,k){const a=S(k),D=DU(k);let h='';
  // comic burst background: rotating yellow/orange rays + red flash
  const fq=1-cl(t,a,a+.25);h+=`<div style="position:absolute;inset:-300px;background:repeating-conic-gradient(from ${(t*40).toFixed(1)}deg at 50% 55%,#ffd23f 0deg 10deg,#ff8a3d 10deg 20deg)"></div>`;
  h+=`<div style="position:absolute;inset:0;background:radial-gradient(circle at 50% 55%,#fff6 0%,transparent 60%)"></div>`;
  if(fq>0)h+=`<div style="position:absolute;inset:0;background:#fff;opacity:${fq.toFixed(2)}"></div>`;
  // giant Sam bursts up from below with overshoot, shakes while yelling, drops out at the end
  const pin=cl(t,a,a+.3),pout=cl(t,a+D*.82,a+D),s=lerp(.35,1,bo(pin)),y=lerp(2300,1150,ez(pin))+pout*pout*1400;
  const sh=Math.sin(t*55)*14*(1-pout),rot=Math.sin(t*37)*3;
  h+=obj('samyell',540+sh,y,1150*s,{rot});
  const ws=TL.lines[k].words||[],wEnd=ws.length?S(k)+ws[0][2]:a+D*.4;
  if(t<wEnd+.05){const st=1+.12*cl(t,a,wEnd);h+=TX(540,300,'WAIT!!!',{size:118,col:'#fff',s:st*(1+Math.sin(t*40)*.03)})}
  else h+=KT(540,300,'FOLLOW!!',t,wEnd+.05,{size:190,col:'#fff',stag:.05});
  h+=pill(540,500,'for more money stories 💸',{p:cl(t,a+D*.55,a+D*.7),size:46,bg:C.red2,fg:'#fff'});
  return h},
 record(t,k){const a=S(k),D=DU(k);let h='';const q1=sg(t,a+D*.3,a+D*.55),q2=sg(t,a+D*.45,a+D*.85),Hh=820,b1=Hh*1.5/6.3*q1,b2=Hh*q2;
  h+=`<div style="position:absolute;left:150px;top:${1390-b1}px;width:320px;height:${b1}px;border-radius:26px 26px 0 0;background:linear-gradient(#9fb3c8,#6f86a0);box-shadow:0 14px 30px #0a2a5055"></div><div style="position:absolute;left:610px;top:${1390-b2}px;width:320px;height:${b2}px;border-radius:26px 26px 0 0;background:linear-gradient(#ff7a62,${C.red2});box-shadow:0 0 40px #ff5b4a88"></div>`;
  h+=TX(310,1390-b1-60,'$1.5B',{size:70,col:'#fff',p:q1>0?1:0})+TX(770,1390-b2-60,'$6.3B',{size:80,col:'#fff',p:q2>0?1:0});
  h+=pill(310,1460,'old record · Bybit 2025',{p:cl(t,a+D*.3,a+D*.45),size:34,dot:'#6f86a0'})+pill(770,1460,'Binance · Oct 2026',{p:cl(t,a+D*.45,a+D*.6),size:34,bg:C.red2,fg:'#fff'});
  h+=KT(540,250,'BIGGEST CRYPTO THEFT EVER',t,a+.15,{size:66,col:C.gold});
  h+=stamp(770,640,'×4',cl(t,a+D*.85,a+D*.95),C.red,-8,110);return h},
 suspect(t,k){const a=S(k),D=DU(k);let h='';
  h+=shadow(540,1440,560,.9)+obj('hacker',540,1120+fl(t,1,5),620);
  h+=KT(540,260,'NORTH KOREA?',t,a+.1,{size:120,col:C.red,glow:'#ff5b4a77'});
  h+=pill(540,400,'suspected by blockchain analysts (TRM Labs)',{p:cl(t,a+.3,a+.6),size:32});
  h+=stamp(540,620,'WITHDRAWALS FROZEN',cl(t,a+D*.6,a+D*.72),C.ink,-5,64);
  h+=pill(540,760,'≈ $3B of the stolen coins frozen',{p:cl(t,a+D*.78,a+D*.9),size:38,dot:C.green2});return h}
};

const GRADE={samyell:'#00000000',hero:'#ffffff00',breakin:'#ff5b4a0c',laptop:'#ff5b4a10',drain:'#ff5b4a14',record:'#ff5b4a0c',suspect:'#14202c14'};
function fgLayer(t){let h='';const N=TL.lines.length;
 for(let k=0;k<N;k++){const ty=SP(k).type;const hin=ty==='samyell',hout=k+1<N&&SP(k+1).type==='samyell';
  const a=k===0?-1:(hin?S(k)-.05:S(k)-.2),b=k+1<N?(hout?S(k+1)-.05:S(k+1)+.2):TL.dur+1;if(t<a||t>=b)continue;
  const qi=(k===0||hin)?1:ei(cl(t,a,a+.32)),qo=(k+1<N&&!hout)?ei(cl(t,b-.32,b)):0;const dx=(1-qi)*1150-qo*1150,blur=Math.abs(dx)>4?Math.min(16,Math.abs(dx)/36):0;
  const st=k===0?0:S(k),en=k+1<N?S(k+1):TL.dur,u=cl(t,st,en),z=1+.06*u*(k+1<N?1:1-ei(cl(t,TL.dur-.7,TL.dur-.05)));
  h+=`<div style="position:absolute;inset:0;transform:translateX(${dx.toFixed(1)}px) scale(${z.toFixed(4)});transform-origin:540px 900px;${blur?`filter:blur(${blur.toFixed(1)}px);`:''}">${ANIM[ty](t,k)}</div>`}
 return h}
function camera(t){let sx=0,sy=0,rot=0,z=1;for(const s of SHAKES){const q=(t-s.t)/s.d;if(q<0||q>1)continue;const a=s.a*(1-q)*(1-q);sx+=Math.sin(t*90+s.t)*a;sy+=Math.cos(t*77+s.t*3)*a;rot+=Math.sin(t*60)*a*.04}
 for(const p of PUNCH){const q=(t-p.t)/.35;if(q<0||q>1)continue;z+=p.a*Math.sin(q*Math.PI)}
 return `translate(${sx.toFixed(2)}px,${sy.toFixed(2)}px) rotate(${rot.toFixed(3)}deg) scale(${z.toFixed(4)})`}
function gradeAt(t){const N=TL.lines.length;let k=0;for(let i=0;i<N;i++)if(t>=S(i)-.2)k=i;return GRADE[SP(k).type]||'#0000'}
function draw(t){if(!TL)return;
 $('sky').innerHTML=sky(t);
 const fh=fgLayer(t);if(fh!==$('fg')._h){$('fg').innerHTML=fh;$('fg')._h=fh}
 $('cam').style.transform=camera(t);
 $('fx').innerHTML=dust(t)+bursts(t);
 $('grade').innerHTML=`<div style="position:absolute;inset:0;background:${gradeAt(t)}"></div><div style="position:absolute;inset:0;background:radial-gradient(ellipse at 50% 45%,transparent 60%,#0a2a5044 100%)"></div>`;
 const c=t>=TL.lines[TL.lines.length-1].end-.02?'':MG.captions(t,{y:1570,size:66,maxWords:3,stageW:1080,w:940,upper:true});if(c!==$('cap')._h){$('cap').innerHTML=c;$('cap')._h=c}
 MG.grainTick(t)}
window.setTimeline=tl=>{MG.TL=TL=tl;MG.preload(['samyell','samthink','vault','hacker','skull','coins','lock'].map(IM));
 // camera events derived from the beats
 const a=i=>S(i),d=i=>DU(i);SHAKES=[];PUNCH=[];BURSTS=[];
 SHAKES.push({t:a(0)+.05,d:.35,a:10});
 SHAKES.push({t:a(1)+d(1)*.3,d:.4,a:14});PUNCH.push({t:a(1)+d(1)*.3,a:.05});BURSTS.push({t:a(1)+d(1)*.35,x:540,y:1000,col:C.gold});
 PUNCH.push({t:a(2)+d(2)*.45,a:.04});
