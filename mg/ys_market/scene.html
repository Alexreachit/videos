<script>
// Short 9:16 – GameStop squeeze. "Team look" upgrades: parallax night skyline (3 depths), camera shake + zoom punches,
// light rays, ambient + burst particles, kinetic typography, contact shadows, per-scene colour grade.
const {cl,ez,ei,bo,el,lerp}=MG,$=MG.$,W=1080,H=1920;
const C={cream:'#fff6e6',gold:'#ffc94a',green:'#3ddc84',green2:'#1fa45a',red:'#ff5b4a',red2:'#d6402e',ink:'#14202c',neon:'#16c172'};
let TL=null,fontsOk=false,imgReady=false,SHAKES=[],PUNCH=[],BURSTS=[];
const S=i=>TL.lines[i].start,E=i=>TL.lines[i].end,DU=i=>E(i)-S(i),SP=i=>TL.lines[i].spec;
const sg=(t,a,b)=>ei(cl(t,a,b)),R=MG.rnd;
const IM=k=>`img/${k}.png`;
const LW=w=>TL?2*Math.PI*Math.max(1,Math.round(w*TL.dur/(2*Math.PI)))/TL.dur:w;// loop-safe angular speed
const fl=(t,i,a=8)=>Math.sin(t*LW(2.1)+i*1.7)*a;
function obj(k,x,y,w,o={}){const op=o.op??1;if(op<=0.001||w<=1)return'';return `<img src="${IM(k)}" style="position:absolute;left:0;top:0;width:${w.toFixed(1)}px;transform:translate(${(x-w/2).toFixed(1)}px,${(y-w/2).toFixed(1)}px) rotate(${(o.rot||0).toFixed(2)}deg) scaleX(${o.flip?-1:1});opacity:${op.toFixed(3)};filter:drop-shadow(0 ${(w/22).toFixed(0)}px ${(w/14).toFixed(0)}px #000a)${o.glow?` drop-shadow(0 0 ${o.glow}px ${o.gcol||'#38ff9c'})`:''}">`}
function shadow(x,y,w,op=1){return `<div style="position:absolute;left:${x-w/2}px;top:${y-w*.06}px;width:${w}px;height:${w*.12}px;border-radius:50%;background:radial-gradient(#000a,#0000 70%);opacity:${op.toFixed(2)}"></div>`}
function TX(x,y,txt,o={}){const p=o.p??1;if(p<=0)return'';const sz=o.size||64,s=o.s??1;
 return `<div style="position:absolute;left:${x}px;top:${y}px;transform:translate(-50%,-50%) translateY(${((1-Math.min(1,p))*22).toFixed(1)}px) scale(${s.toFixed(3)}) rotate(${o.rot||0}deg);opacity:${Math.min(1,p).toFixed(3)};font:700 ${sz}px/1.05 P,Arial;color:${o.col||C.cream};white-space:nowrap;text-align:center;text-shadow:${MG.outline(o.ol||Math.max(3,Math.round(sz/13)))},0 ${sz/9}px ${sz/3}px #000c${o.glow?`,0 0 ${sz/3}px ${o.glow}`:''}">${txt}</div>`}
// kinetic type: words pop in one after another with overshoot + slight rotation
function KT(x,y,txt,t,t0,o={}){const ws=txt.split(' '),sz=o.size||80,gap=o.stag??.07;let h='';
 const spans=ws.map((w,i)=>{const q=cl(t,t0+i*gap,t0+i*gap+.28);if(q<=0)return `<span style="display:inline-block;opacity:0">${w}</span>`;const s=bo(q),r=(1-ez(q))*(i%2?8:-8);
  return `<span style="display:inline-block;transform:scale(${s.toFixed(3)}) rotate(${r.toFixed(1)}deg);opacity:${Math.min(1,q*3).toFixed(2)}">${w}</span>`}).join(' ');
 return `<div style="position:absolute;left:${x}px;top:${y}px;transform:translate(-50%,-50%);font:700 ${sz}px/1.05 P;color:${o.col||C.cream};white-space:nowrap;text-shadow:${MG.outline(Math.max(3,Math.round(sz/13)))},0 ${sz/9}px ${sz/3}px #000c${o.glow?`,0 0 ${sz/2.5}px ${o.glow}`:''}">${spans}</div>`}
function pill(x,y,txt,o={}){const p=o.p??1;if(p<=0)return'';const sz=o.size||36,s=bo(Math.min(1,p))*(o.s??1);
 const dot=o.dot?`<span style="display:inline-block;width:${sz*.62}px;height:${sz*.62}px;border-radius:50%;background:${o.dot};margin-right:${sz*.3}px;vertical-align:-${sz*.06}px;box-shadow:0 0 12px ${o.dot}"></span>`:'';
 return `<div style="position:absolute;left:${x}px;top:${y}px;transform:translate(-50%,-50%) scale(${s.toFixed(3)});opacity:${Math.min(1,p*2).toFixed(3)};padding:${sz*.34}px ${sz*.7}px;border-radius:${sz*1.2}px;background:${o.bg||'#ffffffee'};color:${o.fg||C.ink};font:700 ${sz}px/1.1 P,Arial;white-space:nowrap;box-shadow:0 10px 26px #000a">${dot}${txt}</div>`}
function stamp(x,y,txt,p,col=C.red,rot=-8,sz=70){if(p<=0)return'';const s=lerp(2.2,1,ez(Math.min(1,p)));return `<div style="position:absolute;left:${x}px;top:${y}px;transform:translate(-50%,-50%) rotate(${rot}deg) scale(${s.toFixed(3)});opacity:${Math.min(1,p*2.5).toFixed(3)};padding:10px 30px;border:8px solid ${col};border-radius:18px;color:${col};font:700 ${sz}px/1 P;letter-spacing:3px;background:#ffffffe6;white-space:nowrap;box-shadow:0 14px 30px #000a">${txt}</div>`}

   const col=PCOL[(l*7+j*3+(side<0?0:5))%PCOL.length];

   // little label stripe

  svg+=`<line x1="${t0[0]}" y1="${t0[1].toFixed(1)}" x2="${t1[0]}" y2="${t1[1].toFixed(1)}" stroke="#9fb0c4" stroke-width="10" />`}

 for(let i=0;i<7;i++){const f=1-1/(1+.5*i),g=1-1/(1+.5*(i+.35)),y0=lerp(0,690,f),y1=lerp(0,690,g),w0=lerp(500,60,f),w1=lerp(500,60,g);
  s+=`<polygon points="${540-w0/2},${y0} ${540+w0/2},${y0} ${540+w1/2},${y1} ${540-w1/2},${y1}" fill="#ffffff" stroke="#dbe6f2" stroke-width="2" style="filter:drop-shadow(0 0 12px #fff)" />`}

 s+=`<polygon points="-40,1560 1120,1560 650,950 430,950" fill="#dfe6ee" />`;

 for(let j=1;j<9;j++){const f=1-1/(1+.6*j),y=lerp(1920,950,f);s+=`<line x1="-40" y1="${y.toFixed(1)}" x2="1120" y2="${y.toFixed(1)}" stroke="#c7d1dd" stroke-width="${(3*(1-f)+1).toFixed(1)}" />`}
 s+=`<polygon points="-40,1560 -40,1920 1120,1920 1120,1560 650,950 430,950" fill="#dfe6ee" />`;
 // re-draw floor grid over full floor
 for(let i=-6;i<=6;i++)s+=`<line x1="${540+i*190}" y1="1920" x2="${540+i*18}" y2="950" stroke="#c7d1dd" stroke-width="3" />`;
 for(let j=1;j<10;j++){const f=1-1/(1+.6*j),y=lerp(1920,950,f);s+=`<line x1="-40" y1="${y.toFixed(1)}" x2="1120" y2="${y.toFixed(1)}" stroke="#c7d1dd" stroke-width="${(3*(1-f)+1).toFixed(1)}" />`}

 for(let i=0;i<4;i++)for(let j=0;j<2;j++)s+=`<rect x="${450+i*47}" y="${775+j*82}" width="34" height="62" rx="4" fill="#fff" stroke="#14202c" stroke-width="2" /><rect x="${450+i*47}" y="${790+j*82}" width="34" height="14" fill="#4f8fd8" />`;
 s+=`<rect x="455" y="702" width="170" height="44" rx="10" fill="#4f8fd8" stroke="#14202c" stroke-width="3" /><text x="540" y="734" text-anchor="middle" font-family="P" font-weight="700" font-size="30" fill="#fff">DAIRY</text>`;

 return s+'</svg>'})();

  `<div style="position:absolute;left:340px;top:600px;width:400px;height:420px;border-radius:50%;background:radial-gradient(#ffffff99,#ffffff00 70%)"></div>`}

// ---------- particles
function dust(t){let h='';for(let i=0;i<28;i++){const ph=(t/TL.dur*(1+Math.floor(R(i)*2))+R(i+5))%1,x=R(i+3)*1080+Math.sin(2*Math.PI*t/TL.dur+i)*20,y=1500-ph*1500;h+=`<div style="position:absolute;left:${x.toFixed(0)}px;top:${y.toFixed(0)}px;width:${(3+R(i)*5).toFixed(1)}px;height:${(3+R(i)*5).toFixed(1)}px;border-radius:50%;background:#ffffff;opacity:${(.25+.4*Math.sin(ph*Math.PI)).toFixed(2)}"></div>`}return h}
function bursts(t){let h='';for(const b of BURSTS){const q=(t-b.t)/.8;if(q<0||q>1)continue;for(let i=0;i<18;i++){const a=i/18*6.283+R(i+b.t*10),r=ez(q)*(160+R(i+3)*160),x=b.x+Math.cos(a)*r,y=b.y+Math.sin(a)*r+q*q*80;
  h+=`<div style="position:absolute;left:${x.toFixed(0)}px;top:${y.toFixed(0)}px;width:${(14*(1-q)+3).toFixed(1)}px;height:${(14*(1-q)+3).toFixed(1)}px;border-radius:50%;background:${b.col};box-shadow:0 0 12px ${b.col};opacity:${(1-q).toFixed(2)}"></div>`}}return h}
// ---------- SCENES
function hookTitle(t,t0=-9){return KT(540,190,'WHY THE MILK IS ALWAYS',t,t0,{size:66})+KT(540,310,'AT THE VERY BACK',t,t0+.2,{size:100,col:C.gold})+KT(540,430,'OF THE SUPERMARKET',t,t0+.35,{size:86,col:'#4f8fd8',glow:'#4f8fd866'})}
function chartUp(t,q,x0,y0,w,h,col){const pts=[];for(let i=0;i<=50;i++){const f=i/50,v=.04+.9*Math.pow(f,3.2)+Math.sin(i*1.7)*.012;pts.push([x0+f*w,y0-v*h])}
 const m=Math.max(2,Math.round(q*51)),d='M'+pts.slice(0,m).map(p=>p[0].toFixed(0)+','+p[1].toFixed(0)).join(' L'),lp=pts[m-1];
 return {svg:`<svg width="1080" height="1920" style="position:absolute;left:0;top:0"><path d="${d} L${lp[0].toFixed(0)},${y0} L${x0},${y0} Z" fill="${col}22" /><path d="${d}" fill="none" stroke="${col}" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" style="filter:drop-shadow(0 0 14px ${col})" /></svg>`,lp}}
function card(x,y,w,h,inner,p){if(p<=0)return'';return `<div style="position:absolute;left:${x-w/2}px;top:${y-h/2}px;width:${w}px;height:${h}px;border-radius:44px;background:#ffffffee;box-shadow:0 30px 60px #0a2a5055;border:6px solid #fff;transform:scale(${bo(Math.min(1,p)).toFixed(3)});opacity:${Math.min(1,p*2).toFixed(2)};overflow:hidden">${inner}</div>`}
const PATH=[[120,880],[120,140],[260,140],[260,860],[400,860],[400,140],[540,140],[540,860],[680,860],[680,140],[800,140]];
function pathPt(f){let L=0;const seg=[];for(let i=1;i<PATH.length;i++){const d=Math.hypot(PATH[i][0]-PATH[i-1][0],PATH[i][1]-PATH[i-1][1]);seg.push(d);L+=d}
 let r=f*L;for(let i=0;i<seg.length;i++){if(r<=seg[i]){const g=r/seg[i];return [lerp(PATH[i][0],PATH[i+1][0],g),lerp(PATH[i][1],PATH[i+1][1],g)]}r-=seg[i]}return PATH[PATH.length-1]}
function shelfFront(t,x0,y0,w,rows,hl,hq){let h='';const rh=150;
 for(let r=0;r<rows;r++){const y=y0+r*rh,isH=r===hl;
  for(let i=0;i<6;i++){const bw=w/6-14,bx=x0+i*(w/6)+7,bh=110+((i*7+r*3)%3)*8,col=PCOL[(i*3+r*5)%PCOL.length];
   h+=`<div style="position:absolute;left:${bx}px;top:${y+rh-18-bh}px;width:${bw}px;height:${bh}px;border-radius:10px;background:${col};border:4px solid #14202c;${isH&&hq>0?`box-shadow:0 0 ${(30*hq).toFixed(0)}px #ffd23f;transform:translateY(${(-8*hq).toFixed(1)}px)`:''};opacity:${isH||hq<=0?1:(1-.45*hq).toFixed(2)}"><div style="margin:30% 10% 0;height:22%;border-radius:6px;background:#ffffffbb"></div></div>`}
  h+=`<div style="position:absolute;left:${x0-10}px;top:${y+rh-18}px;width:${w+20}px;height:18px;border-radius:9px;background:#9fb0c4"></div>`}
 return h}
const ANIM={
 hero(t,k){const sp=SP(k),a=S(k),D=DU(k);let h='';const p=k===0?1:el(cl(t,a-.25,a+.35));
  const g=.5+.5*Math.sin(2*Math.PI*t/TL.dur*4);

 map(t,k){const a=S(k),D=DU(k);let h='';const p=el(cl(t,a,a+.35)),q=sg(t,a+.25,a+D*.88);

 eyelevel(t,k){const a=S(k),D=DU(k);let h='';const hq=cl(t,a+D*.25,a+D*.5);

  for(let i=0;i<6;i++){const q=cl(t,a+D*(.45+i*.05),a+D*(.45+i*.05)+.25);if(q>0)h+=`<div style="position:absolute;left:${150+i*140}px;top:${sy-45}px;font:700 40px P;color:${C.green2};transform:scale(${bo(q).toFixed(2)});text-shadow:0 2px 0 #fff">$$$</div>`}

 checkout(t,k){const a=S(k),D=DU(k);let h='';
  // conveyor belt
  const off=(t*120)%60;let st='';for(let i=0;i<20;i++)st+=`<div style="position:absolute;left:${i*60-off}px;top:0;width:6px;height:70px;background:#2a3542"></div>`;
  h+=`<div style="position:absolute;left:0;top:1210px;width:1080px;height:70px;background:#14202c;overflow:hidden">${st}</div>`;
  for(let i=0;i<5;i++){const x=((t*120+i*230)%1300)-200;h+=`<div style="position:absolute;left:${x.toFixed(0)}px;top:${1110}px;width:120px;height:100px;border-radius:12px;background:${PCOL[i*2]};border:4px solid #14202c"></div>`}
  h+=shadow(780,1290,420,.8)+obj('register',780,1030+fl(t,1,3),440);
  {const cq=el(cl(t,a+.1,a+.5));if(cq>0){let r=`<div style="position:absolute;left:${260-170}px;top:${980-200}px;width:340px;height:400px;transform:scale(${cq.toFixed(3)});transform-origin:50% 100%"><div style="position:absolute;inset:0;border-radius:18px;background:#e9eef5;border:6px solid #14202c"></div>`;
   for(let rr=0;rr<4;rr++){for(let i=0;i<6;i++){const col=PCOL[(i*3+rr*7)%PCOL.length];r+=`<div style="position:absolute;left:${22+i*50}px;top:${24+rr*92}px;width:40px;height:66px;border-radius:8px;background:linear-gradient(${col},${col}cc);border:3px solid #14202c;transform:rotate(${((i+rr)%3-1)*4}deg)"><div style="margin:22px 4px 0;height:12px;border-radius:4px;background:#ffffffcc"></div></div>`}
    r+=`<div style="position:absolute;left:10px;top:${94+rr*92}px;width:308px;height:10px;border-radius:5px;background:#9fb0c4"></div>`}
   h+=r+'</div>'+pill(260,1240,'🍫 candy at the till',{p:cl(t,a+.4,a+.7),size:34})}}
  h+=TX(540,300,'$'+(6*sg(t,a+.1,a+D*.75)).toFixed(1)+' BILLION',{size:120,col:C.green2});
  h+=pill(540,450,'a year · spent at checkouts (US)',{p:cl(t,a+.2,a+.5),size:42});return h},
 music(t,k){const a=S(k),D=DU(k);let h='';const q=sg(t,a+.1,a+D*.55);
  h+=obj('speaker',540,620+fl(t,1,5),lerp(0,380,el(cl(t,a,a+.4))));
  const bpm=Math.round(lerp(108,60,q));
  h+=`<div style="position:absolute;left:290px;top:880px;width:500px;height:170px;border-radius:30px;background:#14202c;box-shadow:0 20px 40px #0006;text-align:center;font:700 110px/170px P;color:${q>.95?C.green:'#fff'}">${bpm} BPM</div>`;
  // cart rolling slower and slower (position via integrated speed)
  const sp=lerp(1,.4,q),cx=((t-a)*360*sp)%1400-200;h+=obj('cart',cx,1330,260,{rot:Math.sin(t*20*sp)*2});
  h+=TX(540,280,'+'+Math.round(38*sg(t,a+D*.5,a+D*.85))+'%',{size:200,col:C.green2,p:cl(t,a+D*.5,a+D*.6),glow:'#3ddc8488',s:1+.12*cl(t,a+D*.85,a+D*.9)*(1-cl(t,a+D*.9,a+D))});
  h+=pill(540,1110,'slow music (60 BPM) vs fast (108 BPM) · Milliman study',{p:cl(t,a+D*.3,a+D*.5),size:30});return h},
 fair(t,k){const a=S(k),D=DU(k);let h='';
  h+=`<div style="position:absolute;left:120px;top:760px;width:300px;height:460px;border-radius:20px;background:#cfe7ff;border:8px solid #14202c;text-align:center;font:700 90px/440px P">❄️</div>`;
  const tq=ez(cl(t,a,a+D*.6));h+=shadow(lerp(1300,700,tq),1260,560,.8)+obj('truck',lerp(1300,700,tq),1060+fl(t,1,3),560);
  h+=KT(540,280,'TO BE FAIR…',t,a+.05,{size:110,col:C.gold});
  h+=pill(540,430,'coolers + deliveries = back of the store',{p:cl(t,a+D*.45,a+D*.6),size:38,dot:'#4f8fd8'});return h}
};

const GRADE={hero:'#ffffff00',map:'#ffffff00',eyelevel:'#ffd23f08',checkout:'#3ddc8408',music:'#9b6ad60c',fair:'#4f8fd80a'};
function fgLayer(t){let h='';const N=TL.lines.length;
 for(let k=0;k<N;k++){const ty=SP(k).type;const hin=ty==='samyell',hout=k+1<N&&SP(k+1).type==='samyell';
  const a=k===0?-1:(hin?S(k)-.05:S(k)-.2),b=k+1<N?(hout?S(k+1)-.05:S(k+1)+.2):TL.dur+1;if(t<a||t>=b)continue;
  const qi=(k===0||hin)?1:ei(cl(t,a,a+.32)),qo=(k+1<N&&!hout)?ei(cl(t,b-.32,b)):0;const dx=(1-qi)*1150-qo*1150,blur=Math.abs(dx)>4?Math.min(16,Math.abs(dx)/36):0;
  const st=k===0?0:S(k),en=k+1<N?S(k+1):TL.dur,u=cl(t,st,en),z=1+.06*u*(k+1<N?1:1-ei(cl(t,TL.dur-.7,TL.dur-.05)));
  h+=`<div style="position:absolute;inset:0;transform:translateX(${dx.toFixed(1)}px) scale(${z.toFixed(4)});transform-origin:540px 900px;${blur?`filter:blur(${blur.toFixed(1)}px);`:''}">${ANIM[ty](t,k)}</div>`}
 return h}
function camera(t){let sx=0,sy=0,rot=0,z=1;for(const s of SHAKES){const q=(t-s.t)/s.d;if(q<0||q>1)continue;const a=s.a*(1-q)*(1-q);sx+=Math.sin(t*90+s.t)*a;sy+=Math.cos(t*77+s.t*3)*a;rot+=Math.sin(t*60)*a*.04}
 for(const p of PUNCH){const q=(t-p.t)/.35;if(q<0||q>1)continue;z+=p.a*Math.sin(q*Math.PI)}
 return `translate(${sx.toFixed(2)}px,${sy.toFixed(2)}px) rotate(${rot.toFixed(3)}deg) scale(${z.toFixed(4)})`}
function gradeAt(t){const N=TL.lines.length;let k=0;for(let i=0;i<N;i++)if(t>=S(i)-.2)k=i;return GRADE[SP(k).type]||'#0000'}
function draw(t){if(!TL)return;
 $('sky').innerHTML=sky(t);
 const fh=fgLayer(t);if(fh!==$('fg')._h){$('fg').innerHTML=fh;$('fg')._h=fh}
 $('cam').style.transform=camera(t);
 $('fx').innerHTML=dust(t)+bursts(t);
 $('grade').innerHTML=`<div style="position:absolute;inset:0;background:${gradeAt(t)}"></div><div style="position:absolute;inset:0;background:radial-gradient(ellipse at 50% 45%,transparent 60%,#0a2a5044 100%)"></div>`;
 const c=t>=TL.lines[TL.lines.length-1].end-.02?'':MG.captions(t,{y:1570,size:66,maxWords:3,stageW:1080,w:940,upper:true});if(c!==$('cap')._h){$('cap').innerHTML=c;$('cap')._h=c}
 MG.grainTick(t)}
window.setTimeline=tl=>{MG.TL=TL=tl;MG.preload(['samcart','samthink','milk','cart','register','truck','speaker'].map(IM));
 // camera events derived from the beats
 const a=i=>S(i),d=i=>DU(i);SHAKES=[];PUNCH=[];BURSTS=[];
 SHAKES.push({t:a(0)+.05,d:.35,a:8});
 PUNCH.push({t:a(1)+d(1)*.6,a:.04});BURSTS.push({t:a(1)+d(1)*.58,x:540,y:220,col:C.gold});
 SHAKES.push({t:a(2)+d(2)*.45,d:.35,a:10});PUNCH.push({t:a(2)+d(2)*.5,a:.05});
 PUNCH.push({t:a(3)+d(3)*.75,a:.05});BURSTS.push({t:a(3)+d(3)*.76,x:540,y:300,col:C.green});
 SHAKES.push({t:a(4)+.05,d:.5,a:12});SHAKES.push({t:a(4)+d(4)*.85,d:.5,a:16});PUNCH.push({t:a(4)+d(4)*.85,a:.07});BURSTS.push({t:a(4)+d(4)*.86,x:540,y:280,col:C.green});
 SHAKES.push({t:a(5)+d(5)*.6,d:.3,a:8});
 Promise.all([document.fonts.load('700 50px P'),document.fonts.load('500 50px P')]).then(()=>{fontsOk=true},()=>{fontsOk=true})};
Object.defineProperty(window,'ready',{configurable:true,get(){return imgReady&&fontsOk},set(v){imgReady=v}});
window.sfxEvents=()=>{const ev=[],N=TL.lines.length,add=(k,t,o={})=>ev.push(Object.assign({k,t:+t.toFixed(3)},o));
 for(let i=1;i<N;i++)add(i%2?'whoosh':'swish',S(i)-.22,{d:.45});
 for(let k=0;k<N;k++){const sp=SP(k),ty=sp.type,a=S(k),d=DU(k);
  if(ty==='hero'&&k===0){add('impact',a+.05);add('ding',a+d*.5)}
  if(ty==='hero'&&sp.choice){add('pop',a+d*.17);add('pop',a+d*.37)}
  if(ty==='map'){for(let i=1;i<=8;i++)add('pop',a+.25+(d*.88-.25)*i/9);add('impact',a+d*.58)}
  if(ty==='eyelevel'){add('swish',a+.05,{d:.5});for(let i=0;i<6;i++)add('cash',a+d*(.45+i*.05));add('impact',a+d*.45)}
  if(ty==='checkout'){add('ding',a+.15);for(let i=0;i<8;i++)add('tick',a+d*(.1+i*.08),{f:1000+i*90});add('cash',a+d*.76)}
  if(ty==='music'){add('impact',a+.05);for(let i=0;i<6;i++)add('tick',a+d*(.1+i*.08),{f:1300-i*90});add('impact',a+d*.85)}
  if(ty==='fair'){add('thud',a+d*.6);add('pop',a+d*.47)}}
 ev.sort((a,b)=>a.t-b.t);const out=[];for(const e of ev){if(e.t<0)e.t=0;if(!out.find(o=>o.k==e.k&&Math.abs(o.t-e.t)<.12))out.push(e)}return out};
window.draw=draw;
MG.finish($('stage'),1080,1920,.04,'#0a2a5022',65);
</script>
