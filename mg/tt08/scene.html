  <g id=neonB filter="url(#neon)"><text x=540 y=650 text-anchor=middle font-family="Arial Black,Arial" font-weight=900 font-size=64 fill="none" stroke="#46e3ff" stroke-width=5 letter-spacing=14>+ SODA</text></g>

   </div>

<script>
const M=MG,$=M.$,cl=M.cl,ez=M.ez,ei=M.ei,bo=M.bo,lerp=M.lerp,T=X.T;
$('defs').innerHTML=`<filter id=neon2 x="-30%" y="-80%" width="160%" height="260%"><feGaussianBlur stdDeviation="7" result=b /><feMerge><feMergeNode in=b /><feMergeNode in=SourceGraphic /></feMerge></filter>`;
// statische Intro-Grafiken (SVG-Inhalte duerfen die gemeinsamen defs nutzen -> eigene Kopie im Intro)
const introDefs='';$('gdefs').innerHTML=X.defs;
$('bbHD').querySelector('svg').innerHTML=introDefs+X.hotdog(0);
$('bbSoda').querySelector('svg').innerHTML=introDefs+`<g transform="translate(0,0)">${X.soda()}</g>`;
$('bbTag').querySelector('svg').innerHTML=introDefs+X.tag('$1.50',340,190);
// Menue-Tafeln an der Wand (unscharf, Tiefe)
(function(){let h='';for(let i=0;i<4;i++){const x=40+i*270;h+=`<g opacity=".55" filter="url(#neon)"><rect x="${x}" y="700" width="230" height="150" rx="14" fill="#1b2340" stroke="#ffd16655" stroke-width="3"/>`;for(let r=0;r<3;r++)h+=`<rect x="${x+24}" y="${730+r*38}" width="${120-r*20}" height="14" rx="7" fill="#dfe7ff55"/><rect x="${x+170}" y="${730+r*38}" width="36" height="14" rx="7" fill="#ffd16677"/>`;h+='</g>'}$('menus').innerHTML=h})();
function register(open,paid){return introDefs+`<g>
 <rect x="-150" y="-60" width="300" height="70" rx="10" fill="#2a3044"/>
 <rect x="-130" y="${-20+open*70}" width="260" height="60" rx="8" fill="#3b4560" stroke="#11151f" stroke-width="4"/>
 <rect x="-60" y="${0+open*70}" width="120" height="12" rx="6" fill="#11151f"/>
 <path d="M-170,-60 L170,-60 L150,-250 L-150,-250 Z" fill="url(#gSteel)"/>
 <rect x="-120" y="-230" width="240" height="120" rx="12" fill="${paid?'#0f3b25':'#0b1530'}" stroke="#05070f" stroke-width="6"/>
 ${paid?`<path d="M-30,-170 L-8,-148 L34,-196" stroke="#35e08a" stroke-width="12" fill="none" stroke-linecap="round" stroke-linejoin="round"/>`:`<rect x="-80" y="-180" width="160" height="16" rx="8" fill="#60a5fa66"/>`}
 ${[0,1,2].map(r=>[0,1,2,3].map(c=>`<rect x="${-120+c*62}" y="${-100+r*0}" width="50" height="0" />`).join('')).join('')}
 <path d="M-110,-300 L110,-300 L120,-250 L-120,-250 Z" fill="#2a3044"/>
</g>`}

// ---------- Schritte ----------
const PAL=[['#ff4fa8','#35d6ff'],['#ffd166','#ff7a3c'],['#ff7a3c','#ff5d5d'],['#ff5d5d','#ffd166'],['#ffd166','#60a5fa'],['#60a5fa','#ffd166'],['#35e08a','#60a5fa'],['#60a5fa','#35e08a'],['#ffd166','#6b3cff'],['#60a5fa','#ffd166'],['#35e08a','#60a5fa'],['#ffd166','#35e08a'],['#ffd166','#60a5fa'],['#ff4fa8','#ffd166'],['#ff5d5d','#6b3cff'],['#ffd166','#ff4fa8'],['#35e08a','#ff5d5d']];
const S=[];
S.push({a:0,tr:'cut',f:()=>''});

// 1: seit 1985 – Split-Flap-Jahreszahl rollt, Preisschild bleibt
S.push({a:1,tr:'fade',f:(t,s)=>{
 const u=t-s.ls, e=ei(cl(t,s.t0,s.t0+.7));
 const r0=s.ls+.35, r1=Math.max(r0+.8,X.wordT(1,/1985/)+.15), r=ei(cl(t,r0,r1));
 const yv=2026-41*r, Y=Math.ceil(yv-1e-6), fr=Y-yv, ys=String(Math.max(Y,1985)), yn=String(Math.max(Y-1,1985));
 let h=X.kick('SAME PRICE SINCE',cl(t,s.t0+.3,s.t0+.8),'#ffd166',260,58);
 const fo=cl(t,s.t0+.25,s.t0+.7);
 h+=`<g opacity="${fo}" transform="translate(540,${lerp(560,470,ez(fo))})">`;
 for(let i=0;i<4;i++){const x=(i-1.5)*178,ch=ys[i],chg=ys[i]!=yn[i]&&Y>1985,sq=chg?1-.85*Math.sin(Math.PI*fr):1;
  h+=`<g transform="translate(${x},0)"><rect x="-80" y="-110" width="160" height="220" rx="20" fill="url(#gPanel)" stroke="#ffffff22" stroke-width="3" filter="url(#sh)"/>
  <g transform="scale(1,${sq.toFixed(3)})">${T(0,58,ch,168,r>.98?'#ffd166':'#ffffff')}</g><rect x="-80" y="-3" width="160" height="6" fill="#05070f"/></g>`}
 h+=`</g>`;
 const sc=lerp(3.2,1.25,e), ty=lerp(860,930,e);
 h+=`<g transform="translate(540,${ty}) scale(${sc}) rotate(${lerp(-6,0,e)})" filter="url(#sh)">${X.tag('$1.50',340,190)}</g>`;
 const sp=cl(t,r1+.15,r1+.5);
 if(sp>0){const k=lerp(2.2,1,ez(sp));h+=`<g transform="translate(560,1145) rotate(-7) scale(${k})" opacity="${cl(sp,0,.4)}"><rect x="-250" y="-62" width="500" height="112" rx="16" fill="none" stroke="#35e08a" stroke-width="10"/>${T(0,22,'UNCHANGED',70,'#35e08a',{ls:3})}</g>`}
 return h},
 sfx:s=>{const r0=s.ls+.35,r1=Math.max(r0+.8,X.wordT(1,/1985/)+.15),e=[];for(let k=0;k<18;k++){const q=k/17;e.push({k:'tick',t:r0+(r1-r0)*(q<.5?2*q*q:1-Math.pow(-2*q+2,2)/2),f:2200+k*30})}e.push({k:'thud',t:r1+.12});return e}});

// 2: Inflation – zwei Saeulen
S.push({a:2,tr:'left',f:(t,s)=>{
 const u=t-s.ls, base=1190, H=600, hA=H*1.5/4.65, gA=ez(cl(u,.05,.7)), fT=X.wordT(2,/four/), gB=ei(cl(t,s.ls+.5,fT+.3));
 let h=X.kick('IF IT KEPT UP WITH INFLATION',cl(u,-.1,.4),'#ff7a3c',250,52)+X.floor(base+8,860);
 h+=`<rect x="220" y="${base-hA*gA}" width="220" height="${hA*gA}" rx="14" fill="url(#gGold)" filter="url(#sh)"/>`;
 h+=`<g transform="translate(330,${base-hA*gA-100}) scale(${.62*bo(cl(u,.3,.8))})">${X.tag('$1.50',340,190)}</g>`;
 const hb=H*gB;
 h+=`<rect x="640" y="${base-hb}" width="220" height="${hb}" rx="14" fill="url(#hatch)" stroke="#ff5d5d" stroke-width="6" stroke-dasharray="22 14"/>`;
 h+=`<g opacity="${cl(gB,0,.2)}"><rect x="640" y="${base-hb-4}" width="220" height="10" rx="5" fill="#ff5d5d"/></g>`;
 h+=X.big(750,base-H-60,'OVER $4',104,'#ff7a3c',cl(t,fT+.1,fT+.6));
 h+=T(330,base+62,'THE COMBO',40,'#ffd166',{op:cl(u,.2,.6)})+T(750,base+62,'WITH INFLATION',40,'#ff9a7a',{op:cl(u,.5,.9)});
 return h},sfx:s=>{const fT=X.wordT(2,/four/);return[{k:'riser',t:s.ls+.4,d:Math.max(.6,fT-s.ls)},{k:'impact',t:fT+.15}]}});

// 3: Kosten steigen -> Gewinn fast null
const ICO={meat:`<g><rect x="-46" y="-16" width="60" height="32" rx="16" fill="#d0563a"/><rect x="-6" y="-16" width="56" height="32" rx="16" fill="#b23a24"/><circle cx="12" cy="0" r="5" fill="#7a2414"/></g>`,
 bun:`<g><path d="M-50,10 Q-52,-34 0,-36 Q52,-34 50,10 Z" fill="#e7a95c"/><rect x="-54" y="6" width="108" height="20" rx="10" fill="#c98a45"/><circle cx="-14" cy="-18" r="3" fill="#fff8"/><circle cx="12" cy="-24" r="3" fill="#fff8"/></g>`,
 wage:`<g transform="translate(-6,22)">${X.person('#f472b6')}<circle cx="34" cy="-38" r="20" fill="url(#gGold)"/><text x="34" y="-30" text-anchor="middle" font-family="Arial Black" font-size="24" fill="#3a2300">$</text></g>`,
 rent:`<g transform="translate(0,6) scale(1.15)">${X.house('#60a5fa')}</g>`};
S.push({a:3,tr:'zoom',f:(t,s)=>{
 const u=t-s.ls; let h=X.kick('EVERYTHING GOT PRICIER',cl(u,-.1,.4),'#ff5d5d',250,56);
 h+=X.cone(540,360,120,620,620,.6)+`<g transform="translate(540,${720+Math.sin(u*2)*6}) scale(.82)">${X.hotdog(1)}</g>`;
 const B=[['meat',/Meat/i,'MEAT',190,470],['bun',/buns/i,'BUNS',890,470],['wage',/wages/i,'WAGES',190,930],['rent',/rent/i,'RENT',890,930]];
 B.forEach((b,i)=>{const tb=X.wordT(3,b[1],.1+i*.08),p=cl(t,tb-.15,tb+.35);if(p<=0)return;const s2=bo(p);
  h+=`<path d="M${b[3]},${b[4]} L540,720" stroke="#ff5d5d" stroke-width="4" stroke-dasharray="10 12" opacity="${.5*cl(p,.3,1)}"/>`;
  h+=`<g transform="translate(${b[3]},${b[4]}) scale(${s2})">${X.badge(ICO[b[0]],'#ff5d5d',88)}<g transform="translate(64,-62)">${X.arrowUp('#ff5d5d',.9*bo(cl(t,tb+.15,tb+.5)))}</g></g>`;
  h+=T(b[3],b[4]+140,b[2],40,'#ffffff',{op:cl(p,.4,1)})});
 const nT=X.wordT(3,/nothing/,.85),p=cl(t,nT-.35,nT+.2);
 if(p>0){h+=`<g transform="translate(540,1195) scale(${bo(p)})" opacity="${cl(p,0,.3)}"><rect x="-330" y="-74" width="660" height="128" rx="64" fill="#1a0b10" stroke="#ff5d5d" stroke-width="6"/>${T(0,22,'PROFIT ≈ $0',74,'#ff5d5d')}</g>`}
 return h},sfx:s=>{const e=[];[/Meat/i,/buns/i,/wages/i,/rent/i].forEach((r,i)=>e.push({k:'pop',t:X.wordT(3,r,.1+i*.08)}));e.push({k:'thud',t:X.wordT(3,/nothing/,.85)-.2});return e}});

// 4: 200 Millionen pro Jahr – Raster aus Hot Dogs, Kamera zieht zurueck
S.push({a:4,tr:'up',f:(t,s)=>{
 const u=t-s.ls, d=M.L(4).end-s.ls, p=ez(cl(u,0,d*.9)), zm=lerp(2.1,.92,ei(cl(u,-.2,d+.2)));
 let h=`<g clip-path="url(#clipTop)"><g transform="translate(540,880) scale(${zm}) translate(-540,-880)">`;
 const C=9,R=13;
 for(let r=0;r<R;r++)for(let c=0;c<C;c++){const x=540+(c-(C-1)/2)*118,y=880+(r-(R-1)/2)*70,dd=Math.hypot(c-(C-1)/2,(r-(R-1)/2)*.7);
  const q=cl(u,.0+dd*.11,.35+dd*.11);if(q<=0)continue;h+=`<g transform="translate(${x},${y}) scale(${.21*bo(q)})">${X.hotdog(1)}</g>`}
 h+='</g><rect x="0" y="1150" width="1080" height="150" fill="url(#fadeBot)"/></g>';
 h+=`<rect x="0" y="0" width="1080" height="560" fill="url(#fadeTop)"/>`;
 const n=Math.round(200*p);
 h+=X.big(540,360,`${n} MILLION`,104,'#ffd166',cl(u,-.1,.3))+T(540,440,'COMBOS EVERY YEAR',44,'#ffffff',{op:cl(u,.2,.6),st:'#05070f',sw:8});
 return h},sfx:s=>{const e=[],d=M.L(4).end-s.ls;for(let k=0;k<10;k++)e.push({k:'tick',t:s.ls+k*d*.09,f:1800+k*80});e.push({k:'pop',t:s.ls+d*.9});return e}});

// 5: Loss Leader – Koeder vor der Tuer
S.push({a:5,tr:'left',f:(t,s)=>{
 const u=t-s.ls, d=M.L(5).end-s.ls; let h=X.kick('THE "LOSS LEADER"',cl(u,-.1,.4),'#ffd166',250,62);
 const doorT=X.wordT(5,/pulls/,.6),dp=ei(cl(t,doorT-.6,doorT+.1));
 // Gebaeude
 h+=`<g filter="url(#sh)"><path d="M210,600 L870,600 L910,660 L170,660 Z" fill="#3b4560"/><rect x="190" y="655" width="700" height="520" fill="url(#gSteel)"/>
 ${[0,1,2,3,4,5,6].map(i=>`<rect x="${215+i*96}" y="690" width="70" height="20" rx="4" fill="#ffd16633"/>`).join('')}
 <rect x="190" y="730" width="700" height="10" fill="#ffd166" opacity=".7"/></g>`;
 // Tuer (Schiebetueren)
 h+=`<rect x="430" y="900" width="220" height="275" fill="#ffe7a8" opacity="${.25+.6*dp}"/><rect x="430" y="900" width="220" height="275" fill="url(#gSpot)" opacity="${dp}"/>`;
 h+=`<rect x="${430-100*dp}" y="900" width="110" height="275" fill="#9fc0ff44" stroke="#dfe7ff88" stroke-width="4"/><rect x="${540+100*dp}" y="900" width="110" height="275" fill="#9fc0ff44" stroke="#dfe7ff88" stroke-width="4"/>`;
 h+=`<rect x="150" y="1172" width="780" height="10" rx="5" fill="#ffffff22"/>`;
 // Angel + Hot Dog als Koeder
 const sw=Math.sin(u*2.4)*7, rodP=ez(cl(u,.1,.7));
 h+=`<path d="M60,${430} Q300,${330} ${lerp(120,540,rodP)},${lerp(420,400,rodP)}" stroke="#c9a36a" stroke-width="12" fill="none" stroke-linecap="round"/>`;
 const hx=540+Math.sin(sw*Math.PI/180)*360, hy=400+Math.cos(sw*Math.PI/180)*360*ez(cl(u,.3,1));
 h+=`<line x1="540" y1="400" x2="${hx}" y2="${hy}" stroke="#ffffff99" stroke-width="3" opacity="${rodP}"/>`;
 h+=`<g transform="translate(${hx},${hy+40}) rotate(${-sw}) scale(.5)" opacity="${cl(u,.3,.6)}">${X.hotdog(1)}</g>`;
 // Kunden laufen hinein
 for(let k=0;k<5;k++){const t0=.2+k*(d*.75)/5,q=cl(u,t0,t0+1.8);if(q<=0||q>=1)continue;const x=lerp(-60,540,ei(q)),fade=1-cl(q,.85,1),bob=Math.abs(Math.sin(q*18))*8;
  h+=`<g transform="translate(${x},${1172-bob}) scale(${lerp(1,.8,cl(q,.8,1))})" opacity="${fade}">${X.person(['#dfe7ff','#ffd166','#60a5fa','#f472b6','#35e08a'][k])}</g>`}
 return h},sfx:s=>[{k:'pop',t:X.wordT(5,/pulls/,.6)-.4},{k:'swish',t:s.ls+.2,d:.6,pan:-.3}]});

// 6: Einkaufswagen fuellt sich
const ITEMS=[
 {w:200,h:150,svg:`<rect x="-100" y="-150" width="200" height="150" rx="10" fill="#3b7be0"/><rect x="-100" y="-90" width="200" height="22" fill="#9cc6ff88"/>`},
 {w:180,h:190,svg:`<rect x="-90" y="-190" width="180" height="190" rx="12" fill="#1b2133" stroke="#9fb0d0" stroke-width="6"/><rect x="-74" y="-174" width="148" height="110" rx="8" fill="#2a5cff55"/>`},
 {w:170,h:150,svg:[0,1,2].map(i=>`<rect x="${-85+i*58}" y="-150" width="54" height="150" rx="20" fill="#f4f6fb"/><rect x="${-85+i*58}" y="-110" width="54" height="16" fill="#35e08a"/>`).join('')},
 {w:190,h:130,svg:[0,1,2,3].map(i=>`<rect x="${-95+i*48}" y="-130" width="40" height="130" rx="14" fill="#35e08a" opacity=".9"/><rect x="${-87+i*48}" y="-150" width="24" height="26" rx="6" fill="#1b5e38"/>`).join('')},
 {w:150,h:210,svg:`<rect x="-75" y="-210" width="150" height="210" rx="10" fill="#ff5d5d"/><circle cx="0" cy="-120" r="40" fill="#ffd166"/>`}];
const SLOT=[[-150,40],[60,40],[-40,-110],[170,-100],[-190,-110]];
S.push({a:6,tr:'zoom',f:(t,s)=>{
 const u=t-s.ls, d=M.L(6).end-s.ls; let h=X.kick('JUST A HOT DOG?',cl(u,-.1,.4),'#35e08a',250,62);
 const cx=470,cy=1000;
 // Kassenbon waechst rechts
 const rp=ez(cl(u,.3,d)),rh=80+640*rp;
 h+=`<g filter="url(#sh)"><rect x="840" y="420" width="190" height="${rh}" fill="#f4f6fb"/>`;
 for(let k=0;k<Math.floor((rh-40)/44);k++)h+=`<rect x="860" y="${450+k*44}" width="${70+(k*37)%60}" height="14" rx="7" fill="#9aa3b8"/><rect x="980" y="${450+k*44}" width="32" height="14" rx="7" fill="#c4cad8"/>`;
 h+=`<path d="M840,${420+rh} ${[...Array(10)].map((_,i)=>`L${840+i*19+9.5},${420+rh+10} L${840+(i+1)*19},${420+rh}`).join(' ')}" fill="#f4f6fb"/><rect x="820" y="400" width="230" height="26" rx="10" fill="#2a3044"/></g>`;
 // Waren fallen in den Wagen (hinter der Gitterfront)
 ITEMS.forEach((it,i)=>{const t0=.25+i*(d*.8)/ITEMS.length,q=cl(u,t0,t0+.45);if(q<=0)return;const fall=1-q*q,bou=q>=1?Math.max(0,Math.sin(cl(u,t0+.45,t0+.75)*Math.PI))*-14:0;
  h+=`<g transform="translate(${cx+SLOT[i][0]},${cy-60+SLOT[i][1]-fall*800+bou})">${it.svg}</g>`});
 // Wagen
 h+=`<g transform="translate(${cx},${cy})"><path d="M-300,-170 L300,-170 L250,90 L-240,90 Z" fill="#9fc0ff22" stroke="#cfdcf5" stroke-width="12" stroke-linejoin="round"/>
 ${[-200,-100,0,100,200].map(x=>`<line x1="${x}" y1="-170" x2="${x*.82}" y2="90" stroke="#cfdcf5" stroke-width="6" opacity=".7"/>`).join('')}
 <line x1="-275" y1="-40" x2="275" y2="-40" stroke="#cfdcf5" stroke-width="6" opacity=".7"/>

 $('hook').innerHTML=`<div style="opacity:${hq};transform:translateY(${(1-hq)*-24}px)">THIS PRICE HASN'T<br><span style="color:#ffd166">MOVED IN 40 YEARS</span></div>`;
 // Push in das Preisschild -> Match-Cut
 const pp=ei(cl(t,te-.75,te+.05));
 $('intro').style.transform='';if(pp>0){const r=$('bbTag').getBoundingClientRect(),ox=r.left+r.width/2,oy=r.top+r.height/2;$('intro').style.transformOrigin=`${ox}px ${oy}px`;$('intro').style.transform=`scale(${1+5*pp*pp})`}else $('intro').style.transform='';
 $('intro').style.opacity=1-ez(cl(t,te-.05,te+.35));
 $('stage').style.setProperty('--x',0);
}

// ---------- Hauptschleife ----------
let fin=false;
function draw(t){
 if(!fin){M.finish($('stage'),1080,1920,.07);fin=true}
 X.bg($('bg'),t,PAL);
 drawIntro(t);
 $('content').innerHTML=X.render(t);
 const te=IT.te,fl=ez(cl(t,te-.35,te))*(1-ez(cl(t,te,te+.5)));$('flash').style.opacity=fl*.95;
 $('cap').innerHTML=M.captions(t,{y:1380});
 M.grainTick(t);
}
window.setTimeline=tl=>{M.TL=tl;X.compute();introTimes()};
window.sfxEvents=()=>{const e=[{k:'whoosh',t:.15,d:1.2},{k:'thud',t:IT.drop+.42},{k:'swish',t:IT.drop+.55,d:.5,pan:.2},{k:'pop',t:IT.tag-.2},{k:'cash',t:IT.cash},{k:'riser',t:IT.te-1.0,d:1.0},{k:'impact',t:IT.te}];return e.concat(X.sfx()).sort((a,b)=>a.t-b.t)};
window.draw=draw;
