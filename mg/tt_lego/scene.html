<!doctype html><meta charset=utf-8><style>
@font-face{font-family:P;src:url(fonts/Poppins-Bold.ttf);font-weight:700}
@font-face{font-family:P;src:url(fonts/Poppins-Medium.ttf);font-weight:500}
html,body{margin:0;background:#2f86d0}
#stage{position:relative;width:1080px;height:1920px;overflow:hidden;font-family:P,Arial,sans-serif;background:radial-gradient(circle at 50% 42%,#8fd3ff 0%,#4fa6e6 48%,#2a76c0 100%)}
#pat{position:absolute;inset:-60px;opacity:.13;background-image:radial-gradient(circle,#ffffff 1.8px,transparent 2.4px);background-size:52px 52px}
#mapwrap{position:absolute;inset:0;opacity:0}
#mapsvg{position:absolute;left:0;top:0}
#mapov,#imgs,#fg{position:absolute;inset:0}
#cap{position:absolute;inset:0;z-index:60}
.land{fill:#f4f8fc;stroke:#7fb0da;stroke-width:1.2;vector-effect:non-scaling-stroke}
.st{fill:none;stroke:#a9c9e6;stroke-width:1;vector-effect:non-scaling-stroke}
</style>
<div id=stage><div id=pat></div>
 <div id=deco style="position:absolute;inset:0"></div><div id=fg></div><div id=cap></div></div>
<script src="../lib/core.js"></script>
<script src="../lib/mapdata.js"></script>
<script>
// TikTok 9:16 – LEGO as investment: Sam + detailed coded bricks/boxes (sky theme, YT11 style)
const {cl,ez,ei,bo,el,lerp}=MG,$=MG.$,W=1080,H=1920,CX=540,CY=860;
const C={cream:'#fff6e6',gold:'#ffc94a',green:'#3ddc84',green2:'#1fa45a',red:'#ff5b4a',red2:'#d6402e',orange:'#ff9f43',blue:'#2f86d0',ink:'#14202c',sand:'#f1d39a',sand2:'#d9b16b',water:'#3f9fe0',water2:'#2b7fc4'};
let TL=null,fontsOk=false;
const S=i=>TL.lines[i].start,E=i=>TL.lines[i].end,DU=i=>E(i)-S(i),SP=i=>TL.lines[i].spec;
const sg=(t,a,b)=>ei(cl(t,a,b));
// ---------- building blocks
function TX(x,y,txt,o={}){const p=o.p??1;if(p<=0)return'';const sz=o.size||64,s=o.s??1;
 return `<div style="position:absolute;left:${x}px;top:${y}px;transform:translate(-50%,-50%) translateY(${((1-Math.min(1,p))*22).toFixed(1)}px) scale(${s.toFixed(3)}) rotate(${o.rot||0}deg);opacity:${Math.min(1,p).toFixed(3)};font:700 ${sz}px/1.05 P,Arial;color:${o.col||C.cream};white-space:nowrap;text-align:center;text-shadow:${MG.outline(o.ol||Math.max(3,Math.round(sz/13)))},0 ${sz/9}px ${sz/3}px #0a2a5099">${txt}</div>`}
function pill(x,y,txt,o={}){const p=o.p??1;if(p<=0)return'';const sz=o.size||36,s=bo(Math.min(1,p))*(o.s??1);
 const dot=o.dot?`<span style="display:inline-block;width:${sz*.62}px;height:${sz*.62}px;border-radius:50%;background:${o.dot};margin-right:${sz*.3}px;vertical-align:-${sz*.06}px"></span>`:'';
 return `<div style="position:absolute;left:${x}px;top:${y}px;transform:translate(-50%,-50%) scale(${s.toFixed(3)});opacity:${Math.min(1,p*2).toFixed(3)};padding:${sz*.34}px ${sz*.7}px;border-radius:${sz*1.2}px;background:${o.bg||'#ffffffee'};color:${o.fg||C.ink};font:700 ${sz}px/1.1 P,Arial;white-space:nowrap;box-shadow:0 10px 26px #0a2a5066">${dot}${txt}</div>`}
function card(x,y,w,inner,p,o={}){if(p<=0)return'';const s=bo(Math.min(1,p));
 return `<div style="position:absolute;left:${x-w/2}px;top:${y}px;width:${w}px;box-sizing:border-box;transform:scale(${s.toFixed(3)}) rotate(${o.rot||0}deg);transform-origin:50% 0;opacity:${Math.min(1,p*2).toFixed(3)};padding:${o.pad||'20px 30px'};border-radius:30px;background:${o.bg||'#ffffffee'};box-shadow:0 22px 46px #0a2a5066;color:${C.ink};text-align:${o.align||'center'}">${inner}</div>`}
function stamp(x,y,txt,p,col=C.red,rot=-8,sz=70){if(p<=0)return'';const s=lerp(2.2,1,ez(Math.min(1,p)));return `<div style="position:absolute;left:${x}px;top:${y}px;transform:translate(-50%,-50%) rotate(${rot}deg) scale(${s.toFixed(3)});opacity:${Math.min(1,p*2.5).toFixed(3)};padding:10px 30px;border:8px solid ${col};border-radius:18px;color:${col};font:700 ${sz}px/1 P;letter-spacing:3px;background:#ffffffdd;white-space:nowrap">${txt}</div>`}
// ---------- assets (Gemini objects, keyed out) + Sam
const IM=k=>`img/${k}.png`;
function obj(k,x,y,w,o={}){const op=o.op??1;if(op<=0.001||w<=1)return'';return `<img src="${IM(k)}" style="position:absolute;left:0;top:0;width:${w.toFixed(1)}px;transform:translate(${(x-w/2).toFixed(1)}px,${(y-w/2).toFixed(1)}px) rotate(${(o.rot||0).toFixed(2)}deg) scaleX(${o.flip?-1:1});opacity:${op.toFixed(3)};filter:drop-shadow(0 ${(w/22).toFixed(0)}px ${(w/16).toFixed(0)}px #0a2a5066)${o.f||''}">`}
const fl=(t,i,a=10)=>Math.sin(t*2.1+i*1.7)*a; // idle float
function bgDeco(t){// slow floating bricks in the background – never a static frame
 let h='';for(let i=0;i<9;i++){const x=(MG.rnd(i)*1180-50+t*(8+MG.rnd(i+4)*10))%1180-50,y=(MG.rnd(i+20)*1700+80+Math.sin(t*.7+i)*30);h+=obj('brick',x,y,60+MG.rnd(i+7)*50,{rot:t*(10+i*3)%360,op:.18})}return h}
function ground(){return `<div style="position:absolute;left:-60px;right:-60px;top:1390px;height:600px;background:linear-gradient(#f1e3c6,#dcc8a2);border-top:6px solid #ffffff88"></div>`}
function hookTitle(p=1){return TX(540,190,'WHY YOU SHOULD NEVER',{size:62,p})+TX(540,300,'THROW AWAY',{size:106,col:C.gold,p})+TX(540,420,'YOUR OLD LEGO',{size:106,col:C.gold,p})}
const ANIM={
 hero(t,k){const sp=SP(k),a=S(k),D=DU(k);let h=ground();const p=k===0?1:el(cl(t,a-.25,a+.35));
  h+=obj('pile',220,1420,330,{rot:fl(t,1,1.5)})+obj('trash',800,1300,380,{rot:fl(t,2,1.2)});
  // the box hovers over the trash can, tilting, with a red "no" ring
  const by=930+fl(t,3,16);h+=obj('box',800,by,420,{rot:10+fl(t,4,4)});
  const rq=k===0?1:cl(t,a+.1,a+.4);h+=`<div style="position:absolute;left:${800-150}px;top:${1160-150}px;width:300px;height:300px;border-radius:50%;border:16px solid ${C.red};transform:scale(${bo(rq).toFixed(3)}) rotate(-45deg);opacity:${rq.toFixed(2)}"><div style="position:absolute;left:50%;top:-8px;bottom:-8px;width:16px;margin-left:-8px;background:${C.red}"></div></div>`;
  h+=`<img src="${IM('samthink')}" style="position:absolute;left:0;top:0;width:${(560*p).toFixed(1)}px;transform:translate(${(300-280*p).toFixed(1)}px,${(1200-280*p+fl(t,5,5)).toFixed(1)}px);filter:drop-shadow(0 26px 30px #0a2a5088)">`;
  if(k===0){const q=1-cl(t,a+D*.85,a+D*.98);if(q>0)h+=`<div style="opacity:${q.toFixed(3)}">${hookTitle()}</div>`}
  if(sp.choice){const end=TL.dur,out=1-cl(t,end-.6,end-.2);
   h+=`<div style="opacity:${out.toFixed(3)}">`+TX(540,230,'WHAT WOULD YOU DO?',{size:70,p:cl(t,a+.05,a+.3)})+pill(540,410,'📦 KEEP IT SEALED',{p:cl(t,a+D*.15,a+D*.3),size:56,bg:C.green2,fg:'#fff'})+pill(540,550,'🧱 OPEN & BUILD',{p:cl(t,a+D*.35,a+D*.5),size:56,bg:'#fff'})+`</div>`;
   const tin=cl(t,end-.5,end-.06);if(tin>0)h+=`<div style="opacity:${tin.toFixed(3)}">${hookTitle()}</div>`}
  return h},
 study(t,k){const a=S(k),D=DU(k);let h='';const q=sg(t,a,a+D*.8);
  h+=obj('pile',540,930,lerp(300,640,el(cl(t,a-.2,a+.5))),{rot:fl(t,1,3)});
  // boxes fly in from all sides and orbit
  for(let i=0;i<12;i++){const ang=i/12*6.283+t*.35,st=a+.05+i*D*.05,pq=ez(cl(t,st,st+.45));if(pq<=0)continue;const R=lerp(900,400,pq);h+=obj('box',540+Math.cos(ang)*R,900+Math.sin(ang)*R*.82,150,{rot:fl(t,i,12)+ang*20,op:pq})}
  h+=card(540,130,720,`<div style="font:700 110px/1 P;color:${C.ink}">${MG.fmt(2322*q,0)}</div><div style="font:500 34px P;color:#4a5b6c;margin-top:6px">LEGO sets studied · 1987–2015</div>`,cl(t,a-.1,a+.2));
  h+=pill(540,1430,'🔬 HSE University study',{p:cl(t,a+D*.45,a+D*.6),size:42});return h},
 grow(t,k){const a=S(k),D=DU(k);let h=ground();
  // bricks drop one after another and stack (smooth, continuous)
  for(let r=0;r<12;r++){const st=a-.1+r*D*.07,q=cl(t,st,st+.35);if(q<=0)continue;const y=lerp(-200,1390-110-r*78,ez(q))+ (q<1?0:Math.sin((t-st-.35)*18)*Math.exp(-(t-st-.35)*6)*8);h+=obj('brick',280+((r%2)*30-15),y,230,{rot:(r%2?4:-4)*(1-q)+fl(t,r,.8)})}
  h+=obj('box',790,1130+fl(t,2,12),360,{rot:-4+fl(t,3,3),f:''});
  const gq=cl(t,a+D*.3,a+D*.45);h+=TX(790,660+fl(t,4,6),'+11%',{size:180,col:C.green,p:gq,s:bo(gq)})+pill(790,810,'per year',{p:cl(t,a+D*.42,a+D*.55),size:48,dot:C.green2})+pill(540,200,'UNOPENED SETS',{p:cl(t,a-.1,a+.15),size:54,bg:C.green2,fg:'#fff'});
  // sparkles
  for(let i=0;i<8;i++){const ph=(t*.8+i/8)%1;h+=`<div style="position:absolute;left:${(790+Math.cos(i*.8)*220).toFixed(0)}px;top:${(1050-ph*260+Math.sin(i)*80).toFixed(0)}px;font-size:${(30+20*Math.sin(ph*Math.PI)).toFixed(0)}px;opacity:${(Math.sin(ph*Math.PI)*.9).toFixed(2)}">✨</div>`}
  return h},
 race(t,k){const a=S(k),D=DU(k);let h='';const rows=[['box','LEGO',1,C.green2],['gold','Gold',.74,'#f2b51c'],['arrow','Stocks',.66,'#4fa3ff'],['bond','Bonds',.44,'#9aa6b2']];
  h+=TX(540,210,'WHO GREW FASTER?',{size:74,p:cl(t,a-.1,a+.15)});
  rows.forEach((r,i)=>{const st=a+i*D*.08,q=sg(t,st,st+D*.55),y=400+i*250,w=680*r[2]*q;
   h+=`<div style="position:absolute;left:220px;top:${y+40}px;height:130px;width:${w.toFixed(0)}px;border-radius:0 34px 34px 0;background:linear-gradient(${r[3]},${r[3]}cc);box-shadow:0 16px 30px #0a2a5055;${i===0?'outline:8px solid #fff;':''}"></div>`;
   h+=obj(r[0],150,y+105+fl(t,i,6),200,{rot:fl(t,i+3,4),op:Math.min(1,q*3+.3)})+`<div style="position:absolute;left:250px;top:${y+78}px;font:700 50px P;color:#fff;text-shadow:0 3px 10px #0a2a5099;opacity:${Math.min(1,q*3).toFixed(2)}">${r[1]}</div>`});
  const wq=cl(t,a+D*.62,a+D*.75);if(wq>0)h+=`<div style="position:absolute;left:${220+680-60}px;top:${330}px;font-size:120px;transform:scale(${bo(wq).toFixed(3)}) rotate(${(15+fl(t,9,5)).toFixed(1)}deg)">👑</div>`;
  h+=pill(540,1440,'1987–2015 · sealed sets',{p:cl(t,a+D*.4,a+D*.55),size:40});return h},
 price(t,a0){const a=S(a0),D=DU(a0),hasB=SP(a0+1)&&SP(a0+1).type==='price',b=hasB?S(a0+1):1e9,Db=hasB?DU(a0+1):1;let h=ground();
  const q=sg(t,b,b+Db*.7);const val=lerp(499.99,3999,q);
  if(t>b){for(let i=0;i<10;i++){const ph=((t-b)*.7+MG.rnd(i))%1;h+=obj('cash',540+(MG.rnd(i+3)-.5)*900,lerp(-100,1500,ph),110,{rot:(t*90+i*40)%360,op:.85*cl(t,b+Db*.5,b+Db*.6)})}}
  h+=obj('box',540,860+fl(t,1,14),lerp(560,640,q),{rot:fl(t,2,3)});
  // shine sweep when value rises
  if(t>b)h+=`<div style="position:absolute;left:250px;top:560px;width:580px;height:600px;overflow:hidden;border-radius:30px;pointer-events:none"><div style="position:absolute;top:-30%;left:${(((t-b)*.9%1.4)*100-30).toFixed(0)}%;width:26%;height:160%;background:linear-gradient(90deg,transparent,#ffffff77,transparent);transform:rotate(18deg)"></div></div>`;
  const sw=Math.sin(t*2.6)*9;h+=`<div style="position:absolute;left:0;top:0;transform:translate(840px,1150px) rotate(${sw.toFixed(1)}deg);transform-origin:0 -80px">${obj('tag',0,0,380)}<div style="position:absolute;left:-140px;top:10px;width:230px;text-align:center;transform:rotate(-8deg);font:700 ${q>0?52:46}px P;color:${q>.95?'#13692f':C.ink}">${q>0?'$'+MG.fmt(val,0):'$499.99'}</div></div>`;
  h+=pill(270,1250,t<b?'2007':'2016',{p:cl(t,a-.1,a+.15),size:62,dot:t<b?C.gold:C.green});
  if(t>b){h+=TX(540,230,'×8',{size:190,col:C.green,p:cl(t,b+Db*.55,b+Db*.7),s:bo(cl(t,b+Db*.55,b+Db*.75))});}
  else h+=TX(540,230,'$499.99',{size:140,col:'#fff',p:cl(t,a-.05,a+.2)});
  return h},
 sealed(t,k){const a=S(k),D=DU(k);let h=ground();
  h+=obj('box',560,820+fl(t,1,14),600,{rot:-3+fl(t,2,2)});
  h+=`<div style="position:absolute;left:400px;top:${(1040+fl(t,1,14)).toFixed(0)}px;padding:12px 30px;border-radius:20px;background:${C.green2};border:6px solid #fff;font:700 48px P;color:#fff;transform:rotate(-8deg) scale(${bo(cl(t,a+.15,a+.4)).toFixed(3)});box-shadow:0 14px 26px #0a2a5066">SEALED ✓</div>`;
  const steps=['RETIRED','+1 YEAR','+2 YEARS','+3 YEARS'],cq=sg(t,a+D*.35,a+D*.9),ci=Math.min(3,Math.floor(cq*4)),flip=(cq*4)%1;
  h+=`<div style="position:absolute;left:0;top:0;transform:translate(850px,${(1280+fl(t,3,8)).toFixed(0)}px) scale(${bo(cl(t,a+D*.3,a+D*.45)).toFixed(3)})">${obj('cal',0,0,360,{rot:5})}<div style="position:absolute;left:-125px;top:${-5}px;width:220px;text-align:center;font:700 38px P;color:${C.ink};transform:rotate(5deg) scaleY(${(ci<3?Math.max(.2,1-Math.pow(flip,6)):1).toFixed(2)})">${steps[ci]}</div></div>`;
  h+=`<img src="${IM('samhappy')}" style="position:absolute;left:0;top:0;width:470px;transform:translate(${lerp(-500,15,ez(cl(t,a-.1,a+.4))).toFixed(0)}px,${(1080+fl(t,4,6)).toFixed(0)}px);filter:drop-shadow(0 26px 30px #0a2a5088)">`;
  h+=pill(540,220,'KEEP THE BOX SEALED',{p:cl(t,a-.1,a+.15),size:56,bg:C.green2,fg:'#fff'})+pill(830,1500,'📈 value rising',{p:cl(t,a+D*.62,a+D*.72),size:40,dot:C.green2});return h}
};
let T=0;
function seqR(k){const ty=SP(k).type;let a=k,b=k;while(a>0&&SP(a-1).type===ty)a--;while(b+1<TL.lines.length&&SP(b+1).type===ty)b++;return [a,b]}
// swipe transitions + slow camera push-in per scene
function fgLayer(t){let h='';const N=TL.lines.length,seen=new Set();
 for(let k=0;k<N;k++){const ty=SP(k).type;if(!ANIM[ty])continue;const [a0,b0]=seqR(k);if(seen.has(a0))continue;seen.add(a0);
  const a=a0===0?-1:S(a0)-.2,b=b0+1<N?S(b0+1)+.2:TL.dur+1;if(t<a||t>b)continue;
  const qi=a0===0?1:ei(cl(t,a,a+.32)),qo=b0+1<N?ei(cl(t,b-.32,b)):0;
  const dx=(1-qi)*1150-qo*1150,blur=Math.abs(dx)>4?Math.min(14,Math.abs(dx)/40):0;
  const st=a0===0?0:S(a0),en=b0+1<N?S(b0+1):TL.dur,u=cl(t,st,en),z=1+.06*u;
  h+=`<div style="position:absolute;inset:0;transform:translateX(${dx.toFixed(1)}px) scale(${z.toFixed(4)});transform-origin:540px 900px;${blur?`filter:blur(${blur.toFixed(1)}px);`:''}">${ANIM[ty](t,a0)}</div>`}
 return h}
function draw(t){if(!TL)return;T=t;
 $('deco').innerHTML=bgDeco(t);
 const fh=fgLayer(t);if(fh!==$('fg')._h){$('fg').innerHTML=fh;$('fg')._h=fh}
 $('pat').style.transform=`translateY(${(-(t/TL.dur*52*8)%52).toFixed(1)}px)`;
 const c=t>=TL.lines[TL.lines.length-1].end-.02?'':MG.captions(t,{y:1570,size:66,maxWords:3,stageW:1080,w:940,upper:true});if(c!==$('cap')._h){$('cap').innerHTML=c;$('cap')._h=c}
 MG.grainTick(t)}
let imgReady=false;
window.setTimeline=tl=>{MG.TL=TL=tl;MG.preload(['samhappy','samthink','box','pile','brick','trash','gold','arrow','tag','cal','study','bond','cash'].map(IM));Promise.all([document.fonts.load('700 50px P'),document.fonts.load('500 50px P')]).then(()=>{fontsOk=true},()=>{fontsOk=true})};
Object.defineProperty(window,'ready',{configurable:true,get(){return imgReady&&fontsOk},set(v){imgReady=v}});
window.sfxEvents=()=>{const ev=[],N=TL.lines.length,add=(k,t,o={})=>ev.push(Object.assign({k,t:+t.toFixed(3)},o));
 for(let i=1;i<N;i++)if(SP(i).type!==SP(i-1).type)add(i%2?'whoosh':'swish',S(i)-.22,{d:.45});
 for(let k=0;k<N;k++){const ty=SP(k).type,a=S(k),d=DU(k);
  if(ty==='hero'&&k===0)add('impact',a+.05);
  if(ty==='hero'&&SP(k).choice){add('pop',a+d*.17);add('pop',a+d*.37)}
  if(ty==='study'){for(let i=0;i<6;i++)add('blip',a+.1+i*d*.1);}
  if(ty==='grow'){for(let i=0;i<8;i++)add('click',a+.2+i*d*.07);add('ding',a+d*.35)}
  if(ty==='race'){add('whoosh',a+.05,{d:.8});add('ding',a+d*.64)}
  if(ty==='price'&&SP(k-1)&&SP(k-1).type!=='price')add('pop',a+.1);
  if(ty==='price'&&SP(k-1)&&SP(k-1).type==='price'){for(let i=0;i<8;i++)add('tick',a+.05+i*d*.08,{f:1200+i*80});add('cash',a+d*.62)}
  if(ty==='sealed'){add('pop',a+.2);for(let i=0;i<3;i++)add('click',a+d*(.45+i*.14));add('ding',a+d*.72)}}
 ev.sort((a,b)=>a.t-b.t);const out=[];for(const e of ev){if(e.t<0)e.t=0;if(!out.find(o=>o.k==e.k&&Math.abs(o.t-e.t)<.12))out.push(e)}return out};
window.draw=draw;
MG.finish($('stage'),1080,1920,.04,'#0a2a5022',65);
</script>
