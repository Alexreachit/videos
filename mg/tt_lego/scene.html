<!doctype html><meta charset=utf-8><style>
@font-face{font-family:P;src:url(fonts/Poppins-Bold.ttf);font-weight:700}
@font-face{font-family:P;src:url(fonts/Poppins-Medium.ttf);font-weight:500}
html,body{margin:0;background:#2f86d0}
#stage{position:relative;width:1080px;height:1920px;overflow:hidden;font-family:P,Arial,sans-serif;background:radial-gradient(circle at 50% 42%,#8fd3ff 0%,#4fa6e6 48%,#2a76c0 100%)}
#pat{position:absolute;inset:-60px;opacity:.13;background-image:radial-gradient(circle,#ffffff 1.8px,transparent 2.4px);background-size:52px 52px}
#mapwrap{position:absolute;inset:0;opacity:0}
#mapsvg{position:absolute;left:0;top:0}
#mapov,#imgs,#fg{position:absolute;inset:0}
#cap{position:absolute;inset:0;z-index:60}
.land{fill:#f4f8fc;stroke:#7fb0da;stroke-width:1.2;vector-effect:non-scaling-stroke}
.st{fill:none;stroke:#a9c9e6;stroke-width:1;vector-effect:non-scaling-stroke}
</style>
<div id=stage><div id=pat></div>
 <div id=fg></div><div id=cap></div></div>
<script src="../lib/core.js"></script>
<script src="../lib/mapdata.js"></script>
<script>
// TikTok 9:16 – LEGO as investment: Sam + detailed coded bricks/boxes (sky theme, YT11 style)
const {cl,ez,ei,bo,el,lerp}=MG,$=MG.$,W=1080,H=1920,CX=540,CY=860;
const C={cream:'#fff6e6',gold:'#ffc94a',green:'#3ddc84',green2:'#1fa45a',red:'#ff5b4a',red2:'#d6402e',orange:'#ff9f43',blue:'#2f86d0',ink:'#14202c',sand:'#f1d39a',sand2:'#d9b16b',water:'#3f9fe0',water2:'#2b7fc4'};
let TL=null,fontsOk=false;
const S=i=>TL.lines[i].start,E=i=>TL.lines[i].end,DU=i=>E(i)-S(i),SP=i=>TL.lines[i].spec;
const sg=(t,a,b)=>ei(cl(t,a,b));
// ---------- building blocks
function TX(x,y,txt,o={}){const p=o.p??1;if(p<=0)return'';const sz=o.size||64,s=o.s??1;
 return `<div style="position:absolute;left:${x}px;top:${y}px;transform:translate(-50%,-50%) translateY(${((1-Math.min(1,p))*22).toFixed(1)}px) scale(${s.toFixed(3)}) rotate(${o.rot||0}deg);opacity:${Math.min(1,p).toFixed(3)};font:700 ${sz}px/1.05 P,Arial;color:${o.col||C.cream};white-space:nowrap;text-align:center;text-shadow:${MG.outline(o.ol||Math.max(3,Math.round(sz/13)))},0 ${sz/9}px ${sz/3}px #0a2a5099">${txt}</div>`}
function pill(x,y,txt,o={}){const p=o.p??1;if(p<=0)return'';const sz=o.size||36,s=bo(Math.min(1,p))*(o.s??1);
 const dot=o.dot?`<span style="display:inline-block;width:${sz*.62}px;height:${sz*.62}px;border-radius:50%;background:${o.dot};margin-right:${sz*.3}px;vertical-align:-${sz*.06}px"></span>`:'';
 return `<div style="position:absolute;left:${x}px;top:${y}px;transform:translate(-50%,-50%) scale(${s.toFixed(3)});opacity:${Math.min(1,p*2).toFixed(3)};padding:${sz*.34}px ${sz*.7}px;border-radius:${sz*1.2}px;background:${o.bg||'#ffffffee'};color:${o.fg||C.ink};font:700 ${sz}px/1.1 P,Arial;white-space:nowrap;box-shadow:0 10px 26px #0a2a5066">${dot}${txt}</div>`}
function card(x,y,w,inner,p,o={}){if(p<=0)return'';const s=bo(Math.min(1,p));
 return `<div style="position:absolute;left:${x-w/2}px;top:${y}px;width:${w}px;box-sizing:border-box;transform:scale(${s.toFixed(3)}) rotate(${o.rot||0}deg);transform-origin:50% 0;opacity:${Math.min(1,p*2).toFixed(3)};padding:${o.pad||'20px 30px'};border-radius:30px;background:${o.bg||'#ffffffee'};box-shadow:0 22px 46px #0a2a5066;color:${C.ink};text-align:${o.align||'center'}">${inner}</div>`}
function stamp(x,y,txt,p,col=C.red,rot=-8,sz=70){if(p<=0)return'';const s=lerp(2.2,1,ez(Math.min(1,p)));return `<div style="position:absolute;left:${x}px;top:${y}px;transform:translate(-50%,-50%) rotate(${rot}deg) scale(${s.toFixed(3)});opacity:${Math.min(1,p*2.5).toFixed(3)};padding:10px 30px;border:8px solid ${col};border-radius:18px;color:${col};font:700 ${sz}px/1 P;letter-spacing:3px;background:#ffffffdd;white-space:nowrap">${txt}</div>`}
// ---------- art
const SAM=k=>`img/${k}.png`;
function sam(k,x,y,w,o={}){if((o.op??1)<=0.001||w<=1)return'';return `<img src="${SAM(k)}" style="position:absolute;left:0;top:0;width:${w.toFixed(1)}px;transform:translate(${(x-w/2).toFixed(1)}px,${(y-w/2).toFixed(1)}px) rotate(${(o.rot||0).toFixed(2)}deg);opacity:${(o.op??1).toFixed(3)};filter:drop-shadow(0 26px 30px #0a2a5088)">`}
const BC={red:['#ff5a4a','#d6342a','#a8231c'],yellow:['#ffd84a','#f2b51c','#c98e10'],blue:['#4fa3ff','#2f7fe0','#1f5fb0'],green:['#5fd27a','#2fae55','#1f8a40'],white:['#ffffff','#e3e8ee','#c3ccd6']};
// isometric-ish brick: w = width in px, n studs along, col key
function brick(x,y,w,n,col,rot=0){const c=BC[col],h=w*.42,sd=w/n;let st='';for(let i=0;i<n;i++){const cx=sd*(i+.5);st+=`<ellipse cx=${cx.toFixed(1)} cy=${(h*.32).toFixed(1)} rx=${(sd*.32).toFixed(1)} ry=${(sd*.14).toFixed(1)} fill="${c[2]}" /><rect x=${(cx-sd*.32).toFixed(1)} y=${(h*.12).toFixed(1)} width=${(sd*.64).toFixed(1)} height=${(h*.2).toFixed(1)} fill="${c[1]}" /><ellipse cx=${cx.toFixed(1)} cy=${(h*.12).toFixed(1)} rx=${(sd*.32).toFixed(1)} ry=${(sd*.14).toFixed(1)} fill="${c[0]}" stroke="${c[2]}" stroke-width=1.5 /><ellipse cx=${(cx-sd*.1).toFixed(1)} cy=${(h*.1).toFixed(1)} rx=${(sd*.1).toFixed(1)} ry=${(sd*.04).toFixed(1)} fill="#ffffff88" />`}
 return `<svg style="position:absolute;left:${(x-w/2).toFixed(1)}px;top:${(y-h/2).toFixed(1)}px;transform:rotate(${rot.toFixed(1)}deg);overflow:visible;filter:drop-shadow(0 ${w/20}px ${w/16}px #0a2a5055)" width=${w.toFixed(1)} height=${h.toFixed(1)} viewBox="0 0 ${w.toFixed(1)} ${h.toFixed(1)}"><rect x=0 y=${(h*.3).toFixed(1)} width=${w.toFixed(1)} height=${(h*.7).toFixed(1)} rx=${(w*.02).toFixed(1)} fill="${c[1]}" stroke="#14202c" stroke-width=3 /><rect x=0 y=${(h*.3).toFixed(1)} width=${w.toFixed(1)} height=${(h*.14).toFixed(1)} fill="${c[0]}" /><rect x=${(w*.04).toFixed(1)} y=${(h*.5).toFixed(1)} width=${(w*.92).toFixed(1)} height=${(h*.08).toFixed(1)} rx=3 fill="#ffffff44" />${st}</svg>`}
// LEGO-style set box (no real logo): w width
function setBox(x,y,w,o={}){const h=w*.78,rot=o.rot||0,num=o.num||'10179',yr=o.yr||'2007';let tower='';const cs=['red','yellow','blue','green','red','blue'];
 return `<div style="position:absolute;left:${(x-w/2).toFixed(1)}px;top:${(y-h/2).toFixed(1)}px;width:${w}px;height:${h}px;transform:rotate(${rot}deg) scale(${(o.s??1).toFixed(3)});filter:drop-shadow(0 30px 34px #0a2a5077)">
 <svg style="position:absolute;inset:0;overflow:visible" width=${w} height=${h} viewBox="0 0 400 312"><rect x=0 y=0 width=400 height=312 rx=10 fill="#1f2a44" stroke="#14202c" stroke-width=6 /><rect x=0 y=0 width=400 height=58 rx=10 fill="#ffcf2e" /><rect x=0 y=46 width=400 height=12 fill="#ffcf2e" />
 <rect x=14 y=10 width=72 height=38 rx=6 fill="#e8473a" stroke="#14202c" stroke-width=3 /><text x=50 y=37 font-family=P font-size=22 font-weight=700 fill="#fff" text-anchor=middle>BRICK</text><text x=380 y=38 font-family=P font-size=24 font-weight=700 fill="#14202c" text-anchor=end>${num}</text>
 <rect x=16 y=72 width=368 height=176 rx=8 fill="url(#bxg)" /><defs><linearGradient id=bxg x1=0 y1=0 x2=0 y2=1><stop offset=0 stop-color="#3b5d9a"/><stop offset=1 stop-color="#1b2f55"/></linearGradient></defs>
 ${[...Array(30)].map((_,i)=>`<circle cx=${(30+MG.rnd(i)*340).toFixed(0)} cy=${(80+MG.rnd(i+9)*120).toFixed(0)} r=${(1+MG.rnd(i+3)*2).toFixed(1)} fill="#fff" opacity=.7 />`).join('')}
 <path d="M90 220 L200 120 L310 220 L280 232 L200 168 L120 232 Z" fill="#c9d1da" stroke="#14202c" stroke-width=4 /><circle cx=200 cy=176 r=26 fill="#e3e8ee" stroke="#14202c" stroke-width=4 /><rect x=150 y=216 width=100 height=16 rx=4 fill="#8a96a3" stroke="#14202c" stroke-width=3 />
 <rect x=16 y=256 width=180 height=42 rx=6 fill="#ffffff22" /><text x=28 y=286 font-family=P font-size=22 font-weight=700 fill="#fff">AGES 16+ · ${yr}</text><text x=384 y=290 font-family=P font-size=30 font-weight=700 fill="#ffcf2e" text-anchor=end>5,195 pcs</text></svg>
 ${o.sealed?`<div style="position:absolute;left:${w*.38}px;top:-6px;width:${w*.24}px;height:${h+12}px;background:linear-gradient(90deg,#ffffff44,#ffffffaa,#ffffff44);border-left:2px solid #ffffffcc;border-right:2px solid #ffffffcc"></div><div style="position:absolute;left:${w*.3}px;top:${h*.82}px;width:${w*.4}px;padding:${w*.012}px 0;border-radius:${w*.03}px;background:${C.green2};border:${w*.008}px solid #fff;font:700 ${w*.05}px/1.3 P;color:#fff;text-align:center;transform:rotate(-6deg)">SEALED ✓</div>`:''}
 ${o.shine?`<div style="position:absolute;inset:0;border-radius:10px;overflow:hidden"><div style="position:absolute;top:-20%;left:${(((T*.6)%1.6)*100-30).toFixed(0)}%;width:22%;height:140%;background:linear-gradient(90deg,transparent,#ffffff66,transparent);transform:rotate(18deg)"></div></div>`:''}</div>`}
function trash(x,y,w,lid=0){const h=w*1.25;return `<svg style="position:absolute;left:${x-w/2}px;top:${y-h}px;overflow:visible;filter:drop-shadow(0 20px 24px #0a2a5066)" width=${w} height=${h} viewBox="0 0 200 250"><path d="M24 60 L176 60 L160 246 L40 246 Z" fill="#7d8894" stroke="#14202c" stroke-width=6 stroke-linejoin=round />${[60,100,140].map(x2=>`<line x1=${x2} y1=80 x2=${x2-8+ (x2-100)*.05} y2=228 stroke="#5a646e" stroke-width=6 stroke-linecap=round />`).join('')}<g transform="rotate(${(-lid*35).toFixed(1)} 16 56)"><rect x=10 y=38 width=180 height=22 rx=8 fill="#9aa6b2" stroke="#14202c" stroke-width=6 /><rect x=80 y=24 width=40 height=16 rx=6 fill="#9aa6b2" stroke="#14202c" stroke-width=5 /></g></svg>`}
function priceTag(x,y,w,txt,rot,col='#ffcf2e'){return `<div style="position:absolute;left:${x-w/2}px;top:${y}px;width:${w}px;transform:rotate(${rot.toFixed(1)}deg);transform-origin:50% -60px;filter:drop-shadow(0 18px 22px #0a2a5066)"><div style="position:absolute;left:50%;top:-60px;width:4px;height:64px;background:#8a6a3a"></div><div style="padding:${w*.06}px 0;border-radius:${w*.08}px;background:${col};border:${w*.02}px solid #14202c;text-align:center;font:700 ${w*.2}px/1.1 P;color:#14202c"><div style="width:${w*.08}px;height:${w*.08}px;border-radius:50%;background:#fff;border:3px solid #14202c;margin:0 auto ${w*.03}px"></div>${txt}</div></div>`}
function skyBG(){return `<div style="position:absolute;inset:0;background:linear-gradient(#5db6f5 0%,#9fd8ff 62%,#d8f0ff 72%,#e9dcc2 72.2%,#d9c7a6 100%)"></div>`}
function hookTitle(){return TX(540,190,'WHY YOU SHOULD NEVER',{size:62})+TX(540,300,'THROW AWAY',{size:104,col:C.gold})+TX(540,420,'YOUR OLD LEGO',{size:104,col:C.gold})}
// ---------- scenes
const ANIM={
 hero(t,k){const sp=SP(k),a=S(k),D=DU(k);let h=skyBG();const p=k===0?1:el(cl(t,a-.3,a+.3));
  // scattered bricks on the floor
  [['red',150,1460,150,4,-8],['blue',930,1480,130,3,12],['yellow',820,1420,110,2,-4],['green',300,1500,120,3,6]].forEach(b=>h+=brick(b[1],b[2],b[3],b[4],b[0],b[5]));
  h+=trash(760,1400,260,.6+.15*Math.sin(t*3));
  const bob=Math.sin(t*2.2)*14;h+=setBox(760,1000+bob,380,{rot:8+Math.sin(t*1.7)*3});
  h+=`<div style="position:absolute;left:600px;top:${1220+bob}px;width:320px;height:0;border-top:10px dashed ${C.red};transform:rotate(-4deg);opacity:.9"></div>`+TX(760,1240+bob,'✕',{size:120,col:C.red});
  h+=sam('samthink',280,1230,lerp(0,560,p),{rot:Math.sin(t*1.5)*1.2});
  if(k===0){const q=1-cl(t,a+D*.85,a+D*.98);if(q>0)h+=`<div style="opacity:${q.toFixed(3)}">${hookTitle()}</div>`}
  if(sp.choice){const end=TL.dur,out=1-cl(t,end-.6,end-.2);
   h+=`<div style="opacity:${out.toFixed(3)}">`+TX(540,230,'WHAT WOULD YOU DO?',{size:70,p:cl(t,a+.05,a+.3)})+pill(540,410,'📦 KEEP IT SEALED',{p:cl(t,a+D*.15,a+D*.3),size:56,bg:C.green2,fg:'#fff'})+pill(540,550,'🧱 OPEN & BUILD',{p:cl(t,a+D*.35,a+D*.5),size:56,bg:'#fff'})+`</div>`;
   const tin=cl(t,end-.5,end-.06);if(tin>0)h+=`<div style="opacity:${tin.toFixed(3)}">${hookTitle()}</div>`}
  return h},
 study(t,k){const a=S(k),D=DU(k);let h='';const q=sg(t,a+.05,a+D*.8),n=Math.floor(q*48);
  for(let i=0;i<n;i++){const c=i%6,r=Math.floor(i/6),pq=bo(cl(t,a+.05+i*D*.8/48,a+.25+i*D*.8/48));h+=`<div style="position:absolute;left:0;top:0;transform:translate(${(95+c*178).toFixed(0)}px,${(470+r*118).toFixed(0)}px) scale(${pq.toFixed(3)})">${setBox(0,0,150,{rot:(MG.rnd(i)-.5)*10,num:String(1987+Math.floor(i*28/48)),yr:String(1987+Math.floor(i*28/48))})}</div>`}
  h+=card(540,140,700,`<div style="font:700 110px/1 P;color:${C.ink}">${MG.fmt(Math.round(2322*q),0)}</div><div style="font:500 34px P;color:#4a5b6c;margin-top:6px">LEGO sets studied · 1987–2015</div>`,cl(t,a,a+.25));
  h+=pill(540,1450,'🔬 HSE University study',{p:cl(t,a+D*.5,a+D*.65),size:42});return h},
 grow(t,k){const a=S(k),D=DU(k);let h=skyBG();const q=sg(t,a+.1,a+D*.85);
  // tower of bricks growing year by year
  const rows=Math.floor(q*14);const cs=['red','yellow','blue','green'];for(let r=0;r<rows;r++)h+=brick(300+((r%2)*24-12),1430-r*62,200,4,cs[r%4]);
  if(rows<14&&q>0){const fall=(t*4)%1;h+=brick(300,1430-rows*62-(1-fall)*200,200,4,cs[rows%4])}
  h+=setBox(780,1180,330,{sealed:true,rot:-3});
  h+=TX(780,640,'+11%',{size:170,col:C.green,p:cl(t,a+D*.35,a+D*.45),s:bo(cl(t,a+D*.35,a+D*.5))})+pill(780,780,'every year',{p:cl(t,a+D*.45,a+D*.55),size:46,dot:C.green2})+pill(540,200,'UNOPENED SETS',{p:cl(t,a,a+.2),size:52,bg:C.green2,fg:'#fff'});
  return h},
 race(t,k){const a=S(k),D=DU(k);let h='';const rows=[['🧱 LEGO',1,C.green2],['🥇 Gold',.72,'#f2b51c'],['📈 Stocks',.64,'#4fa3ff'],['📄 Bonds',.42,'#9aa6b2']];
  h+=TX(540,230,'WHO GREW FASTER?',{size:74,p:cl(t,a,a+.2)});
  rows.forEach((r,i)=>{const st=a+.1+i*D*.14,q=sg(t,st,st+D*.4),y=440+i*230,w=760*r[1]*q;
   h+=`<div style="position:absolute;left:120px;top:${y}px;height:150px;width:${w.toFixed(0)}px;border-radius:0 30px 30px 0;background:${r[2]};box-shadow:0 16px 30px #0a2a5055;${i===0?'outline:8px solid #fff;':''}"></div><div style="position:absolute;left:150px;top:${y+40}px;font:700 56px P;color:#fff;text-shadow:0 3px 10px #0a2a5099;opacity:${Math.min(1,q*3).toFixed(2)}">${r[0]}</div>`});
  const wq=cl(t,a+D*.7,a+D*.82);if(wq>0)h+=`<div style="position:absolute;left:${120+760-40}px;top:${440-60}px;font-size:110px;transform:scale(${bo(wq).toFixed(3)}) rotate(15deg)">👑</div>`;
  h+=pill(540,1420,'1987–2015 · sealed sets',{p:cl(t,a+D*.5,a+D*.65),size:40});return h},
 price(t,k){// two consecutive lines: 2007 $499.99 -> 2016 ~$4,000
  const [a0]=seqR(k),a=S(a0),D=DU(a0),hasB=SP(a0+1)&&SP(a0+1).type==='price',b=hasB?S(a0+1):1e9,Db=hasB?DU(a0+1):1;let h=skyBG();
  const q=sg(t,b+.1,b+Db*.75);const val=lerp(499.99,3999,q);
  h+=setBox(540,880,600,{shine:t>b,num:'10179',yr:'2007',rot:Math.sin(t*1.2)*1.5,s:lerp(1,1.06,q)});
  const sw=Math.sin(t*3)*6;h+=priceTag(860,1180,260,(q>0?'$'+MG.fmt(val,0):'$499.99'),sw,q>.95?C.green:'#ffcf2e');
  h+=pill(300,1250,t<b?'2007':'2016',{p:cl(t,a,a+.2),size:60,dot:t<b?C.gold:C.green});
  // value line
  if(t>b){let d='M0 0';for(let i=1;i<=20;i++){const f=i/20;if(f>q)break;d+=` L${(f*700).toFixed(0)} ${(-f*f*360+Math.sin(i*1.3)*14).toFixed(0)}`}h+=`<svg style="position:absolute;left:180px;top:1500px;overflow:visible" width=700 height=10><path d="${d}" stroke="${C.green2}" stroke-width=14 fill=none stroke-linecap=round stroke-linejoin=round /></svg>`;
   h+=TX(540,230,'×8',{size:180,col:C.green,p:cl(t,b+Db*.6,b+Db*.75),s:bo(cl(t,b+Db*.6,b+Db*.8))})}
  else h+=TX(540,230,'$499.99',{size:140,col:'#fff',p:cl(t,a+.1,a+.3)});
  return h},
 sealed(t,k){const a=S(k),D=DU(k);let h=skyBG();
  h+=setBox(540,820,560,{sealed:true,shine:true,rot:-2});
  // calendar pages flipping: retired -> +1 -> +2 -> +3 yrs
  const steps=['RETIRED','+1 YEAR','+2 YEARS','+3 YEARS'],ci=Math.min(3,Math.floor(sg(t,a+D*.35,a+D*.9)*4));
  h+=`<div style="position:absolute;left:640px;top:1150px;width:340px;border-radius:24px;overflow:hidden;background:#fff;box-shadow:0 26px 50px #0a2a5088;transform:rotate(5deg) scale(${bo(cl(t,a+D*.3,a+D*.45)).toFixed(3)});text-align:center"><div style="background:${C.red2};color:#fff;font:700 40px/1 P;padding:14px">📅</div><div style="font:700 60px/1.4 P;color:${C.ink};padding:10px 0">${steps[ci]}</div></div>`;
  h+=pill(810,1460,ci>=2?'📈 value rising':'…',{p:cl(t,a+D*.6,a+D*.7),size:42,dot:C.green2});
  h+=sam('samhappy',250,1300,lerp(0,480,el(cl(t,a-.1,a+.4))));
  h+=pill(540,230,'KEEP THE BOX SEALED',{p:cl(t,a,a+.2),size:56,bg:C.green2,fg:'#fff'});return h}
};
let T=0;
function seqR(k){const ty=SP(k).type;let a=k,b=k;while(a>0&&SP(a-1).type===ty)a--;while(b+1<TL.lines.length&&SP(b+1).type===ty)b++;return [a,b]}
function fgLayer(t){let h='';const N=TL.lines.length,seen=new Set();
 for(let k=0;k<N;k++){const ty=SP(k).type;if(!ANIM[ty])continue;const [a0,b0]=seqR(k);if(seen.has(a0))continue;seen.add(a0);
  const a=a0===0?-1:S(a0)-.22,b=b0+1<N?S(b0+1)+.22:TL.dur+1;if(t<a||t>b)continue;const op=cl(t,a,a+.25)*(1-cl(t,b-.25,b));if(op<=0)continue;
  h+=`<div style="position:absolute;inset:0;opacity:${op.toFixed(3)};transform:scale(${(1+.03*(1-op)).toFixed(4)})">${ANIM[ty](t,a0)}</div>`}
 return h}
function draw(t){if(!TL)return;T=t;
 const fh=fgLayer(t);if(fh!==$('fg')._h){$('fg').innerHTML=fh;$('fg')._h=fh}
 $('pat').style.transform=`translateY(${(-(t/TL.dur*52*8)%52).toFixed(1)}px)`;
 const c=t>=TL.lines[TL.lines.length-1].end-.02?'':MG.captions(t,{y:1570,size:66,maxWords:3,stageW:1080,w:940,upper:true});if(c!==$('cap')._h){$('cap').innerHTML=c;$('cap')._h=c}
 MG.grainTick(t)}
let imgReady=false;
window.setTimeline=tl=>{MG.TL=TL=tl;MG.preload(['samhappy','samthink'].map(SAM));Promise.all([document.fonts.load('700 50px P'),document.fonts.load('500 50px P')]).then(()=>{fontsOk=true},()=>{fontsOk=true})};
Object.defineProperty(window,'ready',{configurable:true,get(){return imgReady&&fontsOk},set(v){imgReady=v}});
window.sfxEvents=()=>{const ev=[],N=TL.lines.length,add=(k,t,o={})=>ev.push(Object.assign({k,t:+t.toFixed(3)},o));
 for(let i=1;i<N;i++)if(SP(i).type!==SP(i-1).type)add(i%2?'whoosh':'swish',S(i)-.2,{d:.5});
 for(let k=0;k<N;k++){const ty=SP(k).type,a=S(k),d=DU(k);
  if(ty==='hero'&&k===0)add('impact',a+.05);
  if(ty==='hero'&&SP(k).choice){add('pop',a+d*.17);add('pop',a+d*.37)}
  if(ty==='study')for(let i=0;i<10;i++)add(i%2?'pop':'blip',a+.1+i*d*.08);
  if(ty==='grow'){for(let i=0;i<7;i++)add('click',a+.15+i*d*.11);add('ding',a+d*.38)}
  if(ty==='race'){for(let i=0;i<4;i++)add('swish',a+.1+i*d*.14,{d:.4});add('ding',a+d*.72)}
  if(ty==='price'&&SP(k-1)&&SP(k-1).type!=='price')add('pop',a+.1);
  if(ty==='price'&&SP(k-1)&&SP(k-1).type==='price'){for(let i=0;i<8;i++)add('tick',a+.1+i*d*.08,{f:1200+i*80});add('cash',a+d*.7)}
  if(ty==='sealed'){add('pop',a+d*.3);for(let i=0;i<3;i++)add('click',a+d*(.45+i*.14));add('ding',a+d*.75)}}
 ev.sort((a,b)=>a.t-b.t);const out=[];for(const e of ev){if(e.t<0)e.t=0;if(!out.find(o=>o.k==e.k&&Math.abs(o.t-e.t)<.12))out.push(e)}return out};
window.draw=draw;
MG.finish($('stage'),1080,1920,.04,'#0a2a5022',65);
</script>
