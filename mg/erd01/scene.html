<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:IB;src:url(fonts/Inter-Black.otf);font-weight:900}
@font-face{font-family:P;src:url(fonts/Poppins-Bold.ttf);font-weight:700}
html,body{margin:0;width:1080px;height:1920px;overflow:hidden;background:#8fd0f5}
#stage{position:absolute;inset:0;overflow:hidden;background:linear-gradient(#4fa9ec 0%,#8fd0f5 38%,#cdeefc 52%,#e8f8ff 60%)}
#sun{position:absolute;width:520px;height:520px;border-radius:50%;background:radial-gradient(circle,#fffbe8 0%,#fff3b8aa 18%,#ffe9a033 45%,transparent 70%)}
canvas{position:absolute;left:0;top:0;width:1080px;height:1920px}
#ov,#ui,#fx,#map{position:absolute;inset:0}
#map{display:none}
#night{position:absolute;inset:0;background:linear-gradient(#0b1633 0%,#1c2f63 45%,#33508f 60%);opacity:0}

.card{position:absolute;background:#fff;border:7px solid #232838;border-radius:28px;box-shadow:0 14px 0 #2328384d,0 26px 40px #0003;font-family:IB,P,Arial;font-weight:900;color:#232838}
.pill{position:absolute;font-family:IB,P,Arial;font-weight:900;border:7px solid #232838;border-radius:22px;padding:8px 30px;box-shadow:0 10px 0 #2328384d;white-space:nowrap}
.lbl{position:absolute;font-family:IB,P,Arial;font-weight:900;white-space:nowrap;color:#fff;text-align:center}
</style></head><body><div id="stage"><div id="sun"></div><div id="night"></div><canvas id="cv"></canvas><div id="ov"></div><div id="fx"></div><div id="map"></div><div id="ui"></div></div>
<script src="../lib/core.js"></script><script src="../lib/gl3d.js"></script><script src="../lib/samrig.js"></script><script src="../lib/mapdata.js"></script>
<script>
const W = 1080, H = 1920, G = GL3D, {cl, ez, ei, bo, el, lerp} = MG;
const $ = id => document.getElementById(id);
// ======================= BIS ZUM ERDKERN – Beispiel =======================
const OL = '#232838', SKIN = '#f6d7a8';
const w = G.World($('cv'), W, H, 2);
w.toon = true; w.rim = .32; w.outline = .0019;
w.fog = G.hex('#d9f2fd'); w.fogN = 120; w.fogF = 400; w.sky = G.hex('#d6efff'); w.gnd = G.hex('#6b4a2e');
w.sun = G.v.norm([.45, .8, .5]); w.shadowSize = 26;
const Lt = i => MG.L(i);
function wt(i, re) { const l = Lt(i); if (!l.words) return l.start; for (const x of l.words) if (re.test(x[0])) return l.start + x[1]; return l.start }
// ---- Erd-Querschnitt (Scheibe) – 1 Einheit = 1 m ----
const SW = 9, SD = 3, HW = 1.6, DEEP = 60;          // Scheibenbreite je Seite, Tiefe, halbe Schachtbreite
const LAY = [[0, .6, '#5fb246'], [.6, 2.2, '#7a5232'], [2.2, 5, '#9a6a3f'], [5, 9, '#b08a5c'], [9, 15, '#8b8f99'], [15, 25, '#73777f'], [25, 40, '#5f6470'], [40, DEEP, '#4d525d']];
for (const [a, b, c] of LAY) for (const s of [-1, 1]) {
  w.mesh(G.box(SW, b - a, SD, c, { base: true }), { pos: [s * (HW + SW / 2), -b, 0] });
}
// Rueckwand des Schachts (dunkler) + Steine in den Schichten
for (const [a, b, c] of LAY) w.mesh(G.box(HW * 2, b - a, .3, c, { base: true }), { pos: [0, -b, -SD / 2 + .15], emis: -.35 });
for (let k = 0; k < 60; k++) { const y = -1 - (k * 7.3) % (DEEP - 2), x = (k % 2 ? 1 : -1) * (HW + .6 + (k * 3.7) % (SW - 1.2)); w.mesh(G.ico(.18 + (k % 3) * .08, 1, k % 5 == 0 ? '#ffd166' : '#5b5f69'), { pos: [x, y, SD / 2 + .02], scl: [1.3, .8, .3] }) }
// Oberflaeche: Wiese, Zelt, Schild
w.mesh(G.box(60, .3, 30, '#6fc04f', { base: true }), { pos: [0, -.3, -16.5] });
const tent = w.mesh(new G.Geo().add(G.cyl(.02, 1.6, 1.6, 4, '#ff8a3d'), G.m4.compose([0, .8, 0], [0, .785, 0])).add(G.box(.5, .9, .05, '#232838', { base: true }), G.m4.compose([0, 0, .8])), { pos: [-5.5, 0, -1.5] });
const signTex = (() => { const c = document.createElement('canvas'); c.width = 768; c.height = 230; const x = c.getContext('2d'); x.fillStyle = '#ffd166'; x.fillRect(0, 0, 768, 230); x.strokeStyle = OL; x.lineWidth = 18; x.strokeRect(9, 9, 750, 212); x.font = '900 92px IB, Arial'; x.textAlign = 'center'; x.fillStyle = OL; x.fillText('BIS ZUM', 384, 100); x.fillText('ERDKERN ⬇', 384, 196); return w.texture(c) })();
w.mesh(new G.Geo().add(G.box(.12, 2.2, .12, '#7a4a24', { base: true }), G.m4.compose([-1, 0, 0])).add(G.box(.12, 2.2, .12, '#7a4a24', { base: true }), G.m4.compose([1, 0, 0])), { pos: [4.6, 0, -.8] });
w.mesh(G.plane(2.6, .78, 1, 1, '#ffffff'), { pos: [4.6, 1.75, -.72], tex: signTex, cast: false });
for (const [x, z] of [[-8, -4], [7.5, -5], [-3, -7], [9.5, -2]]) w.mesh(new G.Geo().add(G.cyl(.15, .2, 1.2, 8, '#7a4a24')).add(G.ico(.9, 2, '#4f9a3c').smooth(), G.m4.compose([0, 1.6, 0])), { pos: [x, 0, z] });
// Lehm-Boden im Schacht (wandert nach unten)
const floor = w.mesh(G.box(HW * 2, .25, SD, '#6b4a2e', { base: true }), { pos: [0, 0, 0] });
// noch nicht gegrabene Erde im Schacht (Schichtfarben, wird von oben abgetragen)
const FILL = LAY.map(([a, b2, c]) => ({ a, b: b2, m: w.mesh(G.box(HW * 2, 1, SD, c, { base: true }), { pos: [0, -b2, 0] }) }));
// Eimer-Seilzug
const rope = w.mesh(G.box(.04, 1, .04, '#3c4a63', { base: true }), { pos: [HW - .3, 0, .4] });
const bucket = w.mesh(G.cyl(.2, .16, .3, 12, '#8a8f99'), { pos: [HW - .3, 0, .4] });
const frame = w.mesh(new G.Geo().add(G.box(.1, 2.4, .1, '#7a4a24', { base: true }), G.m4.compose([-HW, 0, .4])).add(G.box(.1, 2.4, .1, '#7a4a24', { base: true }), G.m4.compose([HW, 0, .4])).add(G.box(HW * 2 + .2, .12, .12, '#7a4a24', { base: true }), G.m4.compose([0, 2.4, .4])), { pos: [0, 0, 0] });
// ---- Arbeiter ----
function worker(col, hat = '#ffd166') {
  const body = w.mesh(new G.Geo().add(G.cyl(.08, .07, .42, 8, '#3c4a63'), G.m4.compose([-.1, 0, 0])).add(G.cyl(.08, .07, .42, 8, '#3c4a63'), G.m4.compose([.1, 0, 0])).add(G.cyl(.25, .22, .5, 16, col).smooth(), G.m4.compose([0, .4, 0])).add(G.box(.52, .08, .46, '#ff8a3d', { base: true }), G.m4.compose([0, .62, 0])), { vis: false });
  const head = w.mesh(new G.Geo().add(G.ico(.3, 3, SKIN).smooth()).add(G.ico(.04, 2, OL), G.m4.compose([-.1, .05, .28])).add(G.ico(.04, 2, OL), G.m4.compose([.1, .05, .28])).add(G.box(.12, .025, .02, OL), G.m4.compose([0, -.08, .29]))
    .add(G.cyl(.3, .33, .16, 16, hat).smooth(), G.m4.compose([0, .22, 0])).add(G.cyl(.38, .38, .03, 16, hat), G.m4.compose([0, .15, .04])).add(G.box(.08, .06, .03, '#fff7c2', { base: true }), G.m4.compose([0, .22, .31])), { parent: body, pos: [0, 1.02, 0] });
  const arm = () => new G.Geo().add(G.cyl(.065, .055, .36, 10, col).smooth(), G.m4.compose([0, -.18, 0])).add(G.ico(.075, 2, SKIN).smooth(), G.m4.compose([0, -.4, 0]));
  const aL = w.mesh(arm(), { parent: body, pos: [-.27, .82, 0] }), aR = w.mesh(arm(), { parent: body, pos: [.27, .82, 0] });
  const shovel = w.mesh(new G.Geo().add(G.cyl(.025, .025, .9, 6, '#7a4a24'), G.m4.compose([0, -.1, 0])).add(G.box(.22, .28, .03, '#9aa0aa', { base: true }), G.m4.compose([0, -.85, 0])), { parent: aR, pos: [0, -.4, .05], rot: [.4, 0, 0] });
  return { m: body, head, aL, aR, shovel };
}
const NAMES = ['@Max', '@Lea', '@Tim', '@Mia', '@Ben'];
const WK = NAMES.map((n, k) => Object.assign(worker(['#2a8fd6', '#e05d9a', '#2fa36b', '#7a55c7', '#d64545'][k]), { name: n, x: -1.1 + k * .55, z: (k % 2 ? -.5 : .45), ph: k * 1.3, k }));
const DIRT = Array.from({ length: 24 }, (_, k) => w.mesh(G.ico(.04 + (k % 3) * .02, 1, k % 2 ? '#7a5232' : '#9a6a3f'), { vis: false }));
// ---- Timeline ----
const tW = k => Lt(2).start + .35 + k * .35;            // Arbeiter landen
const tDig0 = () => Lt(2).start + 1.2;
function depthAt(t) { return 5 * ez(cl((t - tDig0()) / (Lt(3).start - tDig0()), 0, 1)) + 7 * ez(cl((t - Lt(5).start) / 4, 0, 1)) }
function camKeys() {
  const K = [];
  K.push({ t: 0, pos: [2.5, 4.2, 16], at: [1.6, 1.0, 0], fov: 50 });
  K.push({ t: Lt(0).end, pos: [1.5, 2.6, 11], at: [0, .2, 0], fov: 46 });
  K.push({ t: Lt(1).end, pos: [0, 1.2, 10], at: [0, -1.5, 0], fov: 50 });
  K.push({ t: Lt(2).start + .5, dig: 1, d: 7.5, h: 1.6, fov: 48 });
  K.push({ t: Lt(2).end, dig: 1, d: 6.5, h: 1.3, fov: 48 });
  K.push({ t: Lt(3).start + .1, dig: 1, d: 12, h: 3, fov: 50 });
  K.push({ t: Lt(5).start, dig: 1, d: 9, h: 1.5, fov: 48 });
  K.push({ t: 999, dig: 1, d: 7.5, h: 1.3, fov: 48 });
  return K;
}
let KEYS = null;
function camAt(t) {
  const K = KEYS; let i = 0; while (i < K.length - 2 && t > K[i + 1].t) i++;
  const f = k => k.dig ? { pos: [.8, -depthAt(t) + k.h, k.d], at: [0, -depthAt(t) + .6, 0] } : k;
  const a = Object.assign({}, K[i], f(K[i])), b = Object.assign({}, K[i + 1], f(K[i + 1])), end = b.t > 900 ? MG.TL.dur : b.t, u = ei(cl(t, a.t, end));
  return { pos: G.v.lerp(a.pos, b.pos, u), at: G.v.lerp(a.at, b.at, u), fov: lerp(a.fov, b.fov, u) };
}
// ---- UI ----
const shadowTxt = (c = OL, r = 5) => MG.outline(r).replace(/#000/g, c);
const pop = (t, t0, d = .35) => bo(cl(t, t0, t0 + d)), fade = (t, t0, t1) => 1 - ez(cl(t, t0, t1));
function labelAt(p, html, t, t0, t1) { const q = w.project(p); if (!q.vis) return ''; const s = pop(t, t0) * fade(t, t1, t1 + .25); if (s <= .01) return ''; return `<div style="position:absolute;left:${q.x}px;top:${q.y}px;transform:translate(-50%,-100%) scale(${s});transform-origin:50% 100%">${html}</div>` }
const PILL = (txt, bg, fs = 34) => `<div class="pill" style="position:relative;font-size:${fs}px;color:#fff;background:${bg};text-shadow:${shadowTxt(OL, 3)};padding:4px 18px;border-width:5px">${txt}</div>`;
function dayPill(t) {
  const s = pop(t, .1, .4) * fade(t, Lt(1).start - .2, Lt(1).start + .1); if (s <= .01) return '';
  return `<div class="pill" style="left:50%;top:170px;transform:translateX(-50%) rotate(${-3 + Math.sin(t * 5) * 2}deg) scale(${s});font-size:130px;line-height:1.05;color:#fff;background:linear-gradient(90deg,#9a6a3f 0 25%,#b07a48 25% 50%,#9a6a3f 50% 75%,#b07a48 75%);border-radius:34px;padding:6px 56px;text-shadow:${shadowTxt(OL, 7)}">TAG 1</div>`;
}
function rulesCard(t) {
  const t0 = Lt(1).start, t1 = Lt(2).start - .15, s = pop(t, t0, .35) * fade(t, t1, t1 + .2); if (s <= .01) return '';
  const R = [['➕', 'FOLGEN', 'du wirst Arbeiter', '#2fa36b', /folgen/i], ['❤️', 'HERZ', '= 1 Meter tiefer', '#fe2c55', /herz/i], ['📊', 'UMFRAGE', 'du entscheidest mit', '#2a8fd6', /umfrage|entscheid/i]];
  return `<div class="card" style="left:50%;top:210px;width:900px;transform:translateX(-50%) rotate(-1.5deg) scale(${s});padding:22px 30px 26px">
    <div style="font-size:56px;text-align:center;margin-bottom:8px">SO FUNKTIONIERT'S</div>` +
    R.map(([e, a, b, c, re]) => { const p = pop(t, wt(1, re) - .45, .35); return `<div style="display:flex;align-items:center;gap:22px;margin-top:14px;transform:scale(${.6 + .4 * p});opacity:${.25 + .75 * Math.min(1, p)}">
      <div style="width:110px;height:110px;flex:none;border-radius:50%;background:${c};border:5px solid ${OL};font:900 62px/100px IB,Arial;text-align:center">${e}</div>
      <div><div style="font-size:58px;color:${c};text-shadow:${shadowTxt(OL, 2)}">${a}</div><div style="font:700 40px P,Arial;color:#4b5563">${b}</div></div></div>` }).join('') + `</div>`;
}
function depthMeter(t) {
  if (t < Lt(2).start) return '';
  const d = depthAt(t), s = pop(t, Lt(2).start, .4);
  return `<div class="card" style="right:30px;top:160px;transform:scale(${s});transform-origin:100% 0;padding:14px 26px;text-align:right">
    <div style="font:700 30px P,Arial;color:#6b7280">TIEFE</div><div style="font-size:84px;line-height:1;color:#9a6a3f">${d.toFixed(1).replace('.', ',')} m</div>
    <div style="font:700 28px P,Arial;color:#6b7280;margin-top:4px">Ziel: Erdmitte, 6.370 km</div></div>`;
}
// Erd-Querschnitt (Halbkugel, echte Proportionen: Kruste ~40 km, Mantel bis 2.900, aeusserer Kern bis 5.100, innerer Kern bis 6.370)
function earthCard(t) {
  const t0 = Lt(3).start + .05, t1 = Lt(5).start - .1, s = pop(t, t0, .45) * fade(t, t1, t1 + .25); if (s <= .01) return '';
  const R = 380, r = km => R * (1 - km / 6370), z = ez(cl((t - Lt(4).start) / .8, 0, 1));
  const ring = (km, c) => `<circle cx="420" cy="430" r="${r(km)}" fill="${c}" stroke="${OL}" stroke-width="5"/>`;
  const lab = (km, txt, y) => `<text x="${420 + 30}" y="${y}" font-family="IB,Arial" font-weight="900" font-size="30" fill="#fff" stroke="${OL}" stroke-width="7" paint-order="stroke">${txt}</text>`;
  const svg = `<svg width="840" height="470" viewBox="0 0 840 470"><defs><clipPath id="hc"><rect x="0" y="0" width="840" height="430"/></clipPath></defs><g clip-path="url(#hc)">${ring(0, '#6fc04f')}${ring(40, '#d9773a')}${ring(2900, '#ff9a3d')}${ring(5100, '#ffd166')}</g>
    <line x1="420" y1="50" x2="420" y2="430" stroke="#fff" stroke-width="4" stroke-dasharray="10 8"/>
    ${lab(1500, 'Mantel', 200)}${lab(4000, 'äußerer Kern', 330)}${lab(5700, 'innerer Kern', 412)}
    <circle cx="420" cy="50" r="12" fill="#ff3b3b" stroke="${OL}" stroke-width="5"/><text x="440" y="40" font-family="IB,Arial" font-weight="900" font-size="34" fill="#ff3b3b" stroke="#fff" stroke-width="8" paint-order="stroke">WIR</text></svg>`;
  return `<div class="card" style="left:50%;top:220px;width:900px;transform:translateX(-50%) rotate(-1.5deg) scale(${s});padding:20px 30px 18px;text-align:center">
    <div style="font-size:56px">${t > Lt(4).start ? 'WELTREKORD: <span style="color:#e8483c">12.262 m</span>' : 'BIS ZUR ERDMITTE: <span style="color:#e8483c">6.370 km</span>'}</div>${svg}
    <div style="font:700 32px P,Arial;color:#6b7280">${t > Lt(4).start ? 'Kola-Bohrung, Russland, 1989 – auf diesem Bild nur ' + (12.262 / 6370 * R).toFixed(1).replace('.', ',') + ' Pixel tief' : 'Kruste · Mantel · äußerer Kern · innerer Kern'}</div></div>`;
}
function toolCards(t) {
  const t0 = Lt(5).start + .05, s1 = pop(t, wt(5, /presslufthammer/i) - .1, .4), s2 = pop(t, wt(5, /bagger/i) - .1, .4);
  if (t < t0) return '';
  const card = (x, rot, s, e, n, sub) => s > .01 ? `<div class="card" style="left:${x}px;top:240px;width:440px;transform:translateX(-50%) rotate(${rot}deg) scale(${s});text-align:center;padding:18px 18px 24px"><div style="font-size:130px;line-height:1.1">${e}</div><div style="font-size:52px">${n}</div><div style="font:700 34px P,Arial;color:#6b7280">${sub}</div></div>` : '';
  let h = card(285, -5 + Math.sin(t * 3) * 1.5, s1, '⛏️', 'PRESSLUFT&shy;HAMMER', '1 Like = 3 Meter') + card(795, 5 + Math.sin(t * 3 + 1) * 1.5, s2, '🚜', 'BAGGER', '1 Like = 5 Meter');
  if (t > wt(5, /bagger/i) + .2) h += `<div class="lbl" style="left:540px;top:470px;transform:translate(-50%,-50%) rotate(-4deg) scale(${pop(t, wt(5, /bagger/i) + .2)});font-size:78px;color:#ff5d5d;text-shadow:${shadowTxt(OL, 6)}">ODER</div>`;
  if (t > wt(5, /stimmt/i)) h += `<div class="pill" style="left:50%;top:760px;transform:translateX(-50%) rotate(-3deg) scale(${pop(t, wt(5, /stimmt/i))});font-size:64px;color:#fff;background:#fe2c55;text-shadow:${shadowTxt(OL, 4)}">📊 STIMMT AB!</div>`;
  return h;
}
// ---------------- Draw ----------------
window.setTimeline = tl => { MG.TL = tl; KEYS = camKeys() };
window.draw = function (t) {
  const c = camAt(t); w.cam.pos = c.pos; w.cam.at = c.at; w.cam.fov = c.fov;
  const d = depthAt(t), i = MG.cur(t);
  w.shadowCenter = [c.at[0], c.at[1], c.at[2]]; w.shadowSize = 20;
  floor.pos = [0, -d - .25, 0];
  FILL.forEach(f => { const top = Math.max(f.a, d + .25); f.m.vis = top < f.b; if (f.m.vis) { f.m.pos = [0, -f.b, 0]; f.m.scl = [1, f.b - top, 1] } });
  frame.vis = true; rope.pos = [HW - .3, -d + .1, .4]; rope.scl = [1, Math.max(.01, d + 2.3), 1];
  const bu = (Math.sin(t * 1.2) * .5 + .5); bucket.pos = [HW - .3, lerp(-d + .25, 2.1, bu), .4];
  WK.forEach(p => {
    const a = tW(p.k); p.m.vis = t > a; if (!p.m.vis) return;
    const fall = cl((t - a) / .45, 0, 1), y = -d + (1 - ez(fall)) * 6;
    const dig = t > tDig0() + p.k * .1, ph = t * 6 + p.ph, sw = Math.sin(ph);
    p.m.pos = [p.x, y, p.z]; p.m.rot = [0, (p.k - 2) * .18, 0];
    p.aR.rot = dig ? [-.6 - sw * .7, 0, .2] : [0, 0, .15]; p.aL.rot = dig ? [-.4 - sw * .5, 0, -.2] : [0, 0, -.15];
    p.m.scl = [1, 1 + (dig ? .04 * Math.max(0, sw) : 0), 1]; p.head.rot = [dig ? .15 : 0, 0, 0];
    if (i == 6) { p.aR.rot = [0, 0, 2.5 + Math.sin(t * 9 + p.ph) * .3]; p.aL.rot = [0, 0, -2.5 - Math.sin(t * 9 + p.ph) * .3] }
  });
  DIRT.forEach((m, k) => { const on = t > tDig0() && i < 6; m.vis = on; if (!on) return; const ph = ((t * 1.4 + k / DIRT.length) % 1), x = -1.2 + (k % 5) * .6 + Math.sin(k) * .2;
    m.pos = [x + (ph * (k % 2 ? .6 : -.6)), -d + .2 + Math.sin(ph * Math.PI) * 1.4, .3 + (k % 3) * .2] });
  w.render(t);
  let ov = '';
  WK.forEach(p => { if (p.m.vis && i >= 2 && i <= 3) ov += labelAt([p.x, -d + 1.75, p.z], PILL(p.name, ['#2a8fd6', '#e05d9a', '#2fa36b', '#7a55c7', '#d64545'][p.k], 30), t, tW(p.k) + .3, Lt(3).start + .3) });
  $('ov').innerHTML = ov;
  let ui = dayPill(t) + rulesCard(t) + depthMeter(t) + earthCard(t) + toolCards(t);
  if (i == 2 && t > Lt(2).start + .3) ui += `<div class="pill" style="left:40px;top:330px;transform:rotate(-3deg) scale(${pop(t, Lt(2).start + .3)});font-size:68px;color:#fff;background:#2fa36b;text-shadow:${shadowTxt(OL, 4)}">+5 ARBEITER</div>`;
  ui += MG.captions(t, { y: 1470, size: 84, maxWords: 3, hl: '#ffd166', upper: true, stageW: 1080 }).replace(/'Arial Black',Arial/, 'IB,Arial');
  $('ui').innerHTML = ui;
};
window.sfxEvents = function () {
  const E = [], L = Lt;
  E.push({ k: 'pop', t: .05 }, { k: 'whoosh', t: .2, d: 1.2 }, { k: 'chime', t: .3 });
  E.push({ k: 'swish', t: L(1).start, d: .4 }, { k: 'pop', t: wt(1, /folgen/i) - .1 }, { k: 'pop', t: wt(1, /herz/i) - .1 }, { k: 'pop', t: wt(1, /umfrage|entscheid|wünsch/i) - .1 });
  WK.forEach(p => E.push({ k: 'thud', t: tW(p.k) + .45, g: .5 }));
  for (let x = tDig0(); x < L(3).start; x += .5) E.push({ k: 'hammer', t: x, g: .35 });
  E.push({ k: 'whoosh', t: L(3).start, d: .8 }, { k: 'impact', t: L(3).start + .2 }, { k: 'bell', t: L(4).start + .2 });
  E.push({ k: 'pop', t: wt(5, /presslufthammer/i) }, { k: 'pop', t: wt(5, /bagger/i) }, { k: 'chime', t: wt(5, /stimmt/i) });
  return E;
};
