<script>

function TX(x,y,txt,o={}){const p=o.p??1;if(p<=0)return'';const sz=o.size||64,s=o.s??1;

 const sp=ws.map((w,i)=>{const q=cl(t,t0+i*gap,t0+i*gap+.3);if(q<=0)return `<span style="display:inline-block;opacity:0">${w}</span>`;return `<span style="display:inline-block;transform:translateY(${((1-ez(q))*30).toFixed(1)}px) scale(${bo(q).toFixed(3)}) rotate(${((1-ez(q))*(i%2?8:-8)).toFixed(1)}deg);opacity:${Math.min(1,q*3).toFixed(2)}">${w}</span>`}).join(' ');

 const dot=o.dot?`<span style="display:inline-block;width:${sz*.62}px;height:${sz*.62}px;border-radius:50%;background:${o.dot};margin-right:${sz*.3}px;vertical-align:-${sz*.06}px"></span>`:'';
 return `<div style="position:absolute;left:${x}px;top:${y}px;transform:translate(-50%,-50%) scale(${s.toFixed(3)});opacity:${Math.min(1,p*2).toFixed(3)};padding:${sz*.34}px ${sz*.7}px;border-radius:${sz*1.2}px;background:${o.bg||'#ffffffee'};color:${o.fg||C.ink};font:700 ${sz}px/1.1 P,Arial;white-space:nowrap;box-shadow:0 10px 26px #0a2a5066">${dot}${txt}</div>`}

 const n=Math.floor(w/40);for(let i=0;i<n;i++){for(let r=0;r<2;r++){const fx=x-w/2+28+i*(w-56)/Math.max(1,n-1)+(r?14:0),fy=y-h-6-r*24+fl(t,i0+i,1.5);if(r&&i===n-1)continue;s+=fruit(fx,fy,20,c,false)}}return s}
function loaf(x,y,s){return `<path d="M${x-120*s} ${y} q0 ${-110*s} ${120*s} ${-110*s} q${120*s} 0 ${120*s} ${110*s} z" fill="#e0a25a" stroke="${INK}" stroke-width="5"/>`+[-60,0,60].map(d=>`<path d="M${x+d*s-18*s} ${y-60*s} q${18*s} ${-20*s} ${36*s} 0" stroke="#a8682b" stroke-width="6" fill="none" stroke-linecap="round"/>`).join('')}

 <circle cx="${x}" cy="${y-h*.62}" r="${w*.2}" fill="#ffffffcc" stroke="${INK}" stroke-width="3"/><path d="M${x-w/2+6} ${y-h+14} l${w-12} 0" stroke="#ffffff88" stroke-width="6"/>`}

const VP={x:960,y:440};const lp=(a,b,f)=>[a[0]+(b[0]-a[0])*f,a[1]+(b[1]-a[1])*f];

 for(let l=0;l<5;l++){const y0=l/5,y1=(l+1)/5;for(let j=0;j<N;j++){const d0=dep(j)/D,d1=dep(j+1)/D,Pp=(d,fy)=>lp(lp([xn,tn],[xf,tf],d),lp([xn,bn],[xf,bf],d),fy);

  const t0=lp([xn,tn],[xn,bn],y1),t1=lp([xf,tf],[xf,bf],y1);s+=`<line x1="${t0[0]}" y1="${t0[1]}" x2="${t1[0]}" y2="${t1[1]}" stroke="#9fb0c4" stroke-width="12"/>`}

const WORLD_SVG=(()=>{let s=`<svg width="1920" height="1080" style="position:absolute;left:0;top:0">`;
 s+=`<polygon points="-80,-60 2000,-60 1200,290 720,290" fill="#f6f9fc"/>`;
 for(let i=0;i<7;i++){const f=1-1/(1+.5*i),g=1-1/(1+.5*(i+.3)),y0=lerp(-60,290,f),y1=lerp(-60,290,g),w0=lerp(900,120,f),w1=lerp(900,120,g);
  s+=`<polygon points="${960-w0/2},${y0} ${960+w0/2},${y0} ${960+w1/2},${y1} ${960-w1/2},${y1}" fill="#ffffff" stroke="#dbe6f2" stroke-width="2" style="filter:drop-shadow(0 0 14px #fff)"/>`}

 for(let i=-8;i<=8;i++)s+=`<line x1="${960+i*260}" y1="1160" x2="${960+i*30}" y2="610" stroke="#cbd5e0" stroke-width="3"/>`;
 for(let j=1;j<10;j++){const f=1-1/(1+.6*j),y=lerp(1160,610,f);s+=`<line x1="-80" y1="${y.toFixed(1)}" x2="2000" y2="${y.toFixed(1)}" stroke="#cbd5e0" stroke-width="${(3*(1-f)+1).toFixed(1)}"/>`}
 // back wall + dairy cooler

 s+=`<line x1="960" y1="370" x2="960" y2="595" stroke="${INK}" stroke-width="4"/><rect x="850" y="306" width="220" height="50" rx="12" fill="#4f8fd8" stroke="${INK}" stroke-width="4"/><text x="960" y="343" text-anchor="middle" font-family="P" font-weight="700" font-size="34" fill="#fff">DAIRY</text>`;

// ---------- top-down STORE PLAN (map) ----------
const PL={x:330,y:150,w:1260,h:720};// plan rectangle

function planSVG(t,e){const x=PL.x,y=PL.y,w=PL.w,h=PL.h;let s=`<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="40" fill="#f7fbff" stroke="${INK}" stroke-width="7"/>`;

 return s}
function routeDraw(pts,q,col=C.red){let L=0;const seg=[];for(let i=1;i<pts.length;i++){const d=Math.hypot(pts[i][0]-pts[i-1][0],pts[i][1]-pts[i-1][1]);seg.push(d);L+=d}
 let rem=L*q,d='M'+pts[0][0]+' '+pts[0][1],pos=pts[0];for(let i=1;i<pts.length&&rem>0;i++){const f=Math.min(1,rem/seg[i-1]);pos=lp(pts[i-1],pts[i],f);d+=` L${pos[0].toFixed(1)} ${pos[1].toFixed(1)}`;rem-=seg[i-1]}

// ---------- generic BEAT engine

function O2(k,x,y,w,t,e){return obj(k,x,y+fl(t,1,4),w,{op:Math.min(1,cl(t,e._t0+1.4,e._t0+1.8))})}
// ---------- camera
let SCN=[];// scene spans for dolly
function dollyZ(t){for(const s of SCN){if(t>=s.a&&t<=s.b){const f=(t-s.a)/Math.max(1,s.b-s.a);return 1+(s.dolly?.16:.035)*ei(f)}}return 1}
function camT(t){let z=dollyZ(t)*0+1,sx=0,sy=0;for(const [pt,a] of PUNCH){const d=t-pt;if(d>-.08&&d<.6)z+=a*(d<0?(1+d/.08):Math.exp(-d*6))}
 for(const st of SHAKE){const d=t-st;if(d>=0&&d<.35){const k=(1-d/.35)*14;sx+=Math.sin(d*90)*k;sy+=Math.cos(d*77)*k*.7}}
 const drift=Math.sin(t*.35)*6;return `translate(${(sx+drift).toFixed(1)}px,${sy.toFixed(1)}px) scale(${z.toFixed(4)})`}
function bgLayers(t){let wa=0,wb=0;const N=TL.lines.length,seen=new Set();for(let k=0;k<N;k++){const [a0,b0]=sceneRange(k);if(seen.has(a0))continue;seen.add(a0);
  const a=a0==0?-1:S(a0)-.4,b=b0+1<N?S(b0+1)+.4:TL.dur+1;if(t<a||t>b)continue;const op=cl(t,a,a+.45)*(1-cl(t,b-.45,b));const bg=SP(a0).bg;if(bg==='aisle')wa=Math.max(wa,op);if(bg==='store')wb=Math.max(wb,op)}
 const z=dollyZ(t);$('world').style.opacity=wa.toFixed(3);$('worldb').style.opacity=wb.toFixed(3);
 $('world').style.transform=`scale(${z.toFixed(4)})`;$('worldb').style.transform=`scale(${(1.06+(z-1)).toFixed(4)})`}
function beatLayer(t){let h='';const N=TL.lines.length,seen=new Set();
 for(let k=0;k<N;k++){const [a0,b0]=sceneRange(k);if(seen.has(a0))continue;seen.add(a0);
  const a=a0==0?-1:S(a0)-.4,b=b0+1<N?S(b0+1)+.4:TL.dur+1;if(t<a||t>b)continue;const op=cl(t,a,a+.45)*(1-cl(t,b-.45,b));if(op<=0)continue;
  let inner='';
  for(let j=a0;j<=b0;j++)for(const e of SP(j).els){if(t<e._t0-.01)continue;if(t>e._t1+.2)continue;const pin=e._t0<-5||(e._cont&&e.at<0)?1:cl(t,e._t0,e._t0+.35),pout=1-cl(t,e._t1-.15,e._t1+.15);if(pout<=0)continue;
   const f=R2[e.e];if(!f)continue;const s=f(e,t,pin);if(s)inner+=pout<1?`<div style="position:absolute;inset:0;opacity:${pout.toFixed(3)}">${s}</div>`:s}
  const ent=1-op;h+=`<div style="position:absolute;inset:0;opacity:${op.toFixed(3)};transform:translateX(${(t<S(a0)?ent*80:-ent*80).toFixed(1)}px) scale(${(1+.03*ent).toFixed(4)})">${inner}</div>`}
 return h}
function hud(t){let k=0;for(let i=0;i<TL.lines.length;i++)if(t>=S(i)-.2)k=i;let n=0;for(let i=0;i<=k;i++)if(SP(i).trick!=null)n=SP(i).trick;
 if(!n)return'';// hide during station wipes
 const inSt=SP(k).els.some(e=>e.e==='station'&&t>=e._t0&&t<=e._t1);if(inSt)return'';
 let d='';for(let i=1;i<=10;i++)d+=`<div style="width:${i===n?34:18}px;height:18px;border-radius:9px;background:${i<=n?C.gold:'#ffffff66'};margin-left:7px;box-shadow:0 2px 6px #0a2a5055"></div>`;
 return `<div style="position:absolute;right:46px;top:40px;display:flex;align-items:center;padding:12px 22px;border-radius:40px;background:#14202ccc"><div style="font:700 30px P;color:#fff;margin-right:12px">TRICK ${n}/10</div>${d}</div>`}
function draw(t){if(!TL)return;bgLayers(t);
 const fh=beatLayer(t);if(fh!==$('fg')._h){$('fg').innerHTML=fh;$('fg')._h=fh}
 $('cam').style.transform=camT(t);
 const hh=hud(t);if(hh!==$('hud')._h){$('hud').innerHTML=hh;$('hud')._h=hh}
 $('pat').style.transform=`translateY(${(-(t*8)%52).toFixed(1)}px)`;
 const c=MG.captions(t,{y:985,size:50,maxWords:4,stageW:1920,w:1500,upper:true});if(c!==$('cap')._h){$('cap').innerHTML=c;$('cap')._h=c}
 MG.grainTick(t)}
window.setTimeline=tl=>{MG.TL=TL=tl;prepEls();SCN=[];const seen=new Set();for(let k=0;k<TL.lines.length;k++){const [a0,b0]=sceneRange(k);if(seen.has(a0))continue;seen.add(a0);SCN.push({a:S(a0)-.4,b:b0+1<TL.lines.length?S(b0+1)+.4:TL.dur,dolly:SP(a0).dolly})}
 $('world').innerHTML=WORLD_SVG;$('worldb').innerHTML=WORLD_SVG;
 MG.preload(['cart','cash','coins','milk','register','samcart','samhappy','samsad','samthink','samyell','speaker','tag','truck'].map(IMG));
 Promise.all([document.fonts.load('700 50px P'),document.fonts.load('500 50px P')]).then(()=>{fontsOk=true},()=>{fontsOk=true})};
Object.defineProperty(window,'ready',{configurable:true,get(){return imgReady&&fontsOk},set(v){imgReady=v}});
window.sfxEvents=()=>{const ev=[],N=TL.lines.length,add=(k,t,o={})=>ev.push(Object.assign({k,t:+t.toFixed(3)},o));
 for(let i=1;i<N;i++){if(sceneRange(i)[0]===i)add(i%2?'whoosh':'swish',S(i)-.3,{d:.6})}
 for(let i=0;i<N;i++){const sp=SP(i);for(const e of sp.els){if(e.at<0)continue;const t0=e._t0,te=e._te;
   if(e.e==='obj'&&!e._cont&&e.at>0)add('pop',t0);
   if(e.e==='obj'&&e.drive)add('whoosh',t0,{d:1});
   if(e.e==='stamp')add('impact',t0+.05);
   if(e.e==='station'){add('whoosh',t0,{d:.7});add('impact',t0+.35)}
   if(e.e==='trick'){add('impact',t0+.05);add('swish',t0+1.25,{d:.5})}
   if(e.e==='count'){for(let q=0;q<8;q++)add('tick',t0+(te-t0)*q/8,{f:1200+q*80});add('ding',te)}
   if(e.e==='receipt'){for(let q=0;q<(e.mode==='long'?9:1);q++)add('blip',t0+q*.32)}
   if(e.e==='plan'){add('swish',t0,{d:.8});if(e.stations)for(let q=0;q<5;q++)add('pop',t0+.15+q*.25)}
   if(e.e==='doors')add('swish',t0+.3,{d:1});
   if(e.e==='clock')for(let q=0;q<10;q++)add('tick',t0+.2+q*.18,{f:1500});
   if(e.e==='cartgrow')add('pop',te);
   if(e.e==='produce')for(let q=0;q<6;q++)add('pop',t0+q*.14);
   if(e.e==='fill'||e.e==='grab')for(let q=0;q<4;q++)add('pop',t0+q*.4);
   if(e.e==='tags3'&&e.bars==null)for(let q=0;q<3;q++)add('pop',t0+.2+q*.55);
   if(e.e==='tags3'&&e.bars!=null){add('swish',tAt(e._k,e.bars),{d:.8});add('ding',tAt(e._k,e.bars)+1.1)}
   if(e.e==='bars'||e.e==='range')add('swish',t0,{d:.8});
   if(e.e==='shelf'&&e.pay!=null)for(let q=0;q<5;q++)add('coin',tAt(e._k,e.pay)+q*.35+.7);
   if(e.e==='shelf'&&e.eye!=null&&e.eye>=0)add('shimmer',tAt(e._k,e.eye));
   if(e.e==='endcap'||e.e==='bigtag'||e.e==='coldroom'||e.e==='bread')add('pop',t0);
   if(e.e==='grid')add('error',tAt(e._k,.45));
   if(e.e==='tips')add('ding',S(e._k)+.1);
   if(e.e==='uk')add('error',tAt(e._k,.6));
   if(e.e==='clips')for(let q=0;q<8;q++)add('click',t0+(te-t0)*q/8);
   if(e.e==='chain')add('whoosh',t0+1.4,{d:1});
   if(e.e==='dairyglow')add('shimmer',t0)}}
 ev.sort((a,b)=>a.t-b.t);const out=[];for(const e of ev){if(e.t<0)e.t=0;if(!out.find(o=>o.k==e.k&&Math.abs(o.t-e.t)<.12))out.push(e)}return out};
window.draw=draw;
MG.finish($('stage'),1920,1080,.04,'#0a2a5022',65);
</script>
