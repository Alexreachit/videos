  p.m.scl = [s, s * (1 + .025 * Math.sin(t * 2.1 + p.ph)), s]; p.m.pos = [p.x, p.y + hop, p.z]; p.m.rot = [0, p.yaw, .04 * Math.sin(t * 1.4 + p.ph)];
  p.head.rot = [0, hy, 0]; p.aL.rot = [axL, 0, aL]; p.aR.rot = [axR, 0, aR];
}
window.draw = function (t) {

  pole.pos = [FX[0], FX[1] - .05, FX[2]]; w.update(flag, flagGeo(t));

  });

  if (blocks({ x: WA[0], z: WA[2] }, c)) JUL.m.vis = false;

  doener.vis = t > tD; doener.scl = [1, Math.max(.01, bo(cl(t, tD, tD + .45))), 1];

    m.mel.scl = [s * 1.15, s * .9, s * 1.5]; m.mel.pos = [m.x, MF[1] + .17 * s, m.z];

    wishCard(t, 5, 'Henry', '🥒', 'EIN GURKENLADEN', '#c8f0a0', /gurkenladen/i, 'GURKENLADEN!', 'will bauen:') +
    wishCard(t, 6, 'Elias', '✨', 'GOLDKETTE, CAPPY & BLAUER PULLI', '#9ad0ff', /pulli/i) +
    wishCard(t, 7, 'Кристиан', '❄️', 'EINE USCHANKA', '#d8c8f0', /uschanka/i) +
    wishCard(t, 8, 'Jk777', '🕶️', 'Kann ich Bodyguard sein?', '#c9ccd3', /bodyguard/i, 'BODYGUARD!', 'fragt:') +
    ripeUI(t) + choiceCards(t) + commentCard(t);
  ui += MG.captions(t, { y: 1470, size: 84, maxWords: 3, hl: '#ffd166', upper: true, stageW: 1080 }).replace(/'Arial Black',Arial/, 'IB,Arial');
  $('ui').innerHTML = ui;
};
