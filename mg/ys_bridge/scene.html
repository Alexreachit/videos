  E.push({ k: 'bell', t: tc + .5 }, { k: 'impact', t: wt(6, /chased/) + .2 });
  E.push({ k: 'pop', t: L(7).start + .1 }, { k: 'impact', t: wt(7, /life/) });
  E.push({ k: 'pop', t: L(8).start + .1 }, { k: 'pop', t: L(8).start + .45 }, { k: 'pop', t: L(8).start + .6 });
  return E;
};
