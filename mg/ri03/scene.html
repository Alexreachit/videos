  else if (i == 9) { const u = ez(cl(rt, .2, .5)); o.armL = [lerp(.12, 2.7, u), .25]; o.armR = [lerp(.12, 2.7, u), .25]; o.mouth = 'grin'; o.bob = Math.max(0, Math.sin(t * 9)) * 26 * cl(rt, .3, .6) }
