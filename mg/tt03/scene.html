<!doctype html><meta charset=utf-8><style>
html,body{margin:0;background:#04060d}
#stage{position:relative;width:1080px;height:1920px;overflow:hidden;background:#07050f;font-family:Arial,Helvetica,sans-serif}
.abs{position:absolute}
.layer{position:absolute;left:0;top:0;width:1080px;height:1920px;display:none}
#bg{position:absolute;inset:0}
#iworld{position:absolute;inset:0;perspective:1500px;perspective-origin:540px 900px}
#icam{position:absolute;left:0;top:0;width:1080px;height:1920px;transform-style:preserve-3d}
#desk{position:absolute;left:-400px;top:1360px;width:1880px;height:1400px;transform-origin:50% 0;transform:rotateX(78deg);
 background:radial-gradient(45% 40% at 50% 20%,#4a2c1c,#20130c 60%,#0c0705);}
#phone{position:absolute;left:320px;top:470px;width:440px;height:900px;border-radius:66px;transform-style:preserve-3d;
 background:linear-gradient(150deg,#3a3f4f,#15171f 50%,#0b0c11);box-shadow:inset 0 3px 0 #7a8095,inset 0 -6px 18px #000c,0 70px 140px #000e,0 0 0 3px #08090d}
#scr{position:absolute;left:18px;top:18px;width:404px;height:864px;border-radius:50px;overflow:hidden;background:#f4f5fa}
#notch{position:absolute;left:150px;top:14px;width:104px;height:30px;border-radius:15px;background:#08090d;z-index:5}
#thumb{position:absolute;left:0;top:0;width:150px;height:260px;border-radius:75px 75px 60px 60px;
 background:linear-gradient(100deg,#e9b996,#d39a74 60%,#b07a58);box-shadow:-20px 30px 50px #0009,inset -10px -6px 20px #0003}
#thumb i{position:absolute;left:34px;top:18px;width:82px;height:92px;border-radius:40px 40px 30px 30px;background:linear-gradient(180deg,#f6dccd,#e8c1aa);box-shadow:inset 0 -4px 8px #0002}
#flash{position:absolute;inset:0;pointer-events:none;opacity:0;z-index:80}
#hook,#cap{position:absolute;left:0;top:0;width:1080px;height:1920px;pointer-events:none}
#hook{z-index:60}#cap{z-index:70}
</style>
<div id=stage>
<svg width=0 height=0 style="position:absolute"><defs>
 <filter id=glow x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="9" result=b /><feMerge><feMergeNode in=b /><feMergeNode in=SourceGraphic /></feMerge></filter>
 <filter id=shd x="-40%" y="-40%" width="180%" height="180%"><feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#000" flood-opacity=".6"/></filter>
 <linearGradient id=gGold x1=0 y1=0 x2=0 y2=1><stop offset=0 stop-color="#ffe7a6"/><stop offset=1 stop-color="#f0a531"/></linearGradient>
 <linearGradient id=gCard x1=0 y1=0 x2=1 y2=1><stop offset=0 stop-color="#2c2550"/><stop offset=1 stop-color="#15122a"/></linearGradient>
 <linearGradient id=gPh x1=0 y1=0 x2=1 y2=1><stop offset=0 stop-color="#3a3f4f"/><stop offset=.5 stop-color="#15171f"/><stop offset=1 stop-color="#0b0c11"/></linearGradient>
 <linearGradient id=gApp x1=0 y1=0 x2=1 y2=1><stop offset=0 stop-color="#ff5d8f"/><stop offset=.5 stop-color="#a855f7"/><stop offset=1 stop-color="#3b82f6"/></linearGradient>
 <radialGradient id=gCu cx=".4" cy=".35"><stop offset=0 stop-color="#ffcc9a"/><stop offset=.6 stop-color="#d9824a"/><stop offset=1 stop-color="#8f4a22"/></radialGradient>
 <linearGradient id=gBox x1=0 y1=0 x2=1 y2=1><stop offset=0 stop-color="#ffe7a6"/><stop offset=1 stop-color="#e09a2a"/></linearGradient>
</defs></svg>
<div id=bg></div>
<div id=L0 class=layer><div id=iworld><div id=icam><div id=desk></div>
 <div id=phone><div id=scr></div><div id=notch></div></div><div id=thumb><i></i></div>
</div></div></div>
<div id=L1 class=layer></div><div id=L2 class=layer></div><div id=L3 class=layer></div><div id=L4 class=layer></div>
<div id=L5 class=layer></div><div id=L6 class=layer></div><div id=L7 class=layer></div><div id=L8 class=layer></div>
<div id=L9 class=layer></div><div id=L10 class=layer></div>
<div id=flash></div><div id=hook></div><div id=cap></div>
</div>
<script src="../lib/core.js"></script>
<script>
const {cl,ez,ei,bo,lerp}=MG,$=MG.$,F='Arial,Helvetica,sans-serif';
const NL=()=>MG.TL?MG.TL.lines.length:11;
const ST=i=>i>=NL()?(MG.TL?MG.TL.dur:99):MG.L(i).start, EN=i=>MG.L(i).end, DU=i=>EN(i)-ST(i);
function wt(i,re,fb=.5,n=0){const l=MG.L(i);let k=0;for(const w of (l.words||[])){if(re.test(w[0].replace(/[^\w$]/g,''))){if(k==n)return l.start+w[1];k++}}return l.start+(l.end-l.start)*fb}
const tx=(x,y,s,c,str,o={})=>`<text x="${x}" y="${y}" font-family="${F}" font-size="${s}" font-weight="${o.w||900}" fill="${c}" text-anchor="${o.a||'middle'}"${o.ls?` letter-spacing="${o.ls}"`:''} opacity="${o.op==null?1:o.op}"${o.f?` filter="url(#${o.f})"`:''}${o.st?` stroke="${o.st}" stroke-width="${o.sw||6}" paint-order="stroke"`:''}>${str}</text>`;
const svg=inner=>`<svg width=1080 height=1920 viewBox="0 0 1080 1920" style="position:absolute;left:0;top:0">${inner}</svg>`;
function headline(t,t0,num,label,col='#ffd166',y=400,size=170){const p=cl(t,t0,t0+.55),a=ez(cl(t,t0,t0+.2)),lp=ez(cl(t,t0+.25,t0+.6));
 return `<g transform="translate(540,${y}) scale(${.55+.45*bo(p)})" opacity="${a}">${tx(0,0,size,col,num,{f:'glow',st:'#000a',sw:10})}</g>`+
 (label?`<g opacity="${lp}" transform="translate(0,${(1-lp)*16})">${tx(540,y+70,40,'#e4dcff',label,{w:800,ls:4,st:'#000c',sw:6})}</g>`:'')}
const label=(t,t0,str,y=340,col='#c4b5fd',size=46)=>tx(540,y,size,col,str,{w:900,ls:5,op:ez(cl(t,t0,t0+.4)),st:'#000c',sw:6});
// Icons der Werbekunden (generisch, keine Marken)
const BC=['#ff7a59','#a855f7','#22c55e','#3b82f6','#f472b6','#eab308'];
function icon(k){switch(k){
 case 0:return `<path d="M-40,8 L-36,-22 L-14,-20 C-8,-8 8,-4 24,-2 C36,0 42,6 42,14 L42,22 L-40,22 Z" fill="#fff"/><path d="M-40,14 L42,14" stroke="#0003" stroke-width="5"/>`;
 case 1:return `<path d="M-26,-12 L26,-12 L20,30 L-20,30 Z" fill="#fff"/><path d="M26,-4 C44,-4 44,18 22,18" stroke="#fff" stroke-width="7" fill="none"/><path d="M-8,-20 c-7,-8 7,-12 0,-22 M8,-20 c-7,-8 7,-12 0,-22" stroke="#fff" stroke-width="5" fill="none" stroke-linecap="round"/>`;
 case 2:return `<path d="M-42,2 C-42,-16 -28,-20 -16,-18 L16,-18 C28,-20 42,-16 42,2 L44,18 C44,32 28,34 22,24 L16,14 L-16,14 L-22,24 C-28,34 -44,32 -44,18 Z" fill="#fff"/><path d="M-26,-6 v14 M-33,1 h14" stroke="#22c55e" stroke-width="5"/><circle cx="22" cy="-2" r="5" fill="#22c55e"/><circle cx="32" cy="6" r="5" fill="#22c55e"/>`;
 case 3:return `<path d="M-44,10 L-38,-6 L-22,-10 L-12,-26 L18,-26 L30,-10 L44,-6 L46,12 Z" fill="#fff"/><circle cx="-24" cy="14" r="11" fill="#1e293b" stroke="#fff" stroke-width="5"/><circle cx="26" cy="14" r="11" fill="#1e293b" stroke="#fff" stroke-width="5"/>`;
 case 4:return `<path d="M-30,12 A30,30 0 0 1 30,12" stroke="#fff" stroke-width="9" fill="none"/><rect x="-42" y="4" width="18" height="32" rx="7" fill="#fff"/><rect x="24" y="4" width="18" height="32" rx="7" fill="#fff"/>`;
 default:return `<path d="M0,34 L-32,-22 Q0,-38 32,-22 Z" fill="#fff"/><circle cx="-6" cy="-6" r="6" fill="#eab308"/><circle cx="9" cy="8" r="5" fill="#eab308"/><circle cx="-2" cy="20" r="4" fill="#eab308"/>`}}
const bidder=(k,x,y,s,op=1,glow=0)=>`<g transform="translate(${x},${y}) scale(${s})" opacity="${op}"><circle r="62" fill="${BC[k]}"${glow?' filter="url(#glow)"':''}/><circle r="62" fill="none" stroke="#fff" stroke-opacity=".35" stroke-width="4"/>${icon(k)}</g>`;
// flaches Handy (SVG), Bildschirm-Inhalt wird uebergeben (Koordinaten 0..360 x 0..760)
function phone(x,y,s,inner,id){return `<g transform="translate(${x},${y}) scale(${s})" filter="url(#shd)"><rect x="-200" y="-400" width="400" height="800" rx="58" fill="url(#gPh)" stroke="#5b6075" stroke-width="3"/>
 <clipPath id="pc${id}"><rect x="-182" y="-382" width="364" height="764" rx="44"/></clipPath><g clip-path="url(#pc${id})"><rect x="-182" y="-382" width="364" height="764" fill="#f4f5fa"/><g transform="translate(-182,-382)">${inner}</g></g><rect x="-48" y="-372" width="96" height="26" rx="13" fill="#0b0c11"/></g>`}
const coin=(x,y,s,op=1)=>`<g transform="translate(${x},${y}) scale(${s})" opacity="${op}"><circle r="30" fill="url(#gGold)" stroke="#fff3c4" stroke-width="4"/>${tx(0,12,34,'#7a4a00','$')}</g>`;
// Feed-Karten
function feedCard(y,k,ad,w=324){const c=['#c7d2fe','#fbcfe8','#bbf7d0','#fde68a','#bae6fd'][k%5];
 return `<g transform="translate(20,${y})"><rect width="${w}" height="210" rx="22" fill="#fff" stroke="${ad?'#f0a531':'#e2e5ef'}" stroke-width="${ad?6:3}"/><rect x="14" y="14" width="${w-28}" height="128" rx="14" fill="${ad?'#fff3d6':c}"/>
 ${ad?`<g transform="translate(${w/2},78) scale(.9)">${bidder(k%6,0,0,.8)}</g><rect x="20" y="22" width="56" height="30" rx="8" fill="#f0a531"/>${tx(48,45,22,'#fff','AD')}`:`<circle cx="${w/2}" cy="78" r="34" fill="#fff8"/>`}
 <circle cx="34" cy="176" r="16" fill="${ad?'#f0a531':'#cbd2e4'}"/><rect x="60" y="164" width="150" height="12" rx="6" fill="#cbd2e4"/><rect x="60" y="184" width="100" height="10" rx="5" fill="#e2e5ef"/></g>`}

// ---------- Hintergrund ----------
function drawBg(t){const k=MG.cur(t),hue=[270,280,255,265,290,30,270,300,45,330,260][k]||270,a=t*.15;
 $('bg').style.background=`radial-gradient(60% 40% at ${50+18*Math.sin(a)}% ${30+8*Math.cos(a*1.3)}%,hsla(${hue},70%,40%,.36),transparent 70%),radial-gradient(55% 35% at ${45-20*Math.sin(a*.8)}% ${78+6*Math.sin(a)}%,hsla(${hue+50},70%,35%,.24),transparent 70%),linear-gradient(180deg,#0c0820,#140f30 50%,#06040d)`}

// ---------- Szene 0: Daumen tippt "GET" ----------
function storeScreen(t,tap){const pr=cl(t,tap+.1,tap+1.0),open=ez(cl(t,tap+1.1,tap+1.5));
 const btn=pr<=0?`<div style="position:absolute;left:236px;top:268px;width:132px;height:58px;border-radius:29px;background:#2f6bff;color:#fff;font:900 30px/58px Arial;text-align:center;transform:scale(${1-.12*Math.sin(Math.PI*cl(t,tap-.08,tap+.12))})">GET</div>`
  :`<svg style="position:absolute;left:272px;top:268px" width=60 height=60><circle cx=30 cy=30 r=24 fill=none stroke="#dfe3ee" stroke-width=7 /><circle cx=30 cy=30 r=24 fill=none stroke="#2f6bff" stroke-width=7 stroke-dasharray="151" stroke-dashoffset="${151-151*ez(pr)}" transform="rotate(-90 30 30)"/></svg>`;
 let s=`<div style="position:absolute;inset:0;opacity:${1-open}"><div style="position:absolute;left:28px;top:84px;font:900 44px Arial;color:#111">App</div>
 <div style="position:absolute;left:28px;top:170px;width:180px;height:180px;border-radius:42px;background:linear-gradient(135deg,#ff5d8f,#a855f7 55%,#3b82f6);box-shadow:0 14px 30px #a855f766"><svg width=180 height=180 viewBox="-90 -90 180 180"><path d="M-40,0 C-40,-34 -6,-34 0,0 C6,34 40,34 40,0 C40,-34 6,-34 0,0 C-6,34 -40,34 -40,0 Z" fill=none stroke="#fff" stroke-width="16"/></svg></div>
 <div style="position:absolute;left:236px;top:178px;font:900 40px Arial;color:#111">LOOP</div><div style="position:absolute;left:236px;top:226px;font:600 24px Arial;color:#7a8095">Social &amp; video</div>${btn}
 <div style="position:absolute;left:28px;top:390px;right:28px;height:2px;background:#e2e5ef"></div>
 <div style="position:absolute;left:28px;top:420px;font:900 72px Arial;color:#111">$0.00</div><div style="position:absolute;left:30px;top:500px;font:700 26px Arial;color:#7a8095;letter-spacing:3px">PRICE</div>
 <div style="position:absolute;left:28px;top:560px;width:348px;height:220px;border-radius:24px;background:linear-gradient(135deg,#dbeafe,#fce7f3)"></div></div>`;
 let f='';for(let k=0;k<4;k++){const y=70+k*240-ez(cl(t,tap+1.4,tap+3))*200;f+=`<div style="position:absolute;left:20px;top:${y}px;width:364px;height:220px;border-radius:24px;background:#fff;box-shadow:0 4px 14px #0001"><div style="position:absolute;left:14px;top:14px;right:14px;height:140px;border-radius:16px;background:${['#c7d2fe','#fbcfe8','#bbf7d0','#fde68a'][k]}"></div><div style="position:absolute;left:14px;top:170px;width:200px;height:14px;border-radius:7px;background:#cbd2e4"></div></div>`}
 s+=`<div style="position:absolute;inset:0;opacity:${open};transform:scale(${lerp(.85,1,open)})">${f}</div>`;return s}
function drawIntro(t){const T1=ST(1),tap=wt(0,/nothing/,.35)+.15,bil=wt(0,/billions/,.85);
 const dol=ei(cl(t,0,T1-.7)),dive=Math.pow(cl(t,T1-.9,T1-.15),2.4);
 $('icam').style.transform=`translate3d(${lerp(40,0,dol)}px,${lerp(60,-30,dol)-dive*200}px,${lerp(-260,120,dol)+1250*dive}px)`;
 $('phone').style.transform=`rotateX(${lerp(38,6,dol)}deg) rotateY(${lerp(-26,-4,dol)}deg) rotateZ(${lerp(10,1,dol)}deg)`;
 // Daumen: von rechts unten, tippt GET (Schirmposition 302,297 -> Weltposition ueber Phone)
 const a=ez(cl(t,.2,tap)),back=ei(cl(t,tap+.15,tap+.9)),press=Math.sin(Math.PI*cl(t,tap-.08,tap+.14));
 const tx0=lerp(lerp(900,580,a),980,back),ty0=lerp(lerp(1500,700,a),1500,back)+press*14;
 $('thumb').style.transform=`translate3d(${tx0}px,${ty0}px,${lerp(220,60,a)+ (1-press)*0}px) rotateZ(${lerp(-28,-18,a)}deg) rotateX(${lerp(38,10,a)}deg)`;
 $('thumb').style.opacity=cl(t,.1,.4)*(1-cl(t,tap+.6,tap+.9));
 $('scr').innerHTML=storeScreen(t,tap)+(t>tap&&t<tap+.7?`<div style="position:absolute;left:${302-90*ez(cl(t,tap,tap+.6))}px;top:${297-90*ez(cl(t,tap,tap+.6))}px;width:${180*ez(cl(t,tap,tap+.6))}px;height:${180*ez(cl(t,tap,tap+.6))}px;border-radius:50%;border:5px solid #2f6bff;opacity:${1-cl(t,tap,tap+.7)}"></div>`:'');
 $('phone').style.boxShadow=`inset 0 3px 0 #7a8095,inset 0 -6px 18px #000c,0 70px 140px #000e,0 0 0 3px #08090d,0 0 ${120*cl(t,tap+1,tap+1.6)}px #a855f799`;
 $('L0').style.opacity=ez(cl(t,0,.5));
 const q=ez(cl(t,.2,.6)),q2=ez(cl(t,bil-.15,bil+.2)),fo=1-ez(cl(t,T1-.6,T1-.3));
 return `<div style="position:absolute;left:0;right:0;top:150px;text-align:center;white-space:nowrap;font:900 92px/1.1 Arial,Helvetica,sans-serif;color:#fff;text-shadow:0 8px 34px #000,0 0 4px #000;opacity:${fo}">
 <div style="opacity:${q};transform:translateY(${(1-q)*30}px)">YOU PAY <span style="color:#35e08a">$0</span>.</div>
 <div style="opacity:${q2};transform:translateY(${(1-q2)*30}px) scale(${1+.15*Math.sin(Math.PI*cl(t,bil,bil+.5))});color:#ffd166">THEY MAKE BILLIONS?</div></div>`}

// ---------- Szene 1: Live-Auktion ----------
const BPOS=[[150,620],[150,860],[150,1100],[930,620],[930,860],[930,1100]];
function drawAuction(t){const T=ST(1),au=wt(1,/auction/,.6);
 const pin=ez(cl(t,T-.2,T+.5));let h=label(t,T,'BEHIND THE SCREEN',330);
 const live=ez(cl(t,au-.2,au+.2));
 h+=`<g opacity="${live}" transform="translate(540,440) scale(${.7+.3*bo(cl(t,au-.2,au+.4))})"><rect x="-260" y="-56" width="520" height="100" rx="50" fill="#ff3b5c"/><circle cx="-205" cy="-6" r="16" fill="#fff" opacity="${.5+.5*Math.sin(t*9)}"/>${tx(30,12,50,'#fff','LIVE AUCTION',{ls:2})}</g>`;
 let sp='';const ang=(t*420)%360;
 sp=`<rect width="364" height="764" fill="#f4f5fa"/>${[0,1,2].map(k=>`<g transform="translate(20,${80+k*230})"><rect width="324" height="210" rx="22" fill="#e9ecf4"/><rect x="14" y="14" width="296" height="128" rx="14" fill="#dde1ec"/></g>`).join('')}
  <g transform="translate(182,382)"><circle r="54" fill="#fffd"/><circle r="38" fill="none" stroke="#dfe3ee" stroke-width="9"/><circle r="38" fill="none" stroke="#a855f7" stroke-width="9" stroke-dasharray="70 200" stroke-linecap="round" transform="rotate(${ang})"/></g>`;
 h+=`<g opacity="${pin}" transform="translate(0,${(1-pin)*80})">${phone(540,880,.8,sp,1)}</g>`;
 BPOS.forEach(([x,y],k)=>{const p=bo(cl(t,au+k*.12,au+k*.12+.45));if(p<=0)return;const ph=((t-au)*1.6+k*.17)%1;
  const ex=x<540?380:700;h+=`<line x1="${x<540?x+70:x-70}" y1="${y}" x2="${ex}" y2="${880+(y-860)*.4}" stroke="${BC[k]}" stroke-width="5" stroke-dasharray="10 12" stroke-dashoffset="${-t*60}" opacity="${.7*cl(t,au+k*.12+.2,au+k*.12+.5)}"/>`;
  h+=bidder(k,x,y,p*.95);
  const bp=cl(t,au+.6+k*.25,au+.6+k*.25+.5);if(bp>0&&bp<1)h+=`<g transform="translate(${x},${y-90-60*ez(bp)})" opacity="${Math.sin(Math.PI*bp)}"><rect x="-52" y="-30" width="104" height="48" rx="24" fill="#fff"/>${tx(0,8,28,BC[k],'BID')}</g>`});
 return svg(h)}

// ---------- Szene 2: Interessen ----------
const TAGS=[['RUNNING',0],['COFFEE',1],['GAMING',2],['AGE 25–34',-1],['NIGHT OWL',-1],['CITY',-1]];
const TP=[[290,590],[790,600],[260,880],[820,880],[340,1010],[740,1010]];
function profile(x,y,s,op=1){return `<g transform="translate(${x},${y}) scale(${s})" opacity="${op}"><circle r="150" fill="url(#gCard)" stroke="#a78bfa" stroke-width="6"/><circle cy="-40" r="52" fill="#e4dcff"/><path d="M-90,90 C-90,10 90,10 90,90 Q0,130 -90,90 Z" fill="#e4dcff"/></g>`}
function drawInterests(t){const T=ST(2),d=DU(2),mt=wt(2,/interests/,.85)-.2;let h=label(t,T,'WHAT THE APP KNOWS',330);
 const sc=bo(cl(t,T-.1,T+.5));h+=profile(540,760,sc);
 const ring=((t-T)*.8)%1;h+=`<circle cx="540" cy="760" r="${160+120*ring}" fill="none" stroke="#a78bfa" stroke-width="4" opacity="${(1-ring)*.6}"/>`;
 TAGS.forEach(([s,b],k)=>{const t0=T+.3+k*d*.09,p=ez(cl(t,t0,t0+.5));if(p<=0)return;const [x,y]=TP[k],xx=lerp(540,x,p),yy=lerp(760,y,p);const w=s.length*24+56;
  const hit=b>=0?cl(t,mt+b*.15,mt+b*.15+.3):0;
  h+=`<line x1="540" y1="760" x2="${xx}" y2="${yy}" stroke="#a78bfa" stroke-width="3" opacity=".35"/><g transform="translate(${xx},${yy}) scale(${.6+.4*bo(cl(t,t0,t0+.5))})"><rect x="${-w/2}" y="-34" width="${w}" height="64" rx="32" fill="${hit>0?BC[b]:'#2a2350'}" stroke="${b>=0?BC[b]:'#6d5bd0'}" stroke-width="4"/>${tx(0,10,32,'#fff',s,{ls:1})}</g>`});
 // passende Werbekunden unten
 [0,1,2].forEach((b,k)=>{const x=260+k*280,y=1190,p=bo(cl(t,mt-.5+k*.1,mt-.1+k*.1)),hit=cl(t,mt+b*.15,mt+b*.15+.3);if(p<=0)return;
  const [tx0,ty0]=TP[b];if(hit>0&&hit<1){const q=ez(hit);h+=`<circle cx="${lerp(tx0,x,q)}" cy="${lerp(ty0,y,q)}" r="14" fill="${BC[b]}" filter="url(#glow)"/>`}
  h+=bidder(b,x,y,p*.9,1,hit>=1?1:0);if(hit>=1){const u=cl(t,mt+b*.15+.3,mt+b*.15+.8);h+=`<g transform="translate(${x+58},${y-62}) scale(${bo(u)})"><circle r="26" fill="#fff"/>${tx(0,10,28,BC[b],'$')}</g>`}});
 return svg(h)}

// ---------- Szene 3: Je genauer, desto teurer ----------
function drawPrecision(t){const T=ST(3),d=DU(3),s=ei(cl(t,T+.3,T+d*.75));let h=label(t,T,'HOW WELL IT KNOWS YOU',330);
 // Profil links mit wachsenden Datenpunkten
 const n=Math.round(1+11*s);h+=profile(330,760,.95);
 for(let k=0;k<12;k++){const a=k/12*6.283-1.57,on=k<n,p=on?bo(cl(t,T+.3+k/12*d*.75,T+.6+k/12*d*.75)):0;if(p<=0)continue;h+=`<g transform="translate(${330+Math.cos(a)*205},${760+Math.sin(a)*205}) scale(${p})"><circle r="22" fill="${['#ff7a59','#a855f7','#22c55e','#3b82f6','#f472b6','#eab308'][k%6]}"/><circle r="8" fill="#fff"/></g>`}
 // Fokus-Ring: erst unscharf (gestrichelt), dann scharf

 else{switch(type){case'push':return[`translateX(${-p*1080}px) scale(${lerp(1,.9,p)})`,1,''];case'up':return[`translateY(${-p*1920}px)`,1,''];case'zoom':return[`scale(${lerp(1,2.6,p)})`,1-p,''];case'iris':return[`scale(${lerp(1,.94,p)})`,1-.5*p,''];case'flash':return['',1-p,''];}}return['',1,'']}

  const r=L.f(t,el);if(k==0)hook=r;else el.innerHTML=r});
