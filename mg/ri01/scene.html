<script>
const W = 1080, H = 1920, G = GL3D, {cl, ez, ei, bo, el, lerp} = MG;
const $ = id => document.getElementById(id);
const OL = '#232838';
// ---------------- Welt ----------------
const w = G.World($('cv'), W, H, 1.5);
w.fog = G.hex('#d9f2fd'); w.fogN = 110; w.fogF = 380; w.sky = G.hex('#d6efff'); w.gnd = G.hex('#c9b07c');
w.sun = G.v.norm([.5, .78, .42]); w.shadowSize = 26;

// Inselhoehe (gleiche Funktion fuer Gelaende + Platzierung)
const S = 1.9, IR = 15 * S, SP0 = [0, 0, 3];
function iH(x, z) {
  x /= S; z /= S;
  const r = Math.hypot(x, z), a = Math.atan2(z, x);
  const R = 11.2 + .9 * Math.sin(a * 3 + .5) + .5 * Math.sin(a * 5 - 1.2);
  const u = r / R;
  let h = u < 1 ? 1.7 * Math.pow(1 - u * u, .55) : -1.6 * Math.min(1, (u - 1) * 2.4);
  const plateau = 1.5 + .12 * Math.sin(x * .9) * Math.cos(z * .7) + .25 * Math.sin(x * .35 + z * .4);
  if (h > 1.2) h = 1.2 + (Math.min(h, plateau) - 1.2) * .9;
  return h;
}
(function island() {
  const g = new G.Geo(), NR = 52, NS = 120, P = (i, j) => { const r = IR * Math.pow(i / NR, .9), a = j / NS * 6.2832 + (i % 2) * .5 / NS * 6.2832, x = Math.cos(a) * r, z = Math.sin(a) * r; return [x, iH(x, z), z] };
  const col = (a, b, c) => { const h = (a[1] + b[1] + c[1]) / 3, s = G.hash(a[0] * 3.1, c[2] * 1.7);
    if (h < -.25) return G.hex('#e9c98a').map(v => v * (.92 + .06 * s));
    if (h < .55) return G.hex('#f4dca0').map(v => v * (.95 + .07 * s));
    if (h < .8) return G.hex('#b9d474').map(v => v * (.94 + .08 * s));
    return (s > .5 ? G.hex('#6cbf55') : G.hex('#5fb24c')).map(v => v * (.94 + .1 * s)); };
  for (let i = 0; i < NR; i++) for (let j = 0; j < NS; j++) {
    const a = P(i, j), b = P(i, j + 1), c = P(i + 1, j + 1), d = P(i + 1, j);
    if (i == 0) { g.tri(a, c, d, col(a, c, d)); continue }
    g.tri(a, b, c, col(a, b, c)); g.tri(a, c, d, col(a, c, d));
  }
  w.mesh(g.smooth(), { cast: true, terrain: 1 });
})();
// Meer: Ringe, innen fein
(function sea() {
  const g = new G.Geo(), NR = 46, NS = 90, k = G.hex('#1d9bd3');
  const P = (i, j) => { const r = 6 * S + 330 * Math.pow(i / NR, 2.2), a = (j + (i % 2) * .5) / NS * 6.2832; return [Math.cos(a) * r, -.12, Math.sin(a) * r] };
  for (let i = 0; i < NR; i++) for (let j = 0; j < NS; j++) { const a = P(i, j), b = P(i, j + 1), c = P(i + 1, j + 1), d = P(i + 1, j); g.tri(a, b, c, k); g.tri(a, c, d, k) }
  w.mesh(g, { wave: .22, foam: 10.6 * S, cast: false, recv: true });
})();
// Palmen
function palm(x, z, hgt, lean, yaw, seed) {
  const y = iH(x, z), g = new G.Geo(), seg = 8;
  let px = 0, py = 0;
  for (let i = 0; i < seg; i++) {
    const u = i / seg, r0 = .28 - .1 * u, r1 = .28 - .1 * (u + 1 / seg), sh = hgt / seg;
    const c = G.cyl(r0, r1 * 1.12, sh * 1.02, 10, i % 2 ? '#a4744a' : '#94683f', { rot: i * .4, open: true }).smooth();
    const bx = lean * u * u * hgt * .35, bx1 = lean * (u + 1 / seg) * (u + 1 / seg) * hgt * .35;
    g.add(c, G.m4.compose([bx, i * sh, 0], [0, 0, -(bx1 - bx) / sh], 1));
    px = bx1; py = (i + 1) * sh;
  }
  const n = 8;
  for (let i = 0; i < n; i++) {
    const lf = G.leaf(2.6 + .5 * G.hash(i, seed), .42, .55 + .2 * G.hash(seed, i), i % 2 ? '#3fae49' : '#55c457');
    g.add(lf, G.m4.compose([px, py, 0], [0, i / n * 6.2832 + seed, -.25 + .25 * G.hash(i * 3, seed)], 1));
  }
  for (let i = 0; i < 3; i++) g.add(G.ico(.2, 2, '#6b4426', .06, i).smooth(), G.m4.compose([px + Math.cos(i * 2.1) * .25, py - .25, Math.sin(i * 2.1) * .25]));
  return w.mesh(g, { pos: [x, y - .1, z], rot: [0, yaw, 0] });
}
palm(-6.2 * S, -3.5 * S, 5.2, 1, .3, 1); palm(-7.6 * S, -1.4 * S, 4.2, 1.2, -.4, 2); palm(6.4 * S, -4.8 * S, 5.6, 1, 2.6, 3); palm(8.1 * S, 1.6 * S, 4.4, 1.3, 3.4, 4); palm(-3.5 * S, -7.5 * S, 4.8, .9, 1.4, 5); palm(3 * S, -8 * S, 3.8, 1.1, 1.9, 6);
palm(-7.5, -6.5, 5, 1, .9, 7); palm(-9.5, -4.2, 4.2, 1.2, 2.2, 8); palm(8.5, -7.2, 5.4, 1, 2.9, 9); palm(10.8, -5, 4.3, 1.2, 1.2, 10); palm(-13, 6, 4.6, 1, .5, 11); palm(14, 5, 4.8, 1.1, 2.4, 12); palm(-4, -14, 5, 1, 1.7, 13); palm(5.5, -15, 4.4, 1.1, .2, 14);
// Felsen + Buesche
[[9.6, 4.2, .9], [-9.4, 3.6, 1.1], [10.8, -2, .7], [-2, 9.8, .8], [4.5, 9.2, .6], [-10.5, -4, .7]].map(([x, z, s]) => [x * S, z * S, s * 1.3]).forEach(([x, z, s], i) =>
  w.mesh(G.ico(s, 2, '#a3abb4', .22, i + 10, .7).smooth(), { spec: .25, pos: [x, iH(x, z) + s * .2, z], rot: [0, i, 0] }));
[[-5, 1.2, .8], [5.4, -1.6, .7], [-2.8, -4.6, .9], [6.6, 3.8, .6], [-6.3, 4, .7], [-11, -9, .9], [12, -9, .8], [-15, 1, .9], [15, -1, .8], [0, -12, 1], [-9, 11, .8], [10, 11, .7]].forEach(([x, z, s], i) =>
  w.mesh(G.ico(s, 2, i % 2 ? '#3f9e3c' : '#4cae45', .16, i + 30, .75).smooth(), { spec: .15, pos: [x, iH(x, z) + s * .35, z] }));
// Grasbueschel + kleine Blumen (eine Mesh)
(function tufts() {
  const g = new G.Geo();
  for (let k = 0; k < 2600; k++) {
    const a = G.hash(k, 1) * 6.2832, r = Math.sqrt(G.hash(k, 2)) * 17.5, x = Math.cos(a) * r, z = Math.sin(a) * r, y = iH(x, z);
    if (y < .75 || Math.hypot(x - SP0[0], z - SP0[2]) < 1.2) continue;
    const c = G.hex(G.hash(k, 3) > .5 ? '#3c8f32' : '#4fa63f'), hgt = .1 + .13 * G.hash(k, 4);
    for (let b = 0; b < 3; b++) { const q = b * 2.1 + k, dx = Math.cos(q) * .04, dz = Math.sin(q) * .04, lx = Math.cos(q) * .07, lz = Math.sin(q) * .07;
      g.tri([x - dx, y, z - dz], [x + dx, y, z + dz], [x + lx * .8, y + hgt, z + lz * .8], c) }
    if (G.hash(k, 6) > .9) g.add(G.ico(.06, 0, G.hash(k, 7) > .5 ? '#ffffff' : '#ffd84a'), G.m4.compose([x + .1, y + hgt * .8, z]));
  }
  w.mesh(g, { cast: false });
})();
// Wolken
const clouds = [];
[[-70, 38, -120, 1.2], [40, 44, -150, 1.6], [110, 36, -60, 1.1], [-130, 42, -30, 1.4], [0, 50, -200, 2], [-40, 34, 90, 1.1], [90, 40, 80, 1.3]].forEach(([x, y, z, s], i) => {
  const g = new G.Geo();
  for (let k = 0; k < 6; k++) { const r = (3 + 2.5 * G.hash(k, i)) * s; g.add(G.ico(r, 2, '#ffffff', .08, k + i * 7, .7).smooth(), G.m4.compose([(k - 2.5) * 3.2 * s, G.hash(k * 2, i) * 1.5 * s, G.hash(k, i * 3) * 2 * s])) }
  clouds.push(w.mesh(g, { pos: [x, y, z], cast: false, recv: false, shade: .35, emis: .1, base: [x, y, z] }));
});
// Moewen
const gulls = [0, 1, 2].map(i => { const b = w.mesh(G.ico(.16, 0, '#ffffff', 0, i, .6), { cast: false, recv: false, shade: .6 });
  const wl = w.mesh(new G.Geo().tri([0, 0, -.12], [-.9, .1, 0], [0, 0, .14], G.hex('#f4f6f8')), { parent: b, cast: false, recv: false, shade: .6 });
  const wr = w.mesh(new G.Geo().tri([0, 0, -.12], [.9, .1, 0], [0, 0, .14], G.hex('#f4f6f8')), { parent: b, cast: false, recv: false, shade: .6 });
  return { b, wl, wr, i } });

// Heldenplatz: Sam steht hier
const SP = [0, 0, 3]; SP[1] = iH(SP[0], SP[2]);
const hS = SP[1];
// Flagge
function flagTex() {
  const c = document.createElement('canvas'); c.width = 512; c.height = 320; const x = c.getContext('2d');
  x.fillStyle = '#2f4372'; x.fillRect(0, 0, 512, 320); x.fillStyle = '#ffd166'; x.fillRect(0, 262, 512, 58); x.fillRect(0, 0, 512, 20);
  x.fillStyle = '#f7e4b5'; x.strokeStyle = OL; x.lineWidth = 12; x.beginPath(); x.arc(256, 150, 92, 0, 7); x.fill(); x.stroke();
  x.fillStyle = OL; x.beginPath(); x.arc(226, 140, 12, 0, 7); x.arc(286, 140, 12, 0, 7); x.fill();
  x.lineWidth = 10; x.lineCap = 'round'; x.beginPath(); x.moveTo(222, 182); x.quadraticCurveTo(256, 206, 290, 182); x.stroke();
  return w.texture(c);
}
const FX = [1.55, 0, 2.2]; FX[1] = iH(FX[0], FX[2]);
const pole = w.mesh(G.cyl(.06, .05, 3.4, 8, '#e9e2d4').add(G.ico(.12, 1, '#ffd166'), G.m4.compose([0, 3.45, 0])), { pos: [...FX] });
const flagGeo = (t) => { const g = G.plane(1.7, 1.06, 12, 6, '#ffffff', { left: true }); for (let i = 0; i < g.p.length; i += 3) { const x = g.p[i]; g.p[i + 2] = Math.sin(x * 3.2 - t * 6.5) * .13 * x; g.p[i + 1] += -.05 * x * x + Math.sin(x * 2.4 - t * 5) * .04 * x } return g };
const flag = w.mesh(flagGeo(0), { dynamic: true, parent: pole, pos: [.04, 2.85, 0], tex: flagTex(), cast: true });
// Schild
function signTex() {
  const c = document.createElement('canvas'); c.width = 1024; c.height = 420; const x = c.getContext('2d');
  for (let i = 0; i < 4; i++) { x.fillStyle = i % 2 ? '#c98c50' : '#d49a5c'; x.fillRect(0, i * 105, 1024, 105); x.fillStyle = '#00000022'; x.fillRect(0, i * 105 + 100, 1024, 5) }
  x.strokeStyle = '#7a4a24'; x.lineWidth = 20; x.strokeRect(10, 10, 1004, 400);
  x.font = '900 150px IB, P, Arial'; x.textAlign = 'center'; x.fillStyle = '#ffffff55'; x.fillText('ROUNDHEAD', 516, 186);
  x.fillStyle = '#4a2a12'; x.fillText('ROUNDHEAD', 512, 180);
  x.font = '900 110px IB, P, Arial'; x.fillStyle = '#ffffff55'; x.fillText('ISLAND', 516, 316); x.fillStyle = '#2f4372'; x.fillText('ISLAND', 512, 310);
  x.font = '700 40px P, Arial'; x.fillStyle = '#4a2a12'; x.fillText('GEGR. AM TAG 1', 512, 380);
  return w.texture(c);
}
const SG = [-4.6, 0, 1.2]; SG[1] = iH(SG[0], SG[2]);
const sign = w.mesh(G.box(.16, 2.1, .16, '#7a4a24', { base: true }).add(G.box(.16, 2.1, .16, '#7a4a24', { base: true }), G.m4.compose([2.1, 0, 0])), { pos: [...SG], rot: [0, .75, 0] });
const board = w.mesh(G.box(2.6, 1.07, .14, '#c98c50', { uvFront: true }), { parent: sign, pos: [1.05, 1.62, .05], tex: null });
const signT = signTex();
const boardFace = w.mesh(G.plane(2.56, 1.03, 1, 1, '#ffffff'), { parent: sign, pos: [1.05, 1.62, .125], tex: signT, cast: false });
// Schatzkiste
const CH = [1.35, 0, 3.5]; CH[1] = iH(CH[0], CH[2]);
const chest = w.mesh(G.box(1.1, .62, .72, '#8a5428', { base: true }).add(G.box(1.16, .1, .78, '#ffd166', { base: true }), G.m4.compose([0, .5, 0])).add(G.box(.18, .66, .76, '#ffd166', { base: true }), G.m4.compose([-.36, 0, 0])).add(G.box(.18, .66, .76, '#ffd166', { base: true }), G.m4.compose([.36, 0, 0])), { pos: [...CH], rot: [0, -.35, 0] });
const lid = w.mesh(new G.Geo().add(G.box(1.12, .26, .74, '#9a6030', { base: true }).add(G.box(.2, .3, .78, '#ffd166', { base: true }), G.m4.compose([-.36, 0, 0])).add(G.box(.2, .3, .78, '#ffd166', { base: true }), G.m4.compose([.36, 0, 0])), G.m4.compose([0, 0, .37])), { parent: chest, pos: [0, .62, -.37], cast: true });
lid.geoOff = true;
const COINS = [0, 1, 2, 3, 4].map(k => ({ m: w.mesh(G.cyl(.2, .2, .06, 14, '#ffc94a', { cap: '#ffe07a' }), { parent: null, emis: .25, vis: false }), k }));
const glow = w.mesh(G.box(.9, .05, .55, '#ffe680'), { parent: chest, pos: [0, .5, 0], emis: .9, shade: .2, cast: false });
const coco = w.mesh(G.ico(.2, 2, '#6b4426', .06, 9).smooth(), { parent: chest, pos: [0, .4, 0] });
// Bauplaetze (gestrichelte Quadrate) – Haeuser, Bank, Strasse
function dashed(wd, dp, n) { const g = new G.Geo(); const seg = (x0, z0, x1, z1) => { for (let i = 0; i < n; i++) { if (i % 2) continue; const a = i / n, b = (i + 1) / n; const ax = lerp(x0, x1, a), az = lerp(z0, z1, a), bx = lerp(x0, x1, b), bz = lerp(z0, z1, b); const L = Math.hypot(bx - ax, bz - az); g.add(G.box(L, .06, .14, '#ffffff'), G.m4.compose([(ax + bx) / 2, .03, (az + bz) / 2], [0, -Math.atan2(bz - az, bx - ax), 0])) } };
  const x = wd / 2, z = dp / 2; seg(-x, -z, x, -z); seg(x, -z, x, z); seg(x, z, -x, z); seg(-x, z, -x, -z); return g }
const PL = [{ x: -2.4, z: -2.6, w: 2.6, d: 2.2, lab: 'HÄUSER', re: /häuser/i }, { x: 4.2, z: -2.4, w: 2.8, d: 2.4, lab: 'BANK', re: /bank/i }, { x: 2.6, z: .4, w: 1.2, d: 4.2, lab: 'STRASSE', re: /straße/i, rot: .25 }];
PL.forEach(p => { p.y = iH(p.x, p.z) + .02; p.m = w.mesh(dashed(p.w, p.d, 14), { pos: [p.x, p.y, p.z], rot: [0, p.rot || 0, 0], cast: false, emis: .35, shade: .5 }) });
// Hologramm-Stadt (Ziel)
const holo = [];
for (let i = 0; i < 22; i++) {
  const a = G.hash(i, 3) * 6.2832, r = 1.5 + 7 * Math.sqrt(G.hash(i, 5)), x = Math.cos(a) * r, z = Math.sin(a) * r - 1.5;
  const h = 2.5 + 9 * G.hash(i, 7) * (1 - r / 10), wd = .9 + .9 * G.hash(i, 9);
  const g = G.box(wd, h, wd, i % 3 ? '#2fb8ff' : '#ffb703', { base: true });
  holo.push({ m: w.mesh(g, { pos: [x, iH(x, z), z], alpha: 0, emis: .55, shade: .6, cast: false, vis: false }), d: G.hash(i, 11) });
}
const beams = [-1, 1, 0].map((s, i) => w.mesh(G.cyl(.5, 3.2, 60, 16, '#fff6c8', { open: true }), { pos: [s * 5, hS, -3 - 2 * Math.abs(s)], rot: [0, 0, s * .25], alpha: 0, emis: 1.2, shade: 0, cast: false, recv: false, additive: true, vis: false }));

// ---------------- Karten-Intro (Australien -> Insel) ----------------
const TM = 1.75;
const ISL = MAPP(155.6, -19.6), AUSC = MAPP(134, -25), C0 = MAPP(143, -22), W0 = 560, W1 = 2.3;
(function buildMap() {
  let p = '';
  for (let lo = 90; lo <= 190; lo += 10) { const a = MAPP(lo, 10), b = MAPP(lo, -50); p += `<path d="M${a[0]},${a[1]}L${b[0]},${b[1]}" stroke="#fff" stroke-opacity=".18" stroke-width="2" vector-effect="non-scaling-stroke"/>` }
  for (let la = 10; la >= -50; la -= 10) { const a = MAPP(90, la), b = MAPP(190, la); p += `<path d="M${a[0]},${a[1]}L${b[0]},${b[1]}" stroke="#fff" stroke-opacity=".18" stroke-width="2" vector-effect="non-scaling-stroke"/>` }
  for (const k in WORLD) p += `<path d="${WORLD[k]}" fill="${k === 'AUS' ? '#ffd166' : '#8fd36b'}" stroke="${k === 'AUS' ? OL : '#ffffff'}" stroke-width="${k === 'AUS' ? 5 : 2.5}" stroke-linejoin="round" vector-effect="non-scaling-stroke"/>`;
  // unsere Insel
  p += `<g transform="translate(${ISL[0]},${ISL[1]})"><path d="${(() => { let d = ''; for (let i = 0; i <= 40; i++) { const a = i / 40 * 6.2832, r = .95 + .08 * Math.sin(a * 3 + .5) + .05 * Math.sin(a * 5 - 1.2); d += (i ? 'L' : 'M') + (Math.cos(a) * r).toFixed(3) + ',' + (Math.sin(a) * r).toFixed(3) } return d + 'Z' })()}" fill="#f4dca0" stroke="#fff" stroke-width="3" vector-effect="non-scaling-stroke"/><circle r=".68" fill="#6cbf55"/></g>`;
  $('map').innerHTML = `<svg id="msv" width="1080" height="1920" viewBox="0 0 10 10" preserveAspectRatio="xMidYMid slice" style="position:absolute;inset:0">${p}</svg><div id="mlab"></div>`;
})();
function mapView(t) {
  const u = ei(cl(t, .25, TM)), wd = W0 * Math.pow(W1 / W0, u), k = (wd - W1) / (W0 - W1);
  const cx = ISL[0] + (C0[0] - ISL[0]) * k, cy = ISL[1] + (C0[1] - ISL[1]) * k, hd = wd * 1920 / 1080;
  return { x0: cx - wd / 2, y0: cy - hd / 2, wd, hd };
}
function drawMap(t) {
  const m = $('map'), op = 1 - ez(cl(t, TM - .22, TM + .12));
  m.style.opacity = op; m.style.display = op <= .001 ? 'none' : 'block'; if (op <= .001) return;
  const v = mapView(t); $('msv').setAttribute('viewBox', `${v.x0} ${v.y0} ${v.wd} ${v.hd}`);
  const sc = p => [(p[0] - v.x0) / v.wd * 1080, (p[1] - v.y0) / v.hd * 1920];
  const a = sc(AUSC), i = sc(ISL), la = 1 - ez(cl(t, .7, 1.1)), pin = 1;
  $('mlab').innerHTML = (la > .01 ? `<div class="lbl" style="left:${a[0]}px;top:${a[1]}px;transform:translate(-50%,-50%) scale(${la});font-size:74px;color:${OL};text-shadow:0 0 0 #0000">AUSTRALIEN</div>` : '') +
    `<div style="position:absolute;left:${i[0]}px;top:${i[1]}px;transform:translate(-50%,-100%) scale(${pin * (1 - ez(cl(t, TM - .45, TM - .15)))});transform-origin:50% 100%;display:flex;flex-direction:column;align-items:center">
      <div class="pill" style="position:relative;font-size:56px;color:#fff;background:#ff5d5d;text-shadow:${shadowTxt(OL, 4)}">UNSERE INSEL</div>
      <svg width="70" height="90" viewBox="0 0 70 90"><path d="M35,88 C35,88 6,52 6,32 A29,29 0 1,1 64,32 C64,52 35,88 35,88Z" fill="#ff5d5d" stroke="${OL}" stroke-width="6"/><circle cx="35" cy="32" r="11" fill="#fff"/></svg></div>`;
}

let KEYS = null;
function camAt(t) {
  const K = KEYS; let i = 0; while (i < K.length - 2 && t > K[i + 1].t) i++;
  const a = K[i], b = K[i + 1], end = b.t > 900 ? MG.TL.dur : b.t, u = ei(cl(t, a.t, end));
  // Erster Flug: weich ohne Halt
  const f = i == 1 ? ei(cl(t, a.t, end)) : i == 2 ? (1 - Math.pow(1 - cl(t, a.t, end), 2.2)) : u;
  return { pos: G.v.lerp(a.pos, b.pos, f), at: G.v.lerp(a.at, b.at, f), fov: lerp(a.fov, b.fov, f) };
}

function samPose(t) {
  const i = MG.cur(t), l = Lt(i), rt = t - l.start, lt = cl(t, l.start, l.end);
  const talk = MG_SAM.talk(t, l) * .9;
  let o = { mouth: 'smile', talk, blink: MG_SAM.blink(t), armL: [.12, .1], armR: [.12, .1], bob: 0 };
  const plant = Lt(0).end - .55;
  if (i == 0) { const u = cl(t, plant - .5, plant), d = cl(t, plant, plant + .15); o.armR = [lerp(.3, 2.5, ez(u)) - 2.1 * ez(d), lerp(.2, -.2, u)]; o.mouth = 'grin'; o.bob = 14 * Math.sin(Math.PI * cl(t, plant - .5, plant)) }
  else if (i == 1) { const u = ez(cl(rt, 0, .3)); o.armL = [lerp(.12, 1.35, u), lerp(.1, -.1, u)]; o.mouth = 'grin'; o.look = [-5 * u, 0] }
  else if (i == 2) { const wv = Math.sin(t * 9) * .35; o.armR = [2.55 + wv * .4, .25 + wv]; o.mouth = rt > 1.1 ? 'flat' : 'smile'; o.tilt = rt > 1.1 ? -.08 : 0 }
  else if (i == 3) { const u = ez(cl(rt, .2, .5)); o.armL = [lerp(.12, 1.25, u), -.15]; o.mouth = 'grin'; o.look = [-6 * u, 0] }
  else if (i == 4) { const u = ez(cl(rt, 0, .4)); o.armL = [lerp(.12, 2.6, u), .2]; o.armR = [lerp(.12, 2.6, u), .2]; o.mouth = 'grin'; o.bob = Math.max(0, Math.sin(cl(rt, .3, 1.0) * Math.PI)) * 40 }
  else if (i == 5) { o.armR = [.5, -2.85]; o.mouth = 'o'; o.look = [Math.sin(rt * 2) * 6, -2] }
  else if (i == 6) { o.armL = [1.45, -.1]; o.mouth = 'grin'; o.armR = [.3, .3]; o.look = [-6, 0] }
  else if (i == 7) { const u = ez(cl(t, wt(7, /kokos/i) - .2, wt(7, /kokos/i) + .2)); o.armL = [lerp(.12, .95, u), lerp(.1, -1.25, u)]; o.armR = [lerp(.12, .95, u), lerp(.1, -1.25, u)]; o.mouth = u > .5 ? 'flat' : 'smile'; o.look = [6, 0] }
  else if (i == 8) { const u = ez(cl(rt, .1, .4)); o.armL = [lerp(.12, 2.6, u), .2]; o.armR = [lerp(.12, 2.6, u), .2]; o.mouth = 'grin'; o.bob = Math.max(0, Math.sin(cl(rt, .6, 1.3) * Math.PI)) * 30; o.look = [5, -2] }
  else if (i == 9) { o.armR = [.45, -2.75]; o.armL = [.2, .1]; o.mouth = 'hmm'; o.look = [4, -3] }
  else { o.armR = [1.5, -.15]; o.mouth = 'grin' }
  if (t > l.end + .05) o.talk = 0;
  return o;
}
let ghostT = 0;
function samLayer(t) {

window.setTimeline = tl => { MG.TL = tl; KEYS = camKeys() };
window.draw = function (t) {
  const c = camAt(t); w.cam.pos = c.pos; w.cam.at = c.at; w.cam.fov = c.fov;
  w.shadowCenter = [c.at[0], 0, c.at[2]]; w.shadowSize = Math.min(60, 14 + Math.hypot(...G.v.sub(c.pos, c.at)) * .6);
  // Sonne im Bild (CSS) passend zur Kamera-Richtung
  const sp = w.project(G.v.lerp(c.pos, [c.pos[0] + w.sun[0] * 100, c.pos[1] + w.sun[1] * 100, c.pos[2] + w.sun[2] * 100], 1));
  $('sun').style.cssText = `left:${sp.x - 260}px;top:${Math.min(sp.y, 1100) - 260}px;opacity:${sp.vis ? 1 : 0}`;
  // Grasbueschel + kleine Blumen (eine Mesh)
(function tufts() {
  const g = new G.Geo();
  for (let k = 0; k < 2600; k++) {
    const a = G.hash(k, 1) * 6.2832, r = Math.sqrt(G.hash(k, 2)) * 17.5, x = Math.cos(a) * r, z = Math.sin(a) * r, y = iH(x, z);
    if (y < .75 || Math.hypot(x - SP0[0], z - SP0[2]) < 1.2) continue;
    const c = G.hex(G.hash(k, 3) > .5 ? '#3c8f32' : '#4fa63f'), hgt = .1 + .13 * G.hash(k, 4);
    for (let b = 0; b < 3; b++) { const q = b * 2.1 + k, dx = Math.cos(q) * .04, dz = Math.sin(q) * .04, lx = Math.cos(q) * .07, lz = Math.sin(q) * .07;
      g.tri([x - dx, y, z - dz], [x + dx, y, z + dz], [x + lx * .8, y + hgt, z + lz * .8], c) }
    if (G.hash(k, 6) > .9) g.add(G.ico(.06, 0, G.hash(k, 7) > .5 ? '#ffffff' : '#ffd84a'), G.m4.compose([x + .1, y + hgt * .8, z]));
  }
  w.mesh(g, { cast: false });
})();
// Wolken + Moewen
  clouds.forEach((m, i) => { m.pos = [m.base[0] + ((t * (1.2 + .3 * i)) % 400), m.base[1], m.base[2]] });
  gulls.forEach(({ b, wl, wr, i }) => { const a = t * (.32 + .06 * i) + i * 2.1, R = 14 + 4 * i; b.pos = [Math.cos(a) * R, 9 + 2.5 * i + Math.sin(t * 1.3 + i) * .6, Math.sin(a) * R - 2]; b.rot = [0, -a, .35]; const f = Math.sin(t * 9 + i * 2) * .55; wl.rot = [0, 0, -f]; wr.rot = [0, 0, f] });
  // Flagge
  const pl = Lt(0).end - .55, pu = cl(t, pl - .08, pl + .3);
  pole.vis = t > pl - .08; pole.scl = [1, Math.max(.01, el(pu)), 1]; pole.pos = [FX[0], FX[1] - .05, FX[2]];
  w.update(flag, flagGeo(t)); flag.scl = [1, 1, 1];
  // Schild ploppt aus dem Boden
  const st = Lt(1).start - .05, su = cl(t, st, st + .55);
  sign.vis = t > st; sign.scl = [1, Math.max(.01, el(su)), 1]; sign.pos = [SG[0], SG[1] - .3 * (1 - ez(su)), SG[2]];
  // Ziel: Hologramm-Stadt + Lichtstrahlen
  const g0 = wt(4, /ziel/i), g1 = Lt(5).start + .1, gOut = fade(t, g1 - .2, g1 + .35);
  holo.forEach(({ m, d }) => { const u = el(cl(t, g0 + .1 + d * .7, g0 + .7 + d * .7)); m.vis = t > g0 && t < g1 + .4; m.scl = [1, Math.max(.01, u), 1]; m.alpha = .72 * Math.min(1, u * 2) * gOut * (.85 + .15 * Math.sin(t * 7 + d * 9)) });
  beams.forEach((m, i) => { const u = ez(cl(t, wt(4, /reichste/i) - .1 + i * .08, wt(4, /reichste/i) + .5)); m.vis = t > g0 && t < g1 + .4; m.alpha = .16 * u * gOut; m.rot = [0, t * .2, (i - 1) * .25 + Math.sin(t * .8 + i) * .12] });
  // Bauplaetze
  PL.forEach((p, k) => { const t0 = wt(5, p.re) - .15, u = bo(cl(t, t0, t0 + .35)); p.m.vis = t > t0; p.m.scl = [Math.max(.01, u), 1, Math.max(.01, u)]; p.t0 = t0 });
  // Truhe
  const c0 = Lt(7).start - .1, cu = bo(cl(t, c0, c0 + .45)), co = wt(7, /zwanzig/i) - .25;
  chest.vis = t > c0; chest.scl = [Math.max(.01, cu), Math.max(.01, cu), Math.max(.01, cu)]; chest.pos = [CH[0], CH[1] + 3 * (1 - ez(cl(t, c0, c0 + .3))), CH[2]];
  lid.rot = [-1.9 * el(cl(t, co, co + .5)), 0, 0];
  const kt = wt(7, /kokos/i) - .1, ku = cl(t, kt, kt + .7);
  coco.pos = [.0 + .9 * ku, .4 + Math.max(0, 1.6 * Math.sin(ku * Math.PI)) * (ku < 1 ? 1 : 0) + (ku >= 1 ? -.1 + .06 : 0), .25 * ku]; coco.rot = [ku * 7, 0, ku * 4]; coco.vis = t > co;
  if (ku >= 1) coco.pos = [.9, -.06 + .2, .25];
  const ck = wt(8, /zehn/i) - .1;
  COINS.forEach(c => { c.t0 = ck + c.k * .32; c.t1 = c.t0 + .45; const u = cl(t, c.t0, c.t1); c.m.vis = u > 0 && u < 1;
    const s = [CH[0] - 1.4 + c.k * .5, CH[1] + 3.2, CH[2] + 1.6], e = [CH[0], CH[1] + .55, CH[2]];
    c.m.pos = [lerp(s[0], e[0], u), lerp(s[1], e[1], u) + Math.sin(u * Math.PI) * 1.2, lerp(s[2], e[2], u)]; c.m.rot = [1.2 + u * 6, u * 3, 0] });
  w.render(t);
  drawMap(t);
  // ---- Overlays ----
  let ov = '';
  ov += samLayer(t);
  // Labels in der Welt
  ov += labelAt([FX[0], FX[1] + 3.8, FX[2]], `<div class="pill" style="position:relative;font-size:44px;color:${OL};background:#ffd166">UNSERE INSEL</div>`, t, Lt(0).end - .2, Lt(1).start - .1, { k: 1 });
  PL.forEach(p => ov += labelAt([p.x, p.y + .2, p.z], qBubble(p.lab), t, p.t0 + .05, Lt(6).start + .45, { k: 1.35 }));
  ov += labelAt([PL[0].x, PL[0].y + .2, PL[0].z], `<div style="display:flex;flex-direction:column;align-items:center"><div class="pill" style="position:relative;font-size:46px;color:#fff;background:#35c35a;text-shadow:${shadowTxt(OL, 3)}">DEIN GRUNDSTÜCK</div><div style="width:0;height:0;border:22px solid transparent;border-top:28px solid ${OL}"></div></div>`, t, Lt(6).start + .15, Lt(7).start - .3);
  $('ov').innerHTML = ov;
  // UI oben + Untertitel
  let ui = '';
  ui += dayPill(t);
  ui += counterCard(t, wt(2, /einwohner/i) - .05, Lt(3).start + .3, 1);
  ui += profileCard(t, Lt(3).start + .2, Lt(4).start - .15);
  ui += followPill(t, wt(3, /bürger/i) - .1, Lt(4).start - .15);
  ui += goalText(t, Lt(4).start, Lt(5).start - .1);
  ui += passport(t, Lt(6).start + .05, Lt(7).start - .2);
  ui += treasury(t, Lt(7).start + .1, Lt(9).start - .15);
  ui += choiceCards(t, Lt(9).start, Lt(10).start - .1);
  ui += commentCard(t, Lt(10).start + .05);
  ui += MG.captions(t, { y: 1470, size: 84, maxWords: 3, hl: '#ffd166', upper: true, stageW: 1080 }).replace(/'Arial Black',Arial/, 'IB,Arial');
  $('ui').innerHTML = ui;
};
window.sfxEvents = function () {
  const E = [], L = Lt;
  E.push({ k: 'pop', t: .1 }, { k: 'whoosh', t: .35, d: 1.3 }, { k: 'whoosh', t: TM - .15, d: 1.2 });
  E.push({ k: 'impact', t: L(0).end - .55 });
  E.push({ k: 'pop', t: L(0).end - .2 });
  E.push({ k: 'thud', t: L(1).start }, { k: 'swish', t: L(1).start + .1, d: .5 });
  E.push({ k: 'ding', t: wt(2, /einwohner/i) });
  E.push({ k: 'swish', t: L(3).start + .2, d: .4 }, { k: 'click', t: L(3).start + 1.35 }, { k: 'pop', t: wt(3, /bürger/i) - .1 });
  E.push({ k: 'whoosh', t: L(4).start, d: 1.1 }, { k: 'shimmer', t: wt(4, /ziel/i) + .1 }, { k: 'chime', t: wt(4, /reichste/i) });
  E.push({ k: 'whoosh', t: L(5).start, d: .9 });
  PL.forEach(p => E.push({ k: 'tap', t: wt(5, p.re) - .15 }));
  E.push({ k: 'swish', t: L(6).start + .05, d: .4 }, { k: 'impact', t: wt(6, /eins/i) });
  E.push({ k: 'whoosh', t: L(7).start, d: .6 }, { k: 'thud', t: L(7).start + .2 }, { k: 'cash', t: wt(7, /zwanzig/i) }, { k: 'pop', t: wt(7, /kokos/i) });
  COINS.forEach(c => E.push({ k: 'cash', t: wt(8, /zehn/i) - .1 + c.k * .32 + .45 }));
  E.push({ k: 'pop', t: wt(8, /like/i) - .15 });
  E.push({ k: 'pop', t: wt(9, /hafen/i) - .1 }, { k: 'pop', t: wt(9, /bank/i) - .1 });
  E.push({ k: 'swish', t: L(10).start + .05, d: .4 }, { k: 'ding', t: L(10).start + 1.15 });
  return E;
};
