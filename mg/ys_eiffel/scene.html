<!doctype html><meta charset=utf-8><style>
@font-face{font-family:P;src:url(fonts/Poppins-Bold.ttf);font-weight:700}
@font-face{font-family:P;src:url(fonts/Poppins-Medium.ttf);font-weight:500}
html,body{margin:0;background:#2f86d0}
#stage{position:relative;width:1080px;height:1920px;overflow:hidden;font-family:P,Arial,sans-serif;background:radial-gradient(circle at 50% 42%,#8fd3ff 0%,#4fa6e6 48%,#2a76c0 100%)}
#pat{position:absolute;inset:-60px;opacity:.13;background-image:radial-gradient(circle,#ffffff 1.8px,transparent 2.4px);background-size:52px 52px}
#mapwrap{position:absolute;inset:0;opacity:0}
#mapsvg{position:absolute;left:0;top:0}
#mapov,#imgs,#fg{position:absolute;inset:0}
#cap{position:absolute;inset:0;z-index:60}
.land{fill:#f4f8fc;stroke:#7fb0da;stroke-width:1.2;vector-effect:non-scaling-stroke}
.st{fill:none;stroke:#a9c9e6;stroke-width:1;vector-effect:non-scaling-stroke}
</style>
<div id=stage><div id=pat></div>
 <div id=mapwrap><svg id=mapsvg width=1080 height=1920><g id=mapg></g></svg><div id=mapov></div></div>
 <div id=fg></div><div id=cap></div></div>
<script src="../lib/core.js"></script>
<script src="../lib/mapdata.js"></script>
<script>
// TikTok 9:16 – Eiffel Tower scam (Lustig 1925): Gemini objects + Paris map zoom (sky theme, YT11 style)
const {cl,ez,ei,bo,el,lerp}=MG,$=MG.$,W=1080,H=1920,CX=540,CY=860;
const C={cream:'#fff6e6',gold:'#ffc94a',green:'#3ddc84',green2:'#1fa45a',red:'#ff5b4a',red2:'#d6402e',orange:'#ff9f43',blue:'#2f86d0',ink:'#14202c',sand:'#f1d39a',sand2:'#d9b16b',water:'#3f9fe0',water2:'#2b7fc4'};
let TL=null,fontsOk=false;
const S=i=>TL.lines[i].start,E=i=>TL.lines[i].end,DU=i=>E(i)-S(i),SP=i=>TL.lines[i].spec;
const sg=(t,a,b)=>ei(cl(t,a,b));
// ---------- building blocks
function TX(x,y,txt,o={}){const p=o.p??1;if(p<=0)return'';const sz=o.size||64,s=o.s??1;
 return `<div style="position:absolute;left:${x}px;top:${y}px;transform:translate(-50%,-50%) translateY(${((1-Math.min(1,p))*22).toFixed(1)}px) scale(${s.toFixed(3)}) rotate(${o.rot||0}deg);opacity:${Math.min(1,p).toFixed(3)};font:700 ${sz}px/1.05 P,Arial;color:${o.col||C.cream};white-space:nowrap;text-align:center;text-shadow:${MG.outline(o.ol||Math.max(3,Math.round(sz/13)))},0 ${sz/9}px ${sz/3}px #0a2a5099">${txt}</div>`}
function pill(x,y,txt,o={}){const p=o.p??1;if(p<=0)return'';const sz=o.size||36,s=bo(Math.min(1,p))*(o.s??1);
 const dot=o.dot?`<span style="display:inline-block;width:${sz*.62}px;height:${sz*.62}px;border-radius:50%;background:${o.dot};margin-right:${sz*.3}px;vertical-align:-${sz*.06}px"></span>`:'';
 return `<div style="position:absolute;left:${x}px;top:${y}px;transform:translate(-50%,-50%) scale(${s.toFixed(3)});opacity:${Math.min(1,p*2).toFixed(3)};padding:${sz*.34}px ${sz*.7}px;border-radius:${sz*1.2}px;background:${o.bg||'#ffffffee'};color:${o.fg||C.ink};font:700 ${sz}px/1.1 P,Arial;white-space:nowrap;box-shadow:0 10px 26px #0a2a5066">${dot}${txt}</div>`}
function card(x,y,w,inner,p,o={}){if(p<=0)return'';const s=bo(Math.min(1,p));
 return `<div style="position:absolute;left:${x-w/2}px;top:${y}px;width:${w}px;box-sizing:border-box;transform:scale(${s.toFixed(3)}) rotate(${o.rot||0}deg);transform-origin:50% 0;opacity:${Math.min(1,p*2).toFixed(3)};padding:${o.pad||'20px 30px'};border-radius:30px;background:${o.bg||'#ffffffee'};box-shadow:0 22px 46px #0a2a5066;color:${C.ink};text-align:${o.align||'center'}">${inner}</div>`}
function stamp(x,y,txt,p,col=C.red,rot=-8,sz=70){if(p<=0)return'';const s=lerp(2.2,1,ez(Math.min(1,p)));return `<div style="position:absolute;left:${x}px;top:${y}px;transform:translate(-50%,-50%) rotate(${rot}deg) scale(${s.toFixed(3)});opacity:${Math.min(1,p*2.5).toFixed(3)};padding:10px 30px;border:8px solid ${col};border-radius:18px;color:${col};font:700 ${sz}px/1 P;letter-spacing:3px;background:#ffffffdd;white-space:nowrap">${txt}</div>`}
// ---------- art
const IM=k=>`img/${k}.png`;
function obj(k,x,y,w,o={}){const op=o.op??1;if(op<=0.001||w<=1)return'';const ax=o.ax??.5,ay=o.ay??.5;return `<img src="${IM(k)}" style="position:absolute;left:0;top:0;width:${w.toFixed(1)}px;transform:translate(${(x-w*ax).toFixed(1)}px,${(y-w*ay).toFixed(1)}px) rotate(${(o.rot||0).toFixed(2)}deg) scale(${(o.sx||1).toFixed(3)},${(o.sy||1).toFixed(3)});transform-origin:${ax*100}% ${ay*100}%;opacity:${op.toFixed(3)};${o.clip?`clip-path:inset(0 0 ${o.clip.toFixed(1)}% 0);`:''}filter:drop-shadow(0 ${(w/26).toFixed(0)}px ${(w/18).toFixed(0)}px #0a2a5055)">`}
const fl=(t,i,a=10)=>Math.sin(t*2.1+i*1.7)*a;
const GY=1420; // ground line
function skyBG(t){let h=`<div style="position:absolute;inset:0;background:linear-gradient(#5db6f5 0%,#9fd8ff 62%,#d8f0ff 73.9%,#cfd6dd 74%,#b9c3cf 100%)"></div>`;
 // drifting clouds (whole cycles over TL.dur -> seamless loop)
 const u=t/TL.dur;for(let i=0;i<4;i++){const x=((MG.rnd(i+3)*1400+u*1400*(i%2?1:2))%1400)-200,y=160+i*190+MG.rnd(i+9)*60,w=200+MG.rnd(i+5)*140;
  h+=`<div style="position:absolute;left:${x.toFixed(0)}px;top:${y.toFixed(0)}px;width:${w.toFixed(0)}px;height:${(w*.32).toFixed(0)}px;border-radius:${w}px;background:#ffffff;opacity:.55;box-shadow:${(w*.25).toFixed(0)}px ${(-w*.1).toFixed(0)}px 0 ${(-w*.04).toFixed(0)}px #ffffff"></div>`}
 // Paris rooftops silhouette
 for(let i=0;i<10;i++){const w=90+MG.rnd(i+40)*60,hh=50+MG.rnd(i+50)*80,x=i*115-30;h+=`<div style="position:absolute;left:${x}px;top:${GY-hh}px;width:${w}px;height:${hh}px;background:#b7d3ea;border-radius:8px 8px 0 0"></div>`}
 return h}
function sam(k,x,y,w,o={}){return obj(k,x,y,w,o)}
function hookTitle(){return TX(540,175,'WHY YOU SHOULD NEVER BUY',{size:58})+TX(540,285,"SOMETHING THAT'S",{size:84})+TX(540,400,'TOO GOOD',{size:120,col:C.gold})+TX(540,515,'TO BE TRUE',{size:98,col:C.red})}
function tag(x,y,p,t){if(p<=0)return'';const sw=Math.sin(t*3)*6;return `<div style="position:absolute;left:${x}px;top:${y}px;transform:translate(-50%,0) rotate(${(sw+(1-ez(Math.min(1,p)))*-40).toFixed(1)}deg) scale(${bo(Math.min(1,p)).toFixed(3)});transform-origin:50% -60px;opacity:${Math.min(1,p*2).toFixed(2)}"><div style="position:absolute;left:50%;top:-60px;width:4px;height:60px;background:#14202c"></div><div style="padding:16px 34px;border-radius:16px;background:${C.gold};color:${C.ink};font:700 58px P;border:5px solid #14202c;box-shadow:0 14px 30px #0a2a5055;white-space:nowrap">FOR SALE</div></div>`}
function cashArc(t,x0,y0,x1,y1,a,step,n=4,w=170){let h='';for(let i=0;i<n;i++){const q=ei(cl(t,a+i*step,a+i*step+.45));if(q<=0)continue;h+=obj('cash',lerp(x0,x1,q),lerp(y0,y1,q)-Math.sin(q*Math.PI)*260,w,{rot:lerp(-12,8,q)+i*3,op:q>=1?.0:1})}return h}
// ---------- MAP (Europe -> Paris)
let mapBuilt=false;
function buildMap(){let h='';for(const k in WORLD)h+=`<path id="c_${k}" class=land d="${WORLD[k]}"/>`;$('mapg').innerHTML=h;mapBuilt=true}
function camOf(c){const [x,y]=MAPP(c[0],c[1]);return {x,y,z:c[2]}}
function scr(cam,lon,lat){const [x,y]=MAPP(lon,lat),s=.96*cam.z;return [CX+(x-cam.x)*s,CY+(y-cam.y)*s]}
function mapVis(t){let v=0;const N=TL.lines.length;for(let k=0;k<N;k++){if(SP(k).type!=='map')continue;const a=S(k)-.22,b=k+1<N?S(k+1)+.22:TL.dur+1;v=Math.max(v,cl(t,a,a+.25)*(1-cl(t,b-.25,b)))}return v}
function drawMap(t){const v=mapVis(t);$('mapwrap').style.opacity=v.toFixed(3);if(v<=0){if($('mapov')._h){$('mapov').innerHTML='';$('mapov')._h=''}return}
 if(!mapBuilt)buildMap();let j=0;TL.lines.forEach((l,k)=>{if(SP(k).type==='map')j=k});const a=S(j),D=DU(j);
 const c1=camOf([10,50,2.2]),c2=camOf([2.35,48.2,9]),q0=sg(t,a-.25,a+.4),q=sg(t,a+D*.05,a+D*.4);
 let c={x:c1.x,y:c1.y,z:Math.exp(lerp(Math.log(c1.z*.6),Math.log(c1.z),q0))};c={x:lerp(c.x,c2.x,q),y:lerp(c.y,c2.y,q),z:Math.exp(lerp(Math.log(c.z),Math.log(c2.z),q))};const s=.96*c.z;
 $('mapg').setAttribute('transform',`translate(${(CX-c.x*s).toFixed(2)},${(CY-c.y*s).toFixed(2)}) scale(${s.toFixed(4)})`);
 const on=t>a+D*.25;if($('mapg')._fr!==on){const f=$('c_FRA');if(f){f.style.fill=on?'#ffe8a8':'';f.style.stroke=on?'#e0a020':'';f.style.strokeWidth=on?3:''}$('mapg')._fr=on}
 let ov='';const [px,py]=scr(c,2.35,48.86);const pq=cl(t,a+D*.3,a+D*.45);
 if(pq>0){ov+=obj('eiffel',px,py+8,lerp(0,230,el(pq)),{ax:.5,ay:.93});ov+=`<div style="position:absolute;left:${px-19}px;top:${py-19}px;width:38px;height:38px;border-radius:50%;background:${C.red};border:7px solid #fff;box-sizing:border-box;transform:scale(${bo(pq).toFixed(3)});box-shadow:0 0 0 ${(12+9*Math.sin(t*6)).toFixed(1)}px #ff5b4a44"></div>`;
  ov+=pill(px+150,py+50,'Paris 🇫🇷',{p:cl(t,a+D*.36,a+D*.5),size:40,dot:C.red})}
 ov+=TX(540,220,'1925',{size:170,col:C.gold,p:cl(t,a,a+.25)});
 // con man card slides up
 const cq=cl(t,a+D*.5,a+D*.68);if(cq>0){ov+=obj('conman',300,1150+fl(t,2,5),lerp(0,560,el(cq)));
  ov+=pill(350,800,'con man VICTOR LUSTIG',{p:cl(t,a+D*.55,a+D*.68),size:40,bg:C.ink,fg:'#fff'});
  ov+=obj('contract',790,1100+fl(t,3,6),lerp(0,330,el(cl(t,a+D*.68,a+D*.82))),{rot:6});
  ov+=stamp(790,1200,'FAKE OFFICIAL',cl(t,a+D*.8,a+D*.92),C.red,-8,52)}
 if(ov!==$('mapov')._h){$('mapov').innerHTML=ov;$('mapov')._h=ov}}
// ---------- scenes
const ANIM={
 hero(t,k){const sp=SP(k),a=S(k),D=DU(k);let h=skyBG(t);
  h+=obj('eiffel',640,GY+20,860,{ax:.5,ay:.97});
  h+=sam('samthink',200,1300+fl(t,5,5),440);
  if(k===0){const q=1-cl(t,a+D*.5,a+D*.6);if(q>0)h+=`<div style="opacity:${q.toFixed(3)}">${hookTitle()}</div>`;
   const c=cl(t,a+D*.58,a+D*.7);if(c>0){h+=TX(540,210,'SOMEONE BOUGHT',{size:84,p:c})+TX(540,330,'THE EIFFEL TOWER',{size:96,col:C.gold,p:cl(t,a+D*.62,a+D*.74)});
    h+=tag(830,820,cl(t,a+D*.66,a+D*.8),t);h+=stamp(640,1060,'SOLD',cl(t,a+D*.82,a+D*.92),C.red,-10,130)}}
  if(sp.choice){const end=TL.dur,out=1-cl(t,end-.6,end-.2);
   h+=`<div style="opacity:${out.toFixed(3)}">`+TX(540,220,'WOULD YOU BUY IT?',{size:84,p:cl(t,a+.05,a+.3)})+pill(540,390,'🗼 TAKE MY MONEY',{p:cl(t,a+D*.15,a+D*.3),size:54,bg:C.green2,fg:'#fff'})+pill(540,530,'🚩 TOO GOOD TO BE TRUE',{p:cl(t,a+D*.35,a+D*.5),size:50,bg:'#fff'})+`</div>`;
   const tin=cl(t,end-.5,end-.06);if(tin>0)h+=`<div style="opacity:${tin.toFixed(3)}">${hookTitle()}</div>`}
  return h},
 iron(t,k){const a=S(k),D=DU(k);let h=skyBG(t);const sink=sg(t,a+D*.28,a+D*.7),sh=sink>0&&sink<1?Math.sin(t*45)*8:0;
  h+=pill(540,210,'“It will be torn down!”',{p:cl(t,a,a+.25),size:54});
  // tower sinks into the ground while the scrap pile grows
  h+=obj('eiffel',640+sh,GY+20+sink*620,860,{ax:.5,ay:.97,op:1-cl(sink,.85,1),clip:0});
  h+=`<div style="position:absolute;left:0;top:${GY+40}px;width:1080px;height:600px;background:linear-gradient(#cfd6dd,#b9c3cf)"></div>`;
  const pq=sg(t,a+D*.4,a+D*.75);h+=obj('scrap',640,GY+60,lerp(0,640,el(pq)),{ax:.5,ay:.9});
  // dust puffs
  for(let i=0;i<6;i++){const d=cl(t,a+D*.3+i*.08,a+D*.3+i*.08+.7);if(d<=0||d>=1)continue;h+=`<div style="position:absolute;left:${(640+(i-2.5)*120*(.5+d)).toFixed(0)}px;top:${(GY-20-d*80).toFixed(0)}px;width:${(90+d*120).toFixed(0)}px;height:${(90+d*120).toFixed(0)}px;transform:translate(-50%,-50%);border-radius:50%;background:#ffffff;opacity:${(.7*(1-d)).toFixed(2)}"></div>`}
  const q=sg(t,a+D*.45,a+D*.9);if(q>0.01){h+=TX(540,360,MG.fmt(Math.round(7300*q),0)+' TONS',{size:130,col:C.gold,p:cl(t,a+D*.45,a+D*.55)});h+=pill(540,490,'of iron → scrap 💰',{p:cl(t,a+D*.55,a+D*.65),size:46,bg:'#d9843f',fg:'#fff'})}
  h+=sam('conman',190,1240+fl(t,2,5),480);return h},
 bribe(t,k){const a=S(k),D=DU(k);let h=skyBG(t);
  h+=sam('samhappy',250,1200+fl(t,4,5),500);h+=pill(250,850,'scrap dealer',{p:cl(t,a,a+.2),size:40,bg:'#fff',dot:C.green});
  h+=sam('conman',820,1170+fl(t,1,5),560);
  h+=cashArc(t,330,1150,660,1350,a+.05,D*.13);
  const n=Math.min(4,Math.floor(cl(t,a+.05,a+.05+3*D*.13+.45)*4.01));for(let i=0;i<n;i++)h+=obj('cash',650+(i%2)*40,1360-i*28,160,{rot:i*4-6});
  h+=TX(540,230,'💰 PAID',{size:130,col:C.green,p:cl(t,a,a+.25)});
  h+=pill(540,400,'+ a secret bribe 🤫',{p:cl(t,a+D*.6,a+D*.75),size:56,bg:C.gold});return h},
 vanish(t,k){const a=S(k),D=DU(k);let h=skyBG(t);const q=ei(cl(t,a+D*.25,a+D*.8));
  if(q>0)for(let i=0;i<8;i++){const y=900+i*60,ln=200+MG.rnd(i+60)*300;h+=`<div style="position:absolute;left:${(lerp(820,1300,q)-ln-160).toFixed(0)}px;top:${y}px;width:${ln.toFixed(0)}px;height:12px;border-radius:6px;background:#fff;opacity:${(.8*Math.sin(q*Math.PI)).toFixed(2)}"></div>`}
  h+=sam('conman',lerp(820,1500,q),1170,560,{rot:q*10});
  for(let i=0;i<4;i++)h+=obj('cash',lerp(650,1460,cl(q*1.3-.15,0,1))+(i%2)*40,1360-i*28,160,{rot:i*4-6});
  h+=sam('samsad',250,1200+fl(t,4,5),500);
  h+=TX(540,230,'VANISHED',{size:130,p:cl(t,a,a+.25)});
  h+=stamp(560,560,'GONE',cl(t,a+D*.68,a+D*.82),C.red,-8,150);return h},
 shame(t,k){const a=S(k),D=DU(k);let h=skyBG(t);
  h+=sam('samsad',300,1190+fl(t,4,5),520);
  h+=pill(540,210,'🚓 Call the police?',{p:cl(t,a,a+.2),size:58});
  h+=stamp(540,360,'TOO EMBARRASSED',cl(t,a+D*.25,a+D*.38),C.red,-5,62);
  const r=el(cl(t,a+D*.55,a+D*.78));h+=sam('conman',820,1170+fl(t,1,5),560*r);
  h+=TX(540,560,'ROUND 2',{size:140,col:C.gold,p:cl(t,a+D*.6,a+D*.72)});
  h+=obj('eiffel',870,820,lerp(0,300,el(cl(t,a+D*.66,a+D*.84))),{ax:.5,ay:.95});return h}
};
function fgLayer(t){let h='';const N=TL.lines.length;
 for(let k=0;k<N;k++){const ty=SP(k).type;if(!ANIM[ty])continue;const a=k===0?-1:S(k)-.22,b=k+1<N?S(k+1)+.22:TL.dur+1;if(t<a||t>b)continue;const op=cl(t,a,a+.25)*(1-cl(t,b-.25,b));if(op<=0)continue;
  h+=`<div style="position:absolute;inset:0;opacity:${op.toFixed(3)};transform:scale(${(1+.03*(1-op)).toFixed(4)})">${ANIM[ty](t,k)}</div>`}
 return h}
function draw(t){if(!TL)return;drawMap(t);
 const fh=fgLayer(t);if(fh!==$('fg')._h){$('fg').innerHTML=fh;$('fg')._h=fh}
 $('pat').style.transform=`translateY(${(-(t/TL.dur*52*8)%52).toFixed(1)}px)`;
 const c=t>=TL.lines[TL.lines.length-1].end-.02?'':MG.captions(t,{y:1570,size:66,maxWords:3,stageW:1080,w:940,upper:true});if(c!==$('cap')._h){$('cap').innerHTML=c;$('cap')._h=c}
 MG.grainTick(t)}
let imgReady=false;
window.setTimeline=tl=>{MG.TL=TL=tl;MG.preload(['samthink','samhappy','samsad','cash','contract','eiffel','conman','scrap'].map(IM));Promise.all([document.fonts.load('700 50px P'),document.fonts.load('500 50px P')]).then(()=>{fontsOk=true},()=>{fontsOk=true})};
Object.defineProperty(window,'ready',{configurable:true,get(){return imgReady&&fontsOk},set(v){imgReady=v}});
window.sfxEvents=()=>{const ev=[],N=TL.lines.length,add=(k,t,o={})=>ev.push(Object.assign({k,t:+t.toFixed(3)},o));
 for(let i=1;i<N;i++)add(i%2?'whoosh':'swish',S(i)-.2,{d:.5});
 for(let k=0;k<N;k++){const sp=SP(k),ty=sp.type,a=S(k),d=DU(k);
  if(ty==='hero'&&k===0){add('impact',a+.05);add('pop',a+d*.66);add('impact',a+d*.84)}
  if(ty==='hero'&&sp.choice){add('pop',a+d*.17);add('pop',a+d*.37)}
  if(ty==='map'){add('ding',a+.05);add('pop',a+d*.32);add('pop',a+d*.52);add('pop',a+d*.7);add('impact',a+d*.82)}
  if(ty==='iron'){add('thud',a+d*.3);add('impact',a+d*.45);add('thud',a+d*.6);add('cash',a+d*.9)}
  if(ty==='bribe'){for(let i=0;i<4;i++)add('swish',a+.1+i*d*.13,{d:.3});add('cash',a+d*.62)}
  if(ty==='vanish'){add('whoosh',a+d*.28,{d:.6});add('impact',a+d*.7)}
  if(ty==='shame'){add('pop',a+.05);add('impact',a+d*.3);add('ding',a+d*.62)}}
 ev.sort((a,b)=>a.t-b.t);const out=[];for(const e of ev){if(e.t<0)e.t=0;if(!out.find(o=>o.k==e.k&&Math.abs(o.t-e.t)<.12))out.push(e)}return out};
window.draw=draw;
MG.finish($('stage'),1080,1920,.04,'#0a2a5022',65);
</script>
