<!doctype html><meta charset=utf-8><style>
html,body{margin:0;background:#05070f}
#stage{position:relative;width:1080px;height:1920px;overflow:hidden;background:radial-gradient(120% 80% at 50% 30%,#1c2142,#0b0f22 55%,#04060d)}
#glow{position:absolute;left:-300px;top:-200px;width:1680px;height:1700px;border-radius:50%}
.sc{position:absolute;left:0;top:0;width:1080px;height:1320px;display:none;transform-origin:540px 700px;-webkit-mask-image:linear-gradient(#000 0,#000 1150px,transparent 1310px);mask-image:linear-gradient(#000 0,#000 1150px,transparent 1310px)}
.sc>svg{position:absolute;left:0;top:0}
#intro{position:absolute;left:0;top:0;width:1080px;height:1920px}
.p3{position:absolute;left:0;top:0;width:1080px;height:1320px;overflow:hidden}
.w3{position:absolute;left:0;top:0;width:0;height:0;transform-style:preserve-3d}
.f{position:absolute;backface-visibility:hidden}
#flash{position:absolute;inset:0;background:radial-gradient(circle at 50% 45%,#fff,#ffe9b0 40%,#c07a10 85%);opacity:0;z-index:60;pointer-events:none}
#hook,#cap{position:absolute;left:0;top:0;width:1080px;height:1920px;z-index:95;pointer-events:none}
</style>
<div id=stage>
<div id=glow></div>
<svg id=intro width=1080 height=1920 viewBox="0 0 1080 1920"></svg>
<div id=scenes></div>
<div id=flash></div>
<div id=hook></div><div id=cap></div>
<svg width=0 height=0 style="position:absolute"><defs>
<filter id=gl x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="9" result=b /><feMerge><feMergeNode in=b /><feMergeNode in=SourceGraphic /></feMerge></filter>
<filter id=sh x="-30%" y="-30%" width="160%" height="170%"><feDropShadow dx=0 dy=16 stdDeviation=16 flood-color="#000" flood-opacity=".55"/></filter>
<linearGradient id=gold x1=0 y1=0 x2=1 y2=1><stop offset=0 stop-color="#ffe9a0"/><stop offset=.55 stop-color="#f5b630"/><stop offset=1 stop-color="#d98a12"/></linearGradient>
<linearGradient id=bill x1=0 y1=0 x2=1 y2=1><stop offset=0 stop-color="#d9f2d0"/><stop offset=.5 stop-color="#a9d6a0"/><stop offset=1 stop-color="#7fb878"/></linearGradient>
<linearGradient id=chrome x1=0 y1=0 x2=0 y2=1><stop offset=0 stop-color="#eef2f8"/><stop offset=.5 stop-color="#9aa4b8"/><stop offset=1 stop-color="#5d6678"/></linearGradient>
<linearGradient id=floor x1=0 y1=0 x2=0 y2=1><stop offset=0 stop-color="#3a3f55"/><stop offset=1 stop-color="#141826"/></linearGradient>
<linearGradient id=panel x1=0 y1=0 x2=0 y2=1><stop offset=0 stop-color="#1d2640"/><stop offset=1 stop-color="#111829"/></linearGradient>
<linearGradient id=wood x1=0 y1=0 x2=0 y2=1><stop offset=0 stop-color="#9a6a42"/><stop offset=1 stop-color="#6b4527"/></linearGradient>
<linearGradient id=marble x1=0 y1=0 x2=0 y2=1><stop offset=0 stop-color="#e9edf5"/><stop offset=1 stop-color="#aab3c6"/></linearGradient>
<radialGradient id=warm cx=.5 cy=.5 r=.5><stop offset=0 stop-color="#fff2c8" stop-opacity=".55"/><stop offset=1 stop-color="#fff2c8" stop-opacity="0"/></radialGradient>
</defs></svg>
</div>
<script src="../lib/core.js"></script>
<script>
const {cl,ez,ei,bo,lerp,$}=MG;
const F="Arial,Helvetica,sans-serif",FB="'Arial Black',Arial,Helvetica,sans-serif";
const T=(x,y,s,size,col,o={})=>`<text x="${x}" y="${y}" font-size="${size}" font-weight="${o.w||900}" fill="${col}" text-anchor="${o.a||'middle'}" font-family="${o.f||F}" ${o.ls?`letter-spacing="${o.ls}"`:''} ${o.op!=null?`opacity="${o.op}"`:''}>${s}</text>`;
const st=k=>MG.L(k).start, en=k=>MG.L(k).end;
function wt(k,w,fb=.5){const l=MG.L(k);if(l.words)for(const x of l.words){if(x[0].toLowerCase().replace(/[^a-z0-9']/g,'').startsWith(w))return l.start+x[1]}return l.start+fb}
function header(lt,label,big,col,o={}){
 const p1=ez(cl(lt,-.15,.35)),p2=bo(cl(lt,0,.55)),sz=o.size||150;
 let s=`<g opacity="${p1}" transform="translate(0,${(1-p1)*-20})">${T(540,o.ly||170,label,44,'#aab8de',{w:800,ls:6})}</g>`;
 if(big!=null)s+=`<g transform="translate(540,${o.by||320}) scale(${.6+.4*p2})" opacity="${cl(lt,0,.2)}" filter="url(#gl)">${T(0,0,big,sz,col,{f:FB})}</g>`;
 return s}
// ---- shared drawings ----
function billSVG(v,o={}){ // centred 400x180 bill
 const g=o.grey||0;
 return `<g><rect x=-200 y=-90 width=400 height=180 rx=12 fill="url(#bill)" stroke="#3d6b3a" stroke-width=5 ${g?`opacity="${1-g*.5}"`:''}/><rect x=-182 y=-72 width=364 height=144 rx=8 fill=none stroke="#3d6b3a" stroke-width=3 opacity=".7"/><ellipse cx=0 cy=0 rx=58 ry=66 fill="#c9e7c0" stroke="#3d6b3a" stroke-width=4 /><path d="M0,-34 L10,-8 L38,-8 L15,8 L24,36 L0,19 L-24,36 L-15,8 L-38,-8 L-10,-8 Z" fill="#3d6b3a" opacity=".8"/>${T(-140,-30,v,40,'#2b5a2a',{f:FB})}${T(140,58,v,40,'#2b5a2a',{f:FB})}${T(-120,52,'DOLLARS',22,'#2b5a2a',{w:800,ls:2})}</g>`}
function tag(x,y,txt,col,flip,newTxt,s=1){ // hanging price tag, flip 0..1 flips up around top hinge
 const c=Math.cos(Math.PI*flip),show=flip<.5?txt:newTxt,sy=Math.max(.04,Math.abs(c));
 return `<g transform="translate(${x},${y}) scale(${s})"><line x1=0 y1=-34 x2=0 y2=0 stroke="#d8dce6" stroke-width=3 /><g transform="scale(1,${sy})"><path d="M-46,0 L46,0 L46,60 L-46,60 Z" fill="${flip<.5?'#fff8e6':col}" stroke="#0b1020" stroke-width=3 /><circle cx=0 cy=10 r=5 fill="#0b1020"/>${T(0,48,show,30,flip<.5?'#0b1020':'#0b1020',{f:FB})}</g></g>`}
// grocery item drawings (centred at bottom)
const ITEMS={
 cereal:`<rect x=-50 y=-170 width=100 height=170 rx=6 fill="#ff8a3d"/><rect x=-50 y=-170 width=100 height=40 fill="#ffd166"/><circle cx=0 cy=-80 r=28 fill="#fff3d6"/><circle cx=-8 cy=-86 r=7 fill="#e0a040"/><circle cx=9 cy=-74 r=7 fill="#e0a040"/>`,
 milk:`<path d="M-38,-150 L-38,0 L38,0 L38,-150 L20,-185 L-20,-185 Z" fill="#f4f6fb"/><rect x=-38 y=-110 width=76 height=50 fill="#60a5fa"/><rect x=-20 y=-198 width=40 height=14 fill="#dfe6f2"/>`,
 bread:`<path d="M-80,0 L-80,-60 Q-80,-110 -30,-110 Q0,-130 30,-110 Q80,-110 80,-60 L80,0 Z" fill="#d9954a"/><path d="M-40,-95 L-30,-60 M0,-108 L4,-66 M40,-95 L32,-60" stroke="#a86a2a" stroke-width=7 stroke-linecap=round />`,
 apples:`<circle cx=-28 cy=-30 r=30 fill="#e2463a"/><circle cx=26 cy=-32 r=30 fill="#c9302c"/><circle cx=0 cy=-72 r=30 fill="#ef5a48"/><path d="M0,-102 L4,-116" stroke="#5a3418" stroke-width=5 /><ellipse cx=12 cy=-112 rx=10 ry=5 fill="#46b363"/>`,
 bananas:`<path d="M-70,-40 Q0,30 70,-50 Q60,-20 0,-10 Q-50,-10 -70,-40 Z" fill="#ffd84a"/><path d="M-66,-60 Q0,10 66,-70 Q56,-38 0,-28 Q-46,-28 -66,-60 Z" fill="#ffe36e"/>`
};
// cart: basket top-left (x0,y0) width 520, height 300 ; returns {back,front}
function cart(wa){
 const back=`<path d="M-270,-330 L270,-330 L230,-40 L-220,-40 Z" fill="#0b1020" opacity=".35"/>`;
 let mesh='';for(let i=0;i<=10;i++){const u=i/10;mesh+=`<line x1=${lerp(-270,270,u)} y1=-330 x2=${lerp(-220,230,u)} y2=-40 stroke="url(#chrome)" stroke-width=5 />`}
 for(let j=0;j<=5;j++){const v=j/5;mesh+=`<line x1=${lerp(-270,-220,v)} y1=${lerp(-330,-40,v)} x2=${lerp(270,230,v)} y2=${lerp(-330,-40,v)} stroke="url(#chrome)" stroke-width=${j==0?12:5} />`}
 const wheel=(x)=>`<g transform="translate(${x},70)"><circle r=34 fill="#141826" stroke="#5d6678" stroke-width=8 /><g transform="rotate(${wa})"><line x1=-24 y1=0 x2=24 y2=0 stroke="#9aa4b8" stroke-width=6 /><line x1=0 y1=-24 x2=0 y2=24 stroke="#9aa4b8" stroke-width=6 /></g></g>`;
 const front=`<g opacity=".95">${mesh}</g><path d="M-220,-40 L-200,30 L220,30 L230,-40" stroke="url(#chrome)" stroke-width=10 fill=none /><path d="M270,-330 L330,-400 L400,-400" stroke="url(#chrome)" stroke-width=14 fill=none stroke-linecap=round /><rect x=380 y=-414 width=70 height=28 rx=14 fill="#ff5d5d"/>${wheel(-170)}${wheel(170)}`;
 return {back,front}}
// ---- intro: supermarket aisle + cart ----
function aisle(par){
 let h=`<rect width=1080 height=1320 fill="#1a1e30"/><path d="M0,1320 L380,820 L700,820 L1080,1320 Z" fill="url(#floor)"/>`;
 h+=`<path d="M380,520 L700,520 L700,820 L380,820 Z" fill="#232a44"/>`;
 // ceiling lights
 for(let i=0;i<5;i++){const u=i/5,y=lerp(60,500,Math.pow(u,.6)),w=lerp(300,60,Math.pow(u,.6));h+=`<rect x=${540-w/2} y=${y} width=${w} height=${lerp(26,6,u)} rx=6 fill="#fff6d8" opacity="${.9-u*.5}"/>`}
 h+=`<ellipse cx=540 cy=1050 rx=420 ry=120 fill="url(#warm)"/>`;
 const COLS=['#ff5d5d','#60a5fa','#ffd166','#35e08a','#f472b6','#ff8a3d','#8b7cf6','#e8ecf5'];
 [0,1].forEach(side=>{const sx=side?-1:1,ox=side?1080:0;
  const P=(u,v)=>{const x=lerp(0,380,u),yt=lerp(170,520,u),yb=lerp(1320,820,u);return [ox+sx*(x+par*(1-u)*(side?-1:1)),lerp(yt,yb,v)]};
  const a=P(0,0),b=P(1,0),c=P(1,1),d=P(0,1);h+=`<path d="M${a} L${b} L${c} L${d} Z" fill="#2a3150"/>`;
  for(let r=0;r<5;r++){const v=.12+r*.19;
   // products
   for(let k=0;k<14;k++){const u0=Math.pow(k/14,.75),u1=Math.pow((k+.8)/14,.75);const hh=.13+.03*MG.rnd(k*7+r+side*50);const p0=P(u0,v),p1=P(u1,v),p2=P(u1,v-hh),p3=P(u0,v-hh);
    h+=`<path d="M${p0} L${p1} L${p2} L${p3} Z" fill="${COLS[Math.floor(MG.rnd(k*13+r*5+side*31)*8)]}" opacity="${.85-u0*.4}"/>`}
   const s0=P(0,v),s1=P(1,v),s2=P(1,v+.025),s3=P(0,v+.025);h+=`<path d="M${s0} L${s1} L${s2} L${s3} Z" fill="#c9cfdc"/>`}
 });
 h+=`<rect width=1080 height=1320 fill="#05070f" opacity=".35"/>`;
 return h}
const INTRO_ITEMS=[['cereal',-150,-250,2],['milk',-30,-232,3],['bread',100,-215,2],['apples',210,-205,4],['bananas',30,-150,1]];
function drawIntro(t){
 const end=st(2)-.3;if(t>end+.6){$('intro').style.display='none';return}$('intro').style.display='block';
 const L1=st(1);
 const arr=ei(cl(t,0,2.0)),cx=lerp(-420,540,arr),wa=(cx-540)/34*57.3;
 const push=ei(cl(t,.5,end)),cs=lerp(1.3,1.45,push),cy=lerp(1130,1110,push);
 let h=`<g transform="translate(540,700) scale(${lerp(1,1.12,push)}) translate(-540,-700)">${aisle(lerp(-60,40,arr))}</g>`;
 h+=`<g transform="translate(${cx},${cy}) scale(${cs})"><ellipse cx=0 cy=110 rx=360 ry=30 fill="#000" opacity=".5"/>`;
 const c=cart(wa);h+=c.back;
 const fp=cl(t,L1+.3,L1+2.6);
 INTRO_ITEMS.forEach((it,i)=>{const q=bo(cl(t,1.3+i*.16,1.75+i*.16));if(q<=0)return;const dropY=(1-ez(cl(t,1.3+i*.16,1.6+i*.16)))*-260;
  h+=`<g transform="translate(${it[1]},${it[2]+120+dropY}) scale(${q})">${ITEMS[it[0]]}</g>`});
 h+=c.front;
 INTRO_ITEMS.forEach((it,i)=>{const q=bo(cl(t,1.9+i*.12,2.3+i*.12));if(q<=0)return;const f=cl(fp,i*.12,i*.12+.35);
  h+=tag([-200,-75,50,175,300][i],-430,'$'+it[3],'#ffd166',f,'$'+(it[3]*1.7).toFixed(2),q*.95)});
 // the $100 bill rides in the child seat, shrinks during line 1
 const bq=bo(cl(t,2.3,2.8)),sh=ei(cl(t,L1+.4,L1+2.4)),bs=lerp(1,.59,sh);
 if(bq>0)h+=`<g transform="translate(0,${-110+lerp(0,20,sh)}) rotate(${-6+2*Math.sin(t*1.7)}) scale(${bq*.62*bs})" filter="url(#sh)">${billSVG('100',{grey:sh})}</g>`;
 h+='</g>';
 // year odometer
 const yq=bo(cl(t,2.0,2.5)),yp=ei(cl(t,L1+.1,L1+2.2)),yr=lerp(2006,2026,yp);
 if(yq>0){h+=`<g transform="translate(880,1290) scale(${yq*.8})" filter="url(#sh)"><rect x=-150 y=-62 width=300 height=124 rx=20 fill="#0b1020ee" stroke="#ffd166" stroke-width=4 /><clipPath id=yc><rect x=-130 y=-48 width=260 height=96 /></clipPath><g clip-path="url(#yc)">${T(-58,30,'20',84,'#ffd166',{f:"'Courier New',monospace"})}`;
  const dd=(yr-2006)/10,i0=Math.floor(dd);[i0,i0+1].forEach(dv=>{h+=T(32,30+(dv-dd)*90,dv%10,84,'#ffd166',{f:"'Courier New',monospace"})});
  h+=T(90,30,'6',84,'#ffd166',{f:"'Courier New',monospace"})+`</g></g>`}
 // header in line 1: total price
 const hq=cl(t,L1-.2,L1+.3);
 if(hq>0){const v=lerp(100,170,ez(cl(t,L1+.3,L1+2.6)));h+=`<g opacity="${hq}">${T(540,170,'SAME CART TODAY',44,'#aab8de',{w:800,ls:6})}<g transform="translate(540,320) scale(${.6+.4*bo(cl(t,L1-.1,L1+.45))})" filter="url(#gl)">${T(0,0,'$'+Math.round(v),150,'#ff5d5d',{f:FB})}</g></g>`}
 // fade out
 const fo=1-ez(cl(t,end+.05,end+.5));
 $('intro').innerHTML=`<g opacity="${fo}">${h}</g>`;
 return h}

// ---- scene framework ----
const SC={},ORDER=[];
function mk(k,kind,fn){const d=document.createElement('div');d.className='sc';$('scenes').appendChild(d);const s=document.createElementNS(MG.NS,'svg');s.setAttribute('width',1080);s.setAttribute('height',1320);d.appendChild(s);SC[k]={k,el:d,svg:s,kind,render:fn};ORDER.push(k);return SC[k]}
function win(k){const i=ORDER.indexOf(k);return [st(k)-.35,i==ORDER.length-1?1e9:st(ORDER[i+1])-.35]}
function place(sc,t){
 const [a,b]=win(sc.k),D=.55;
 if(t<a-.01||t>b+D+.01){sc.el.style.display='none';return false}
 const pin=ei(cl(t,a,a+D)),pout=ei(cl(t,b,b+D));
 let tx=0,ty=0,s=1,o=1,ry=0;
 const kin=sc.kind,nx=SC[ORDER[ORDER.indexOf(sc.k)+1]],kout=nx?nx.kind:'zoom';
 if(pin<1){const q=1-pin;if(kin=='push')tx=1080*q;else if(kin=='zoom'){s=.7+.3*pin;o=pin}else if(kin=='rise')ty=1320*q;else if(kin=='turn'){ry=-75*q;tx=560*q}else if(kin=='flash'){s=1.15-.15*pin;o=pin}}
 if(pout>0){if(kout=='push')tx-=1080*pout;else if(kout=='zoom'){s*=1+.7*pout;o*=1-pout}else if(kout=='rise')ty-=1320*pout;else if(kout=='turn'){ry+=75*pout;tx-=560*pout}else o*=1-pout}
 sc.el.style.display='block';sc.el.style.opacity=o;
 sc.el.style.transform=`perspective(1800px) translate3d(${tx}px,${ty}px,0) rotateY(${ry}deg) scale(${s})`;
 return true}

// 2: inflation chart (CPI-U annual averages, 2006 = 100)
const CPI=[[2006,201.6],[2007,207.3],[2008,215.3],[2009,214.5],[2010,218.1],[2011,224.9],[2012,229.6],[2013,233.0],[2014,236.7],[2015,237.0],[2016,240.0],[2017,245.1],[2018,251.1],[2019,255.7],[2020,258.8],[2021,271.0],[2022,292.7],[2023,304.7],[2024,313.7],[2025,322.0],[2026,336.9]];
mk(2,'flash',(lt,t)=>{
 const L=MG.L(2),dur=L.end-L.start,p=ei(cl(lt,.2,Math.max(1.5,dur-.2)));
 let h=header(lt,'THE NAME FOR IT','INFLATION','#ffd166',{size:128});
 const X0=150,X1=980,Y0=1080,Y1=470,vmin=95,vmax=175,X=y=>lerp(X0,X1,(y-2006)/20),Y=v=>lerp(Y0,Y1,(v-vmin)/(vmax-vmin));
 const ax=ez(cl(lt,0,.5));
 h+=`<g opacity="${ax}"><rect x=90 y=420 width=930 height=740 rx=30 fill="url(#panel)" stroke="#2c3a60" stroke-width=3 /><line x1=${X0} y1=${Y0} x2=${X1} y2=${Y0} stroke="#8fa0c8" stroke-width=4 />`;
 [100,125,150].forEach(v=>h+=`<line x1=${X0} y1=${Y(v)} x2=${X1} y2=${Y(v)} stroke="#ffffff14" stroke-width=3 />${T(X0-14,Y(v)+10,'$'+v,28,'#8fa0c8',{a:'end',w:800})}`);
 [2006,2016,2026].forEach(y=>h+=T(X(y),Y0+48,y,32,'#8fa0c8',{w:800}));h+='</g>';
 const n=(CPI.length-1)*p,k=Math.floor(n),fr=n-k;let pts=[];for(let i=0;i<=k&&i<CPI.length;i++)pts.push([X(CPI[i][0]),Y(CPI[i][1]/2.016)]);
 if(k<CPI.length-1){const a=CPI[k],b=CPI[k+1];pts.push([X(lerp(a[0],b[0],fr)),Y(lerp(a[1],b[1],fr)/2.016)])}
 const last=pts[pts.length-1];
 h+=`<path d="M${pts.map(q=>q.join(',')).join(' L')} L${last[0]},${Y0} L${X0},${Y0} Z" fill="#ffd16622"/><path d="M${pts.map(q=>q.join(',')).join(' L')}" stroke="#ffd166" stroke-width=10 fill=none stroke-linejoin=round stroke-linecap=round filter="url(#gl)"/>`;
 // price tag riding the line
 const val=Math.round((CPI[Math.min(k,CPI.length-1)][1]+(k<CPI.length-1?(CPI[k+1][1]-CPI[k][1])*fr:0))/2.016);
 h+=`<g transform="translate(${last[0]},${last[1]})"><circle r=16 fill="#fff" filter="url(#gl)"/><g transform="translate(${last[0]>820?-120:0},-90)"><rect x=-75 y=-36 width=150 height=60 rx=12 fill="#ffd166"/>${T(0,10,'$'+val,36,'#0b1020',{f:FB})}</g></g>`;
 s2note=0;return h});
let s2note=0;
// 3: basket of prices
const BK=[['rent','house','#60a5fa','RENT'],['food','apple','#35e08a','FOOD'],['fuel','pump','#ffd166','FUEL'],['haircuts','scissors','#f472b6','HAIRCUTS']];
function ico(k,c){return {
 house:`<path d="M-50,6 L0,-46 L50,6 Z" fill="${c}"/><rect x=-36 y=4 width=72 height=52 fill="${c}"/><rect x=-10 y=20 width=20 height=36 fill="#0b1020"/>`,
 apple:`<circle cx=-14 cy=6 r=36 fill="${c}"/><circle cx=14 cy=6 r=36 fill="${c}"/><path d="M0,-28 Q6,-50 18,-54" stroke="#0b1020" stroke-width=6 fill=none />`,
 pump:`<rect x=-36 y=-48 width=52 height=100 rx=8 fill="${c}"/><rect x=-26 y=-38 width=32 height=26 rx=4 fill="#0b1020"/><path d="M16,-30 L36,-14 L36,30 Q36,40 26,40" stroke="${c}" stroke-width=8 fill=none />`,
 scissors:`<circle cx=-22 cy=30 r=16 fill=none stroke="${c}" stroke-width=9 /><circle cx=22 cy=30 r=16 fill=none stroke="${c}" stroke-width=9 /><path d="M-12,18 L26,-50 M12,18 L-26,-50" stroke="${c}" stroke-width=10 stroke-linecap=round />`,
 crowd:`<circle cx=-34 cy=-16 r=16 fill="${c}"/><circle cx=34 cy=-16 r=16 fill="${c}"/><circle cy=-28 r=20 fill="${c}"/><path d="M-60,40 C-60,4 -10,4 -10,40 Z M10,40 C10,4 60,4 60,40 Z" fill="${c}"/><path d="M-30,46 C-30,0 30,0 30,46 Z" fill="${c}"/>`,
 gear:`<circle r=34 fill="${c}"/>${[...Array(8)].map((_,i)=>`<rect x=-9 y=-52 width=18 height=24 rx=4 fill="${c}" transform="rotate(${i*45})"/>`).join('')}<circle r=14 fill="#0b1020"/>`,
 bills:`<rect x=-50 y=-10 width=100 height=48 rx=6 fill="${c}" transform="rotate(-10)"/><rect x=-50 y=-30 width=100 height=48 rx=6 fill="${c}" stroke="#0b1020" stroke-width=4 /><circle cy=-6 r=12 fill="#0b1020"/>`}[k]}
mk(3,'push',(lt,t)=>{
 const L=MG.L(3);
 let h=header(lt,'MEASURED WITH A BASKET','1000s',"#35e08a",{size:140});
 h+=T(540,400,'OF EVERYDAY PRICES',40,'#e8eefc',{w:800,op:ez(cl(lt,.3,.8))});
 // basket
 const bq=bo(cl(lt,0,.5));
