<!doctype html><meta charset=utf-8><style>
@font-face{font-family:P;src:url(fonts/Poppins-Bold.ttf);font-weight:700}

<div id=stage><div id=pat></div>
 <div id=mapwrap><svg id=mapsvg width=1080 height=1920><g id=mapg></g></svg><div id=mapov></div></div>
 <div id=fg></div><div id=cap></div></div>

<script>
// TikTok 9:16 – SVB bank run: Sam + detailed coded scenes + California map zoom (sky theme, YT11 style)
const {cl,ez,ei,bo,el,lerp}=MG,$=MG.$,W=1080,H=1920,CX=540,CY=860;
const C={cream:'#fff6e6',gold:'#ffc94a',green:'#3ddc84',green2:'#1fa45a',red:'#ff5b4a',red2:'#d6402e',orange:'#ff9f43',blue:'#2f86d0',ink:'#14202c',sand:'#f1d39a',sand2:'#d9b16b',water:'#3f9fe0',water2:'#2b7fc4'};
let TL=null,fontsOk=false;
const S=i=>TL.lines[i].start,E=i=>TL.lines[i].end,DU=i=>E(i)-S(i),SP=i=>TL.lines[i].spec;
const sg=(t,a,b)=>ei(cl(t,a,b));
// ---------- building blocks
function TX(x,y,txt,o={}){const p=o.p??1;if(p<=0)return'';const sz=o.size||64,s=o.s??1;
 return `<div style="position:absolute;left:${x}px;top:${y}px;transform:translate(-50%,-50%) translateY(${((1-Math.min(1,p))*22).toFixed(1)}px) scale(${s.toFixed(3)}) rotate(${o.rot||0}deg);opacity:${Math.min(1,p).toFixed(3)};font:700 ${sz}px/1.05 P,Arial;color:${o.col||C.cream};white-space:nowrap;text-align:center;text-shadow:${MG.outline(o.ol||Math.max(3,Math.round(sz/13)))},0 ${sz/9}px ${sz/3}px #0a2a5099">${txt}</div>`}
function pill(x,y,txt,o={}){const p=o.p??1;if(p<=0)return'';const sz=o.size||36,s=bo(Math.min(1,p))*(o.s??1);
 const dot=o.dot?`<span style="display:inline-block;width:${sz*.62}px;height:${sz*.62}px;border-radius:50%;background:${o.dot};margin-right:${sz*.3}px;vertical-align:-${sz*.06}px"></span>`:'';
 return `<div style="position:absolute;left:${x}px;top:${y}px;transform:translate(-50%,-50%) scale(${s.toFixed(3)});opacity:${Math.min(1,p*2).toFixed(3)};padding:${sz*.34}px ${sz*.7}px;border-radius:${sz*1.2}px;background:${o.bg||'#ffffffee'};color:${o.fg||C.ink};font:700 ${sz}px/1.1 P,Arial;white-space:nowrap;box-shadow:0 10px 26px #0a2a5066">${dot}${txt}</div>`}
function card(x,y,w,inner,p,o={}){if(p<=0)return'';const s=bo(Math.min(1,p));
 return `<div style="position:absolute;left:${x-w/2}px;top:${y}px;width:${w}px;box-sizing:border-box;transform:scale(${s.toFixed(3)}) rotate(${o.rot||0}deg);transform-origin:50% 0;opacity:${Math.min(1,p*2).toFixed(3)};padding:${o.pad||'20px 30px'};border-radius:30px;background:${o.bg||'#ffffffee'};box-shadow:0 22px 46px #0a2a5066;color:${C.ink};text-align:${o.align||'center'}">${inner}</div>`}
function stamp(x,y,txt,p,col=C.red,rot=-8,sz=70){if(p<=0)return'';const s=lerp(2.2,1,ez(Math.min(1,p)));return `<div style="position:absolute;left:${x}px;top:${y}px;transform:translate(-50%,-50%) rotate(${rot}deg) scale(${s.toFixed(3)});opacity:${Math.min(1,p*2.5).toFixed(3)};padding:10px 30px;border:8px solid ${col};border-radius:18px;color:${col};font:700 ${sz}px/1 P;letter-spacing:3px;background:#ffffffdd;white-space:nowrap">${txt}</div>`}
// ---------- art
const SAM=k=>`img/${k}.png`;
function sam(k,x,y,w,o={}){if((o.op??1)<=0.001||w<=1)return'';return `<img src="${SAM(k)}" style="position:absolute;left:0;top:0;width:${w.toFixed(1)}px;transform:translate(${(x-w/2).toFixed(1)}px,${(y-w/2).toFixed(1)}px) rotate(${(o.rot||0).toFixed(2)}deg);opacity:${(o.op??1).toFixed(3)};filter:drop-shadow(0 26px 30px #0a2a5088)">`}
function bill(x,y,w,rot,op=1){const h=w*.46;return `<svg style="position:absolute;left:${(x-w/2).toFixed(1)}px;top:${(y-h/2).toFixed(1)}px;transform:rotate(${rot.toFixed(1)}deg);opacity:${op.toFixed(2)};overflow:visible" width=${w.toFixed(1)} height=${h.toFixed(1)} viewBox="0 0 100 46"><rect x=1 y=1 width=98 height=44 rx=3 fill="#8fd49a" stroke="#2e6b38" stroke-width=2 /><rect x=6 y=5 width=88 height=36 rx=2 fill="none" stroke="#3f8a4a" stroke-width=1.5 /><ellipse cx=50 cy=23 rx=13 ry=15 fill="#5fae6a" stroke="#2e6b38" stroke-width=1.5 /><text x=50 y=29 font-family=P font-size=16 font-weight=700 fill="#1f4d27" text-anchor=middle>$</text><text x=14 y=16 font-family=P font-size=9 font-weight=700 fill="#2e6b38">100</text><text x=86 y=40 font-family=P font-size=9 font-weight=700 fill="#2e6b38" text-anchor=end>100</text></svg>`}
function bank2(x,y,w,o={}){// bottom centre x,y. o.gate 0..1 closing gate, o.crack 0..1, o.glow
 const s=w/600;const gate=o.gate||0,cr=o.crack||0;
 let cols='';for(let i=0;i<6;i++){const cx=95+i*82;cols+=`<rect x=${cx-22} y=190 width=44 height=200 fill="url(#cl)" stroke="#14202c" stroke-width=5 />${[ -10,0,10].map(d=>`<line x1=${cx+d} y1=198 x2=${cx+d} y2=382 stroke="#b9c3cf" stroke-width=3 />`).join('')}<rect x=${cx-30} y=176 width=60 height=16 rx=3 fill="#e9eef3" stroke="#14202c" stroke-width=4 /><rect x=${cx-30} y=388 width=60 height=14 rx=3 fill="#e9eef3" stroke="#14202c" stroke-width=4 />`}
 let bars='';if(gate>0){const gh=210*gate;for(let i=0;i<9;i++)bars+=`<rect x=${246+i*13} y=226 width=6 height=${gh.toFixed(1)} fill="#3a4048" />`;bars+=`<rect x=240 y=${(222+gh).toFixed(1)} width=120 height=10 fill="#2b2f36" />`}
 const crack=cr>0?`<path d="M300 40 L288 92 L312 140 L290 196 L314 262 L296 330 L308 404" stroke="#14202c" stroke-width=7 fill=none stroke-dasharray="520" stroke-dashoffset="${(520*(1-cr)).toFixed(0)}" stroke-linejoin=round />`:'';
 return `<svg style="position:absolute;left:${x-w/2}px;top:${y-460*s}px;overflow:visible;filter:drop-shadow(0 30px 34px #0a2a5066)" width=${w} height=${460*s} viewBox="0 0 600 460">
 <defs><linearGradient id=cl x1=0 y1=0 x2=1 y2=0><stop offset=0 stop-color="#dfe6ee"/><stop offset=.5 stop-color="#ffffff"/><stop offset=1 stop-color="#c6d0dc"/></linearGradient><linearGradient id=wl x1=0 y1=0 x2=0 y2=1><stop offset=0 stop-color="#f4f7fa"/><stop offset=1 stop-color="#d9e1ea"/></linearGradient><radialGradient id=dr cx=.5 cy=.6 r=.7><stop offset=0 stop-color="${o.glow?'#ff6a4a':'#ffd98a'}"/><stop offset=1 stop-color="${o.glow?'#7a1a10':'#8a5a1a'}"/></radialGradient></defs>
 <rect x=40 y=170 width=520 height=240 fill="url(#wl)" stroke="#14202c" stroke-width=6 />
 <rect x=240 y=222 width=120 height=188 rx=6 fill="url(#dr)" stroke="#14202c" stroke-width=6 />${bars}
 ${cols}
 <path d="M20 172 L300 40 L580 172 Z" fill="#eef2f6" stroke="#14202c" stroke-width=6 stroke-linejoin=round /><path d="M70 160 L300 58 L530 160 Z" fill="#dfe6ee" stroke="#b9c3cf" stroke-width=3 />
 <circle cx=300 cy=118 r=26 fill="#ffc94a" stroke="#14202c" stroke-width=5 /><text x=300 y=130 font-family=P font-size=34 font-weight=700 fill="#14202c" text-anchor=middle>$</text>
 <rect x=30 y=160 width=540 height=18 fill="#e9eef3" stroke="#14202c" stroke-width=5 />
 <rect x=20 y=408 width=560 height=18 fill="#e9eef3" stroke="#14202c" stroke-width=5 /><rect x=0 y=426 width=600 height=18 fill="#dfe6ee" stroke="#14202c" stroke-width=5 /><rect x=-20 y=444 width=640 height=16 fill="#d3dbe4" stroke="#14202c" stroke-width=5 />
 ${crack}</svg>`}
function phone(x,y,w,rot,inner){const h=w*2.05;return `<div style="position:absolute;left:${x-w/2}px;top:${y-h/2}px;width:${w}px;height:${h}px;border-radius:${w*.16}px;background:linear-gradient(145deg,#3a3f47,#14171c);box-shadow:0 30px 50px #0a2a5088,inset 0 0 0 3px #5a606a;transform:rotate(${rot}deg)"><div style="position:absolute;left:${w*.05}px;top:${w*.05}px;right:${w*.05}px;bottom:${w*.05}px;border-radius:${w*.12}px;overflow:hidden;background:linear-gradient(#eef3f8,#dfe8f1)"><div style="position:absolute;left:50%;top:${w*.03}px;width:${w*.3}px;height:${w*.06}px;margin-left:-${w*.15}px;border-radius:${w*.03}px;background:#14171c"></div><div style="position:absolute;left:0;right:0;top:${w*.12}px;height:${w*.13}px;background:#ffffffcc;border-bottom:2px solid #d0d8e2;font:700 ${w*.07}px/${w*.13}px P;color:#14202c;text-align:center">Founders 🚀</div>${inner}</div></div>`}
function bubble(txt,mine,p,w){if(p<=0)return'';return `<div style="margin:${w*.035}px ${w*.05}px;display:flex;justify-content:${mine?'flex-end':'flex-start'};transform:scale(${bo(Math.min(1,p)).toFixed(3)});transform-origin:${mine?'100%':'0'} 50%;opacity:${Math.min(1,p*2).toFixed(2)}"><div style="max-width:78%;padding:${w*.03}px ${w*.05}px;border-radius:${w*.06}px;background:${mine?'#3ddc84':'#fff'};font:700 ${w*.075}px/1.2 P;color:#14202c;box-shadow:0 3px 8px #0a2a5022">${txt}</div></div>`}
function skyBG(){return `<div style="position:absolute;inset:0;background:linear-gradient(#5db6f5 0%,#9fd8ff 62%,#d8f0ff 74%,#cfd6dd 74.2%,#b9c3cf 100%)"></div>`}
// ---------- MAP (California zoom)
let mapBuilt=false;
function buildMap(){let h='';for(const k in WORLD)h+=`<path id="c_${k}" class=land d="${WORLD[k]}"/>`;h+='<g id=usst>';for(const k in USST)h+=`<path id="s_${k}" class=st d="${USST[k]}"/>`;h+='</g>';$('mapg').innerHTML=h;mapBuilt=true}
function camOf(c){const [x,y]=MAPP(c[0],c[1]);return {x,y,z:c[2]}}
function scr(cam,lon,lat){const [x,y]=MAPP(lon,lat),s=.96*cam.z;return [CX+(x-cam.x)*s,CY+(y-cam.y)*s]}
function mapVis(t){let v=0;const N=TL.lines.length;for(let k=0;k<N;k++){if(SP(k).type!=='map')continue;const a=S(k)-.4,b=k+1<N?S(k+1)+.35:TL.dur+1;v=Math.max(v,cl(t,a,a+.4)*(1-cl(t,b-.4,b)))}return v}
function drawMap(t){const v=mapVis(t);$('mapwrap').style.opacity=v.toFixed(3);if(v<=0){if($('mapov')._h){$('mapov').innerHTML='';$('mapov')._h=''}return}
 if(!mapBuilt)buildMap();let j=0;TL.lines.forEach((l,k)=>{if(SP(k).type==='map')j=k});const sp=SP(j),a=S(j),D=DU(j);
 const c1=camOf(sp.cam),c2=camOf(sp.cam2),q0=sg(t,a-.4,a+.6),q=sg(t,a+D*.15,a+D*.6);
 let c={x:c1.x,y:c1.y,z:Math.exp(lerp(Math.log(c1.z*.5),Math.log(c1.z),q0))};c={x:lerp(c.x,c2.x,q),y:lerp(c.y,c2.y,q),z:Math.exp(lerp(Math.log(c.z),Math.log(c2.z),q))};const s=.96*c.z;
 $('mapg').setAttribute('transform',`translate(${(CX-c.x*s).toFixed(2)},${(CY-c.y*s).toFixed(2)}) scale(${s.toFixed(4)})`);
 const on=t>a+D*.35;if($('mapg')._ca!==on){const f=$('s_CA');if(f){f.style.fill=on?'#ffe8a8':'';f.style.stroke=on?'#e0a020':'';f.style.strokeWidth=on?3:''}$('mapg')._ca=on}
 let ov='';(sp.pins||[]).forEach(pn=>{const [x,y]=scr(c,pn.at[0],pn.at[1]);const st=a+D*pn.delay,qq=cl(t,st,st+.35);if(qq<=0)return;
  ov+=`<div style="position:absolute;left:${x-19}px;top:${y-19}px;width:38px;height:38px;border-radius:50%;background:${C.red};border:7px solid #fff;box-sizing:border-box;transform:scale(${bo(qq).toFixed(3)});box-shadow:0 0 0 ${(12+9*Math.sin(t*6)).toFixed(1)}px #ff5b4a44"></div>`+pill(x,y-74,pn.label,{p:cl(t,st+.1,st+.45),size:38,dot:C.red})});
 // startup icons orbiting the pin
 const sq=cl(t,a+D*.62,a+D*.8);if(sq>0){const [x,y]=scr(c,...sp.pins[0].at);['🚀','💻','📱','🤖','💡','🧬'].forEach((e,i)=>{const an=i/6*6.283+t*.5,r=210*ez(sq);ov+=`<div style="position:absolute;left:${(x+Math.cos(an)*r-42).toFixed(1)}px;top:${(y+Math.sin(an)*r*.8-42).toFixed(1)}px;width:84px;height:84px;border-radius:24px;background:#fff;box-shadow:0 12px 24px #0a2a5055;font-size:50px;line-height:84px;text-align:center;opacity:${sq.toFixed(2)}">${e}</div>`});ov+=pill(540,1330,'the bank of tech startups',{p:sq,size:44,dot:C.orange})}
 if(ov!==$('mapov')._h){$('mapov').innerHTML=ov;$('mapov')._h=ov}}
// ---------- scenes
function moneyStream(t,x0,y0,dir,n,int){let h='';for(let i=0;i<n;i++){const ph=((t*.55+MG.rnd(i)*1)%1),sp=MG.rnd(i+30);const x=x0+(MG.rnd(i+7)-.5)*120+dir[0]*ph*(600+sp*300)+Math.sin(t*3+i)*30*ph,y=y0+dir[1]*ph*(700+sp*300)-Math.sin(ph*Math.PI)*120;h+=bill(x,y,lerp(40,150,ph),(t*120+i*47)%360*(MG.rnd(i+3)>.5?1:-1)*.4,int*Math.min(1,ph*6)*(1-Math.max(0,ph-.85)/.15))}return h}
function hookTitle(){return TX(540,190,'WHY YOU SHOULD NEVER',{size:62})+TX(540,300,'KEEP ALL YOUR MONEY',{size:88,col:C.gold})+TX(540,410,'IN ONE BANK',{size:104,col:C.gold})}
const ANIM={
 hero(t,k){const sp=SP(k),a=S(k),D=DU(k);let h=skyBG();const p=k===0?1:el(cl(t,a-.3,a+.4));
  h+=bank2(540,1420,820,{crack:1});
  h+=moneyStream(t,540,1250,[.15,1],26,1);
  h+=sam('samthink',230,1420,lerp(0,560,p),{rot:Math.sin(t*1.5)*1.2});
  if(sp.title){const q=1-cl(t,a+D*.82,a+D*.97);if(q>0)h+=`<div style="opacity:${q.toFixed(3)}">${hookTitle()}</div>`;const cq=cl(t,a+D*.55,a+D*.65);if(q>0&&cq>0)h+=`<div style="opacity:${q.toFixed(3)}">`+pill(540,560,'💸 $42 BILLION LEFT IN 1 DAY',{p:cq,size:46,bg:C.red2,fg:'#fff'})+`</div>`}
  if(sp.choice){const end=TL.dur,out=1-cl(t,end-.75,end-.25);
   h+=`<div style="opacity:${out.toFixed(3)}">`+TX(540,240,'WOULD YOU?',{size:84,p:cl(t,a+.1,a+.4)})+pill(540,420,'🏃 YES, PULL IT ALL',{p:cl(t,a+D*.2,a+D*.35),size:56,bg:C.red2,fg:'#fff'})+pill(540,560,'😌 NO, STAY CALM',{p:cl(t,a+D*.4,a+D*.55),size:56,bg:'#fff'})+`</div>`;
   const tin=cl(t,end-.6,end-.08);if(tin>0)h+=`<div style="opacity:${tin.toFixed(3)}">${hookTitle()}</div>`}
  return h},
 loss(t,k){const a=S(k),D=DU(k);let h='';const q=sg(t,a-.2,a+D*.3);
  // press release paper
  h+=`<div style="position:absolute;left:140px;top:${lerp(1900,300,q).toFixed(0)}px;width:800px;height:900px;border-radius:14px;background:#fffdf7;box-shadow:0 40px 70px #0a2a5088;transform:rotate(-3deg);padding:56px 60px;box-sizing:border-box;font-family:P;color:#14202c">
   <div style="font:700 30px P;color:#8a96a3;letter-spacing:3px">PRESS RELEASE</div><div style="font:500 30px P;color:#4a5b6c;margin-top:8px">March 8, 2023</div>
   <div style="font:700 56px/1.15 P;margin-top:34px">Bank sells bonds,<br>reports big loss</div>
   ${[0,1,2,3,4,5,6,7].map(i=>`<div style="height:18px;border-radius:9px;background:#e3e8ee;margin-top:${i?18:44}px;width:${[100,94,98,88,96,70,92,60][i]}%"></div>`).join('')}</div>`;
  // falling chart
  const cq=sg(t,a+D*.35,a+D*.7);let d='M0 0';for(let i=1;i<=20;i++){const f=i/20;if(f>cq)break;d+=` L${(f*560).toFixed(0)} ${(f*f*300+Math.sin(i*1.7)*18).toFixed(0)}`}
  h+=`<svg style="position:absolute;left:260px;top:1060px;overflow:visible" width=560 height=320><path d="${d}" stroke="${C.red}" stroke-width=14 fill=none stroke-linecap=round stroke-linejoin=round /></svg>`;
  h+=stamp(540,880,'−$1.8 BILLION',cl(t,a+D*.45,a+D*.55),C.red2,-8,96);return h},
 panic(t,k){const a=S(k),D=DU(k);let h=skyBG();
  h+=bank2(540,640,420,{crack:1,glow:true});
  const msgs=[['Is SVB safe??',0],['Pull your money NOW',1],['Already moved everything',0],['Do it today!!',1]];
  const ph=[[200,1180,-8],[540,1120,0],[880,1180,8]];
  ph.forEach((pp,i)=>{const pq=el(cl(t,a+i*.25,a+.6+i*.25));if(pq<=0)return;let inner=`<div style="position:absolute;left:0;right:0;top:${300*.25}px">`;
   msgs.forEach((m,j)=>{inner+=bubble(m[0],(m[1]+i)%2===1,cl(t,a+.5+j*D*.13+i*.12,a+.8+j*D*.13+i*.12),300)});inner+='</div>';
   h+=`<div style="position:absolute;left:0;top:0;transform:translate(0,${((1-pq)*600).toFixed(0)}px)">${phone(pp[0],pp[1],300,pp[2],inner)}</div>`;
   // notification badge
   const nq=cl(t,a+D*.4+i*.2,a+D*.5+i*.2);if(nq>0)h+=`<div style="position:absolute;left:${pp[0]+105}px;top:${pp[1]-325}px;width:70px;height:70px;border-radius:50%;background:${C.red};border:6px solid #fff;font:700 36px/58px P;color:#fff;text-align:center;transform:scale(${bo(nq).toFixed(3)})">${3+i*4}</div>`});
  // bills flying out of the bank to the phones
  const fq=cl(t,a+D*.55,a+D*.6);if(fq>0)for(let i=0;i<18;i++){const ph2=((t-a)*.9+MG.rnd(i))%1,tg=ph[i%3];const x=lerp(540,tg[0],ph2),y=lerp(560,tg[1]-200,ph2)-Math.sin(ph2*Math.PI)*160;h+=bill(x,y,90,(t*200+i*40)%360,fq*(1-ph2*.5))}
  return h},
 queue(t,k){const a=S(k),D=DU(k);let h='';const q1=sg(t,a+.2,a+D*.45),q2=sg(t,a+D*.55,a+D*.75);
  h+=TX(540,230,'$'+Math.round(lerp(42,142,q1))+' BILLION',{size:130,col:q1>.98?C.red:'#fff'})+pill(540,370,'wanted out in 2 days',{p:cl(t,a+.2,a+.5),size:44,dot:C.red});
  // tall tube bar 0..175
  const H2=820,fill=H2*(lerp(42,142,q1)/175);
  h+=`<div style="position:absolute;left:390px;top:520px;width:300px;height:${H2}px;border-radius:40px;background:#ffffff44;box-shadow:inset 0 0 0 8px #fff,0 20px 40px #0a2a5055;overflow:hidden"><div style="position:absolute;left:0;right:0;bottom:0;height:${fill.toFixed(0)}px;background:linear-gradient(#ff7a62,${C.red2})"></div>${[...Array(7)].map((_,i)=>`<div style="position:absolute;left:0;right:0;bottom:${(i+1)*H2/8}px;border-top:3px dashed #ffffff66"></div>`).join('')}</div>`;
  for(let i=0;i<10;i++){const ph=((t*.8+i/10)%1);h+=bill(540+(MG.rnd(i)-.5)*200,520+H2-fill-ph*-1*0-40-ph*-200,70,(t*150+i*36)%360,(1-ph)*cl(t,a+.2,a+.4))}
  h+=pill(820,520+H2-fill,Math.round(81*q2)+'%',{p:q2>0?1:0,size:64,bg:C.red2,fg:'#fff'})+pill(820,540,'$175B total',{p:cl(t,a+.3,a+.6),size:36})+pill(540,1420,'81% of all deposits',{p:cl(t,a+D*.7,a+D*.85),size:46,dot:C.red});
  return h},
 closed(t,k){const a=S(k),D=DU(k);let h=skyBG();const g=sg(t,a+.2,a+D*.45);
  h+=bank2(540,1420,880,{crack:1,gate:g,glow:true});
  h+=stamp(540,820,'CLOSED',cl(t,a+D*.45,a+D*.55),C.red2,-9,130)+pill(540,250,'March 10, 2023',{p:cl(t,a+.1,a+.4),size:48,dot:C.gold})+pill(540,370,'3rd-largest bank failure in US history',{p:cl(t,a+D*.65,a+D*.8),size:36,bg:C.red2,fg:'#fff'});
  h+=sam('samthink',860,1500,400);return h},
 pie(t,k){const a=S(k),D=DU(k),q=sg(t,a+.3,a+D*.6)*.86,R=290,cx=540,cy=860,L=2*Math.PI*R;let h='';
  h+=`<svg style="position:absolute;left:0;top:0;filter:drop-shadow(0 26px 30px #0a2a5066)" width=1080 height=1920><circle cx=${cx} cy=${cy} r=${R} fill=none stroke="#1fa45a" stroke-width=150 /><circle cx=${cx} cy=${cy} r=${R} fill=none stroke="#ff5b4a" stroke-width=150 stroke-dasharray="${(L*q).toFixed(1)} ${L}" transform="rotate(-90 ${cx} ${cy})" /><circle cx=${cx} cy=${cy} r=${R-75} fill="none" stroke="#ffffff55" stroke-width=4 /></svg>`;
  h+=TX(cx,cy,Math.round(q*100)+'%',{size:150,col:'#fff'})+TX(540,300,'NOT INSURED',{size:96,col:C.red,p:cl(t,a+D*.45,a+D*.6)})+pill(540,1260,'above $250,000 per person',{p:cl(t,a+D*.6,a+D*.75),size:46,dot:C.red})+pill(300,1380,'insured',{p:cl(t,a+D*.7,a+D*.85),size:38,dot:C.green2})+pill(780,1380,'at risk',{p:cl(t,a+D*.7,a+D*.85),size:38,dot:C.red});
  return h},
 rescue(t,k){const a=S(k),D=DU(k);let h=skyBG();const q=el(cl(t,a+.2,a+.8));
  h+=bank2(540,1420,700,{crack:1});
  h+=`<svg style="position:absolute;left:${540-190}px;top:${300}px;transform:scale(${q.toFixed(3)});filter:drop-shadow(0 26px 30px #0a2a5088)" width=380 height=440 viewBox="0 0 400 470"><path d="M200 12 L372 70 V220 C372 340 290 420 200 456 C110 420 28 340 28 220 V70 Z" fill="#1fa45a" stroke="#fff" stroke-width=16 stroke-linejoin=round /><path d="M128 236 L182 290 L282 178" stroke="#fff" stroke-width=34 fill=none stroke-linecap=round stroke-linejoin=round /></svg>`;
  h+=pill(540,230,'March 12, 2023',{p:cl(t,a+.1,a+.4),size:46,dot:C.gold})+TX(540,830,'ALL MONEY BACK',{size:92,col:C.green,p:cl(t,a+D*.4,a+D*.55)});
  // money flies back into the bank / to people
  const mq=cl(t,a+D*.35,a+D*.45);if(mq>0)h+=moneyStream(t,540,1180,[0,1],20,mq);
  h+=sam('samhappy',820,1480,lerp(0,420,el(cl(t,a+D*.5,a+D*.7))));return h}
};
function fgLayer(t){let h='';const N=TL.lines.length;
 for(let k=0;k<N;k++){const ty=SP(k).type;if(!ANIM[ty])continue;const a=k===0?-1:S(k)-.4,b=k+1<N?S(k+1)+.4:TL.dur+1;if(t<a||t>b)continue;const op=cl(t,a,a+.45)*(1-cl(t,b-.45,b));if(op<=0)continue;
  h+=`<div style="position:absolute;inset:0;opacity:${op.toFixed(3)};transform:scale(${(1+.03*(1-op)).toFixed(4)})">${ANIM[ty](t,k)}</div>`}
 return h}
function draw(t){if(!TL)return;drawMap(t);
 const fh=fgLayer(t);if(fh!==$('fg')._h){$('fg').innerHTML=fh;$('fg')._h=fh}
 $('pat').style.transform=`translateY(${(-(t/TL.dur*52*8)%52).toFixed(1)}px)`;
 const c=t>=TL.lines[TL.lines.length-1].end-.02?'':MG.captions(t,{y:1570,size:66,maxWords:3,stageW:1080,w:940,upper:true});if(c!==$('cap')._h){$('cap').innerHTML=c;$('cap')._h=c}
 MG.grainTick(t)}
let imgReady=false;
window.setTimeline=tl=>{MG.TL=TL=tl;MG.preload(['samhappy','samthink'].map(SAM));Promise.all([document.fonts.load('700 50px P'),document.fonts.load('500 50px P')]).then(()=>{fontsOk=true},()=>{fontsOk=true})};
Object.defineProperty(window,'ready',{configurable:true,get(){return imgReady&&fontsOk},set(v){imgReady=v}});
window.sfxEvents=()=>{const ev=[],N=TL.lines.length,add=(k,t,o={})=>ev.push(Object.assign({k,t:+t.toFixed(3)},o));
 for(let i=1;i<N;i++)add(i%2?'whoosh':'swish',S(i)-.3,{d:.6});
 const s=k=>S(k),d=k=>DU(k);
 add('impact',s(0)+d(0)*.55);
 add('pop',s(1)+d(1)*.45);for(let i=0;i<3;i++)add('pop',s(1)+d(1)*(.62+i*.05));
 add('swish',s(2)+.1,{d:.6});add('impact',s(2)+d(2)*.47);
 for(let i=0;i<6;i++)add('blip',s(3)+.5+i*d(3)*.1);add('cash',s(3)+d(3)*.6);
 for(let i=0;i<8;i++)add('tick',s(4)+.2+i*d(4)*.03,{f:1300+i*60});add('error',s(4)+d(4)*.72);
 add('thud',s(5)+d(5)*.42);add('impact',s(5)+d(5)*.47);
 for(let i=0;i<6;i++)add('tick',s(6)+d(6)*(.3+i*.05),{f:1500-i*60});add('error',s(6)+d(6)*.5);
 add('ding',s(7)+.4);add('cash',s(7)+d(7)*.45);add('ding',s(7)+d(7)*.6);
 add('pop',s(8)+d(8)*.22);add('pop',s(8)+d(8)*.42);
 ev.sort((a,b)=>a.t-b.t);const out=[];for(const e of ev){if(e.t<0)e.t=0;if(!out.find(o=>o.k==e.k&&Math.abs(o.t-e.t)<.12))out.push(e)}return out};
window.draw=draw;
MG.finish($('stage'),1080,1920,.04,'#0a2a5022',65);
</script>
