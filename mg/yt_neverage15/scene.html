<!doctype html><meta charset=utf-8><style>
@font-face{font-family:P;src:url(fonts/Poppins-Bold.ttf);font-weight:700}
@font-face{font-family:P;src:url(fonts/Poppins-Medium.ttf);font-weight:500}
html,body{margin:0;background:#1b2238}
#stage{position:relative;width:1920px;height:1080px;overflow:hidden;font-family:P,Arial,sans-serif;background:#f1ece2}
#bg,#cam,#hud,#fx,#cap{position:absolute;inset:0}
#cam{transform-origin:960px 540px}
.ab{position:absolute}
.chip{position:absolute;left:46px;top:40px;padding:10px 26px;border-radius:40px;background:#1b2238e6;color:#fff;font:700 30px P;letter-spacing:2px;display:flex;align-items:center;gap:14px}
.bub{position:absolute;border-radius:50%;display:flex;align-items:center;justify-content:center;box-sizing:border-box}
.tag{position:absolute;transform:translate(-50%,-50%);padding:12px 30px;border-radius:18px;font:700 44px P;white-space:nowrap}
.big{position:absolute;transform:translate(-50%,-50%);font:700 120px/1 P;white-space:nowrap;letter-spacing:-2px}
</style>
<div id=stage><div id=bg></div><div id=cam></div><div id=fx></div><div id=hud></div><div id=cap></div></div>
<script src="../lib/core.js"></script>
<script src="../lib/samrig.js"></script>
<script>
// YT15 "Your Life If You Never Aged" – flaches 2D im Stil von Alex' Referenz: weiche Bokeh-Hintergruende, Ich-Perspektive, Icon-Blasen,
// Jahr-Chip, grosse Titel mit Goldwort. Sam = "du". Eine Shot-Funktion pro Zeile (spec.shot), Kamera-Drift + Uebergaenge.
const {cl,ez,ei,bo,el,lerp}=MG,$=MG.$,W=1920,H=1080;
const C={ink:'#1b2238',navy:'#2f4372',cream:'#f1ece2',sand:'#e9dcc4',gold:'#f2b632',green:'#35c46a',red:'#e8483c',blue:'#5aa9e6',pink:'#f29bb0',
  yel:'#f6d36b',gray:'#9aa3b5',white:'#ffffff',sep:'#d8c3a0',sky:'#bfe3f7',dark:'#11162a'};
let TL=null,fontsOk=false;
const L=i=>TL.lines[i],S=i=>TL.lines[i].start,E=i=>TL.lines[i].end,SP=i=>TL.lines[i].spec;
const IDX={};  // shot-name -> line index
function WT(i,re,f=0){const l=L(i);if(l.words&&l.words.length)for(const w of l.words)if(re.test(w[0]))return l.start+w[1];return l.start+(l.end-l.start)*f}
const R=MG.rnd,sg=(t,a,b)=>ei(cl(t,a,b)),pop=(t,a,d=.35)=>bo(cl(t,a,a+d)),fo=(t,a,b)=>1-ez(cl(t,a,b));
const fmt=v=>'$'+Math.round(v).toLocaleString('en-US');
// ---------- Grundbausteine ----------
function at(x,y,html,o={}){const s=o.s??1,r=o.r||0,op=o.op??1;if(op<=.001||s<=.001)return'';
 return `<div class=ab style="left:${x.toFixed(1)}px;top:${y.toFixed(1)}px;transform:translate(-50%,-50%) rotate(${r.toFixed(2)}deg) scale(${s.toFixed(4)});opacity:${Math.min(1,op).toFixed(3)};${o.css||''}">${html}</div>`}
function svg(w,h,inner,vb){return `<svg width="${w}" height="${h}" viewBox="${vb||`0 0 ${w} ${h}`}" style="overflow:visible;display:block">${inner}</svg>`}
function samAt(x,y,w,o={},t=0,i=-1){const l=i>=0?L(i):null;const oo=Object.assign({blink:MG_SAM.blink(t+(o.bph||0)),talk:o.talk==null?0:o.talk,bob:Math.abs(Math.sin(t*2.1+(o.bph||0)))*4,tilt:Math.sin(t*1.3)*.025},o);
 const s=MG_SAM.svg(Object.assign(oo,{w}));return `<div class=ab style="left:${(x-w/2).toFixed(1)}px;top:${(y-w*365/240+w*.04).toFixed(1)}px;${o.flip?'transform:scaleX(-1);':''}">${s}</div>`}
// generische Figur (Freunde/Leute): runder Kopf, Punktaugen, Koerper in Farbe, Alter 0..1 (graue Haare, gebeugt, Stock)
function pal(x,y,h,col,age=0,o={}){const hunch=age*10,gray=age>.35,hc=gray?'#e8e8ee':(o.hair||'#5a3a22');
 const head=`<circle cx="0" cy="${-h*.78+hunch*.4}" r="${h*.17}" fill="#f2d3ad" stroke="${C.ink}" stroke-width="5"/>`+
  (o.bald?'':`<path d="M${-h*.17},${-h*.8+hunch*.4} a${h*.17},${h*.17} 0 0,1 ${h*.34},0 q${-h*.06},${-h*.07} ${-h*.17},${-h*.05} q${-h*.11},${-h*.02} ${-h*.17},${h*.05}z" fill="${hc}" stroke="${C.ink}" stroke-width="4"/>`)+
  `<circle cx="${-h*.055}" cy="${-h*.77+hunch*.4}" r="${h*.017}" fill="${C.ink}"/><circle cx="${h*.055}" cy="${-h*.77+hunch*.4}" r="${h*.017}" fill="${C.ink}"/>`+
  (o.mouth==='o'?`<ellipse cx="0" cy="${-h*.71+hunch*.4}" rx="${h*.02}" ry="${h*.027}" fill="${C.ink}"/>`:`<path d="M${-h*.04},${-h*.715+hunch*.4} q${h*.04},${h*.03} ${h*.08},0" stroke="${C.ink}" stroke-width="4" fill="none" stroke-linecap="round"/>`)+
  (age>.6?`<path d="M${-h*.09},${-h*.84+hunch*.4} l${h*.05},${h*.012} M${h*.04},${-h*.828+hunch*.4} l${h*.05},${-h*.012}" stroke="${C.ink}" stroke-width="3" opacity=".6"/>`:'');
 const body=`<path d="M${-h*.15},${-h*.6+hunch} Q0,${-h*.68+hunch} ${h*.15},${-h*.6+hunch} L${h*.17},${-h*.2} L${-h*.17},${-h*.2}Z" fill="${col}" stroke="${C.ink}" stroke-width="5" stroke-linejoin="round" transform="rotate(${hunch*.6},0,${-h*.2})"/>`+
  `<path d="M${-h*.08},${-h*.21} L${-h*.09},0 M${h*.08},${-h*.21} L${h*.09},0" stroke="${C.ink}" stroke-width="${h*.07}" stroke-linecap="round"/>`+
  (age>.7?`<path d="M${h*.2},${-h*.38} L${h*.24},0" stroke="#7a4b2a" stroke-width="8" stroke-linecap="round"/><path d="M${h*.15},${-h*.42} q${h*.04},${h*.04} ${h*.05},${h*.04}" stroke="${C.ink}" stroke-width="10" stroke-linecap="round" fill="none"/>`:'');
 return at(x,y,svg(h*.6,h,`<g transform="translate(${h*.3},${h})">${body}<g transform="rotate(${hunch*1.2},0,${-h*.6})">${head}</g></g>`),{s:o.s??1,op:o.op??1,r:o.r||0,css:`margin-top:${-h/2}px`})}
function bokeh(t,cols,o={}){let h='';const n=cols.length,a=o.a??.85;
 cols.forEach((c,k)=>{const x=(R(k*3+1+(o.seed||0))*1.2-.1)*W+Math.sin(t*.13+k)*40,y=(R(k*3+2+(o.seed||0))*1.1-.05)*H+Math.cos(t*.11+k*2)*30,r=(o.r||260)*(.7+.6*R(k*3+3+(o.seed||0)));
  h+=`<div class=ab style="left:${x-r}px;top:${y-r}px;width:${2*r}px;height:${2*r}px;border-radius:50%;background:${c};opacity:${a};filter:blur(${o.blur||70}px)"></div>`});return h}
function bgFill(css){return `<div class=ab style="inset:0;width:${W}px;height:${H}px;background:${css}"></div>`}
function icon(x,y,r,inner,o={}){return at(x,y,`<div class=bub style="width:${2*r}px;height:${2*r}px;background:${o.bg||C.ink};border:${o.bw??6}px solid ${o.bc||'#ffffff'};box-shadow:0 10px 30px #0003">${inner}</div>`,{s:o.s??1,op:o.op??1})}
function tag(x,y,txt,o={}){return at(x,y,`<div style="padding:${o.pad||'12px 30px'};border-radius:${o.rad||18}px;background:${o.bg||C.ink};color:${o.col||'#fff'};font:700 ${o.size||44}px P;white-space:nowrap;box-shadow:0 8px 24px #0002">${txt}</div>`,{s:o.s??1,op:o.op??1,r:o.r||0})}
function big(x,y,txt,o={}){return at(x,y,`<div style="font:700 ${o.size||120}px/1 P;color:${o.col||C.ink};white-space:nowrap;letter-spacing:-2px;${o.sh?`text-shadow:0 8px 0 ${o.sh}`:''}">${txt}</div>`,{s:o.s??1,op:o.op??1,r:o.r||0})}
function dots(x,y,w,t,col='#ffffff88'){let h='';for(let k=0;k<40;k++){const xx=x-w/2+w*k/39,yy=y+Math.sin(k*.5+t*2)*6;h+=`<circle cx="${xx}" cy="${yy}" r="3.2" fill="${col}"/>`}return `<svg class=ab style="left:0;top:0" width="${W}" height="${H}">${h}</svg>`}
function money(t){return `<span style="font-variant-numeric:tabular-nums">${fmt(t)}</span>`}
// Icons (SVG, 100er-Raster)
const IC={
 clock:(t=0,c='#fff')=>svg(100,100,`<circle cx=50 cy=50 r=38 fill="none" stroke="${c}" stroke-width="7"/><path d="M50,50 L${50+Math.sin(t*6)*24},${50-Math.cos(t*6)*24}" stroke="${c}" stroke-width=7 stroke-linecap="round"/><path d="M50,50 L${50+Math.sin(t*.5)*16},${50-Math.cos(t*.5)*16}" stroke="${c}" stroke-width=7 stroke-linecap="round"/>`),
 chart:(c=C.green)=>svg(100,100,`<path d="M14,72 L36,52 L52,60 L84,24" fill=none stroke="${c}" stroke-width=8 stroke-linecap=round stroke-linejoin="round"/><path d="M66,24 L84,24 L84,42" fill=none stroke="${c}" stroke-width=8 stroke-linecap=round stroke-linejoin="round"/>`),
 down:(c=C.red)=>svg(100,100,`<path d="M14,26 L40,48 L54,40 L84,76" fill=none stroke="${c}" stroke-width=8 stroke-linecap=round stroke-linejoin="round"/><path d="M66,76 L84,76 L84,58" fill=none stroke="${c}" stroke-width=8 stroke-linecap=round stroke-linejoin="round"/>`),
 inf:(c='#fff')=>svg(100,100,`<path d="M50,50 C38,30 14,32 14,50 C14,68 38,70 50,50 C62,30 86,32 86,50 C86,68 62,70 50,50Z" fill=none stroke="${c}" stroke-width="8"/>`),
 heart:(c=C.red)=>svg(100,100,`<path d="M50,82 C10,56 14,22 36,22 C46,22 50,30 50,34 C50,30 54,22 64,22 C86,22 90,56 50,82Z" fill="${c}"/>`),
 plane:(c='#fff')=>svg(100,100,`<rect x=14 y=40 width=72 height=8 rx=3 fill="${c}"/><rect x=14 y=58 width=72 height=8 rx=3 fill="${c}"/><path d="M30,48 L30,58 M70,48 L70,58" stroke="${c}" stroke-width="5"/><rect x=40 y=46 width=22 height=14 rx=4 fill="${c}"/>`),
 car:(c='#fff')=>svg(100,100,`<path d="M18,62 L22,46 L40,40 L64,40 L76,50 L86,52 L86,64 Z" fill="${c}"/><circle cx=32 cy=66 r=9 fill="${C.ink}" stroke="${c}" stroke-width="4"/><circle cx=72 cy=66 r=9 fill="${C.ink}" stroke="${c}" stroke-width="4"/>`),
 mask:(c='#fff')=>svg(100,100,`<path d="M22,40 Q50,30 78,40 L74,64 Q50,78 26,64Z" fill="${c}"/><path d="M22,44 L10,38 M78,44 L90,38 M24,60 L12,66 M76,60 L88,66" stroke="${c}" stroke-width="4"/>`),
 note:(c='#fff')=>svg(100,100,`<path d="M40,72 L40,26 L74,18 L74,64" fill=none stroke="${c}" stroke-width="7"/><circle cx=32 cy=72 r=10 fill="${c}"/><circle cx=66 cy=64 r=10 fill="${c}"/>`),
 suitcase:(c='#fff')=>svg(100,100,`<rect x=18 y=34 width=64 height=46 rx=8 fill="${c}"/><path d="M38,34 L38,24 L62,24 L62,34" fill=none stroke="${c}" stroke-width="6"/>`),
 moon:(c='#fff')=>svg(100,100,`<path d="M62,18 A34,34 0 1,0 82,66 A28,28 0 1,1 62,18Z" fill="${c}"/>`),
 phone:(c='#fff')=>svg(100,100,`<rect x=36 y=14 width=28 height=72 rx=6 fill="${c}"/><rect x=42 y=24 width=16 height=10 fill="${C.ink}"/><path d="M58,14 L58,4" stroke="${c}" stroke-width="5"/>`),
 globe:(c='#fff')=>svg(100,100,`<circle cx=50 cy=50 r=34 fill=none stroke="${c}" stroke-width="6"/><ellipse cx=50 cy=50 rx=14 ry=34 fill=none stroke="${c}" stroke-width="5"/><path d="M16,50 L84,50" stroke="${c}" stroke-width="5"/>`),
 eye:(c='#fff')=>svg(100,100,`<path d="M10,50 Q50,14 90,50 Q50,86 10,50Z" fill=none stroke="${c}" stroke-width="7"/><circle cx=50 cy=50 r=12 fill="${c}"/>`),
 book:(c='#fff')=>svg(100,100,`<path d="M16,24 Q34,18 50,28 Q66,18 84,24 L84,78 Q66,72 50,82 Q34,72 16,78Z" fill=none stroke="${c}" stroke-width=6 stroke-linejoin="round"/><path d="M50,28 L50,82" stroke="${c}" stroke-width="5"/>`),
 coin:(c=C.gold)=>svg(100,100,`<circle cx=50 cy=50 r=36 fill="${c}" stroke="${C.ink}" stroke-width="6"/><text x=50 y=66 text-anchor=middle font-family=P font-weight=700 font-size=46 fill="${C.ink}">$</text>`),
 sun:(c=C.yel)=>svg(100,100,`<circle cx=50 cy=50 r=22 fill="${c}"/>${[...Array(8)].map((_,k)=>`<path d="M${50+Math.cos(k*.785)*30},${50+Math.sin(k*.785)*30} L${50+Math.cos(k*.785)*40},${50+Math.sin(k*.785)*40}" stroke="${c}" stroke-width=7 stroke-linecap="round"/>`).join('')}`),
 rocket:(c='#fff')=>svg(100,100,`<path d="M50,10 C66,26 66,54 60,70 L40,70 C34,54 34,26 50,10Z" fill="${c}"/><path d="M40,58 L28,74 L40,70 M60,58 L72,74 L60,70" fill="${c}"/><circle cx=50 cy=38 r=7 fill="${C.ink}"/>`),
 snow:(c='#fff')=>svg(100,100,`<circle cx=50 cy=50 r=30 fill="${c}"/>`),
};
// ---------- Era-Hintergruende ----------
const ERA={
 wonder:t=>bgFill('#efe9df')+bokeh(t,['#f6d98a','#a9cbe6','#9aa0ad','#f2b6c6','#e8dcc8','#7c8496'],{r:300,blur:80}),
 title:t=>bgFill('radial-gradient(circle at 50% 45%,#2a3358,#141a30 70%)'),
 rag:t=>bgFill('#efe1c6')+bokeh(t,['#d8b98a','#c9a57a','#f3dcae','#b8946a','#e9cfa0'],{r:280,blur:90,a:.7,seed:4}),
 sad:t=>bgFill('#c9ccd3')+bokeh(t,['#8e97a8','#a7adb9','#6f7787','#b9bfca'],{r:300,blur:90,a:.75,seed:8}),
 jazz:t=>bgFill('#1f4b4f')+bokeh(t,['#f2b632','#e86b4a','#2f8f86','#f6d36b','#6fc1b4'],{r:240,blur:80,a:.6,seed:12}),
 lounge:t=>bgFill('#e6efe9')+bokeh(t,['#9fd3c1','#f4b78a','#f6d98a','#a9cbe6','#e9a3a3'],{r:280,blur:85,a:.7,seed:16}),
 space:t=>bgFill('radial-gradient(circle at 50% 60%,#243063,#0d1126 75%)')+stars(t,90),
 synth:t=>bgFill('radial-gradient(circle at 50% 70%,#3a2a6b,#130f2b 75%)')+bokeh(t,['#ff5fa2','#5ad1ff','#8f6bff','#ffb35a'],{r:220,blur:90,a:.45,seed:20}),
 modern:t=>bgFill('#f4f6f2')+bokeh(t,['#bfe8c9','#cfe3f6','#f6e3a8','#d9dde6'],{r:300,blur:90,a:.8,seed:24}),
 cosmic:t=>bgFill('radial-gradient(circle at 50% 50%,#1d1f45,#07081a 75%)')+stars(t,140)+bokeh(t,['#5b3fa8','#2a5fa8','#a83f7a'],{r:320,blur:120,a:.35,seed:28}),
};
function stars(t,n){let h='';for(let k=0;k<n;k++){const x=R(k*7+1)*W,y=R(k*7+2)*H,r=.8+R(k*7+3)*2.4,tw=.45+.55*Math.abs(Math.sin(t*(1+R(k)*2)+k));h+=`<circle cx="${x.toFixed(0)}" cy="${y.toFixed(0)}" r="${r.toFixed(1)}" fill="#fff" opacity="${tw.toFixed(2)}"/>`}
 return `<svg class=ab style="left:0;top:0" width="${W}" height="${H}">${h}</svg>`}
// ---------- Shots: jede Funktion (t, i) -> {h, cam:{z,x,y,r}} ----------
const SH={};
const U=(t,i)=>t-S(i),D=i=>E(i)-S(i);
const talkS=(t,i)=>MG_SAM.talk(t,L(i))*.9;
// POV-Haende (schwarze Faeustlinge wie in der Referenz)
function hand(x,y,s,r=0,open=1){const f=[...Array(4)].map((_,k)=>`<ellipse cx="${-30+k*20}" cy="${-52+Math.abs(k-1.5)*6-open*8}" rx="12" ry="${18+open*6}" fill="${C.ink}"/>`).join('');
 return at(x,y,svg(160,320,`<g transform="translate(80,110)"><rect x=-14 y=40 width=28 height=260 fill="#fff" stroke="${C.ink}" stroke-width="6"/>${f}<ellipse cx=0 cy=0 rx=52 ry=56 fill="${C.ink}"/><ellipse cx=-46 cy=4 rx=16 ry=22 fill="${C.ink}" transform="rotate(-30,-46,4)"/></g>`),{s,r})}
SH.wake=(t,i)=>{const u=U(t,i),d=D(i),blur=Math.max(0,22-u*9);
 let h=`<div class=ab style="inset:0;width:${W}px;height:${H}px;filter:blur(${blur.toFixed(1)}px)">`;
 h+=`<div class=ab style="left:0;top:0;width:${W}px;height:${H}px;background:radial-gradient(ellipse at 50% 40%,#fff ${(1-ez(cl(u,0,1.5)))*60}%,transparent 70%)"></div>`;
 h+=hand(780,980-ez(cl(u,.8,1.6))*260+Math.sin(t*3)*8,1,-8)+hand(1140,1000-ez(cl(u,1.1,1.9))*260+Math.cos(t*3)*8,1,8)+`</div>`;
 const tz=WT(i,/stop/i,.8);
 h+=big(960,330,'DAY 1',{size:150,col:C.ink,op:ez(cl(u,1.6,2.1))*fo(t,tz-.3,tz),s:.9+.1*ez(cl(u,1.6,2.1))});
 if(t>tz-.1){const k=pop(t,tz-.1,.5);h+=at(960,420,svg(520,120,`<rect x=6 y=6 width=508 height=108 rx=54 fill="${C.ink}"/><circle cx=70 cy=60 r=30 fill="none" stroke="#fff" stroke-width="6"/><path d="M70,60 L70,40" stroke="#fff" stroke-width=6 stroke-linecap="round"/><rect x=56 y=26 width=28 height=8 rx=3 fill="#fff"/><text x=290 y=78 text-anchor=middle font-family=P font-weight=700 font-size=46 fill="#fff">AGING: OFF</text><path d="M440,40 L480,80 M480,40 L440,80" stroke="${C.red}" stroke-width=10 stroke-linecap="round"/>`),{s:k})}
 return {h,cam:{z:1+u*.012}}};
SH.mirror=(t,i)=>{const u=U(t,i);let h='';
 h+=at(960,520,`<div style="width:620px;height:820px;border-radius:300px 300px 40px 40px;background:linear-gradient(160deg,#e8f2f8,#c9dbe6);border:18px solid #c49a5a;box-shadow:0 30px 60px #0003"></div>`);
 h+=samAt(960,960,430,{mouth:'grin',talk:talkS(t,i),armR:[2.2+Math.sin(t*5)*.15,.5],armL:[.2,.1],look:[0,-2]},t);
 const items=[['NO WRINKLES',/wrinkles/i],['NO GRAY HAIR',/gray/i],['NO BACK PAIN',/back/i]];
 items.forEach(([s,re],k)=>{const a=WT(i,re,k*.25);h+=tag(k%2?1520:400,330+k*170,`<span style="color:${C.green}">✓</span> ${s}`,{s:pop(t,a),r:k%2?3:-3,bg:'#fff',col:C.ink})});
 const ev=WT(i,/ever/i,.9);h+=big(960,170,'EVER.',{size:110,col:C.gold,s:pop(t,ev,.4),sh:C.ink});
 return {h,cam:{z:1.02+U(t,i)*.01}}};
SH.timeline=(t,i)=>{const u=U(t,i),d=D(i);let h='';const x0=200,x1=1720,y=640,yrs=[1900,1925,1950,1975,2000,2025];
 const p=sg(u,.3,d*.8);h+=at(960,y,svg(1600,40,`<rect x=0 y=14 width=1600 height=12 rx=6 fill="${C.ink}" opacity=".15"/><rect x=0 y=14 width=${1600*p} height=12 rx=6 fill="${C.ink}"/>`));
 yrs.forEach((yr,k)=>{const x=x0+(x1-x0)*k/5,on=p*5>=k-.02;h+=at(x,y,`<div style="width:34px;height:34px;border-radius:50%;background:${on?C.ink:'#fff'};border:6px solid ${C.ink}"></div>`,{s:on?pop(t,S(i)+.3+d*.8*k/5,.3):1})+big(x,y+70,yr,{size:40,col:C.ink,op:.4+.6*on})});
 const sx=x0+(x1-x0)*p;h+=samAt(sx,y-20,190,{mouth:'smile',legL:Math.sin(t*10)*.4,legR:-Math.sin(t*10)*.4,armL:[.3+Math.sin(t*10)*.3,.2],armR:[.3-Math.sin(t*10)*.3,.2]},t);
 const tw=WT(i,/weird/i,.7);['?','!?','??'].forEach((q,k)=>{h+=big(1300+k*150,300+(k%2)*60,q,{size:110,col:k==1?C.red:C.ink,s:pop(t,tw+k*.15),r:(k-1)*12})});
 return {h,cam:{z:1}}};
SH.teaser=(t,i)=>{const u=U(t,i),d=D(i);let h='';const tm=WT(i,/turn/i,.6);
 h+=at(560,560,IC.coin(),{s:pop(t,S(i)+.2)*1.8});
 h+=at(960,560,svg(180,60,`<path d="M10,30 L150,30 M120,8 L160,30 L120,52" fill=none stroke="${C.ink}" stroke-width=12 stroke-linecap=round stroke-linejoin="round"/>`),{op:ez(cl(u,.6,.9))});
 for(let k=0;k<14;k++){const a=tm+k*.06;h+=at(1380+(k%3-1)*70,760-Math.floor(k/3)*48,`<div style="width:220px;height:44px;border-radius:10px;background:${C.green};border:5px solid ${C.ink}"></div>`,{s:pop(t,a,.25),r:R(k)*8-4})}
 h+=big(1380,360,'$$$',{size:140,col:C.green,s:pop(t,tm+.8),sh:C.ink});
 return {h,cam:{z:1+u*.02}}};
SH.title=(t,i)=>{const u=U(t,i),d=D(i);let h='';
 const w=['THIS','IS','YOUR','LIFE','IF','YOU'];const k1=pop(t,S(i)+.1,.5);
