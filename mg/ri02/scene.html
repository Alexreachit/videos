}

  else if (i == 10) { o.armR = [.45, -2.75]; o.mouth = t > wt(10, /kokos/i) ? 'flat' : 'smile'; o.look = [-4, -3] }
  else if (i == 11) { o.armR = [.45, -2.75]; o.armL = [.2, .1]; o.mouth = 'hmm'; o.look = [4, -3] }
  else { o.armR = [1.5, -.15]; o.mouth = 'grin' }
  if (t > l.end + .05) o.talk = 0;

}
const HAT = `<path d="M74,30 L100,-46 L126,30 Z" fill="#ffd166" stroke="${OL}" stroke-width="6" stroke-linejoin="round"/><path d="M84,2 L116,2 M91,-22 L109,-22" stroke="#ff5d5d" stroke-width="8"/><circle cx="100" cy="-48" r="13" fill="#ff5d5d" stroke="${OL}" stroke-width="5"/>`;
function benPose(t) {
  const i = MG.cur(t), rt = t - Lt(i).start;
  let o = { mouth: 'grin', blink: MG_SAM.blink(t + 1.3), armL: [.15, .1], armR: [.15, .1], bob: 0, sw: '#d64545', swd: '#a83232', hat: HAT, talk: 0 };
  const e0 = Lt(8).start;
  if (t < e0 + 1.2) { const u = cl(t, e0, e0 + 1.0); o.bob = Math.abs(Math.sin(u * Math.PI * 3)) * 70 * (1 - u); o.armL = [2.5, .3]; o.armR = [2.5, .3] }
  if (i == 8 && rt > 1.0) { const wv = Math.sin(t * 9) * .35; o.armL = [2.55 + wv * .4, .25 + wv] }
  if (i == 9) { o.armL = [.45, -1.75]; o.armR = [.45, -1.75]; o.mouth = 'o'; o.talk = .2 + .15 * Math.sin(t * 20); o.tilt = .06 }
  if (i == 10) { const k = wt(10, /kokos/i); o.mouth = t > k ? 'sad' : 'grin'; o.look = [3, -6]; o.armR = t > k ? [.3, .1] : [1.2, -1.5]; o.tilt = t > k ? .1 : 0 }
  if (i >= 11) { o.mouth = 'smile'; o.look = [5, -2] }
  return o;
}
function figure(p, o, H3 = 1.75) {
  const q = w.project(p), s = q.s * H3 / 350 * 240; if (!q.vis) return '';
  return `<div style="position:absolute;left:${q.x - s / 240 * 120}px;top:${q.y - s / 240 * 342}px;width:${s}px">${MG_SAM.svg(Object.assign(o, { w: s }))}</div>`;
}
function charLayer(t) {
  let h = '';
  if (t > Lt(8).start - .05) {
    const e0 = Lt(8).start, u = ez(cl(t, e0, e0 + 1.0)), p = [BL[0] - 3.5 * (1 - u), BL[1], BL[2]];
    h += figure(p, benPose(t), 1.55);
    const q = w.project([p[0], p[1] + 2.35, p[2]]);
    if (q.vis && t < Lt(11).start - .2) { const s = pop(t, wt(8, /ben/i) - .1, .4) * fade(t, Lt(10).start - .2, Lt(10).start + .05);
      if (s > .01) h += `<div style="position:absolute;left:${q.x}px;top:${q.y}px;transform:translate(-50%,-100%) scale(${s});transform-origin:50% 100%;display:flex;flex-direction:column;align-items:center">
        <div class="pill" style="position:relative;font-size:40px;color:${OL};background:#ffd166;padding:2px 22px">★ MASKOTTCHEN ★</div>
        <div class="pill" style="position:relative;margin-top:10px;font-size:72px;color:#fff;background:#d64545;text-shadow:${shadowTxt(OL, 4)}">BENLUCA</div>
        <div style="width:0;height:0;border:20px solid transparent;border-top:26px solid ${OL}"></div></div>` }
  }
  h += figure(SP, samPose(t));
  return h;
}

// ---------------- Draw ----------------
window.setTimeline = tl => { MG.TL = tl; KEYS = camKeys() };
window.draw = function (t) {
  const c = camAt(t); w.cam.pos = c.pos; w.cam.at = c.at; w.cam.fov = c.fov;
  w.shadowCenter = [c.at[0], 0, c.at[2]]; w.shadowSize = Math.min(60, 14 + Math.hypot(...G.v.sub(c.pos, c.at)) * .6);
  const sp = w.project(G.v.lerp(c.pos, [c.pos[0] + w.sun[0] * 100, c.pos[1] + w.sun[1] * 100, c.pos[2] + w.sun[2] * 100], 1));
  $('sun').style.cssText = `left:${sp.x - 260}px;top:${Math.min(sp.y, 1100) - 260}px;opacity:${sp.vis ? 1 : 0}`;
  const R = recap(t);
  clouds.forEach((m, i) => { m.pos = [m.base[0] + ((t * (1.2 + .3 * i)) % 400), m.base[1], m.base[2]] });
  gulls.forEach(({ b, wl, wr, i }) => { const a = t * (.32 + .06 * i) + i * 2.1, R2 = 14 + 4 * i; b.pos = [Math.cos(a) * R2, 9 + 2.5 * i + Math.sin(t * 1.3 + i) * .6, Math.sin(a) * R2 - 2]; b.rot = [0, -a, .35]; const f = Math.sin(t * 9 + i * 2) * .55; wl.rot = [0, 0, -f]; wr.rot = [0, 0, f] });
  pole.pos = [FX[0], FX[1] - .05, FX[2]]; w.update(flag, flagGeo(t));
  // Truhe immer offen, Kokosnuss liegt drin
  lid.rot = [-1.75, 0, 0]; coco.pos = [.24, .68, .05]; coco.rot = [0, 0, 0];
  // Bevoelkerung: heute da, im Rueckblick weg, ab Zeile 4 ploppt sie auf
  const sad = t > Lt(9).start + .2 && t < Lt(11).start;
  crowd.forEach(p => { const t0 = crowdT(p), u = R ? 0 : (t < Lt(1).start ? 1 : cl(t, t0, t0 + .4));
    p.m.vis = u > 0; const s = p.s * Math.max(.01, bo(u));
    const hop = t < Lt(1).start || t > Lt(11).start ? Math.max(0, Math.sin(t * 7 + p.d * 30)) * .12 * (p.k % 3 == 0) : 0;
    p.m.scl = [s, s * (sad ? .94 : 1), s]; p.m.pos = [p.x, p.y + hop, p.z]; p.m.rot[2] = sad ? .08 * Math.sin(p.d * 9) : 0 });
  // Muenzen: 860 € fallen in die Truhe
  let landed = 0;
  COINS2.forEach(cn => { const [a, b] = coinT(cn.k), u = cl(t, a, b); cn.m.vis = u > 0 && u < 1; if (t > b) landed++;
    const s = [CH[0] - 1.6 + (cn.k % 6) * .64, CH[1] + 3.4, CH[2] + 1.4], e = [CH[0], CH[1] + .35, CH[2]];
    cn.m.pos = [lerp(s[0], e[0], u), lerp(s[1], e[1], u) + Math.sin(u * Math.PI) * 1.1, lerp(s[2], e[2], u)]; cn.m.rot = [1.2 + u * 6, u * 3, 0] });
  const pay = wt(7, /boot/i) + .35, past = R || (t > Lt(1).start && t < wt(5, /bringen/i));
  let ph = past ? .55 : (t < Lt(1).start ? 1.1 : .55 + .6 * landed / NCOIN);
  if (t > pay) ph = lerp(1.15, .62, ez(cl(t, pay, pay + .6)));
  pile.scl = [1.75, ph, .95];
  // Grosser Hafen (Hologramm) baut sich auf, dann "zu teuer" -> faellt zusammen
  const h0 = Lt(6).start + .3, hx = wt(6, /nicht/i) - .1;
  bigH.forEach(b => { const u = el(cl(t, h0 + b.d * .07, h0 + .55 + b.d * .07)), down = ei(cl(t, hx, hx + .45));
    b.m.vis = t > h0 && down < 1; b.m.scl = [1, Math.max(.01, u * (1 - down)), 1];
    b.m.alpha = .7 * Math.min(1, u * 2) * (1 - down) * (.85 + .15 * Math.sin(t * 8 + b.d * 3));
    b.m.tint = t > hx ? G.hex('#ff4040') : [1, 1, 1]; b.m.tintA = t > hx ? .6 : 0 });
  // Steg: heute fertig, im Rueckblick weg, Zeile 7 Brett fuer Brett
  planks.forEach(p => { const t0 = plankT(p.i), u = t < Lt(1).start ? 1 : cl(t, t0, t0 + .25);
    p.m.vis = u > 0; p.m.pos = [PX, DY + 1.6 * (1 - ez(u)), p.z]; p.m.rot = [0, .3 * (1 - u), 0] });
  const bt = wt(7, /boot/i) - .2, bu = t < Lt(1).start ? 1 : ez(cl(t, bt, bt + .7));
  boat.vis = bu > 0; boat.pos = [BOAT[0], BOAT[1] + Math.sin(t * 2.2) * .06, BOAT[2] + 9 * (1 - bu)]; boat.rot = [Math.sin(t * 1.7) * .04, .08, Math.sin(t * 2.2 + 1) * .05];
  w.render(t);
  // Rueckblick-Look: entsaettigt + warm
  $('cv').style.filter = R ? 'sepia(.45) saturate(.75) contrast(1.04) brightness(1.03)' : 'none';
  // ---- Overlays ----
  let ov = charLayer(t);
  ov += labelAt([PX, DY + 1.2, PZ1 - .6], `<div class="pill" style="position:relative;font-size:52px;color:#fff;background:#2a8fd6;text-shadow:${shadowTxt(OL, 3)}">⚓ UNSER HAFEN</div>`, t, wt(7, /boot/i) + .1, Lt(8).start - .3, { k: 1.5 });
  $('ov').innerHTML = ov;
  // Flash bei Rueckblick-Start und -Ende
  const f1 = cl(t, Lt(1).start - .1, Lt(1).start + .25), f2 = cl(t, Lt(4).start - .1, Lt(4).start + .25);
  const fl = Math.max(f1 > 0 && f1 < 1 ? Math.sin(f1 * Math.PI) : 0, f2 > 0 && f2 < 1 ? Math.sin(f2 * Math.PI) : 0);
  $('fx').innerHTML = (R ? `<div style="position:absolute;inset:0;background:radial-gradient(ellipse at 50% 45%,transparent 55%,#3a2a1066 100%)"></div>` +
    `<div style="position:absolute;left:0;right:0;top:${(t * 900) % 2100 - 100}px;height:26px;background:#ffffff22"></div>` : '') +
    (fl > 0 ? `<div style="position:absolute;inset:0;background:#fff;opacity:${fl * .85}"></div>` : '');
  // UI oben + Untertitel
  let ui = '';
  ui += dayPill(t) + recapBadge(t) + recapChips(t) + voteCard(t) + counterCard(t) + treasury(t) + tooExpensive(t);
  ui += dreamBubble(t) + choiceCards(t) + commentCard(t);
  ui += MG.captions(t, { y: 1470, size: 84, maxWords: 3, hl: '#ffd166', upper: true, stageW: 1080 }).replace(/'Arial Black',Arial/, 'IB,Arial');
  $('ui').innerHTML = ui;
};
