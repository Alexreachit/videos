<script>
// TikTok 9:16 – Bitcoin pizza: realistic Gemini scenes + Florida map zoom + forum post, receipt, price chart (sky theme, YT11 style)

const C={cream:'#fff6e6',gold:'#ffc94a',green:'#3ddc84',green2:'#1fa45a',red:'#ff5b4a',red2:'#d6402e',orange:'#ff9f43',blue:'#2f86d0',ink:'#14202c',sand:'#f1d39a',sand2:'#d9b16b',water:'#3f9fe0',water2:'#2b7fc4'};

function TX(x,y,txt,o={}){const p=o.p??1;if(p<=0)return'';const sz=o.size||64,s=o.s??1;
 return `<div style="position:absolute;left:${x}px;top:${y}px;transform:translate(-50%,-50%) translateY(${((1-Math.min(1,p))*22).toFixed(1)}px) scale(${s.toFixed(3)}) rotate(${o.rot||0}deg);opacity:${Math.min(1,p).toFixed(3)};font:700 ${sz}px/1.05 P,Arial;color:${o.col||C.cream};white-space:nowrap;text-align:center;text-shadow:${MG.outline(o.ol||Math.max(3,Math.round(sz/13)))},0 ${sz/9}px ${sz/3}px #0a2a5099">${txt}</div>`}
function pill(x,y,txt,o={}){const p=o.p??1;if(p<=0)return'';const sz=o.size||36,s=bo(Math.min(1,p))*(o.s??1);
 const dot=o.dot?`<span style="display:inline-block;width:${sz*.62}px;height:${sz*.62}px;border-radius:50%;background:${o.dot};margin-right:${sz*.3}px;vertical-align:-${sz*.06}px"></span>`:'';
 return `<div style="position:absolute;left:${x}px;top:${y}px;transform:translate(-50%,-50%) scale(${s.toFixed(3)});opacity:${Math.min(1,p*2).toFixed(3)};padding:${sz*.34}px ${sz*.7}px;border-radius:${sz*1.2}px;background:${o.bg||'#ffffffee'};color:${o.fg||C.ink};font:700 ${sz}px/1.1 P,Arial;white-space:nowrap;box-shadow:0 10px 26px #0a2a5066">${dot}${txt}</div>`}

function pizzaSVG(id){let s=`<defs><radialGradient id="cr${id}" cx=.5 cy=.45 r=.55><stop offset=.8 stop-color="#f3c066"/><stop offset=1 stop-color="#c67a2a"/></radialGradient><radialGradient id="pp${id}" cx=.4 cy=.35 r=.7><stop offset=0 stop-color="#ef5a3c"/><stop offset=1 stop-color="#a32616"/></radialGradient></defs>

 for(let i=0;i<16;i++){const a=MG.rnd(i+3)*6.283,r=MG.rnd(i+7)*70;s+=`<ellipse cx=${(100+Math.cos(a)*r).toFixed(1)} cy=${(100+Math.sin(a)*r).toFixed(1)} rx=${(6+MG.rnd(i)*9).toFixed(1)} ry=${(4+MG.rnd(i+1)*6).toFixed(1)} fill="#fff0a6" opacity=.85 />`}
 const pp=[[70,62],[122,58],[148,100],[58,112],[100,96],[128,140],[80,148],[42,80],[160,70],[104,168]];

 return `<svg style="position:absolute;left:${x}px;top:${y}px;overflow:visible" width=1 height=1>${s}</svg>`}

function coin(x,y,d,rot=0){return `<div style="position:absolute;left:${x-d/2}px;top:${y-d/2}px;width:${d}px;height:${d}px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ffe08a,#f7a325 55%,#c97a10);border:${d/18}px solid #fff3c4;box-shadow:0 ${d/12}px ${d/6}px #0a2a5088,inset 0 0 0 ${d/14}px #e08c12;transform:rotate(${rot}deg);display:flex;align-items:center;justify-content:center;font:700 ${d*.55}px/1 P;color:#fff;text-shadow:0 3px 0 #b86d0a">₿</div>`}
function palm(x,y,s,t){const sw=Math.sin(t*1.6)*4;let fr='';for(let i=0;i<7;i++){const a=-160+i*25+sw;fr+=`<path d="M0 0 Q${(Math.cos(a*Math.PI/180)*60).toFixed(1)} ${(Math.sin(a*Math.PI/180)*60-30).toFixed(1)} ${(Math.cos(a*Math.PI/180)*120).toFixed(1)} ${(Math.sin(a*Math.PI/180)*120+30).toFixed(1)}" stroke="#2f9a4a" stroke-width=22 fill=none stroke-linecap=round /><path d="M0 0 Q${(Math.cos(a*Math.PI/180)*60).toFixed(1)} ${(Math.sin(a*Math.PI/180)*60-30).toFixed(1)} ${(Math.cos(a*Math.PI/180)*120).toFixed(1)} ${(Math.sin(a*Math.PI/180)*120+30).toFixed(1)}" stroke="#56c06a" stroke-width=8 fill=none stroke-linecap=round />`}
 let tr='';for(let i=0;i<9;i++)tr+=`<path d="M${(-14+i*1.2).toFixed(1)} ${-i*44} L${(14+i*1.2).toFixed(1)} ${-i*44} L${(12+i*1.4).toFixed(1)} ${-i*44-40} L${(-12+i*1.4).toFixed(1)} ${-i*44-40} Z" fill="${i%2?'#a8743c':'#b9844a'}" stroke="#6a4520" stroke-width=3 />`;
 return `<svg style="position:absolute;left:${x}px;top:${y}px;overflow:visible" width=1 height=1><g transform="scale(${s})">${tr}<g transform="translate(12 -396) rotate(${sw.toFixed(1)})">${fr}<circle cx=-8 cy=10 r=10 fill="#7a4a1a"/><circle cx=10 cy=14 r=10 fill="#8a5a24"/></g></g></svg>`}
function house(x,y,w){return `<svg style="position:absolute;left:${x-w/2}px;top:${y-w*.8}px;overflow:visible;filter:drop-shadow(0 20px 24px #0a2a5055)" width=${w} height=${w*.8} viewBox="0 0 500 400">
 <rect x=40 y=170 width=420 height=230 fill="#fff4dc" stroke="#14202c" stroke-width=6 /><path d="M10 180 L250 40 L490 180 Z" fill="#e0703a" stroke="#14202c" stroke-width=6 stroke-linejoin=round />
 ${[0,1,2,3].map(r=>`<path d="M${40+r*30} ${163-r*28} L${460-r*30} ${163-r*28}" stroke="#b8542a" stroke-width=4 />`).join('')}
 <rect x=205 y=245 width=90 height=155 rx=6 fill="#3a7bd5" stroke="#14202c" stroke-width=6 /><circle cx=278 cy=328 r=7 fill="#ffc94a"/><rect x=190 y=392 width=120 height=14 fill="#c9b08a" stroke="#14202c" stroke-width=4 />
 ${[80,340].map(wx=>`<rect x=${wx} y=235 width=80 height=80 rx=4 fill="#bfe3ff" stroke="#14202c" stroke-width=6 /><line x1=${wx+40} y1=235 x2=${wx+40} y2=315 stroke="#14202c" stroke-width=4 /><line x1=${wx} y1=275 x2=${wx+80} y2=275 stroke="#14202c" stroke-width=4 /><rect x=${wx-18} y=232 width=16 height=86 fill="#2fa36b" stroke="#14202c" stroke-width=4 /><rect x=${wx+82} y=232 width=16 height=86 fill="#2fa36b" stroke="#14202c" stroke-width=4 />`).join('')}
 <rect x=60 y=330 width=110 height=26 rx=10 fill="#ff8fb0" stroke="#14202c" stroke-width=3 /><rect x=330 y=330 width=110 height=26 rx=10 fill="#ff8fb0" stroke="#14202c" stroke-width=3 /></svg>`}
function deliveryCar(x,y,w,spin){const r=spin;return `<svg style="position:absolute;left:${x-w/2}px;top:${y-w*.55}px;overflow:visible;filter:drop-shadow(0 16px 18px #0a2a5066)" width=${w} height=${w*.55} viewBox="0 0 400 220">

 <path d="M20 170 L20 120 Q24 96 60 92 L110 56 Q124 48 150 48 L280 48 Q306 48 320 64 L352 100 Q384 104 388 130 L388 170 Z" fill="#e8473a" stroke="#14202c" stroke-width=6 stroke-linejoin=round />
 <path d="M122 64 L200 64 L200 100 L84 100 Z" fill="#cfe3f5" stroke="#14202c" stroke-width=5 /><path d="M214 64 L290 64 L326 100 L214 100 Z" fill="#cfe3f5" stroke="#14202c" stroke-width=5 /><rect x=356 y=112 width=24 height=14 rx=4 fill="#ffe08a"/>
 ${[95,305].map(cx=>`<g transform="translate(${cx} 172) rotate(${r.toFixed(1)})"><circle r=38 fill="#2b2f36" stroke="#14202c" stroke-width=5 /><circle r=18 fill="#c9d1da"/><rect x=-3 y=-18 width=6 height=36 fill="#8a96a3"/><rect x=-18 y=-3 width=36 height=6 fill="#8a96a3"/></g>`).join('')}</svg>`}
// ---------- MAP (Florida zoom)
let mapBuilt=false;
function buildMap(){let h='';for(const k in WORLD)h+=`<path id="c_${k}" class=land d="${WORLD[k]}"/>`;h+='<g id=usst>';for(const k in USST)h+=`<path id="s_${k}" class=st d="${USST[k]}"/>`;h+='</g>';$('mapg').innerHTML=h;mapBuilt=true}
function camOf(c){const [x,y]=MAPP(c[0],c[1]);return {x,y,z:c[2]}}
function scr(cam,lon,lat){const [x,y]=MAPP(lon,lat),s=.96*cam.z;return [CX+(x-cam.x)*s,CY+(y-cam.y)*s]}
function mapVis(t){let v=0;const N=TL.lines.length;for(let k=0;k<N;k++){if(SP(k).type!=='map')continue;const a=S(k)-.4,b=k+1<N?S(k+1)+.35:TL.dur+1;v=Math.max(v,cl(t,a,a+.4)*(1-cl(t,b-.4,b)))}return v}
function drawMap(t){const v=mapVis(t);$('mapwrap').style.opacity=v.toFixed(3);if(v<=0){if($('mapov')._h){$('mapov').innerHTML='';$('mapov')._h=''}return}
 if(!mapBuilt)buildMap();let j=0;TL.lines.forEach((l,k)=>{if(SP(k).type==='map')j=k});const sp=SP(j),a=S(j),D=DU(j);

 c={x:lerp(c.x,c2.x,q),y:lerp(c.y,c2.y,q),z:Math.exp(lerp(Math.log(c.z),Math.log(c2.z),q))};const s=.96*c.z;
 $('mapg').setAttribute('transform',`translate(${(CX-c.x*s).toFixed(2)},${(CY-c.y*s).toFixed(2)}) scale(${s.toFixed(4)})`);
 const on=t>a+D*.4;if($('mapg')._fl!==on){const f=$('s_FL');if(f){f.style.fill=on?'#ffe8a8':'';f.style.stroke=on?'#e0a020':'';f.style.strokeWidth=on?3:''}$('mapg')._fl=on}
 let ov='';(sp.pins||[]).forEach((pn,k)=>{const [x,y]=scr(c,pn.at[0],pn.at[1]);const st=a+D*pn.delay,qq=cl(t,st,st+.35);if(qq<=0)return;
  ov+=`<div style="position:absolute;left:${x-17}px;top:${y-17}px;width:34px;height:34px;border-radius:50%;background:${C.red};border:6px solid #fff;box-sizing:border-box;transform:scale(${bo(qq).toFixed(3)});box-shadow:0 0 0 ${(10+8*Math.sin(t*6)).toFixed(1)}px #ff5b4a44"></div>`+pill(x,y-70,pn.label,{p:cl(t,st+.1,st+.45),size:36,dot:C.red})});

   <div style="display:flex;gap:22px;padding:22px"><div style="flex:none;width:88px;height:88px;border-radius:8px;background:#d8e2ee;display:flex;align-items:center;justify-content:center;font:700 52px P;color:#8aa0b8">?</div>
   <div><div style="font:bold 34px Verdana;color:#2a4e7a">Pizza for bitcoins?</div><div style="font:22px Verdana;color:#777;margin:6px 0 12px">May 18, 2010</div>
   <div style="font:27px/1.35 Verdana">“I'll pay 10,000 bitcoins for a couple of pizzas.. like maybe 2 large ones”</div></div></div></div>`}}
 if(ov!==$('mapov')._h){$('mapov').innerHTML=ov;$('mapov')._h=ov}}
// ---------- coded segments
const ANIM={

  // BTC price (approx., log scale): May 2010 → Oct 2026
  const P=[[2010.4,.004],[2010.99,.3],[2011.45,30],[2011.99,4.7],[2012.99,13.5],[2013.92,1100],[2014.99,320],[2015.99,430],[2016.99,960],[2017.96,19000],[2018.99,3700],[2019.99,7200],[2020.99,29000],[2021.86,67000],[2022.99,16500],[2023.99,42000],[2024.99,93000],[2025.8,110000],[2026.82,79769]];
  const X=v=>110+(v-2010.4)/(2026.82-2010.4)*860,Y=v=>1180-(Math.log10(v)+3)/(5.2+3)*720,q=sg(t,a+.3,a+D*.75);
  let d='',tip=[X(P[0][0]),Y(P[0][1])];const tx=2010.4+q*(2026.82-2010.4);
  for(let i=0;i<P.length;i++){if(P[i][0]<=tx){d+=(i?'L':'M')+X(P[i][0]).toFixed(1)+' '+Y(P[i][1]).toFixed(1);tip=[X(P[i][0]),Y(P[i][1])]}else{const p0=P[i-1],f=(tx-p0[0])/(P[i][0]-p0[0]),lv=lerp(Math.log10(p0[1]),Math.log10(P[i][1]),f);tip=[X(tx),Y(Math.pow(10,lv))];d+='L'+tip[0].toFixed(1)+' '+tip[1].toFixed(1);break}}
  h+=`<svg style="position:absolute;left:0;top:0" width=1080 height=1920><rect x=90 y=420 width=900 height=800 rx=30 fill="#ffffff22" />${[2012,2016,2020,2024].map(y=>`<line x1=${X(y)} y1=440 x2=${X(y)} y2=1190 stroke="#ffffff33" stroke-width=3 /><text x=${X(y)} y=1250 fill="#fff" font-family=P font-size=34 font-weight=700 text-anchor=middle>${y}</text>`).join('')}<path d="${d}" stroke="#fff" stroke-width=18 fill=none stroke-linejoin=round stroke-linecap=round opacity=.6 /><path d="${d}" stroke="${C.orange}" stroke-width=9 fill=none stroke-linejoin=round stroke-linecap=round /></svg>`;
  h+=`<div style="position:absolute;left:${tip[0]-22}px;top:${tip[1]-22}px;width:44px;height:44px;border-radius:50%;background:${C.orange};border:7px solid #fff;box-sizing:border-box;box-shadow:0 0 0 ${(10+8*Math.sin(t*7)).toFixed(1)}px #ff9f4355"></div>`;
  const val=Math.pow(10,lerp(Math.log10(41),Math.log10(797694000),q));
  h+=card(540,130,880,`<div style="font:500 32px P;color:#4a5b6c">10,000 BTC are worth</div><div style="font:700 98px/1.05 P;color:${q>.98?C.green2:C.ink}">$${MG.fmt(val,0)}</div>`,cl(t,a+.1,a+.4));
  h+=pill(540,1340,'1 BTC = $79,769 · Oct 27, 2026',{p:cl(t,a+D*.78,a+D*.9),size:38,dot:C.orange});return h}
};
function fgLayer(t){let h='';const N=TL.lines.length;
 for(let k=0;k<N;k++){const ty=SP(k).type;if(!ANIM[ty])continue;const a=S(k)-.4,b=k+1<N?S(k+1)+.4:TL.dur+1;if(t<a||t>b)continue;const op=cl(t,a,a+.45)*(1-cl(t,b-.45,b));if(op<=0)continue;
  h+=`<div style="position:absolute;inset:0;opacity:${op.toFixed(3)};transform:scale(${(1+.03*(1-op)).toFixed(4)})">${ANIM[ty](t,k)}</div>`}
 return h}

 for(let i=0;i<10;i++)add('tick',s(5)+d(5)*(.3+i*.045),{f:1200+i*60});add('cash',s(5)+d(5)*.78);
 add('impact',s(6)+.2);add('ding',s(6)+d(6)*.6);

 ev.sort((a,b)=>a.t-b.t);const out=[];for(const e of ev){if(e.t<0)e.t=0;if(!out.find(o=>o.k==e.k&&Math.abs(o.t-e.t)<.12))out.push(e)}return out};
