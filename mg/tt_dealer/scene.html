<!doctype html><meta charset=utf-8><style>
@font-face{font-family:P;src:url(fonts/Poppins-Bold.ttf);font-weight:700}
@font-face{font-family:P;src:url(fonts/Poppins-Medium.ttf);font-weight:500}
html,body{margin:0;background:#2f86d0}
#stage{position:relative;width:1080px;height:1920px;overflow:hidden;font-family:P,Arial,sans-serif;background:radial-gradient(circle at 50% 42%,#8fd3ff 0%,#4fa6e6 48%,#2a76c0 100%)}
#pat{position:absolute;inset:-60px;opacity:.13;background-image:radial-gradient(circle,#ffffff 1.8px,transparent 2.4px);background-size:52px 52px}
#mapwrap{position:absolute;inset:0;opacity:0}
#mapsvg{position:absolute;left:0;top:0}
#mapov,#imgs,#fg{position:absolute;inset:0}
#cap{position:absolute;inset:0;z-index:60}
.land{fill:#f4f8fc;stroke:#7fb0da;stroke-width:1.2;vector-effect:non-scaling-stroke}
.st{fill:none;stroke:#a9c9e6;stroke-width:1;vector-effect:non-scaling-stroke}
</style>
<div id=stage><div id=pat></div>
 <div id=deco style="position:absolute;inset:0"></div><div id=fg></div><div id=cap></div></div>
<script src="../lib/core.js"></script>
<script src="../lib/mapdata.js"></script>
<script>
// TikTok 9:16 – Car dealer financing: Sam + Gemini objects + code animation (sky theme, YT11 style)
const {cl,ez,ei,bo,el,lerp}=MG,$=MG.$,W=1080,H=1920,CX=540,CY=860;
const C={cream:'#fff6e6',gold:'#ffc94a',green:'#3ddc84',green2:'#1fa45a',red:'#ff5b4a',red2:'#d6402e',orange:'#ff9f43',blue:'#2f86d0',ink:'#14202c',sand:'#f1d39a',sand2:'#d9b16b',water:'#3f9fe0',water2:'#2b7fc4'};
let TL=null,fontsOk=false;
const S=i=>TL.lines[i].start,E=i=>TL.lines[i].end,DU=i=>E(i)-S(i),SP=i=>TL.lines[i].spec;
const sg=(t,a,b)=>ei(cl(t,a,b));
// ---------- building blocks
function TX(x,y,txt,o={}){const p=o.p??1;if(p<=0)return'';const sz=o.size||64,s=o.s??1;
 return `<div style="position:absolute;left:${x}px;top:${y}px;transform:translate(-50%,-50%) translateY(${((1-Math.min(1,p))*22).toFixed(1)}px) scale(${s.toFixed(3)}) rotate(${o.rot||0}deg);opacity:${Math.min(1,p).toFixed(3)};font:700 ${sz}px/1.05 P,Arial;color:${o.col||C.cream};white-space:nowrap;text-align:center;text-shadow:${MG.outline(o.ol||Math.max(3,Math.round(sz/13)))},0 ${sz/9}px ${sz/3}px #0a2a5099">${txt}</div>`}
function pill(x,y,txt,o={}){const p=o.p??1;if(p<=0)return'';const sz=o.size||36,s=bo(Math.min(1,p))*(o.s??1);
 const dot=o.dot?`<span style="display:inline-block;width:${sz*.62}px;height:${sz*.62}px;border-radius:50%;background:${o.dot};margin-right:${sz*.3}px;vertical-align:-${sz*.06}px"></span>`:'';
 return `<div style="position:absolute;left:${x}px;top:${y}px;transform:translate(-50%,-50%) scale(${s.toFixed(3)});opacity:${Math.min(1,p*2).toFixed(3)};padding:${sz*.34}px ${sz*.7}px;border-radius:${sz*1.2}px;background:${o.bg||'#ffffffee'};color:${o.fg||C.ink};font:700 ${sz}px/1.1 P,Arial;white-space:nowrap;box-shadow:0 10px 26px #0a2a5066">${dot}${txt}</div>`}
function card(x,y,w,inner,p,o={}){if(p<=0)return'';const s=bo(Math.min(1,p));
 return `<div style="position:absolute;left:${x-w/2}px;top:${y}px;width:${w}px;box-sizing:border-box;transform:scale(${s.toFixed(3)}) rotate(${o.rot||0}deg);transform-origin:50% 0;opacity:${Math.min(1,p*2).toFixed(3)};padding:${o.pad||'20px 30px'};border-radius:30px;background:${o.bg||'#ffffffee'};box-shadow:0 22px 46px #0a2a5066;color:${C.ink};text-align:${o.align||'center'}">${inner}</div>`}
function stamp(x,y,txt,p,col=C.red,rot=-8,sz=70){if(p<=0)return'';const s=lerp(2.2,1,ez(Math.min(1,p)));return `<div style="position:absolute;left:${x}px;top:${y}px;transform:translate(-50%,-50%) rotate(${rot}deg) scale(${s.toFixed(3)});opacity:${Math.min(1,p*2.5).toFixed(3)};padding:10px 30px;border:8px solid ${col};border-radius:18px;color:${col};font:700 ${sz}px/1 P;letter-spacing:3px;background:#ffffffdd;white-space:nowrap">${txt}</div>`}
const IM=k=>`img/${k}.png`;
function obj(k,x,y,w,o={}){const op=o.op??1;if(op<=0.001||w<=1)return'';return `<img src="${IM(k)}" style="position:absolute;left:0;top:0;width:${w.toFixed(1)}px;transform:translate(${(x-w/2).toFixed(1)}px,${(y-w/2).toFixed(1)}px) rotate(${(o.rot||0).toFixed(2)}deg) scaleX(${o.flip?-1:1});opacity:${op.toFixed(3)};filter:drop-shadow(0 ${(w/22).toFixed(0)}px ${(w/16).toFixed(0)}px #0a2a5066)">`}
const fl=(t,i,a=10)=>Math.sin(t*2.1+i*1.7)*a;
function samImg(k,x,y,w){if(w<2)return'';return `<img src="${IM(k)}" style="position:absolute;left:0;top:0;width:${w.toFixed(1)}px;transform:translate(${(x-w/2).toFixed(1)}px,${(y-w/2).toFixed(1)}px);filter:drop-shadow(0 26px 30px #0a2a5088)">`}
function bgDeco(t){let h='';for(let i=0;i<9;i++){const x=(MG.rnd(i)*1180-50+t*(9+MG.rnd(i+4)*10))%1180-50,y=MG.rnd(i+20)*1700+80+Math.sin(t*.7+i)*30;h+=`<div style="position:absolute;left:${x.toFixed(0)}px;top:${y.toFixed(0)}px;font:700 ${(34+MG.rnd(i+7)*36).toFixed(0)}px P;color:#fff;opacity:.12;transform:rotate(${(t*20+i*40)%360}deg)">${i%2?'%':'$'}</div>`}return h}
// showroom: glossy floor + window strips
function showroom(t){let h=`<div style="position:absolute;left:-60px;right:-60px;top:1180px;height:800px;background:linear-gradient(#f2f5f9,#cdd6e2)"></div>`;
 for(let i=0;i<6;i++)h+=`<div style="position:absolute;left:${(i*200-40+((t*20)%200)).toFixed(0)}px;top:1180px;width:70px;height:780px;background:linear-gradient(#ffffff88,#ffffff00);transform:skewX(-20deg)"></div>`;
 return h}
function ground(){return `<div style="position:absolute;left:-60px;right:-60px;top:1390px;height:600px;background:linear-gradient(#e9eef6,#cfd8e6);border-top:6px solid #ffffff88"></div>`}
function hookTitle(){return TX(540,190,'WHY YOU SHOULD NEVER TELL',{size:56})+TX(540,300,'A CAR DEALER',{size:110,col:C.gold})+TX(540,420,"HOW YOU'RE PAYING",{size:88,col:C.gold})}
const money=v=>'$'+MG.fmt(Math.round(v),0);
const ANIM={
 hero(t,k){const sp=SP(k),a=S(k),D=DU(k);let h=showroom(t);const p=k===0?1:el(cl(t,a-.25,a+.35));
  h+=`<div style="position:absolute;left:380px;top:1080px;width:600px;height:90px;border-radius:50%;background:#0a2a5022"></div>`;
  h+=obj('car',680,1000+fl(t,1,4),620,{rot:fl(t,2,.6)});
  for(let i=0;i<3;i++){const ph=(t*.7+i/3)%1;h+=`<div style="position:absolute;left:${(560+i*120)}px;top:${(880-ph*40).toFixed(0)}px;font-size:${(30+30*Math.sin(ph*Math.PI)).toFixed(0)}px;opacity:${Math.sin(ph*Math.PI).toFixed(2)}">✨</div>`}
  h+=`<div style="position:absolute;left:0;top:0;transform:translate(900px,780px) rotate(${(Math.sin(t*2.6)*8).toFixed(1)}deg);transform-origin:0 -80px">${obj('tag',0,0,260)}<div style="position:absolute;left:-98px;top:4px;width:170px;text-align:center;transform:rotate(-8deg);font:700 40px P;color:${C.ink}">$40,000</div></div>`;
  h+=samImg('samthink',220,1260+fl(t,5,5),500*p);
  h+=pill(250,920,'💬 "How are you paying?"',{p:k===0?cl(t,a+D*.45,a+D*.6):1-cl(t,TL.dur-.7,TL.dur-.3),size:34,bg:'#fff'});
  if(k===0){const q=1-cl(t,a+D*.85,a+D*.98);if(q>0)h+=`<div style="opacity:${q.toFixed(3)}">${hookTitle()}</div>`}
  if(sp.choice){const end=TL.dur,out=1-cl(t,end-.6,end-.2);
   h+=`<div style="opacity:${out.toFixed(3)}">`+TX(540,230,'DID YOU KNOW?',{size:84,p:cl(t,a+.05,a+.3)})+pill(540,400,'✅ YES',{p:cl(t,a+D*.15,a+D*.3),size:58,bg:C.green2,fg:'#fff'})+pill(540,540,'🤯 NO',{p:cl(t,a+D*.35,a+D*.5),size:58,bg:'#fff'})+`</div>`;
   const tin=cl(t,end-.5,end-.06);if(tin>0)h+=`<div style="opacity:${tin.toFixed(3)}">${hookTitle()}</div>`}
  return h},
 profit(t,k){const a=S(k),D=DU(k);let h=ground();const q1=sg(t,a+.05,a+D*.45),q2=sg(t,a+D*.3,a+D*.75);const H=760,b1=H*q1,b2=H*1727/1781*q2;
  h+=`<div style="position:absolute;left:150px;top:${1390-b1}px;width:320px;height:${b1}px;border-radius:26px 26px 0 0;background:linear-gradient(#5fa8ff,#2f7fe0);box-shadow:0 14px 30px #0a2a5055"></div><div style="position:absolute;left:610px;top:${1390-b2}px;width:320px;height:${b2}px;border-radius:26px 26px 0 0;background:linear-gradient(#ff7a62,${C.red2});box-shadow:0 14px 30px #0a2a5055"></div>`;
  h+=obj('car',310,1390-b1-90,300,{rot:fl(t,1,2)})+obj('contract',770,1390-b2-110,240,{rot:fl(t,2,4),op:Math.min(1,q2*2)});
  h+=TX(310,1390-b1/2,money(1781*q1),{size:60,col:'#fff',p:q1>0?1:0})+TX(770,1390-b2/2,money(1727*q2),{size:60,col:'#fff',p:q2>0?1:0});
  h+=pill(310,1460,'profit on the car',{p:cl(t,a,a+.3),size:36,dot:'#2f7fe0'})+pill(770,1460,'financing & add-ons',{p:cl(t,a+D*.3,a+D*.45),size:36,dot:C.red2});
  h+=pill(540,200,'per car sold · US dealers 2026',{p:cl(t,a,a+.25),size:40});return h},
 stretch(t,k){const a=S(k),D=DU(k);let h=ground();const q=sg(t,a+D*.25,a+D*.7),m=Math.round(lerp(60,84,q));
  h+=obj('contract',540,560+fl(t,1,8),330,{rot:fl(t,2,3)});
  // months bar stretching like rubber
  const w=lerp(560,900,q);h+=`<div style="position:absolute;left:${540-w/2}px;top:830px;width:${w}px;height:110px;border-radius:55px;background:linear-gradient(90deg,#ffd84a,#ff9f43);box-shadow:0 14px 30px #0a2a5055;transform:scaleY(${(1-.15*Math.sin(q*Math.PI)).toFixed(3)})"></div>`+TX(540,885,m+' MONTHS',{size:70,col:C.ink,ol:1});
  h+=card(300,1040,420,`<div style="font:500 30px P;color:#4a5b6c">monthly</div><div style="font:700 74px/1.05 P;color:${C.green2}">${money(lerp(792,604,q))}</div>`,cl(t,a+D*.2,a+D*.35))+card(780,1040,420,`<div style="font:500 30px P;color:#4a5b6c">total interest</div><div style="font:700 74px/1.05 P;color:${C.red2}">${money(lerp(7523,10711,q))}</div>`,cl(t,a+D*.3,a+D*.45));
  h+=pill(540,1300,'+$3,188 more interest',{p:cl(t,a+D*.75,a+D*.88),size:52,bg:C.red2,fg:'#fff'})+pill(540,1460,'$40,000 loan at 7%',{p:cl(t,a,a+.25),size:38});return h},
 rate(t,k){const a=S(k),D=DU(k);let h='';const q=sg(t,a+D*.25,a+D*.75);
  h+=obj('percent',540,820+fl(t,1,12),lerp(200,480,el(cl(t,a-.1,a+.5))),{rot:fl(t,2,6)+q*10});
  h+=TX(540,300,(6+2*q).toFixed(1)+'%',{size:190,col:q>.95?C.red:'#fff'});
  h+=pill(300,1180,'bank rate 6%',{p:cl(t,a,a+.25),size:44,dot:C.green2})+pill(780,1180,'+2 points dealer',{p:cl(t,a+D*.35,a+D*.5),size:44,bg:C.red2,fg:'#fff'});
  h+=obj('bank',200,1330,lerp(0,230,el(cl(t,a,a+.4))),{rot:fl(t,3,3)});return h},
 extra(t,k){const a=S(k),D=DU(k);let h=ground();const q=sg(t,a+.1,a+D*.75);
  for(let i=0;i<Math.floor(q*12);i++)h+=obj('cash',300+(i%3)*240,1300-Math.floor(i/3)*120+fl(t,i,3),250,{rot:(i%2?6:-6)});
  h+=TX(540,300,'+'+money(2265*q),{size:170,col:C.red});h+=pill(540,460,'extra interest',{p:cl(t,a,a+.25),size:46,dot:C.red});
  h+=pill(540,1460,'$40,000 · 5 years · 6% vs 8%',{p:cl(t,a+D*.5,a+D*.65),size:36});return h},
 tips(t,k){const a=S(k),D=DU(k);let h=ground();
  h+=samImg('samhappy',240,1250+fl(t,4,5),lerp(0,460,el(cl(t,a-.1,a+.4))));
  const tips=['Negotiate the price first','Bring your own bank offer','Talk payment last'];
  tips.forEach((tp,i)=>{const st=a+.1+i*D*.25,q=cl(t,st,st+.3);if(q<=0)return;h+=`<div style="position:absolute;left:330px;top:${360+i*190}px;width:600px;padding:24px 26px;border-radius:26px;background:#fff;box-shadow:0 18px 36px #0a2a5055;transform:translateX(${((1-ez(q))*120).toFixed(1)}px);opacity:${Math.min(1,q*2).toFixed(2)};display:flex;align-items:center;gap:22px"><div style="flex:none;width:72px;height:72px;border-radius:50%;background:${C.green2};color:#fff;font:700 42px/72px P;text-align:center">${i+1}</div><div style="font:700 40px/1.15 P;color:${C.ink}">${tp}</div></div>`});
  h+=obj('bank',800,1150+fl(t,2,8),lerp(0,330,el(cl(t,a+D*.35,a+D*.7))));return h}
};
function fgLayer(t){let h='';const N=TL.lines.length;
 for(let k=0;k<N;k++){const ty=SP(k).type;if(!ANIM[ty])continue;
  const a=k===0?-1:S(k)-.2,b=k+1<N?S(k+1)+.2:TL.dur+1;if(t<a||t>b)continue;
  const qi=k===0?1:ei(cl(t,a,a+.32)),qo=k+1<N?ei(cl(t,b-.32,b)):0;
  const dx=(1-qi)*1150-qo*1150,blur=Math.abs(dx)>4?Math.min(14,Math.abs(dx)/40):0;
  const st=k===0?0:S(k),en=k+1<N?S(k+1):TL.dur,u=cl(t,st,en),z=1+.06*u;
  h+=`<div style="position:absolute;inset:0;transform:translateX(${dx.toFixed(1)}px) scale(${z.toFixed(4)});transform-origin:540px 900px;${blur?`filter:blur(${blur.toFixed(1)}px);`:''}">${ANIM[ty](t,k)}</div>`}
 return h}
function draw(t){if(!TL)return;
 $('deco').innerHTML=bgDeco(t);
 const fh=fgLayer(t);if(fh!==$('fg')._h){$('fg').innerHTML=fh;$('fg')._h=fh}
 $('pat').style.transform=`translateY(${(-(t/TL.dur*52*8)%52).toFixed(1)}px)`;
 const c=t>=TL.lines[TL.lines.length-1].end-.02?'':MG.captions(t,{y:1570,size:66,maxWords:3,stageW:1080,w:940,upper:true});if(c!==$('cap')._h){$('cap').innerHTML=c;$('cap')._h=c}
 MG.grainTick(t)}
let imgReady=false;
window.setTimeline=tl=>{MG.TL=TL=tl;MG.preload(['samhappy','samthink','tag','cal','cash','bank','car','contract','percent'].map(IM));Promise.all([document.fonts.load('700 50px P'),document.fonts.load('500 50px P')]).then(()=>{fontsOk=true},()=>{fontsOk=true})};
Object.defineProperty(window,'ready',{configurable:true,get(){return imgReady&&fontsOk},set(v){imgReady=v}});
window.sfxEvents=()=>{const ev=[],N=TL.lines.length,add=(k,t,o={})=>ev.push(Object.assign({k,t:+t.toFixed(3)},o));
 for(let i=1;i<N;i++)add(i%2?'whoosh':'swish',S(i)-.22,{d:.45});
 for(let k=0;k<N;k++){const sp=SP(k),ty=sp.type,a=S(k),d=DU(k);
  if(ty==='hero'&&k===0){add('impact',a+.05);add('pop',a+d*.47)}
  if(ty==='hero'&&sp.choice){add('pop',a+d*.17);add('pop',a+d*.37)}
  if(ty==='profit'){for(let i=0;i<8;i++)add('tick',a+d*(.1+i*.08),{f:1200+i*70});add('ding',a+d*.78)}
  if(ty==='stretch'){add('swish',a+d*.25,{d:.8});add('error',a+d*.78)}
  if(ty==='rate'){for(let i=0;i<6;i++)add('tick',a+d*(.25+i*.08),{f:1300+i*80});add('error',a+d*.75)}
  if(ty==='extra'){for(let i=0;i<6;i++)add('cash',a+.15+i*d*.11)}
  if(ty==='tips'){for(let i=0;i<3;i++)add('pop',a+.1+i*d*.25);add('ding',a+d*.75)}}
 ev.sort((a,b)=>a.t-b.t);const out=[];for(const e of ev){if(e.t<0)e.t=0;if(!out.find(o=>o.k==e.k&&Math.abs(o.t-e.t)<.12))out.push(e)}return out};
window.draw=draw;
MG.finish($('stage'),1080,1920,.04,'#0a2a5022',65);
</script>
