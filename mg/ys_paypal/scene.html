<!doctype html><meta charset=utf-8><style>
@font-face{font-family:P;src:url(fonts/Poppins-Bold.ttf);font-weight:700}
@font-face{font-family:P;src:url(fonts/Poppins-Medium.ttf);font-weight:500}
html,body{margin:0;background:#4fa6e6}
#stage{position:relative;width:1080px;height:1920px;overflow:hidden;font-family:P,Arial,sans-serif;background:linear-gradient(#5fb4ff 0%,#8fd3ff 45%,#c7ecff 72%,#e9f7ff 100%)}
#sky,#cam,#fx,#grade,#cap{position:absolute;inset:0}

<div id=stage><div id=sky></div><div id=cam><div id=fg style="position:absolute;inset:0"></div></div><div id=fx></div><div id=grade></div><div id=cap></div></div>
<script src="../lib/core.js"></script>
<script>
// Short 9:16 – PayPal $92 quadrillion error (2013). Sky look (parallax skyline, rays, particles), code-drawn phone/statement UI,
// camera shake + zoom punches, kinetic type, per-scene colour grade.
const {cl,ez,ei,bo,el,lerp}=MG,$=MG.$,W=1080,H=1920;
const C={cream:'#fff6e6',gold:'#ffc94a',green:'#3ddc84',green2:'#1fa45a',red:'#ff5b4a',red2:'#d6402e',ink:'#14202c',neon:'#16c172'};
let TL=null,fontsOk=false,imgReady=false,SHAKES=[],PUNCH=[],BURSTS=[];
const S=i=>TL.lines[i].start,E=i=>TL.lines[i].end,DU=i=>E(i)-S(i),SP=i=>TL.lines[i].spec;
const sg=(t,a,b)=>ei(cl(t,a,b)),R=MG.rnd;
const IM=k=>`img/${k}.png`;
const LW=w=>TL?2*Math.PI*Math.max(1,Math.round(w*TL.dur/(2*Math.PI)))/TL.dur:w;// loop-safe angular speed
const fl=(t,i,a=8)=>Math.sin(t*LW(2.1)+i*1.7)*a;
function obj(k,x,y,w,o={}){const op=o.op??1;if(op<=0.001||w<=1)return'';return `<img src="${IM(k)}" style="position:absolute;left:0;top:0;width:${w.toFixed(1)}px;transform:translate(${(x-w/2).toFixed(1)}px,${(y-w/2).toFixed(1)}px) rotate(${(o.rot||0).toFixed(2)}deg) scaleX(${o.flip?-1:1});opacity:${op.toFixed(3)};filter:drop-shadow(0 ${(w/22).toFixed(0)}px ${(w/14).toFixed(0)}px #000a)${o.glow?` drop-shadow(0 0 ${o.glow}px ${o.gcol||'#38ff9c'})`:''}">`}
function shadow(x,y,w,op=1){return `<div style="position:absolute;left:${x-w/2}px;top:${y-w*.06}px;width:${w}px;height:${w*.12}px;border-radius:50%;background:radial-gradient(#000a,#0000 70%);opacity:${op.toFixed(2)}"></div>`}
function TX(x,y,txt,o={}){const p=o.p??1;if(p<=0)return'';const sz=o.size||64,s=o.s??1;
 return `<div style="position:absolute;left:${x}px;top:${y}px;transform:translate(-50%,-50%) translateY(${((1-Math.min(1,p))*22).toFixed(1)}px) scale(${s.toFixed(3)}) rotate(${o.rot||0}deg);opacity:${Math.min(1,p).toFixed(3)};font:700 ${sz}px/1.05 P,Arial;color:${o.col||C.cream};white-space:nowrap;text-align:center;text-shadow:${MG.outline(o.ol||Math.max(3,Math.round(sz/13)))},0 ${sz/9}px ${sz/3}px #000c${o.glow?`,0 0 ${sz/3}px ${o.glow}`:''}">${txt}</div>`}
// kinetic type: words pop in one after another with overshoot + slight rotation
function KT(x,y,txt,t,t0,o={}){const ws=txt.split(' '),sz=o.size||80,gap=o.stag??.07;let h='';
 const spans=ws.map((w,i)=>{const q=cl(t,t0+i*gap,t0+i*gap+.28);if(q<=0)return `<span style="display:inline-block;opacity:0">${w}</span>`;const s=bo(q),r=(1-ez(q))*(i%2?8:-8);
  return `<span style="display:inline-block;transform:scale(${s.toFixed(3)}) rotate(${r.toFixed(1)}deg);opacity:${Math.min(1,q*3).toFixed(2)}">${w}</span>`}).join(' ');
 return `<div style="position:absolute;left:${x}px;top:${y}px;transform:translate(-50%,-50%);font:700 ${sz}px/1.05 P;color:${o.col||C.cream};white-space:nowrap;text-shadow:${MG.outline(Math.max(3,Math.round(sz/13)))},0 ${sz/9}px ${sz/3}px #000c${o.glow?`,0 0 ${sz/2.5}px ${o.glow}`:''}">${spans}</div>`}
function pill(x,y,txt,o={}){const p=o.p??1;if(p<=0)return'';const sz=o.size||36,s=bo(Math.min(1,p))*(o.s??1);
 const dot=o.dot?`<span style="display:inline-block;width:${sz*.62}px;height:${sz*.62}px;border-radius:50%;background:${o.dot};margin-right:${sz*.3}px;vertical-align:-${sz*.06}px;box-shadow:0 0 12px ${o.dot}"></span>`:'';
 return `<div style="position:absolute;left:${x}px;top:${y}px;transform:translate(-50%,-50%) scale(${s.toFixed(3)});opacity:${Math.min(1,p*2).toFixed(3)};padding:${sz*.34}px ${sz*.7}px;border-radius:${sz*1.2}px;background:${o.bg||'#ffffffee'};color:${o.fg||C.ink};font:700 ${sz}px/1.1 P,Arial;white-space:nowrap;box-shadow:0 10px 26px #000a">${dot}${txt}</div>`}
function stamp(x,y,txt,p,col=C.red,rot=-8,sz=70){if(p<=0)return'';const s=lerp(2.2,1,ez(Math.min(1,p)));return `<div style="position:absolute;left:${x}px;top:${y}px;transform:translate(-50%,-50%) rotate(${rot}deg) scale(${s.toFixed(3)});opacity:${Math.min(1,p*2.5).toFixed(3)};padding:10px 30px;border:8px solid ${col};border-radius:18px;color:${col};font:700 ${sz}px/1 P;letter-spacing:3px;background:#ffffffe6;white-space:nowrap;box-shadow:0 14px 30px #000a">${txt}</div>`}
const money=v=>'$'+MG.fmt(Math.round(v),0);
// ---------- WORLD: parallax night skyline (3 depths) + rays + stars
function skyline(t,depth,seed,base,hgt,col,win){let h='';const sp=[4,10,22][depth],n=[16,11,8][depth],w0=1400/n;
 for(let i=0;i<n+2;i++){const bw=w0*(.7+R(seed+i)*.5),bh=hgt*(.45+R(seed+i+50)*.55),x=i*w0-w0*.5+Math.sin(2*Math.PI*t/TL.dur+depth)*sp*6;
  let wins='';if(win){for(let r=0;r<Math.floor(bh/46);r++)for(let c=0;c<Math.floor(bw/38);c++){if(R(seed*7+i*31+r*5+c)>.62)wins+=`<div style="position:absolute;left:${10+c*38}px;top:${14+r*46}px;width:16px;height:22px;background:#e9f6ff;opacity:${(.45+.4*R(i+r+c+seed)).toFixed(2)}"></div>`}}
  h+=`<div style="position:absolute;left:${x.toFixed(1)}px;top:${(base-bh).toFixed(1)}px;width:${bw.toFixed(1)}px;height:${bh.toFixed(1)}px;background:${col};overflow:hidden">${wins}</div>`}
 return h}
function sky(t){let h='';for(let i=0;i<6;i++){const w=220+R(i)*260,x=R(i+4)*1200-200+Math.sin(2*Math.PI*t/TL.dur+i)*90,y=120+R(i+9)*640;h+=`<div style="position:absolute;left:${x.toFixed(0)}px;top:${y.toFixed(0)}px;width:${w.toFixed(0)}px;height:${(w*.32).toFixed(0)}px;border-radius:999px;background:#fff;opacity:.55;filter:blur(6px);box-shadow:${(w*.25).toFixed(0)}px -${(w*.12).toFixed(0)}px 0 ${(w*.02).toFixed(0)}px #fff"></div>`}
 h+=`<div style="position:absolute;left:-400px;top:-500px;width:1880px;height:1880px;opacity:.18;background:repeating-conic-gradient(from ${(t/TL.dur*44).toFixed(2)}deg at 50% 50%,#ffffff 0deg 6deg,transparent 6deg 22deg);-webkit-mask:radial-gradient(#000 20%,transparent 65%)"></div>`;
 h+=skyline(t,0,11,1420,900,'#b9dcf7',false)+skyline(t,1,23,1440,700,'#8fbfe6',true)+`<div style="position:absolute;left:0;right:0;top:1380px;height:600px;background:linear-gradient(#dfe9f4,#c3d3e6)"></div>`+skyline(t,2,37,1480,420,'#6f9ccc',true);
 h+=`<div style="position:absolute;left:0;right:0;top:1440px;height:8px;background:linear-gradient(90deg,transparent,#ffffffaa,transparent)"></div>`;return h}
// ---------- particles
function dust(t){let h='';for(let i=0;i<28;i++){const ph=(t/TL.dur*(1+Math.floor(R(i)*2))+R(i+5))%1,x=R(i+3)*1080+Math.sin(2*Math.PI*t/TL.dur+i)*20,y=1500-ph*1500;h+=`<div style="position:absolute;left:${x.toFixed(0)}px;top:${y.toFixed(0)}px;width:${(3+R(i)*5).toFixed(1)}px;height:${(3+R(i)*5).toFixed(1)}px;border-radius:50%;background:#ffffff;opacity:${(.25+.4*Math.sin(ph*Math.PI)).toFixed(2)}"></div>`}return h}
function bursts(t){let h='';for(const b of BURSTS){const q=(t-b.t)/.8;if(q<0||q>1)continue;for(let i=0;i<18;i++){const a=i/18*6.283+R(i+b.t*10),r=ez(q)*(160+R(i+3)*160),x=b.x+Math.cos(a)*r,y=b.y+Math.sin(a)*r+q*q*80;
  h+=`<div style="position:absolute;left:${x.toFixed(0)}px;top:${y.toFixed(0)}px;width:${(14*(1-q)+3).toFixed(1)}px;height:${(14*(1-q)+3).toFixed(1)}px;border-radius:50%;background:${b.col};box-shadow:0 0 12px ${b.col};opacity:${(1-q).toFixed(2)}"></div>`}}return h}
// ---------- SCENES

const INK='#16202b';
const BAL='92,233,720,368,547,800';
// rolling balance: digits fill from the right while counting up (loop-safe, deterministic)
function balStr(q){if(q>=1)return BAL;if(q<=0)return '0';const digs=BAL.replace(/,/g,'');const n=Math.max(1,Math.round(ez(q)*digs.length));
 let s='';for(let i=0;i<n;i++){const d=i<n-1?digs[i]:String(Math.floor(R(Math.floor(q*60)+i)*10));s+=d}
 s=s.replace(/\B(?=(\d{3})+(?!\d))/g,',');return s}
// phone with iOS-like screen; inner = HTML for a 420x820 screen
function phone(x,y,w,inner,o={}){const op=o.op??1;if(op<=.001||w<2)return'';const s=w/480;
 return `<div style="position:absolute;left:0;top:0;width:480px;height:940px;transform:translate(${(x-240).toFixed(1)}px,${(y-470).toFixed(1)}px) rotate(${(o.rot||0).toFixed(2)}deg) scale(${s.toFixed(4)});transform-origin:240px 470px;opacity:${op.toFixed(3)};filter:drop-shadow(0 30px 40px #0008)">
 <div style="position:absolute;inset:0;border-radius:72px;background:linear-gradient(145deg,#2b3846,#10161d);border:6px solid ${INK}"></div>
 <div style="position:absolute;left:24px;top:24px;width:420px;height:880px;border-radius:52px;background:${o.bg||'#f4f8ff'};overflow:hidden">
  <div style="position:absolute;left:150px;top:14px;width:120px;height:34px;border-radius:20px;background:#10161d"></div>
  <div style="position:absolute;left:28px;top:16px;font:700 24px P;color:${INK}">9:41</div>${inner}</div></div>`}
function card(y,html,o={}){return `<div style="position:absolute;left:22px;top:${y}px;width:376px;padding:22px;box-sizing:border-box;border-radius:28px;background:${o.bg||'#fff'};box-shadow:0 8px 22px #0002;${o.border?`border:5px solid ${o.border};`:''}">${html}</div>`}
function balScreen(txt,col,o={}){return `<div style="position:absolute;left:0;right:0;top:80px;text-align:center;font:700 34px P;color:#1f56b3">Wallet</div>`+
 card(150,`<div style="font:500 24px P;color:#5b6b7c">${o.label||'Account balance'}</div><div style="font:700 ${o.fs||21}px P;color:${col};margin-top:8px;white-space:nowrap;letter-spacing:-1px">${txt}</div><div style="font:500 20px P;color:#8a97a6;margin-top:6px">${o.sub||'USD · June statement'}</div>`,{border:o.border})+
 card(370,`<div style="font:700 24px P;color:${INK}">Recent activity</div>`+[['eBay sale · tires','+$1,000'],['Coffee','−$4.50'],['Auto parts','−$38.00']].map(r=>`<div style="display:flex;justify-content:space-between;font:500 22px P;color:#4b5866;margin-top:16px"><span>${r[0]}</span><span>${r[1]}</span></div>`).join(''))+
 `<div style="position:absolute;left:22px;right:22px;top:640px;height:90px;border-radius:45px;background:#1f56b3;color:#fff;font:700 30px P;display:flex;align-items:center;justify-content:center">Send money</div>`}
function inbox(hl){const rows=[['PayPal','Your June statement is ready',1],['Mom','Dinner on Sunday?',0],['eBay','Your item sold!',0],['Bank','Monthly summary',0]];
 return `<div style="position:absolute;left:28px;top:80px;font:700 40px P;color:${INK}">Inbox</div>`+rows.map((r,i)=>`<div style="position:absolute;left:16px;right:16px;top:${150+i*130}px;height:112px;border-radius:24px;background:${r[2]&&hl>0?`rgba(96,165,250,${(.25*hl).toFixed(2)})`:'#fff'};box-shadow:0 4px 12px #0001;${r[2]&&hl>0?`border:4px solid rgba(31,86,179,${hl.toFixed(2)});`:''}padding:18px 22px;box-sizing:border-box">
 <div style="font:700 26px P;color:${INK}">${r[0]}</div><div style="font:500 22px P;color:#5b6b7c;margin-top:6px">${r[1]}</div>${r[2]?`<div style="position:absolute;right:22px;top:22px;width:18px;height:18px;border-radius:50%;background:#1f6fe5"></div>`:''}</div>`).join('')}
function envSVG(x,y,w,o={}){const h=w*.68,op=o.op??1;if(op<=.001||w<2)return'';
 return `<svg viewBox="0 0 300 204" width="${w.toFixed(1)}" height="${h.toFixed(1)}" style="position:absolute;left:0;top:0;transform:translate(${(x-w/2).toFixed(1)}px,${(y-h/2).toFixed(1)}px) rotate(${(o.rot||0).toFixed(2)}deg);opacity:${op.toFixed(3)};filter:drop-shadow(0 ${(w/22).toFixed(0)}px ${(w/14).toFixed(0)}px #000a);overflow:visible">
 <g stroke="${INK}" stroke-width="7" stroke-linejoin="round"><rect x="8" y="20" width="284" height="178" rx="14" fill="#ffffff"/><path d="M8 34 L150 124 L292 34" fill="#e7f0ff"/></g>
 <circle cx="150" cy="124" r="30" fill="#1f6fe5" stroke="${INK}" stroke-width="6"/><text x="150" y="136" text-anchor="middle" font-family="P,Arial" font-weight="700" font-size="34" fill="#fff">$</text></svg>`}
function hookTitle(t,t0=-9){return KT(540,190,'WHY YOU SHOULD NEVER',t,t0,{size:62})+KT(540,305,'PANIC OVER YOUR',t,t0+.2,{size:96,col:C.gold})+KT(540,425,'BANK STATEMENT',t,t0+.35,{size:104,col:'#ff4f5e',glow:'#ff4f5e66'})}
function sweat(t,x,y){let h='';for(let i=0;i<4;i++){const ph=((t/TL.dur)*6+i/4)%1;h+=`<div style="position:absolute;left:${(x+(i-1.5)*46).toFixed(0)}px;top:${(y+ph*120).toFixed(0)}px;width:18px;height:26px;border-radius:50% 50% 50% 50%/60% 60% 40% 40%;background:#7cc8ff;border:3px solid ${INK};opacity:${Math.sin(ph*Math.PI).toFixed(2)}"></div>`}return h}
const ANIM={
 hero(t,k){const sp=SP(k),a=S(k),D=DU(k);let h='';const p=k===0?1:el(cl(t,a-.25,a+.35));
  const bk=sp.choice?cl(t,TL.dur-.6,TL.dur-.06):1;
  h+=shadow(540,1500,520,.8)+phone(540,lerp(1100,1000,bk)+fl(t,1,6),lerp(440,540,bk),balScreen('$'+BAL,C.green2,{border:'#3ddc84'}),{rot:fl(t,2,1.5)});
  if(k===0||bk>0&&sp.choice)h+=pill(540,760+fl(t,3,5),'💰 $92 QUADRILLION',{p:k===0?1:bk,size:64,bg:C.green,fg:'#fff',s:1+.04*Math.sin(t*LW(3))});
  for(let i=0;i<5;i++){const ph=((t/TL.dur)*2+i/5)%1;h+=obj('cash',130+R(i)*820,1440-ph*620,110+R(i+2)*50,{op:Math.sin(ph*Math.PI)*.95,rot:R(i)*40-20})}
  h+=obj('samthink',880,1300+fl(t,5,4),280*p);
  if(k===0){const q=1-cl(t,a+D*.86,a+D*.98);if(q>0)h+=`<div style="opacity:${q.toFixed(3)}">${hookTitle(t)}</div>`}
  if(sp.choice){const end=TL.dur,out=1-cl(t,end-.6,end-.2);
   h+=`<div style="opacity:${out.toFixed(3)}">`+KT(540,200,'WHAT WOULD YOU BUY FIRST?',t,a+.05,{size:66})+pill(540,330,'🏝️ AN ISLAND',{p:cl(t,a+D*.12,a+D*.25),size:46})+pill(540,440,'⚾ A BASEBALL TEAM',{p:cl(t,a+D*.27,a+D*.4),size:46,bg:C.gold})+pill(540,550,'🇺🇸 THE NATIONAL DEBT',{p:cl(t,a+D*.42,a+D*.55),size:46,bg:'#1f56b3',fg:'#fff'})+`</div>`;
   const tin=cl(t,end-.5,end-.06);if(tin>0)h+=`<div style="opacity:${tin.toFixed(3)}">${hookTitle(t)}</div>`}
  return h},
 mail(t,k){const a=S(k),D=DU(k);let h='';const fly=ez(cl(t,a+.05,a+D*.45));
  h+=shadow(540,1500,520,.8)+phone(540,990+fl(t,1,5),540,inbox(sg(t,a+D*.45,a+D*.6)));
  h+=envSVG(lerp(-150,540,fly),lerp(700,980,fly),lerp(300,120,fly),{op:1-cl(t,a+D*.42,a+D*.5),rot:lerp(-25,0,fly)});
  h+=TX(540,250,'2013',{size:160,col:C.gold,p:cl(t,a,a+.3),glow:'#ffc94a55'});
  h+=pill(540,410,'📍 Chris Reynolds · Pennsylvania',{p:cl(t,a+D*.25,a+D*.45),size:40,dot:'#1f6fe5'});
  h+=obj('samthink',880,1320+fl(t,4,4),lerp(0,250,el(cl(t,a+D*.6,a+D*.85))));return h},
 count(t,k){const a=S(k),D=DU(k);let h='';const q=sg(t,a+D*.15,a+D*.82),z=lerp(540,580,ez(cl(t,a,a+D*.5)));
  const s=balStr(q);h+=shadow(540,1490,560,.8)+phone(540,990,z,balScreen('$'+s,C.green2,{border:q>=1?'#3ddc84':null}),{rot:fl(t,2,1)});
  const hit=cl(t,a+D*.82,a+D*.86)*(1-cl(t,a+D*.86,a+D));
  h+=TX(540,250,'$'+s,{size:q>=1?78:74,col:C.green2,glow:'#3ddc8488',s:1+.1*hit,p:cl(t,a+D*.1,a+D*.18)});
  h+=pill(540,400,'💰 92 QUADRILLION DOLLARS',{p:cl(t,a+D*.84,a+D*.95),size:46,bg:C.gold});return h},
 compare(t,k){const a=S(k),D=DU(k);let h='';const g=el(cl(t,a+.1,a+.6)),big=ez(cl(t,a+D*.3,a+D*.85));
  // two bars on a baseline: tiny "richest man" vs giant bar shooting off the top
  h+=`<div style="position:absolute;left:120px;right:120px;top:1250px;height:10px;background:${INK};border-radius:5px"></div>`;
  h+=`<div style="position:absolute;left:220px;top:${(1250-24*g).toFixed(0)}px;width:200px;height:${(24*g).toFixed(0)}px;background:#60a5fa;border:5px solid ${INK};border-radius:8px 8px 0 0"></div>`;
  h+=TX(320,1310,'Richest man',{size:38,p:cl(t,a+.2,a+.5)})+TX(320,1370,'$67 billion',{size:44,col:'#60a5fa',p:cl(t,a+.25,a+.55)});
  const bh=lerp(0,1400,big);h+=`<div style="position:absolute;left:660px;top:${(1250-bh).toFixed(0)}px;width:220px;height:${bh.toFixed(0)}px;background:linear-gradient(#35e08a,#1fa45a);border:5px solid ${INK};border-radius:8px 8px 0 0;box-shadow:0 0 40px #3ddc8466"></div>`;
  h+=TX(770,1310,'Chris',{size:38,p:cl(t,a+D*.3,a+D*.5)})+TX(770,1370,'$92 quadrillion',{size:44,col:C.green2,p:cl(t,a+D*.35,a+D*.55)});
  h+=obj('samthink',190,1080+fl(t,3,4),lerp(0,240,el(cl(t,a+D*.2,a+D*.5))));
  h+=TX(540,250,'×'+MG.fmt(Math.round(1e6*sg(t,a+D*.4,a+D*.85)),0),{size:130,col:C.gold,glow:'#ffc94a66',p:cl(t,a+D*.38,a+D*.45)});
  h+=pill(540,400,'🏆 richer than the world’s richest man',{p:cl(t,a,a+.3),size:38});return h},
 panic(t,k){const a=S(k),D=DU(k);let h='';const sh=Math.sin(t*LW(40))*8*cl(t,a+D*.2,a+D*.3);
  h+=shadow(540,1490,520,.8)+phone(540+sh,990,540,balScreen('−$'+BAL,C.red,{label:'You owe?!',border:'#ff5b4a',sub:'USD · June statement'}),{rot:sh*.3});
  h+=obj('samsad',230,1250+fl(t,4,4),lerp(0,320,el(cl(t,a+.05,a+.45))))+sweat(t,230,1060);
  h+=TX(540,250,'"I OWE THIS?!"',{size:108,col:C.red,glow:'#ff5b4a55',p:cl(t,a+.05,a+.3),s:bo(cl(t,a+.05,a+.35))});
  h+=pill(540,400,'😱 his first thought',{p:cl(t,a+.2,a+.5),size:40,bg:C.ink,fg:'#fff'});return h},
 zero(t,k){const a=S(k),D=DU(k);let h='';const q=sg(t,a+D*.35,a+D*.7);
  const txt=q<1?'$'+balStr(1-q):'$0.00';
  h+=shadow(540,1490,520,.8)+phone(540,990+fl(t,1,4),540,balScreen(txt,q<1?C.green2:INK,{fs:q<1?21:64,sub:'USD · logged in'}));
  h+=stamp(540,960,'ERROR',cl(t,a+D*.72,a+D*.82),C.red,-10,96);
  h+=TX(540,250,txt,{size:q<1?74:160,col:q<1?C.green2:C.cream,p:cl(t,a+.1,a+.3)});
  h+=pill(540,410,'🔐 logged in online',{p:cl(t,a,a+.3),size:40});
  h+=obj('samthink',880,1320+fl(t,5,4),260);return h},
 sorry(t,k){const a=S(k),D=DU(k);let h='';
  const msg=`<div style="position:absolute;left:28px;top:80px;font:700 36px P;color:${INK}">Messages</div>`+
   `<div style="position:absolute;left:22px;top:160px;max-width:330px;padding:22px 26px;border-radius:30px 30px 30px 8px;background:#e7edf5;font:500 26px/1.3 P;color:${INK};opacity:${cl(t,a+.1,a+.3).toFixed(2)}">This is obviously an error. We're sorry! 🙏</div>`+
   `<div style="position:absolute;left:22px;top:340px;max-width:330px;padding:22px 26px;border-radius:30px 30px 30px 8px;background:#e7edf5;font:500 26px/1.3 P;color:${INK};opacity:${cl(t,a+D*.45,a+D*.6).toFixed(2)}">We'd like to donate to a charity of your choice. ❤️</div>`;
  h+=shadow(540,1490,520,.8)+phone(540,990+fl(t,1,4),540,msg,{bg:'#ffffff'});
  const hq=el(cl(t,a+D*.55,a+D*.8));h+=`<div style="position:absolute;left:820px;top:${(900+fl(t,2,10)).toFixed(0)}px;font-size:${(190*hq).toFixed(0)}px;transform:translate(-50%,-50%) rotate(${fl(t,3,6).toFixed(1)}deg);filter:drop-shadow(0 12px 18px #0006)">❤️</div>`;
  h+=TX(540,250,'"SORRY!"',{size:140,col:C.cream,p:cl(t,a+.05,a+.3)});
  h+=pill(540,400,'💙 PayPal offered a donation',{p:cl(t,a+D*.5,a+D*.7),size:40,bg:'#1f56b3',fg:'#fff'});
  h+=obj('samhappy',220,1320+fl(t,4,4),lerp(0,280,el(cl(t,a+D*.6,a+D*.9))));return h}
};
const GRADE={hero:'#ffffff00',mail:'#60a5fa0a',count:'#3ddc840c',compare:'#ffc94a0a',panic:'#ff5b4a12',zero:'#14202c14',sorry:'#60a5fa0a'};

function fgLayer(t){let h='';const N=TL.lines.length;
 for(let k=0;k<N;k++){const ty=SP(k).type;const hin=ty==='samyell',hout=k+1<N&&SP(k+1).type==='samyell';
  const a=k===0?-1:(hin?S(k)-.05:S(k)-.2),b=k+1<N?(hout?S(k+1)-.05:S(k+1)+.2):TL.dur+1;if(t<a||t>=b)continue;
  const qi=(k===0||hin)?1:ei(cl(t,a,a+.32)),qo=(k+1<N&&!hout)?ei(cl(t,b-.32,b)):0;const dx=(1-qi)*1150-qo*1150,blur=Math.abs(dx)>4?Math.min(16,Math.abs(dx)/36):0;
  const st=k===0?0:S(k),en=k+1<N?S(k+1):TL.dur,u=cl(t,st,en),z=1+.06*u*(k+1<N?1:1-ei(cl(t,TL.dur-.7,TL.dur-.05)));
  h+=`<div style="position:absolute;inset:0;transform:translateX(${dx.toFixed(1)}px) scale(${z.toFixed(4)});transform-origin:540px 900px;${blur?`filter:blur(${blur.toFixed(1)}px);`:''}">${ANIM[ty](t,k)}</div>`}
 return h}
function camera(t){let sx=0,sy=0,rot=0,z=1;for(const s of SHAKES){const q=(t-s.t)/s.d;if(q<0||q>1)continue;const a=s.a*(1-q)*(1-q);sx+=Math.sin(t*90+s.t)*a;sy+=Math.cos(t*77+s.t*3)*a;rot+=Math.sin(t*60)*a*.04}
 for(const p of PUNCH){const q=(t-p.t)/.35;if(q<0||q>1)continue;z+=p.a*Math.sin(q*Math.PI)}
 return `translate(${sx.toFixed(2)}px,${sy.toFixed(2)}px) rotate(${rot.toFixed(3)}deg) scale(${z.toFixed(4)})`}
function gradeAt(t){const N=TL.lines.length;let k=0;for(let i=0;i<N;i++)if(t>=S(i)-.2)k=i;return GRADE[SP(k).type]||'#0000'}
function draw(t){if(!TL)return;
 $('sky').innerHTML=sky(t);
 const fh=fgLayer(t);if(fh!==$('fg')._h){$('fg').innerHTML=fh;$('fg')._h=fh}
 $('cam').style.transform=camera(t);
 $('fx').innerHTML=dust(t)+bursts(t);
 $('grade').innerHTML=`<div style="position:absolute;inset:0;background:${gradeAt(t)}"></div><div style="position:absolute;inset:0;background:radial-gradient(ellipse at 50% 45%,transparent 60%,#0a2a5044 100%)"></div>`;
 const c=t>=TL.lines[TL.lines.length-1].end-.02?'':MG.captions(t,{y:1570,size:66,maxWords:3,stageW:1080,w:940,upper:true});if(c!==$('cap')._h){$('cap').innerHTML=c;$('cap')._h=c}
 MG.grainTick(t)}

window.setTimeline=tl=>{MG.TL=TL=tl;MG.preload(['samthink','samsad','samhappy','cash'].map(IM));
 const a=i=>S(i),d=i=>DU(i);SHAKES=[];PUNCH=[];BURSTS=[];
 SHAKES.push({t:a(0)+.05,d:.35,a:10});
 PUNCH.push({t:a(1)+d(1)*.5,a:.05});
 SHAKES.push({t:a(2)+d(2)*.84,d:.5,a:18});PUNCH.push({t:a(2)+d(2)*.84,a:.07});BURSTS.push({t:a(2)+d(2)*.85,x:540,y:260,col:C.green});
 PUNCH.push({t:a(3)+d(3)*.85,a:.05});
 SHAKES.push({t:a(4)+d(4)*.2,d:.5,a:14});
 SHAKES.push({t:a(5)+d(5)*.75,d:.4,a:14});PUNCH.push({t:a(5)+d(5)*.75,a:.06});
 PUNCH.push({t:a(6)+d(6)*.6,a:.05});BURSTS.push({t:a(6)+d(6)*.6,x:820,y:900,col:'#ff5b8a'});
 Promise.all([document.fonts.load('700 50px P'),document.fonts.load('500 50px P')]).then(()=>{fontsOk=true},()=>{fontsOk=true})};
Object.defineProperty(window,'ready',{configurable:true,get(){return imgReady&&fontsOk},set(v){imgReady=v}});
window.sfxEvents=()=>{const ev=[],N=TL.lines.length,add=(k,t,o={})=>ev.push(Object.assign({k,t:+t.toFixed(3)},o));
 for(let i=1;i<N;i++)add(i%2?'whoosh':'swish',S(i)-.22,{d:.45});
 for(let k=0;k<N;k++){const sp=SP(k),ty=sp.type,a=S(k),d=DU(k);
  if(ty==='hero'&&k===0){add('impact',a+.05)}
  if(ty==='hero'&&sp.choice){add('pop',a+d*.15);add('pop',a+d*.3);add('pop',a+d*.45)}
  if(ty==='mail'){add('swish',a+.1,{d:.5});add('ding',a+d*.48);add('pop',a+d*.7)}
  if(ty==='count'){for(let i=0;i<8;i++)add('tick',a+d*(.18+i*.08),{f:800+i*120});add('impact',a+d*.84);add('cash',a+d*.86)}
  if(ty==='compare'){add('pop',a+.15);for(let i=0;i<5;i++)add('tick',a+d*(.4+i*.09),{f:900+i*120});add('ding',a+d*.86)}
  if(ty==='panic'){add('impact',a+d*.2);add('pop',a+d*.3)}
  if(ty==='zero'){for(let i=0;i<5;i++)add('tick',a+d*(.36+i*.07),{f:1400-i*180});add('impact',a+d*.74)}
  if(ty==='sorry'){add('pop',a+.15);add('pop',a+d*.5);add('ding',a+d*.62)}}
 ev.sort((a,b)=>a.t-b.t);const out=[];for(const e of ev){if(e.t<0)e.t=0;if(!out.find(o=>o.k==e.k&&Math.abs(o.t-e.t)<.12))out.push(e)}return out};
window.draw=draw;
MG.finish($('stage'),1080,1920,.04,'#0a2a5022',65);
</script>
