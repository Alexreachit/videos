<!doctype html><meta charset=utf-8><style>
@font-face{font-family:P;src:url(fonts/Poppins-Bold.ttf);font-weight:700}
@font-face{font-family:P;src:url(fonts/Poppins-Medium.ttf);font-weight:500}
html,body{margin:0;background:#2f86d0}
#stage{position:relative;width:1080px;height:1920px;overflow:hidden;font-family:P,Arial,sans-serif;background:radial-gradient(circle at 50% 42%,#8fd3ff 0%,#4fa6e6 48%,#2a76c0 100%)}
#pat{position:absolute;inset:-60px;opacity:.13;background-image:radial-gradient(circle,#ffffff 1.8px,transparent 2.4px);background-size:52px 52px}
#mapwrap{position:absolute;inset:0;opacity:0}
#mapsvg{position:absolute;left:0;top:0}
#mapov,#imgs,#fg{position:absolute;inset:0}
#cap{position:absolute;inset:0;z-index:60}
.land{fill:#f4f8fc;stroke:#7fb0da;stroke-width:1.2;vector-effect:non-scaling-stroke}
.st{fill:none;stroke:#a9c9e6;stroke-width:1;vector-effect:non-scaling-stroke}
</style>
<div id=stage><div id=pat></div>
 <div id=mapwrap><svg id=mapsvg width=1080 height=1920><g id=mapg></g></svg><div id=mapov></div></div>
 <div id=fg></div><div id=cap></div></div>
<script src="../lib/core.js"></script>
<script src="../lib/mapdata.js"></script>
<script>
// TikTok 9:16 – Felicity Ace: map route + Gemini objects + ocean animation (sky theme, YT11 style)
const {cl,ez,ei,bo,el,lerp}=MG,$=MG.$,W=1080,H=1920,CX=540,CY=860;
const C={cream:'#fff6e6',gold:'#ffc94a',green:'#3ddc84',green2:'#1fa45a',red:'#ff5b4a',red2:'#d6402e',orange:'#ff9f43',blue:'#2f86d0',ink:'#14202c',sand:'#f1d39a',sand2:'#d9b16b',water:'#3f9fe0',water2:'#2b7fc4'};
let TL=null,fontsOk=false;
const S=i=>TL.lines[i].start,E=i=>TL.lines[i].end,DU=i=>E(i)-S(i),SP=i=>TL.lines[i].spec;
const sg=(t,a,b)=>ei(cl(t,a,b));
// ---------- building blocks
function TX(x,y,txt,o={}){const p=o.p??1;if(p<=0)return'';const sz=o.size||64,s=o.s??1;
 return `<div style="position:absolute;left:${x}px;top:${y}px;transform:translate(-50%,-50%) translateY(${((1-Math.min(1,p))*22).toFixed(1)}px) scale(${s.toFixed(3)}) rotate(${o.rot||0}deg);opacity:${Math.min(1,p).toFixed(3)};font:700 ${sz}px/1.05 P,Arial;color:${o.col||C.cream};white-space:nowrap;text-align:center;text-shadow:${MG.outline(o.ol||Math.max(3,Math.round(sz/13)))},0 ${sz/9}px ${sz/3}px #0a2a5099">${txt}</div>`}
function pill(x,y,txt,o={}){const p=o.p??1;if(p<=0)return'';const sz=o.size||36,s=bo(Math.min(1,p))*(o.s??1);
 const dot=o.dot?`<span style="display:inline-block;width:${sz*.62}px;height:${sz*.62}px;border-radius:50%;background:${o.dot};margin-right:${sz*.3}px;vertical-align:-${sz*.06}px"></span>`:'';
 return `<div style="position:absolute;left:${x}px;top:${y}px;transform:translate(-50%,-50%) scale(${s.toFixed(3)});opacity:${Math.min(1,p*2).toFixed(3)};padding:${sz*.34}px ${sz*.7}px;border-radius:${sz*1.2}px;background:${o.bg||'#ffffffee'};color:${o.fg||C.ink};font:700 ${sz}px/1.1 P,Arial;white-space:nowrap;box-shadow:0 10px 26px #0a2a5066">${dot}${txt}</div>`}
function card(x,y,w,inner,p,o={}){if(p<=0)return'';const s=bo(Math.min(1,p));
 return `<div style="position:absolute;left:${x-w/2}px;top:${y}px;width:${w}px;box-sizing:border-box;transform:scale(${s.toFixed(3)}) rotate(${o.rot||0}deg);transform-origin:50% 0;opacity:${Math.min(1,p*2).toFixed(3)};padding:${o.pad||'20px 30px'};border-radius:30px;background:${o.bg||'#ffffffee'};box-shadow:0 22px 46px #0a2a5066;color:${C.ink};text-align:${o.align||'center'}">${inner}</div>`}
function stamp(x,y,txt,p,col=C.red,rot=-8,sz=70){if(p<=0)return'';const s=lerp(2.2,1,ez(Math.min(1,p)));return `<div style="position:absolute;left:${x}px;top:${y}px;transform:translate(-50%,-50%) rotate(${rot}deg) scale(${s.toFixed(3)});opacity:${Math.min(1,p*2.5).toFixed(3)};padding:10px 30px;border:8px solid ${col};border-radius:18px;color:${col};font:700 ${sz}px/1 P;letter-spacing:3px;background:#ffffffdd;white-space:nowrap">${txt}</div>`}
const IM=k=>`img/${k}.png`;
function obj(k,x,y,w,o={}){const op=o.op??1;if(op<=0.001||w<=1)return'';return `<img src="${IM(k)}" style="position:absolute;left:0;top:0;width:${w.toFixed(1)}px;transform:translate(${(x-w/2).toFixed(1)}px,${(y-w/2).toFixed(1)}px) rotate(${(o.rot||0).toFixed(2)}deg) scaleX(${o.flip?-1:1});opacity:${op.toFixed(3)};${o.noshadow?'':`filter:drop-shadow(0 ${(w/26).toFixed(0)}px ${(w/18).toFixed(0)}px #0a2a5055)`}">`}
const fl=(t,i,a=10)=>Math.sin(t*2.1+i*1.7)*a;
function samImg(k,x,y,w){if(w<2)return'';return `<img src="${IM(k)}" style="position:absolute;left:0;top:0;width:${w.toFixed(1)}px;transform:translate(${(x-w/2).toFixed(1)}px,${(y-w/2).toFixed(1)}px);filter:drop-shadow(0 26px 30px #0a2a5088)">`}
// ocean backdrop with animated waves; sky tint 0=day 1=fire-orange
function ocean(t,sea=1150,fire=0){let h=`<div style="position:absolute;inset:0;background:linear-gradient(${fire>0?`rgb(${Math.round(lerp(93,255,fire*.6))},${Math.round(lerp(182,140,fire))},${Math.round(lerp(245,90,fire))})`:'#5db6f5'},${fire>0?'#ffd2a0':'#bfe6ff'} ${sea/19.2}%,#2b7fc4 ${sea/19.2}%,#1b5a99 100%)"></div>`;
 let w='';for(let r=0;r<6;r++){const y=sea+20+r*85,sp=40+r*25,off=(t*sp)%120;for(let x=-120;x<1200;x+=120)w+=`<path d="M${(x+off).toFixed(0)} ${y} q30 -16 60 0 t60 0" stroke="#ffffff${r<2?'66':'33'}" stroke-width=${6-r*.6} fill=none stroke-linecap=round />`}
 return h+`<svg style="position:absolute;left:0;top:0" width=1080 height=1920>${w}</svg>`}
function waterFront(t,sea){let w='';for(let x=-120;x<1200;x+=120){const off=(t*70)%120;w+=`<path d="M${(x-off).toFixed(0)} ${sea+30} q30 -22 60 0 t60 0 L${(x-off+120).toFixed(0)} 1950 L${(x-off).toFixed(0)} 1950 Z" fill="#2b7fc4" />`}return `<svg style="position:absolute;left:0;top:0" width=1080 height=1920>${w}<rect x=0 y=${sea+40} width=1080 height=900 fill="#246fb0" /></svg>`}
function fire(x,y,w,t,int=1){if(int<=0)return'';let h=obj('smoke',x+40,y-w*.75-((t*30)%40),w*1.25*int,{rot:fl(t,3,4),op:.85*int,noshadow:1});for(let i=0;i<3;i++)h+=obj('flames',x+(i-1)*w*.32,y-w*.18+Math.sin(t*9+i)*8,w*.55*int*(1+.08*Math.sin(t*11+i*2)),{rot:fl(t*3,i,6),noshadow:1});return h}
function hookTitle(){return TX(540,190,'4,000 LUXURY CARS',{size:94,col:C.gold})+TX(540,310,'LOST AT SEA',{size:120,col:'#fff'})}
// ---------- map (two stages)
let mapBuilt=false;
function buildMap(){let h='';for(const k in WORLD)h+=`<path id="c_${k}" class=land d="${WORLD[k]}"/>`;$('mapg').innerHTML=h;mapBuilt=true}
function camOf(c){const [x,y]=MAPP(c[0],c[1]);return {x,y,z:c[2]}}
function scr(cam,lon,lat){const [x,y]=MAPP(lon,lat),s=.96*cam.z;return [CX+(x-cam.x)*s,CY+(y-cam.y)*s]}
const ROUTE=[[7.2,53.37],[4.5,52.6],[1.8,51.2],[-1,50.3],[-5.5,49.2],[-10,46.5],[-18,42],[-26,38.8],[-29.6,37.6],[-40,37.9],[-55,39.5],[-71.4,41.6]],FIRE_I=8;
function pathPts(cam,pts){return pts.map(p=>scr(cam,p[0],p[1]))}
function partial(P,q){let L=[0];for(let i=1;i<P.length;i++)L.push(L[i-1]+Math.hypot(P[i][0]-P[i-1][0],P[i][1]-P[i-1][1]));const tg=L[L.length-1]*q;let d=`M${P[0][0].toFixed(1)} ${P[0][1].toFixed(1)}`,hx=P[0][0],hy=P[0][1],ang=0;
 for(let i=1;i<P.length;i++){ang=Math.atan2(P[i][1]-P[i-1][1],P[i][0]-P[i-1][0]);if(L[i]<=tg){d+=`L${P[i][0].toFixed(1)} ${P[i][1].toFixed(1)}`;hx=P[i][0];hy=P[i][1]}else{const f=(tg-L[i-1])/Math.max(1e-6,L[i]-L[i-1]);hx=lerp(P[i-1][0],P[i][0],f);hy=lerp(P[i-1][1],P[i][1],f);d+=`L${hx.toFixed(1)} ${hy.toFixed(1)}`;break}}return {d,x:hx,y:hy,ang}}
function drawMap(t){const N=TL.lines.length;let v=0,j=-1;for(let k=0;k<N;k++){if(SP(k).type!=='map')continue;const a=S(k)-.2,b=k+1<N?S(k+1)+.2:TL.dur;const vv=cl(t,a,a+.25)*(1-cl(t,b-.25,b));if(vv>v){v=vv;j=k}}
 $('mapwrap').style.opacity=v.toFixed(3);if(v<=0||j<0){if($('mapov')._h){$('mapov').innerHTML='';$('mapov')._h=''}return}
 if(!mapBuilt)buildMap();const sp=SP(j),a=S(j),D=DU(j);
 let c;if(sp.stage===1){c=camOf([-28,46,1.9])}else{const q=sg(t,a,a+D*.5);const c1=camOf([-28,46,1.9]),c2=camOf([-28.5,38.3,7]);c={x:lerp(c1.x,c2.x,q),y:lerp(c1.y,c2.y,q),z:Math.exp(lerp(Math.log(c1.z),Math.log(c2.z),q))}}
 const s=.96*c.z;$('mapg').setAttribute('transform',`translate(${(CX-c.x*s).toFixed(2)},${(CY-c.y*s).toFixed(2)}) scale(${s.toFixed(4)})`);
 const P=pathPts(c,ROUTE),Pf=P.slice(0,FIRE_I+1);let ov='';
 // full planned route dashed, travelled part solid
 const full=partial(P,1);ov+=`<svg style="position:absolute;left:0;top:0" width=1080 height=1920><path d="${full.d}" stroke="#ffffff" stroke-width=6 fill=none stroke-dasharray="14 12" opacity=.7 />`;
 const q=sp.stage===1?sg(t,a+D*.1,a+D*.95)*.8:1;const r=partial(Pf,q);ov+=`<path d="${r.d}" stroke="#ffffff" stroke-width=16 fill=none opacity=.6 stroke-linecap=round /><path d="${r.d}" stroke="${C.orange}" stroke-width=8 fill=none stroke-linecap=round /></svg>`;
 ov+=obj('carrier',r.x,r.y-10,sp.stage===1?150:230,{rot:Math.sin(t*2)*2});
 const [ex,ey]=P[0],[dx,dy]=P[P.length-1];
 if(sp.stage===1){ov+=pill(ex+60,ey-60,'Emden 🇩🇪',{p:cl(t,a,a+.3),size:36,dot:C.gold})+pill(dx+40,dy-60,'Rhode Island 🇺🇸',{p:cl(t,a+.3,a+.6),size:36,dot:C.gold})+pill(540,230,'February 2022',{p:cl(t,a,a+.25),size:60,dot:C.gold})}
 else{const fq=cl(t,a+D*.45,a+D*.6);ov+=fire(r.x,r.y-30,260,t,ez(fq))+pill(540,230,'🔥 FIRE · Feb 16, 2022',{p:cl(t,a+D*.45,a+D*.6),size:52,bg:C.red2,fg:'#fff'})+pill(r.x+20,r.y+120,'near the Azores',{p:cl(t,a+D*.3,a+D*.45),size:36,dot:C.red})}
 if(ov!==$('mapov')._h){$('mapov').innerHTML=ov;$('mapov')._h=ov}}
// ---------- scenes
const ANIM={
 hero(t,k){const sp=SP(k),a=S(k),D=DU(k);const SEA=1180;let h=ocean(t,SEA,.8);
  h+=obj('carrier',560,SEA-120+fl(t,1,6),820,{rot:4+Math.sin(t*1.3)*1.5})+fire(560,SEA-300,420,t,1)+waterFront(t,SEA);
  h+=samImg('samthink',190,1300+fl(t,5,5),420*(k===0?1:el(cl(t,a-.25,a+.35))));
  if(k===0){const q=1-cl(t,a+D*.85,a+D*.98);if(q>0)h+=`<div style="opacity:${q.toFixed(3)}">${hookTitle()}</div>`}
  if(sp.choice){const end=TL.dur,out=1-cl(t,end-.6,end-.2);
   h+=`<div style="opacity:${out.toFixed(3)}">`+TX(540,210,'WOULD YOU?',{size:84,p:cl(t,a+.05,a+.3)})+pill(540,380,'🚢 YES, SHIP IT',{p:cl(t,a+D*.15,a+D*.3),size:56,bg:'#fff'})+pill(540,520,'✈️ NO WAY',{p:cl(t,a+D*.4,a+D*.55),size:56,bg:C.red2,fg:'#fff'})+`</div>`;
   const tin=cl(t,end-.5,end-.06);if(tin>0)h+=`<div style="opacity:${tin.toFixed(3)}">${hookTitle()}</div>`}
  return h},
 cargo(t,k){const a=S(k),D=DU(k);const SEA=1300;let h=ocean(t,SEA,0);
  h+=obj('carrier',560,SEA-170+fl(t,1,5),900,{flip:true,rot:Math.sin(t*1.3)*1});h+=waterFront(t,SEA);
  // cars drive up and into the ship one after another
  const cars=['supercar','sportscar'];for(let i=0;i<6;i++){const st=a+i*D*.12,q=cl(t,st,st+.9);if(q<=0||q>=1)continue;h+=obj(cars[i%2],lerp(-220,560,ez(q)),lerp(1150,980,ez(q))-Math.sin(q*Math.PI)*260,lerp(260,150,q),{rot:lerp(-10,8,q),op:1-Math.max(0,q-.85)/.15})}
  const n=sg(t,a+.1,a+D*.85);h+=card(540,140,860,`<div style="display:flex;justify-content:space-around;align-items:center"><div><div style="font:700 86px/1 P;color:${C.ink}">${MG.fmt(4000*n,0)}</div><div style="font:500 30px P;color:#4a5b6c">cars</div></div><div><div style="font:700 86px/1 P;color:${C.green2}">$${Math.round(401*n)}M</div><div style="font:500 30px P;color:#4a5b6c">cargo value</div></div></div>`,cl(t,a-.1,a+.2));
  ['Porsche','Bentley','Lamborghini'].forEach((b,i)=>{h+=pill(250+i*290,470,b,{p:cl(t,a+D*(.2+i*.12),a+D*(.3+i*.12)),size:40,dot:[C.gold,C.green2,C.orange][i]})});
  return h},
 burn(t,k){const a=S(k),D=DU(k);const SEA=1100;let h=ocean(t,SEA,1);
  h+=obj('carrier',620,SEA-110,760,{rot:6+Math.sin(t)*1.5})+fire(620,SEA-260,460,t,1)+waterFront(t,SEA);
  const rq=el(cl(t,a,a+.5));h+=obj('raft',230,SEA+250+fl(t,2,14),lerp(0,360,rq),{rot:fl(t,3,6)});
  h+=card(250,150,360,`<div style="font:700 74px/1 P;color:${C.green2}">${Math.round(22*sg(t,a+.1,a+D*.4))}/22</div><div style="font:500 28px P;color:#4a5b6c">crew rescued</div>`,cl(t,a+.05,a+.3));
  const dq=sg(t,a+D*.5,a+D*.95),day=1+Math.floor(dq*12);h+=pill(760,1230,'🔥 burning: day '+day,{p:cl(t,a+D*.5,a+D*.6),size:46,bg:C.red2,fg:'#fff'});
  h+=pill(540,1465,'EV batteries made it harder to fight',{p:cl(t,a+D*.62,a+D*.75),size:36,dot:C.red});return h},
 sink(t,k){const a=S(k),D=DU(k);const SEA=1050;let h=ocean(t,SEA,.4);const q=sg(t,a+D*.25,a+D*.95);
  // tug pulls via rope, ship tilts & sinks below the waterline
  const sx=600,sy=SEA-90+q*520,rot=-6-q*28;h+=obj('carrier',sx,sy,760,{rot:-rot});
  h+=fire(sx,sy-200,380,t,1-q*1.2);
  const tx=180+Math.sin(t*2)*6;h+=`<svg style="position:absolute;left:0;top:0" width=1080 height=1920><line x1=${tx+60} y1=${SEA-40} x2=${(sx-300).toFixed(0)} y2=${(sy-40).toFixed(0)} stroke="#f4e3c0" stroke-width=6 stroke-dasharray="14 8" opacity=${(1-q).toFixed(2)} /></svg>`+obj('tug',tx,SEA-60+fl(t,2,6),300,{flip:true,rot:fl(t,3,3)});
  h+=waterFront(t,SEA);
  for(let i=0;i<14;i++){const ph=((t*.9+MG.rnd(i))%1);if(q<.3)break;h+=`<div style="position:absolute;left:${(sx-200+MG.rnd(i+5)*400).toFixed(0)}px;top:${(SEA+360-ph*320).toFixed(0)}px;width:${(14+MG.rnd(i)*22).toFixed(0)}px;height:${(14+MG.rnd(i)*22).toFixed(0)}px;border-radius:50%;border:4px solid #ffffffaa;opacity:${(1-ph).toFixed(2)}"></div>`}
  h+=pill(540,230,'March 1, 2022',{p:cl(t,a,a+.25),size:58,dot:C.gold})+pill(540,360,'⚓ sunk in the Atlantic',{p:cl(t,a+D*.75,a+D*.88),size:46,bg:C.red2,fg:'#fff'});return h}
};
function fgLayer(t){let h='';const N=TL.lines.length;
 for(let k=0;k<N;k++){const ty=SP(k).type;if(!ANIM[ty])continue;
  const a=k===0?-1:S(k)-.2,b=k+1<N?S(k+1)+.2:TL.dur+1;if(t<a||t>b)continue;
  const qi=k===0?1:ei(cl(t,a,a+.32)),qo=k+1<N?ei(cl(t,b-.32,b)):0;
  const dx=(1-qi)*1150-qo*1150,blur=Math.abs(dx)>4?Math.min(14,Math.abs(dx)/40):0;
  const st=k===0?0:S(k),en=k+1<N?S(k+1):TL.dur,u=cl(t,st,en),z=1+.06*u;
  h+=`<div style="position:absolute;inset:0;transform:translateX(${dx.toFixed(1)}px) scale(${z.toFixed(4)});transform-origin:540px 900px;${blur?`filter:blur(${blur.toFixed(1)}px);`:''}">${ANIM[ty](t,k)}</div>`}
 return h}
function draw(t){if(!TL)return;drawMap(t);
 const fh=fgLayer(t);if(fh!==$('fg')._h){$('fg').innerHTML=fh;$('fg')._h=fh}
 $('pat').style.transform=`translateY(${(-(t/TL.dur*52*8)%52).toFixed(1)}px)`;
 const c=t>=TL.lines[TL.lines.length-1].end-.02?'':MG.captions(t,{y:1570,size:66,maxWords:3,stageW:1080,w:940,upper:true});if(c!==$('cap')._h){$('cap').innerHTML=c;$('cap')._h=c}
 MG.grainTick(t)}
let imgReady=false;
window.setTimeline=tl=>{MG.TL=TL=tl;MG.preload(['samhappy','samthink','carrier','supercar','sportscar','flames','smoke','tug','raft'].map(IM));Promise.all([document.fonts.load('700 50px P'),document.fonts.load('500 50px P')]).then(()=>{fontsOk=true},()=>{fontsOk=true})};
Object.defineProperty(window,'ready',{configurable:true,get(){return imgReady&&fontsOk},set(v){imgReady=v}});
window.sfxEvents=()=>{const ev=[],N=TL.lines.length,add=(k,t,o={})=>ev.push(Object.assign({k,t:+t.toFixed(3)},o));
 for(let i=1;i<N;i++)add(i%2?'whoosh':'swish',S(i)-.22,{d:.45});
 for(let k=0;k<N;k++){const sp=SP(k),ty=sp.type,a=S(k),d=DU(k);
  if(ty==='hero'&&k===0)add('impact',a+.05);
  if(ty==='hero'&&sp.choice){add('pop',a+d*.17);add('pop',a+d*.42)}
  if(ty==='map'&&sp.stage===1){add('pop',a+.1);add('pop',a+.4);add('whoosh',a+d*.2,{d:1.5})}
  if(ty==='map'&&sp.stage===2){add('impact',a+d*.47);add('error',a+d*.55)}
  if(ty==='cargo'){for(let i=0;i<6;i++)add('swish',a+i*d*.12+.6,{d:.3});for(let i=0;i<3;i++)add('pop',a+d*(.2+i*.12));add('cash',a+d*.85)}
  if(ty==='burn'){for(let i=0;i<6;i++)add('blip',a+.15+i*d*.05);add('ding',a+d*.42);add('error',a+d*.55)}
  if(ty==='sink'){add('thud',a+d*.3);add('impact',a+d*.8)}}
 ev.sort((a,b)=>a.t-b.t);const out=[];for(const e of ev){if(e.t<0)e.t=0;if(!out.find(o=>o.k==e.k&&Math.abs(o.t-e.t)<.12))out.push(e)}return out};
window.draw=draw;
MG.finish($('stage'),1080,1920,.04,'#0a2a5022',65);
</script>
