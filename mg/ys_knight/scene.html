<!doctype html><meta charset=utf-8><style>
@font-face{font-family:P;src:url(fonts/Poppins-Bold.ttf);font-weight:700}
@font-face{font-family:P;src:url(fonts/Poppins-Medium.ttf);font-weight:500}
html,body{margin:0;background:#0b1a33}
#stage{position:relative;width:1080px;height:1920px;overflow:hidden;font-family:P,Arial,sans-serif;background:radial-gradient(circle at 50% 42%,#3d6fb8 0%,#1d3c6e 50%,#0b1a33 100%)}
#pat{position:absolute;inset:-60px;opacity:.13;background-image:radial-gradient(circle,#ffffff 1.8px,transparent 2.4px);background-size:52px 52px}
#mapwrap{position:absolute;inset:0;opacity:0}
#mapsvg{position:absolute;left:0;top:0}
#mapov,#imgs,#fg{position:absolute;inset:0}
#cap{position:absolute;inset:0;z-index:60}
.land{fill:#f4f8fc;stroke:#7fb0da;stroke-width:1.2;vector-effect:non-scaling-stroke}
.st{fill:none;stroke:#a9c9e6;stroke-width:1;vector-effect:non-scaling-stroke}
</style>
<div id=stage><div id=pat></div>
 <div id=deco style="position:absolute;inset:0"></div><div id=fg></div><div id=cap></div></div>
<script src="../lib/core.js"></script>
<script src="../lib/mapdata.js"></script>
<script>
// Short 9:16 – Knight Capital error emails: Sam + Gemini objects + code animation (sky theme, YT11 style)
const {cl,ez,ei,bo,el,lerp}=MG,$=MG.$,W=1080,H=1920,CX=540,CY=860;
const C={cream:'#fff6e6',gold:'#ffc94a',green:'#3ddc84',green2:'#1fa45a',red:'#ff5b4a',red2:'#d6402e',orange:'#ff9f43',blue:'#2f86d0',ink:'#14202c',sand:'#f1d39a',sand2:'#d9b16b',water:'#3f9fe0',water2:'#2b7fc4'};
let TL=null,fontsOk=false;
const S=i=>TL.lines[i].start,E=i=>TL.lines[i].end,DU=i=>E(i)-S(i),SP=i=>TL.lines[i].spec;
const sg=(t,a,b)=>ei(cl(t,a,b));
// ---------- building blocks
function TX(x,y,txt,o={}){const p=o.p??1;if(p<=0)return'';const sz=o.size||64,s=o.s??1;
 return `<div style="position:absolute;left:${x}px;top:${y}px;transform:translate(-50%,-50%) translateY(${((1-Math.min(1,p))*22).toFixed(1)}px) scale(${s.toFixed(3)}) rotate(${o.rot||0}deg);opacity:${Math.min(1,p).toFixed(3)};font:700 ${sz}px/1.05 P,Arial;color:${o.col||C.cream};white-space:nowrap;text-align:center;text-shadow:${MG.outline(o.ol||Math.max(3,Math.round(sz/13)))},0 ${sz/9}px ${sz/3}px #0a2a5099">${txt}</div>`}
function pill(x,y,txt,o={}){const p=o.p??1;if(p<=0)return'';const sz=o.size||36,s=bo(Math.min(1,p))*(o.s??1);
 const dot=o.dot?`<span style="display:inline-block;width:${sz*.62}px;height:${sz*.62}px;border-radius:50%;background:${o.dot};margin-right:${sz*.3}px;vertical-align:-${sz*.06}px"></span>`:'';
 return `<div style="position:absolute;left:${x}px;top:${y}px;transform:translate(-50%,-50%) scale(${s.toFixed(3)});opacity:${Math.min(1,p*2).toFixed(3)};padding:${sz*.34}px ${sz*.7}px;border-radius:${sz*1.2}px;background:${o.bg||'#ffffffee'};color:${o.fg||C.ink};font:700 ${sz}px/1.1 P,Arial;white-space:nowrap;box-shadow:0 10px 26px #0a2a5066">${dot}${txt}</div>`}
function card(x,y,w,inner,p,o={}){if(p<=0)return'';const s=bo(Math.min(1,p));
 return `<div style="position:absolute;left:${x-w/2}px;top:${y}px;width:${w}px;box-sizing:border-box;transform:scale(${s.toFixed(3)}) rotate(${o.rot||0}deg);transform-origin:50% 0;opacity:${Math.min(1,p*2).toFixed(3)};padding:${o.pad||'20px 30px'};border-radius:30px;background:${o.bg||'#ffffffee'};box-shadow:0 22px 46px #0a2a5066;color:${C.ink};text-align:${o.align||'center'}">${inner}</div>`}
function stamp(x,y,txt,p,col=C.red,rot=-8,sz=70){if(p<=0)return'';const s=lerp(2.2,1,ez(Math.min(1,p)));return `<div style="position:absolute;left:${x}px;top:${y}px;transform:translate(-50%,-50%) rotate(${rot}deg) scale(${s.toFixed(3)});opacity:${Math.min(1,p*2.5).toFixed(3)};padding:10px 30px;border:8px solid ${col};border-radius:18px;color:${col};font:700 ${sz}px/1 P;letter-spacing:3px;background:#ffffffdd;white-space:nowrap">${txt}</div>`}
const IM=k=>`img/${k}.png`;
function obj(k,x,y,w,o={}){const op=o.op??1;if(op<=0.001||w<=1)return'';return `<img src="${IM(k)}" style="position:absolute;left:0;top:0;width:${w.toFixed(1)}px;transform:translate(${(x-w/2).toFixed(1)}px,${(y-w/2).toFixed(1)}px) rotate(${(o.rot||0).toFixed(2)}deg) scaleX(${o.flip?-1:1});opacity:${op.toFixed(3)};filter:drop-shadow(0 ${(w/22).toFixed(0)}px ${(w/16).toFixed(0)}px #0a2a5066)">`}
const fl=(t,i,a=10)=>Math.sin(t*2.1+i*1.7)*a;
function samImg(k,x,y,w){if(w<2)return'';return `<img src="${IM(k)}" style="position:absolute;left:0;top:0;width:${w.toFixed(1)}px;transform:translate(${(x-w/2).toFixed(1)}px,${(y-w/2).toFixed(1)}px);filter:drop-shadow(0 26px 30px #0a2a5088)">`}
function bgDeco(t){let h='';for(let i=0;i<9;i++){const x=(MG.rnd(i)*1180-50+t*(9+MG.rnd(i+4)*10))%1180-50,y=MG.rnd(i+20)*1700+80+Math.sin(t*.7+i)*30;h+=`<div style="position:absolute;left:${x.toFixed(0)}px;top:${y.toFixed(0)}px;font:700 ${(34+MG.rnd(i+7)*36).toFixed(0)}px P;color:#fff;opacity:.12;transform:rotate(${(t*20+i*40)%360}deg)">${['$','▲','▼','@'][i%4]}</div>`}return h}
// trading-floor backdrop: dark glass with moving ticker grid lines
function floor(t){let h=`<div style="position:absolute;left:-60px;right:-60px;top:1390px;height:600px;background:linear-gradient(#24406e,#122544);border-top:6px solid #5fa8ff55"></div>`;
 for(let i=0;i<7;i++)h+=`<div style="position:absolute;left:${(i*190-60+((t*40)%190)).toFixed(0)}px;top:1390px;width:4px;height:600px;background:#5fa8ff22;transform:skewX(-30deg)"></div>`;return h}
function ticker(t,y){let h=`<div style="position:absolute;left:-40px;right:-40px;top:${y}px;height:70px;background:#0b1830cc;border-top:3px solid #ffc94a88;border-bottom:3px solid #ffc94a88;overflow:hidden">`;
 for(let i=0;i<14;i++){const x=((i*170-t*160)%2380+2380)%2380-200,up=MG.rnd(i+3)>.35;h+=`<div style="position:absolute;left:${x.toFixed(0)}px;top:12px;font:700 36px P;color:${up?C.green:C.red}">${up?'▲':'▼'}${(MG.rnd(i)*3+.2).toFixed(1)}%</div>`}
 return h+'</div>'}
function hookTitle(){return TX(540,190,'WHY YOU SHOULD NEVER',{size:62})+TX(540,310,'IGNORE AN',{size:104,col:C.gold})+TX(540,430,'ERROR EMAIL',{size:118,col:C.red})}
function mails(t,n,cx,cy,r0,op=1){let h='';for(let i=0;i<n;i++){const ph=(t*.35+i/n)%1,ang=i*2.399+t*.4,r=r0+ph*260;
  const x=cx+Math.cos(ang)*r,y=cy+Math.sin(ang)*r*.75-ph*80,o=Math.sin(ph*Math.PI)*op;h+=obj('mail',x,y,lerp(90,170,ph),{rot:fl(t,i,14),op:o})}return h}
const money=v=>'$'+MG.fmt(Math.round(v),0);
const ANIM={
 hero(t,k){const sp=SP(k),a=S(k),D=DU(k);let h=floor(t);const p=k===0?1:el(cl(t,a-.25,a+.35));
  h+=`<div style="position:absolute;left:340px;top:1300px;width:640px;height:90px;border-radius:50%;background:#00000033"></div>`;
  h+=mails(t,6,680,980,120);
  h+=obj('laptop',680,1050+fl(t,1,6),600,{rot:fl(t,2,1)});
  h+=samImg('samthink',210,1250+fl(t,5,5),480*p);
  if(k===0){const q=1-cl(t,a+D*.42,a+D*.52);if(q>0)h+=`<div style="opacity:${q.toFixed(3)}">${hookTitle()}</div>`;
   const c=sg(t,a+D*.5,a+D*.92);if(c>0){h+=TX(540,260,'-$'+MG.fmt(Math.round(460*c),0)+' MILLION',{size:96,col:C.red,p:cl(t,a+D*.5,a+D*.58)});
    h+=obj('burn',540,560+fl(t,3,6),lerp(0,360,el(cl(t,a+D*.5,a+D*.7))));h+=pill(540,380,'in one morning',{p:cl(t,a+D*.6,a+D*.7),size:40})}}
  if(sp.choice){const end=TL.dur,out=1-cl(t,end-.6,end-.2);
   h+=`<div style="opacity:${out.toFixed(3)}">`+TX(540,230,'WOULD YOU READ THEM?',{size:76,p:cl(t,a+.05,a+.3)})+pill(540,400,'📧 YES, ALWAYS',{p:cl(t,a+D*.15,a+D*.3),size:54,bg:C.green2,fg:'#fff'})+pill(540,540,'🙈 HONESTLY… NO',{p:cl(t,a+D*.35,a+D*.5),size:54,bg:'#fff'})+`</div>`;
   const tin=cl(t,end-.5,end-.06);if(tin>0)h+=`<div style="opacity:${tin.toFixed(3)}">${hookTitle()}</div>`}
  return h},
 tower(t,k){const a=S(k),D=DU(k);let h=floor(t);
  // growing green bars behind the tower
  for(let i=0;i<5;i++){const q=sg(t,a+.05+i*.12,a+.6+i*.12),bh=(180+i*120)*q;h+=`<div style="position:absolute;left:${110+i*190}px;top:${1390-bh}px;width:120px;height:${bh}px;border-radius:18px 18px 0 0;background:linear-gradient(#5dffa8,${C.green2});opacity:.55"></div>`}
  h+=obj('tower',540,980+fl(t,1,5),lerp(300,760,el(cl(t,a-.15,a+.5))));
  h+=TX(540,250,'2012',{size:170,col:C.gold,p:cl(t,a,a+.25)});
  h+=pill(540,420,'KNIGHT CAPITAL',{p:cl(t,a+D*.2,a+D*.32),size:50,bg:C.ink,fg:'#fff'});
  h+=pill(300,1460,'#1 US stock trader',{p:cl(t,a+D*.5,a+D*.62),size:38,dot:C.green})+pill(780,1460,'~17% of NYSE volume',{p:cl(t,a+D*.62,a+D*.74),size:38,dot:C.gold});
  h+=ticker(t,560);return h},
 servers(t,k){const a=S(k),D=DU(k);let h=floor(t);
  for(let i=0;i<8;i++){const r=Math.floor(i/4),c=i%4,x=170+c*247,y=720+r*420,ap=el(cl(t,a+i*.06,a+i*.06+.35));
   const bad=i===7,bq=cl(t,a+D*.62,a+D*.72),sh=bad&&bq>0?Math.sin(t*40)*10*(1-cl(t,a+D*.8,a+D*1.05)):0;
   if(ap>0)h+=`<div style="position:absolute;left:${x-150}px;top:${y-170}px;width:300px;height:340px;border-radius:50%;background:radial-gradient(#8fd3ff66,#8fd3ff00 70%);opacity:${ap.toFixed(2)}"></div>`;
   h+=obj('server',x+sh,y+fl(t,i,4),lerp(0,300,ap),{op:bad&&bq>0?1:(bad?1:lerp(1,.75,cl(t,a+D*.6,a+D*.7)))});
   const cq=cl(t,a+.25+i*.08,a+.4+i*.08);
   if(!bad&&cq>0)h+=pill(x+70,y-110,'✓',{p:cq,size:44,bg:C.green2,fg:'#fff'});
   if(bad&&bq>0)h+=pill(x+70,y-110,'✗',{p:bq,size:50,bg:C.red2,fg:'#fff'})+`<div style="position:absolute;left:${x-150}px;top:${y-150}px;width:300px;height:300px;border-radius:40px;box-shadow:0 0 ${(40+30*Math.sin(t*12)).toFixed(0)}px ${C.red};opacity:${bq.toFixed(2)}"></div>`}
  h+=TX(540,260,'8 SERVERS',{size:120,p:cl(t,a,a+.25)});
  h+=pill(540,420,'1 missed the update',{p:cl(t,a+D*.62,a+D*.75),size:50,bg:C.red2,fg:'#fff'});return h},
 emails(t,k){const a=S(k),D=DU(k);let h=floor(t);const q=sg(t,a+.1,a+D*.62),n=Math.round(97*q);
  h+=mails(t,9,540,960,150,cl(t,a,a+.3)*(1-.6*cl(t,a+D*.7,a+D*.8)));
  h+=obj('laptop',540,1080+fl(t,1,6),640);
  h+=obj('mail',540,470+fl(t,2,8),lerp(0,300,el(cl(t,a-.1,a+.4))),{rot:fl(t,3,5)});
  h+=`<div style="position:absolute;left:660px;top:330px;min-width:120px;height:120px;padding:0 20px;box-sizing:border-box;border-radius:60px;background:${C.red};color:#fff;font:700 74px/120px P;text-align:center;box-shadow:0 12px 26px #0006;transform:scale(${(1+.12*Math.sin(n*1.7)).toFixed(3)})">${n}</div>`;
  h+=pill(540,220,'⏰ before 9:30 AM',{p:cl(t,a,a+.25),size:46});
  h+=stamp(540,1180,'IGNORED',cl(t,a+D*.78,a+D*.9),C.red,-8,96);return h},
 orders(t,k){const a=S(k),D=DU(k);let h=floor(t);const q=sg(t,a+.05,a+D*.92);
  // order chips flying out of the monitor
  for(let i=0;i<16;i++){const ph=(t*1.6+i/16)%1;if(q<=0)break;const x=540+(MG.rnd(i)-.5)*900*ph,y=900-ph*520+(MG.rnd(i+9)-.5)*80;
   h+=`<div style="position:absolute;left:${x.toFixed(0)}px;top:${y.toFixed(0)}px;transform:translate(-50%,-50%) scale(${(.6+ph*.6).toFixed(2)});opacity:${Math.sin(ph*Math.PI).toFixed(2)};padding:8px 18px;border-radius:14px;background:${i%3?C.green2:C.red2};color:#fff;font:700 30px P">${i%3?'BUY':'SELL'}</div>`}
  h+=obj('monitor',540,990+fl(t,1,4)+Math.sin(t*30)*3*q,600);
  h+=TX(540,250,MG.fmt(Math.round(4000000*q),0),{size:140,col:C.gold});
  h+=pill(540,400,'orders',{p:cl(t,a,a+.2),size:48});
  h+=obj('watch',840,1300+fl(t,2,6),lerp(0,260,el(cl(t,a+.1,a+.5))),{rot:Math.sin(t*9)*6});
  h+=pill(560,1330,Math.round(45*q)+' MIN',{p:cl(t,a+.1,a+.35),size:54,bg:C.ink,fg:'#fff'});return h},
 crash(t,k){const a=S(k),D=DU(k);let h=floor(t);const q=sg(t,a+.05,a+D*.55);
  // stock line chart: flat-ish then a cliff (-70%)
  const pts=[];for(let i=0;i<=40;i++){const x=i/40;let v=x<.45?.85+Math.sin(i*1.3)*.03:lerp(.85,.22,ez(cl(x,.45,.8)))+Math.sin(i*2.1)*.02;pts.push([90+x*900,560+(1-v)*620])}
  const m=Math.max(2,Math.round(q*41));const d='M'+pts.slice(0,m).map(p=>p[0].toFixed(0)+','+p[1].toFixed(0)).join(' L');
  h+=`<svg width="1080" height="1300" style="position:absolute;left:0;top:0"><path d="${d}" fill="none" stroke="${C.red}" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" style="filter:drop-shadow(0 0 12px #ff5b4a99)" /></svg>`;
  const lp=pts[m-1];h+=`<div style="position:absolute;left:${lp[0]-18}px;top:${lp[1]-18}px;width:36px;height:36px;border-radius:50%;background:#fff;box-shadow:0 0 24px ${C.red}"></div>`;
  h+=obj('arrowdown',870,820+fl(t,1,8),lerp(0,240,el(cl(t,a+D*.35,a+D*.55))));
  h+=TX(540,300,'-'+Math.round(70*cl(q*1.6-.6,0,1))+'%',{size:180,col:C.red,p:cl(t,a+D*.25,a+D*.35)});
  h+=obj('burn',300,1260+fl(t,2,6),lerp(0,330,el(cl(t,a+D*.4,a+D*.65))));
  h+=pill(720,1290,'🛟 $400M rescue',{p:cl(t,a+D*.72,a+D*.85),size:46,bg:C.green2,fg:'#fff'});return h}
};
function fgLayer(t){let h='';const N=TL.lines.length;
 for(let k=0;k<N;k++){const ty=SP(k).type;if(!ANIM[ty])continue;
  const a=k===0?-1:S(k)-.2,b=k+1<N?S(k+1)+.2:TL.dur+1;if(t<a||t>b)continue;
  const qi=k===0?1:ei(cl(t,a,a+.32)),qo=k+1<N?ei(cl(t,b-.32,b)):0;
  const dx=(1-qi)*1150-qo*1150,blur=Math.abs(dx)>4?Math.min(14,Math.abs(dx)/40):0;
  const st=k===0?0:S(k),en=k+1<N?S(k+1):TL.dur,u=cl(t,st,en),z=1+.06*u;
  h+=`<div style="position:absolute;inset:0;transform:translateX(${dx.toFixed(1)}px) scale(${z.toFixed(4)});transform-origin:540px 900px;${blur?`filter:blur(${blur.toFixed(1)}px);`:''}">${ANIM[ty](t,k)}</div>`}
 return h}
function draw(t){if(!TL)return;
 $('deco').innerHTML=bgDeco(t);
 const fh=fgLayer(t);if(fh!==$('fg')._h){$('fg').innerHTML=fh;$('fg')._h=fh}
 $('pat').style.transform=`translateY(${(-(t/TL.dur*52*8)%52).toFixed(1)}px)`;
 const c=t>=TL.lines[TL.lines.length-1].end-.02?'':MG.captions(t,{y:1570,size:66,maxWords:3,stageW:1080,w:940,upper:true});if(c!==$('cap')._h){$('cap').innerHTML=c;$('cap')._h=c}
 MG.grainTick(t)}
let imgReady=false;
window.setTimeline=tl=>{MG.TL=TL=tl;MG.preload(['samthink','laptop','mail','tower','server','monitor','watch','burn','arrowdown'].map(IM));Promise.all([document.fonts.load('700 50px P'),document.fonts.load('500 50px P')]).then(()=>{fontsOk=true},()=>{fontsOk=true})};
Object.defineProperty(window,'ready',{configurable:true,get(){return imgReady&&fontsOk},set(v){imgReady=v}});
window.sfxEvents=()=>{const ev=[],N=TL.lines.length,add=(k,t,o={})=>ev.push(Object.assign({k,t:+t.toFixed(3)},o));
 for(let i=1;i<N;i++)add(i%2?'whoosh':'swish',S(i)-.22,{d:.45});
 for(let k=0;k<N;k++){const sp=SP(k),ty=sp.type,a=S(k),d=DU(k);
  if(ty==='hero'&&k===0){add('impact',a+.05);add('error',a+d*.5);for(let i=0;i<6;i++)add('tick',a+d*(.52+i*.06),{f:900+i*90});add('impact',a+d*.9)}
  if(ty==='hero'&&sp.choice){add('pop',a+d*.17);add('pop',a+d*.37)}
  if(ty==='tower'){for(let i=0;i<5;i++)add('pop',a+.1+i*.12);add('ding',a+d*.55)}
  if(ty==='servers'){for(let i=0;i<7;i++)add('tick',a+.3+i*.08,{f:1300+i*60});add('error',a+d*.64)}
  if(ty==='emails'){for(let i=0;i<9;i++)add('pop',a+.15+i*d*.06);add('impact',a+d*.8)}
  if(ty==='orders'){for(let i=0;i<10;i++)add('tick',a+d*(.05+i*.09),{f:1100+i*90});add('error',a+d*.9)}
  if(ty==='crash'){add('swish',a+d*.3,{d:.8});add('impact',a+d*.5);add('ding',a+d*.75)}}
 ev.sort((a,b)=>a.t-b.t);const out=[];for(const e of ev){if(e.t<0)e.t=0;if(!out.find(o=>o.k==e.k&&Math.abs(o.t-e.t)<.12))out.push(e)}return out};
window.draw=draw;
MG.finish($('stage'),1080,1920,.04,'#0a2a5022',65);
</script>
