const LIGHT = {

};
let curL = '';
function setLight(k, flash = 0) { const L = LIGHT[k]; w.sun = G.v.norm(L.sun); w.sunCol = G.v.lerp(G.hex(L.sunCol), [1.25, 1.25, 1.35], flash); w.sky = G.v.lerp(G.hex(L.sky), [.9, .92, 1], flash * .7); w.gnd = G.hex(L.gnd); w.fog = G.hex(L.fog); w.fogN = L.fogN; w.fogF = L.fogF; w.shCol = G.hex(L.shCol); if (curL != k) { $('bg').style.background = L.bg; curL = k } }
const M = (geo, o = {}) => w.mesh(geo, o);
const at = (g, p, r = [0, 0, 0], s = [1, 1, 1]) => [g, G.m4.compose(p, r, s)];
function merge(list) { const g = new G.Geo(); list.forEach(([a, m]) => g.add(a, m)); return g }
// ---------- Flugzeug (727-artig, ohne Airline-Branding) ----------
const WHITE = '#eef1f5', BLUE = '#2f5fae', GREY = '#aab3c2';
function plane(pos, ground) {
  const root = M(merge([
    at(G.cyl(1.9, 1.9, 38, 22, WHITE), [-19, 0, 0], [0, 0, -PI / 2]),

    // Fluegel (gepfeilt)
    at(G.box(4.6, .32, 16, GREY), [-1.6, -1.15, 8.8], [0, -.45, 0]), at(G.box(4.6, .32, 16, GREY), [-1.6, -1.15, -8.8], [0, .45, 0]),
    // Leitwerk (T-Tail)

    at(G.box(2.4, .26, 6.2, '#c64a3a'), [-24.8, 7.7, 3.0], [0, -.5, 0]), at(G.box(2.4, .26, 6.2, '#c64a3a'), [-24.8, 7.7, -3.0], [0, .5, 0]),

// Wolken rund um das Flugzeug (ziehen vorbei = Tempo)

for (let k = 0; k < 16; k++) { const g = new G.Geo(); for (let j = 0; j < 5; j++) g.add(G.ico(3 + G.hash(k, j) * 2.5, 2, '#8e9bc6'), G.m4.compose([j * 4 - 8, G.hash(j, k) * 1.5, G.hash(j, k + 3) * 3], [0, 0, 0], [1.4, .6, 1.1]));

// ---------- Kabine (z=+300) ----------
const C0 = [0, 0, 300];
(function cabin() {

const BUN = [...Array(4)].map((_, k) => M(merge([at(G.box(.42, .12, .2, '#7d8a5a'), [0, 0, 0]), at(G.box(.08, .13, .21, '#c9bf96'), [.08, 0, 0])]).vary(.12, k), { pos: [RV[0] + .35 + k * .3, .05, RV[2] + 2.0 + (k % 2) * .25], rot: [0, k * .5, 0], scl: [1.7, 1.7, 1.7], cast: false }));
const HOLE = M(G.cyl(.6, .45, .05, 16, '#b89a62'), { pos: [RV[0] + .8, .005, RV[2] + 2.1], outline: false, cast: false });
// ---------- Wald bei Nacht (z=+600) ----------
const FO = [0, 0, 600];
(function forest() {
  M(merge([at(G.box(500, 1, 500, '#25354a', { base: true }), [FO[0], -1, FO[2]])]), { outline: false });
  const T = []; for (let k = 0; k < 900; k++) { const x = FO[0] - 90 + (k % 30) * 6 + G.hash(k) * 4, z = FO[2] - 110 + Math.floor(k / 30) * 6.5 + G.hash(k, 2) * 4;

    T.push(at(G.cyl(2.0, 0, h, 7, ['#24563a', '#2d6644', '#1f4a34'][k % 3]), [x, 0, z]), at(G.cyl(.25, .25, 1.2, 6, '#4a3a2a'), [x, -.6, z])) }

// ================= Figuren (2D-SVG) =================
const GLASSES = `<path d="M62,74 Q100,68 140,74 L138,96 Q122,102 104,94 L96,94 Q80,102 64,96 Z" fill="#1b1d26" stroke="${OL}" stroke-width="4"/><path d="M70,78 L84,77" stroke="#7a86b8" stroke-width="4" stroke-linecap="round"/>`;
const TIE = `<path d="M84,150 L100,176 L116,150Z" fill="#fff" stroke="${OL}" stroke-width="3"/><path d="M100,160 L93,176 L100,214 L107,176Z" fill="#14141a" stroke="${OL}" stroke-width="3"/>`;
const HAT_STEW = `<path d="M70,30 Q70,12 100,12 Q130,12 130,30 L132,40 L68,40 Z" fill="#2f5fae" stroke="${OL}" stroke-width="5" stroke-linejoin="round"/><path d="M28,84 Q20,10 100,6 Q180,10 172,84 Q164,40 100,40 Q36,40 28,84Z" fill="#6a4a2e" stroke="${OL}" stroke-width="5"/>`;
const SCARF = `<path d="M80,150 L100,170 L120,150 L114,184 L100,172 L86,184Z" fill="#ffd166" stroke="${OL}" stroke-width="3"/>`;
const HAT_CAP = `<path d="M38,50 Q38,8 100,6 Q162,8 162,50 Q100,40 38,50Z" fill="#c0303a" stroke="${OL}" stroke-width="6"/><path d="M128,44 Q176,40 188,56 Q150,62 124,54Z" fill="#9a2430" stroke="${OL}" stroke-width="6" stroke-linejoin="round"/>`;
const HAIR = ['', `<path d="M40,60 Q44,14 100,16 Q156,14 160,60 Q140,34 100,36 Q60,34 40,60Z" fill="#5a3a24" stroke="${OL}" stroke-width="5"/>`, `<path d="M42,56 Q56,22 100,22 Q144,22 158,56 Q124,40 100,42 Q76,40 42,56Z" fill="#2a2a30" stroke="${OL}" stroke-width="5"/>`, `<path d="M36,92 Q28,14 100,12 Q172,14 164,92 Q158,46 100,44 Q42,46 36,92Z" fill="#c9a04a" stroke="${OL}" stroke-width="5"/>`];
const SWEAT = `<path d="M160,40 Q172,62 160,70 Q148,62 160,40Z" fill="#8fd3ff" stroke="${OL}" stroke-width="4"/>`;

const P_CASE = `<g transform="translate(-40,-8)"><rect x="0" y="0" width="80" height="58" rx="8" fill="#6a4a30" stroke="${OL}" stroke-width="5"/><path d="M28,0 L28,-10 L52,-10 L52,0" fill="none" stroke="${OL}" stroke-width="5"/><rect x="0" y="22" width="80" height="6" fill="#4a3220"/><rect x="34" y="16" width="12" height="10" fill="#d6b45a" stroke="${OL}" stroke-width="2"/></g>`;
const P_BAG = `<g transform="translate(-36,-20)"><path d="M14,10 Q36,-6 58,10 L68,60 Q36,78 4,60 Z" fill="#cdb98a" stroke="${OL}" stroke-width="5" stroke-linejoin="round"/><path d="M16,10 Q36,22 56,10" fill="none" stroke="${OL}" stroke-width="4"/><text x="36" y="56" text-anchor="middle" font-family="IB,Arial" font-weight="900" font-size="30" fill="#2f6e3c">$</text></g>`;
const P_PACK = `<g transform="translate(-26,-30)"><rect x="0" y="0" width="52" height="44" rx="10" fill="#d9822b" stroke="${OL}" stroke-width="5"/><path d="M10,0 L10,44 M42,0 L42,44" stroke="#9a5418" stroke-width="4"/></g>`;
const LOOK = {
  coop: { sw: '#2b2e3a', swd: '#1e2029', pa: '#2b2e3a', hat: GLASSES + `<path d="M44,62 Q48,18 100,18 Q152,18 156,62 Q138,36 100,38 Q62,36 44,62Z" fill="#2a2420" stroke="${OL}" stroke-width="5"/>`, mid: TIE },

  agent: { sw: '#4a4f5e', swd: '#383c48', pa: '#3a3e4a', hat: `<path d="M46,48 Q42,4 100,2 Q158,4 154,48Z" fill="#3a3e4a" stroke="${OL}" stroke-width="6"/><path d="M28,48 Q100,34 172,48 Q174,60 100,58 Q26,60 28,48Z" fill="#2a2e38" stroke="${OL}" stroke-width="5"/>`, mid: TIE },

const PAXC = ['#7a4f8a', '#4f8a3c', '#b5803f', '#3f7fb5', '#8a3c3c', '#5e6a7a', '#a0703a', '#3c8a84'];
function fig(p, who, o = {}, H3 = 1.75, clipY = null) {

}
const walk = (t, sp = 9) => ({ legL: .35 * Math.sin(t * sp), legR: -.35 * Math.sin(t * sp), bob: Math.abs(Math.sin(t * sp)) * 6 });
// Punkt auf der Hecktreppe (Abstand d vom Scharnier), Treppenwinkel a
function stairPt(pl, a, d) { const r = pl.root.pos, h = pl.stair.pos; return [r[0] + h[0] - d * Math.cos(a), r[1] + h[1] - d * Math.sin(a) + .1, r[2] + h[2]] }

// ================= Timeline =================
const Lt = i => MG.L(i);
