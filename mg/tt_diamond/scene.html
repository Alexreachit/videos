<!doctype html><meta charset=utf-8><style>
@font-face{font-family:P;src:url(fonts/Poppins-Bold.ttf);font-weight:700}
@font-face{font-family:P;src:url(fonts/Poppins-Medium.ttf);font-weight:500}
html,body{margin:0;background:#2f86d0}
#stage{position:relative;width:1080px;height:1920px;overflow:hidden;font-family:P,Arial,sans-serif;background:radial-gradient(circle at 50% 42%,#8fd3ff 0%,#4fa6e6 48%,#2a76c0 100%)}
#pat{position:absolute;inset:-60px;opacity:.13;background-image:radial-gradient(circle,#ffffff 1.8px,transparent 2.4px);background-size:52px 52px}
#mapwrap{position:absolute;inset:0;opacity:0}
#mapsvg{position:absolute;left:0;top:0}
#mapov,#imgs,#fg{position:absolute;inset:0}
#cap{position:absolute;inset:0;z-index:60}
.land{fill:#f4f8fc;stroke:#7fb0da;stroke-width:1.2;vector-effect:non-scaling-stroke}
.st{fill:none;stroke:#a9c9e6;stroke-width:1;vector-effect:non-scaling-stroke}
</style>
<div id=stage><div id=pat></div>
 <div id=deco style="position:absolute;inset:0"></div><div id=fg></div><div id=cap></div></div>
<script src="../lib/core.js"></script>
<script src="../lib/mapdata.js"></script>
<script>
// TikTok 9:16 – Diamond ring: Sam + Gemini objects + code animation (sky theme, YT11 style)
const {cl,ez,ei,bo,el,lerp}=MG,$=MG.$,W=1080,H=1920,CX=540,CY=860;
const C={cream:'#fff6e6',gold:'#ffc94a',green:'#3ddc84',green2:'#1fa45a',red:'#ff5b4a',red2:'#d6402e',orange:'#ff9f43',blue:'#2f86d0',ink:'#14202c',sand:'#f1d39a',sand2:'#d9b16b',water:'#3f9fe0',water2:'#2b7fc4'};
let TL=null,fontsOk=false;
const S=i=>TL.lines[i].start,E=i=>TL.lines[i].end,DU=i=>E(i)-S(i),SP=i=>TL.lines[i].spec;
const sg=(t,a,b)=>ei(cl(t,a,b));
// ---------- building blocks
function TX(x,y,txt,o={}){const p=o.p??1;if(p<=0)return'';const sz=o.size||64,s=o.s??1;
 return `<div style="position:absolute;left:${x}px;top:${y}px;transform:translate(-50%,-50%) translateY(${((1-Math.min(1,p))*22).toFixed(1)}px) scale(${s.toFixed(3)}) rotate(${o.rot||0}deg);opacity:${Math.min(1,p).toFixed(3)};font:700 ${sz}px/1.05 P,Arial;color:${o.col||C.cream};white-space:nowrap;text-align:center;text-shadow:${MG.outline(o.ol||Math.max(3,Math.round(sz/13)))},0 ${sz/9}px ${sz/3}px #0a2a5099">${txt}</div>`}
function pill(x,y,txt,o={}){const p=o.p??1;if(p<=0)return'';const sz=o.size||36,s=bo(Math.min(1,p))*(o.s??1);
 const dot=o.dot?`<span style="display:inline-block;width:${sz*.62}px;height:${sz*.62}px;border-radius:50%;background:${o.dot};margin-right:${sz*.3}px;vertical-align:-${sz*.06}px"></span>`:'';
 return `<div style="position:absolute;left:${x}px;top:${y}px;transform:translate(-50%,-50%) scale(${s.toFixed(3)});opacity:${Math.min(1,p*2).toFixed(3)};padding:${sz*.34}px ${sz*.7}px;border-radius:${sz*1.2}px;background:${o.bg||'#ffffffee'};color:${o.fg||C.ink};font:700 ${sz}px/1.1 P,Arial;white-space:nowrap;box-shadow:0 10px 26px #0a2a5066">${dot}${txt}</div>`}
function card(x,y,w,inner,p,o={}){if(p<=0)return'';const s=bo(Math.min(1,p));
 return `<div style="position:absolute;left:${x-w/2}px;top:${y}px;width:${w}px;box-sizing:border-box;transform:scale(${s.toFixed(3)}) rotate(${o.rot||0}deg);transform-origin:50% 0;opacity:${Math.min(1,p*2).toFixed(3)};padding:${o.pad||'20px 30px'};border-radius:30px;background:${o.bg||'#ffffffee'};box-shadow:0 22px 46px #0a2a5066;color:${C.ink};text-align:${o.align||'center'}">${inner}</div>`}
function stamp(x,y,txt,p,col=C.red,rot=-8,sz=70){if(p<=0)return'';const s=lerp(2.2,1,ez(Math.min(1,p)));return `<div style="position:absolute;left:${x}px;top:${y}px;transform:translate(-50%,-50%) rotate(${rot}deg) scale(${s.toFixed(3)});opacity:${Math.min(1,p*2.5).toFixed(3)};padding:10px 30px;border:8px solid ${col};border-radius:18px;color:${col};font:700 ${sz}px/1 P;letter-spacing:3px;background:#ffffffdd;white-space:nowrap">${txt}</div>`}
const IM=k=>`img/${k}.png`;
function obj(k,x,y,w,o={}){const op=o.op??1;if(op<=0.001||w<=1)return'';return `<img src="${IM(k)}" style="position:absolute;left:0;top:0;width:${w.toFixed(1)}px;transform:translate(${(x-w/2).toFixed(1)}px,${(y-w/2).toFixed(1)}px) rotate(${(o.rot||0).toFixed(2)}deg);opacity:${op.toFixed(3)};filter:drop-shadow(0 ${(w/22).toFixed(0)}px ${(w/16).toFixed(0)}px #0a2a5066)${o.f||''}">`}
const fl=(t,i,a=10)=>Math.sin(t*2.1+i*1.7)*a;
function bgDeco(t){let h='';for(let i=0;i<10;i++){const x=(MG.rnd(i)*1180-50+t*(10+MG.rnd(i+4)*10))%1180-50,y=MG.rnd(i+20)*1700+80+Math.sin(t*.7+i)*30;h+=`<div style="position:absolute;left:${x.toFixed(0)}px;top:${y.toFixed(0)}px;font-size:${(30+MG.rnd(i+7)*40).toFixed(0)}px;opacity:${(.18+.12*Math.sin(t*3+i)).toFixed(2)};transform:rotate(${(t*20+i*40)%360}deg)">✦</div>`}return h}
function ground(){return `<div style="position:absolute;left:-60px;right:-60px;top:1390px;height:600px;background:linear-gradient(#e9eef6,#cfd8e6);border-top:6px solid #ffffff88"></div>`}
function sparkle(x,y,t,i,s=1){const p=(Math.sin(t*4+i*2.3)+1)/2;return `<div style="position:absolute;left:${x-30}px;top:${y-30}px;width:60px;height:60px;font-size:${(50*s).toFixed(0)}px;line-height:60px;text-align:center;color:#fff;opacity:${p.toFixed(2)};transform:scale(${(.5+p*.8).toFixed(2)}) rotate(${(t*60)%360}deg);text-shadow:0 0 18px #fff">✦</div>`}
function hookTitle(){return TX(540,200,'WHY YOU SHOULD NEVER',{size:62})+TX(540,320,'BUY A DIAMOND',{size:110,col:C.gold})+TX(540,440,'RING',{size:130,col:C.gold})}
function samImg(k,x,y,w){return `<img src="${IM(k)}" style="position:absolute;left:0;top:0;width:${w.toFixed(1)}px;transform:translate(${(x-w/2).toFixed(1)}px,${(y-w/2).toFixed(1)}px);filter:drop-shadow(0 26px 30px #0a2a5088)">`}
const ANIM={
 hero(t,k){const sp=SP(k),a=S(k),D=DU(k);let h=ground();const p=k===0?1:el(cl(t,a-.25,a+.35));
  const by=1060+fl(t,3,16);h+=obj('ringbox',760,by,440,{rot:-6+fl(t,4,3)})+sparkle(790,by-90,t,1,1.2)+sparkle(700,by-150,t,2,.8);
  const rq=k===0?1:cl(t,a+.1,a+.4);h+=`<div style="position:absolute;left:${760-200}px;top:${by-200}px;width:400px;height:400px;border-radius:50%;border:18px solid ${C.red};box-sizing:border-box;transform:scale(${bo(rq).toFixed(3)}) rotate(-45deg);opacity:${rq.toFixed(2)}"><div style="position:absolute;left:50%;top:0;bottom:0;width:18px;margin-left:-9px;background:${C.red}"></div></div>`;
  h+=samImg('samthink',290+0*p,1200+fl(t,5,5),560*p);
  if(k===0){const q=1-cl(t,a+D*.85,a+D*.98);if(q>0)h+=`<div style="opacity:${q.toFixed(3)}">${hookTitle()}</div>`}
  if(sp.choice){const end=TL.dur,out=1-cl(t,end-.6,end-.2);
   h+=`<div style="opacity:${out.toFixed(3)}">`+TX(540,230,'WOULD YOU?',{size:84,p:cl(t,a+.05,a+.3)})+pill(540,410,'💍 YES, NATURAL',{p:cl(t,a+D*.15,a+D*.3),size:56,bg:'#fff'})+pill(540,550,'🧪 NO, LAB-GROWN',{p:cl(t,a+D*.35,a+D*.5),size:56,bg:C.green2,fg:'#fff'})+`</div>`;
   const tin=cl(t,end-.5,end-.06);if(tin>0)h+=`<div style="opacity:${tin.toFixed(3)}">${hookTitle()}</div>`}
  return h},
 ad(t,k){const a=S(k),D=DU(k);let h=`<div style="position:absolute;inset:0;background:radial-gradient(circle at 50% 40%,#fff3d6,#e8c98a 70%,#b98a4a)"></div>`;
  const pq=el(cl(t,a-.1,a+.5));h+=obj('poster',540,700+fl(t,1,10),lerp(200,760,pq),{rot:Math.sin(t*1.6)*2});
  h+=pill(540,190,'1947',{p:cl(t,a,a+.25),size:64,dot:C.gold});
  h+=obj('typewriter',190,1300,lerp(0,330,el(cl(t,a+.2,a+.7))),{rot:fl(t,2,2)});
  const sl='“A DIAMOND IS FOREVER”',tq=cl(t,a+D*.55,a+D*.92),n=Math.floor(tq*sl.length);
  if(n>0)h+=`<div style="position:absolute;left:40px;right:40px;top:1140px;text-align:center;font:700 italic 66px/1.1 Georgia,serif;color:#3a2410;text-shadow:0 3px 0 #fff8">${sl.slice(0,n)}<span style="opacity:${(Math.sin(t*12)>0?1:0)}">|</span></div>`;
  h+=pill(540,1440,'De Beers · ad agency N.W. Ayer',{p:cl(t,a+D*.3,a+D*.45),size:34,dot:C.gold});return h},
 must(t,k){const a=S(k),D=DU(k);let h=ground();
  for(let i=0;i<12;i++){const c=i%3,r=Math.floor(i/3),st=a+i*D*.05,q=bo(cl(t,st,st+.35));if(q<=0)continue;h+=`<div style="position:absolute;left:0;top:0;transform:translate(${(220+c*320)}px,${(560+r*230+fl(t,i,8)).toFixed(0)}px) scale(${q.toFixed(3)})">${obj('ringbox',0,0,230,{rot:fl(t,i+3,5)})}</div>`}
  h+=pill(540,250,'THE NEW STANDARD',{p:cl(t,a,a+.2),size:60,bg:C.red2,fg:'#fff'})+pill(540,1460,'💍 every engagement',{p:cl(t,a+D*.5,a+D*.65),size:46});return h},
 resell(t,k){const a=S(k),D=DU(k);let h=ground();const q=sg(t,a+D*.45,a+D*.8);
  h+=obj('ringbox',400,880+fl(t,1,12),460,{rot:fl(t,2,3)})+sparkle(420,760,t,3);
  const sw=Math.sin(t*2.6)*8,val=lerp(10000,3500,q);
  h+=`<div style="position:absolute;left:0;top:0;transform:translate(800px,1050px) rotate(${sw.toFixed(1)}deg);transform-origin:0 -80px">${obj('tag',0,0,380)}<div style="position:absolute;left:-140px;top:10px;width:230px;text-align:center;transform:rotate(-8deg);font:700 ${q>0?50:50}px P;color:${q>.95?C.red2:C.ink}">$${MG.fmt(val,0)}</div></div>`;
  // value bar
  h+=`<div style="position:absolute;left:140px;top:1420px;width:800px;height:70px;border-radius:35px;background:#ffffff66;box-shadow:inset 0 0 0 5px #fff;overflow:hidden"><div style="height:100%;width:${(100-65*q).toFixed(1)}%;background:linear-gradient(90deg,${C.green2},${q>.5?C.red:C.green2})"></div></div>`+TX(540,1455,Math.round(100-65*q)+'% back',{size:46,col:'#fff'});
  h+=pill(540,230,q<.05?'PAID: $10,000':'BEST OFFER: 35%',{p:cl(t,a,a+.2),size:58,bg:q<.05?'#fff':C.red2,fg:q<.05?C.ink:'#fff'});return h},
 crash(t,k){const a=S(k),D=DU(k);let h='';const q=sg(t,a+.1,a+D*.7);
  h+=obj('diamond',360,700+fl(t,1,12)+q*120,lerp(380,300,q),{rot:fl(t,2,6)+q*20});
  h+=obj('arrowdown',760,900+fl(t,3,8),lerp(0,520,el(cl(t,a,a+.5))),{rot:fl(t,4,3)});
  h+=TX(540,300,'−'+Math.round(30*q)+'%',{size:190,col:C.red,p:cl(t,a,a+.2)});
  h+=card(540,1250,760,`<div style="font:500 32px P;color:#4a5b6c">natural 1-carat diamond</div><div style="font:700 74px/1.1 P;color:${C.ink}">$${MG.fmt(lerp(6000,4200,q),0)}</div><div style="font:500 28px P;color:#4a5b6c">2021 → 2025 (avg.)</div>`,cl(t,a+.1,a+.35));return h},
 lab(t,k){const a=S(k),D=DU(k);let h=ground();
  h+=obj('diamond',290,760+fl(t,1,12),360,{rot:fl(t,2,5)})+obj('beaker',790,760+fl(t,3,12),lerp(0,400,el(cl(t,a,a+.5))),{rot:fl(t,4,3)});
  h+=TX(540,760,'=',{size:150,p:cl(t,a+D*.2,a+D*.3)})+pill(540,560,'same carbon crystal',{p:cl(t,a+D*.25,a+D*.38),size:40,dot:C.green2});
  h+=pill(290,1000,'natural',{p:cl(t,a,a+.2),size:42})+pill(790,1000,'lab-grown',{p:cl(t,a+.2,a+.4),size:42,dot:C.green2});
  const q=sg(t,a+D*.5,a+D*.85);
  h+=`<div style="position:absolute;left:190px;bottom:${1920-1380}px;width:200px;height:300px;border-radius:24px 24px 0 0;background:${C.red};box-shadow:0 14px 30px #0a2a5055"></div><div style="position:absolute;left:690px;bottom:${1920-1380}px;width:200px;height:${lerp(300,60,q).toFixed(0)}px;border-radius:24px 24px 0 0;background:${C.green2};box-shadow:0 14px 30px #0a2a5055"></div>`;
  h+=TX(790,lerp(1050,1270,q),'−'+Math.round(80*q)+'%',{size:90,col:C.green,p:q>0?1:0})+pill(540,230,'UP TO 80% CHEAPER',{p:cl(t,a+D*.55,a+D*.7),size:56,bg:C.green2,fg:'#fff'});return h}
};
function seqR(k){return [k,k]}
function fgLayer(t){let h='';const N=TL.lines.length;
 for(let k=0;k<N;k++){const ty=SP(k).type;if(!ANIM[ty])continue;
  const a=k===0?-1:S(k)-.2,b=k+1<N?S(k+1)+.2:TL.dur+1;if(t<a||t>b)continue;
  const qi=k===0?1:ei(cl(t,a,a+.32)),qo=k+1<N?ei(cl(t,b-.32,b)):0;
  const dx=(1-qi)*1150-qo*1150,blur=Math.abs(dx)>4?Math.min(14,Math.abs(dx)/40):0;
  const st=k===0?0:S(k),en=k+1<N?S(k+1):TL.dur,u=cl(t,st,en),z=1+.06*u;
  h+=`<div style="position:absolute;inset:0;transform:translateX(${dx.toFixed(1)}px) scale(${z.toFixed(4)});transform-origin:540px 900px;${blur?`filter:blur(${blur.toFixed(1)}px);`:''}">${ANIM[ty](t,k)}</div>`}
 return h}
function draw(t){if(!TL)return;
 $('deco').innerHTML=bgDeco(t);
 const fh=fgLayer(t);if(fh!==$('fg')._h){$('fg').innerHTML=fh;$('fg')._h=fh}
 $('pat').style.transform=`translateY(${(-(t/TL.dur*52*8)%52).toFixed(1)}px)`;
 const c=t>=TL.lines[TL.lines.length-1].end-.02?'':MG.captions(t,{y:1570,size:66,maxWords:3,stageW:1080,w:940,upper:true});if(c!==$('cap')._h){$('cap').innerHTML=c;$('cap')._h=c}
 MG.grainTick(t)}
let imgReady=false;
window.setTimeline=tl=>{MG.TL=TL=tl;MG.preload(['samhappy','samthink','tag','ringbox','diamond','arrowdown','beaker','poster','typewriter'].map(IM));Promise.all([document.fonts.load('700 50px P'),document.fonts.load('500 50px P')]).then(()=>{fontsOk=true},()=>{fontsOk=true})};
Object.defineProperty(window,'ready',{configurable:true,get(){return imgReady&&fontsOk},set(v){imgReady=v}});
window.sfxEvents=()=>{const ev=[],N=TL.lines.length,add=(k,t,o={})=>ev.push(Object.assign({k,t:+t.toFixed(3)},o));
 for(let i=1;i<N;i++)add(i%2?'whoosh':'swish',S(i)-.22,{d:.45});
 for(let k=0;k<N;k++){const ty=SP(k).type,a=S(k),d=DU(k);
  if(ty==='hero'&&k===0)add('impact',a+.05);
  if(ty==='hero'&&SP(k).choice){add('pop',a+d*.17);add('pop',a+d*.37)}
  if(ty==='ad'){for(let i=0;i<8;i++)add('click',a+d*(.56+i*.045));add('ding',a+d*.93)}
  if(ty==='must')for(let i=0;i<6;i++)add('pop',a+i*d*.1);
  if(ty==='resell'){for(let i=0;i<7;i++)add('tick',a+d*(.45+i*.05),{f:1500-i*80});add('error',a+d*.82)}
  if(ty==='crash'){for(let i=0;i<6;i++)add('tick',a+d*(.1+i*.1),{f:1400-i*90});add('thud',a+d*.7)}
  if(ty==='lab'){add('pop',a+.2);add('ding',a+d*.3);add('cash',a+d*.8)}}
 ev.sort((a,b)=>a.t-b.t);const out=[];for(const e of ev){if(e.t<0)e.t=0;if(!out.find(o=>o.k==e.k&&Math.abs(o.t-e.t)<.12))out.push(e)}return out};
window.draw=draw;
MG.finish($('stage'),1080,1920,.04,'#0a2a5022',65);
</script>
