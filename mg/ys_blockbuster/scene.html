<!doctype html><meta charset=utf-8><style>
@font-face{font-family:P;src:url(fonts/Poppins-Bold.ttf);font-weight:700}
@font-face{font-family:P;src:url(fonts/Poppins-Medium.ttf);font-weight:500}
html,body{margin:0;background:#4fa6e6}
#stage{position:relative;width:1080px;height:1920px;overflow:hidden;font-family:P,Arial,sans-serif;background:linear-gradient(#5fb4ff 0%,#8fd3ff 45%,#c7ecff 72%,#e9f7ff 100%)}
#sky,#cam,#fx,#grade,#cap{position:absolute;inset:0}
#cam{transform-origin:540px 900px}
#cap{z-index:60}
</style>
<div id=stage><div id=sky></div><div id=cam><div id=fg style="position:absolute;inset:0"></div></div><div id=fx></div><div id=grade></div><div id=cap></div></div>
<script src="../lib/core.js"></script>
<script>
// Short 9:16 – Blockbuster vs Netflix. Sky look (parallax skyline, rays, particles), code-drawn store/envelope/TV objects,
// camera shake + zoom punches, kinetic type, per-scene colour grade.
const {cl,ez,ei,bo,el,lerp}=MG,$=MG.$,W=1080,H=1920;
const C={cream:'#fff6e6',gold:'#ffc94a',green:'#3ddc84',green2:'#1fa45a',red:'#ff5b4a',red2:'#d6402e',ink:'#14202c',neon:'#16c172'};
let TL=null,fontsOk=false,imgReady=false,SHAKES=[],PUNCH=[],BURSTS=[];
const S=i=>TL.lines[i].start,E=i=>TL.lines[i].end,DU=i=>E(i)-S(i),SP=i=>TL.lines[i].spec;
const sg=(t,a,b)=>ei(cl(t,a,b)),R=MG.rnd;
const IM=k=>`img/${k}.png`;
const LW=w=>TL?2*Math.PI*Math.max(1,Math.round(w*TL.dur/(2*Math.PI)))/TL.dur:w;// loop-safe angular speed
const fl=(t,i,a=8)=>Math.sin(t*LW(2.1)+i*1.7)*a;
function obj(k,x,y,w,o={}){const op=o.op??1;if(op<=0.001||w<=1)return'';return `<img src="${IM(k)}" style="position:absolute;left:0;top:0;width:${w.toFixed(1)}px;transform:translate(${(x-w/2).toFixed(1)}px,${(y-w/2).toFixed(1)}px) rotate(${(o.rot||0).toFixed(2)}deg) scaleX(${o.flip?-1:1});opacity:${op.toFixed(3)};filter:drop-shadow(0 ${(w/22).toFixed(0)}px ${(w/14).toFixed(0)}px #000a)${o.glow?` drop-shadow(0 0 ${o.glow}px ${o.gcol||'#38ff9c'})`:''}">`}
function shadow(x,y,w,op=1){return `<div style="position:absolute;left:${x-w/2}px;top:${y-w*.06}px;width:${w}px;height:${w*.12}px;border-radius:50%;background:radial-gradient(#000a,#0000 70%);opacity:${op.toFixed(2)}"></div>`}
function TX(x,y,txt,o={}){const p=o.p??1;if(p<=0)return'';const sz=o.size||64,s=o.s??1;
 return `<div style="position:absolute;left:${x}px;top:${y}px;transform:translate(-50%,-50%) translateY(${((1-Math.min(1,p))*22).toFixed(1)}px) scale(${s.toFixed(3)}) rotate(${o.rot||0}deg);opacity:${Math.min(1,p).toFixed(3)};font:700 ${sz}px/1.05 P,Arial;color:${o.col||C.cream};white-space:nowrap;text-align:center;text-shadow:${MG.outline(o.ol||Math.max(3,Math.round(sz/13)))},0 ${sz/9}px ${sz/3}px #000c${o.glow?`,0 0 ${sz/3}px ${o.glow}`:''}">${txt}</div>`}
// kinetic type: words pop in one after another with overshoot + slight rotation
function KT(x,y,txt,t,t0,o={}){const ws=txt.split(' '),sz=o.size||80,gap=o.stag??.07;let h='';
 const spans=ws.map((w,i)=>{const q=cl(t,t0+i*gap,t0+i*gap+.28);if(q<=0)return `<span style="display:inline-block;opacity:0">${w}</span>`;const s=bo(q),r=(1-ez(q))*(i%2?8:-8);
  return `<span style="display:inline-block;transform:scale(${s.toFixed(3)}) rotate(${r.toFixed(1)}deg);opacity:${Math.min(1,q*3).toFixed(2)}">${w}</span>`}).join(' ');
 return `<div style="position:absolute;left:${x}px;top:${y}px;transform:translate(-50%,-50%);font:700 ${sz}px/1.05 P;color:${o.col||C.cream};white-space:nowrap;text-shadow:${MG.outline(Math.max(3,Math.round(sz/13)))},0 ${sz/9}px ${sz/3}px #000c${o.glow?`,0 0 ${sz/2.5}px ${o.glow}`:''}">${spans}</div>`}
function pill(x,y,txt,o={}){const p=o.p??1;if(p<=0)return'';const sz=o.size||36,s=bo(Math.min(1,p))*(o.s??1);
 const dot=o.dot?`<span style="display:inline-block;width:${sz*.62}px;height:${sz*.62}px;border-radius:50%;background:${o.dot};margin-right:${sz*.3}px;vertical-align:-${sz*.06}px;box-shadow:0 0 12px ${o.dot}"></span>`:'';
 return `<div style="position:absolute;left:${x}px;top:${y}px;transform:translate(-50%,-50%) scale(${s.toFixed(3)});opacity:${Math.min(1,p*2).toFixed(3)};padding:${sz*.34}px ${sz*.7}px;border-radius:${sz*1.2}px;background:${o.bg||'#ffffffee'};color:${o.fg||C.ink};font:700 ${sz}px/1.1 P,Arial;white-space:nowrap;box-shadow:0 10px 26px #000a">${dot}${txt}</div>`}
function stamp(x,y,txt,p,col=C.red,rot=-8,sz=70){if(p<=0)return'';const s=lerp(2.2,1,ez(Math.min(1,p)));return `<div style="position:absolute;left:${x}px;top:${y}px;transform:translate(-50%,-50%) rotate(${rot}deg) scale(${s.toFixed(3)});opacity:${Math.min(1,p*2.5).toFixed(3)};padding:10px 30px;border:8px solid ${col};border-radius:18px;color:${col};font:700 ${sz}px/1 P;letter-spacing:3px;background:#ffffffe6;white-space:nowrap;box-shadow:0 14px 30px #000a">${txt}</div>`}
const money=v=>'$'+MG.fmt(Math.round(v),0);
// ---------- WORLD: parallax night skyline (3 depths) + rays + stars
function skyline(t,depth,seed,base,hgt,col,win){let h='';const sp=[4,10,22][depth],n=[16,11,8][depth],w0=1400/n;
 for(let i=0;i<n+2;i++){const bw=w0*(.7+R(seed+i)*.5),bh=hgt*(.45+R(seed+i+50)*.55),x=i*w0-w0*.5+Math.sin(2*Math.PI*t/TL.dur+depth)*sp*6;
  let wins='';if(win){for(let r=0;r<Math.floor(bh/46);r++)for(let c=0;c<Math.floor(bw/38);c++){if(R(seed*7+i*31+r*5+c)>.62)wins+=`<div style="position:absolute;left:${10+c*38}px;top:${14+r*46}px;width:16px;height:22px;background:#e9f6ff;opacity:${(.45+.4*R(i+r+c+seed)).toFixed(2)}"></div>`}}
  h+=`<div style="position:absolute;left:${x.toFixed(1)}px;top:${(base-bh).toFixed(1)}px;width:${bw.toFixed(1)}px;height:${bh.toFixed(1)}px;background:${col};overflow:hidden">${wins}</div>`}
 return h}
function sky(t){let h='';for(let i=0;i<6;i++){const w=220+R(i)*260,x=R(i+4)*1200-200+Math.sin(2*Math.PI*t/TL.dur+i)*90,y=120+R(i+9)*640;h+=`<div style="position:absolute;left:${x.toFixed(0)}px;top:${y.toFixed(0)}px;width:${w.toFixed(0)}px;height:${(w*.32).toFixed(0)}px;border-radius:999px;background:#fff;opacity:.55;filter:blur(6px);box-shadow:${(w*.25).toFixed(0)}px -${(w*.12).toFixed(0)}px 0 ${(w*.02).toFixed(0)}px #fff"></div>`}
 h+=`<div style="position:absolute;left:-400px;top:-500px;width:1880px;height:1880px;opacity:.18;background:repeating-conic-gradient(from ${(t/TL.dur*44).toFixed(2)}deg at 50% 50%,#ffffff 0deg 6deg,transparent 6deg 22deg);-webkit-mask:radial-gradient(#000 20%,transparent 65%)"></div>`;
 h+=skyline(t,0,11,1420,900,'#b9dcf7',false)+skyline(t,1,23,1440,700,'#8fbfe6',true)+`<div style="position:absolute;left:0;right:0;top:1380px;height:600px;background:linear-gradient(#dfe9f4,#c3d3e6)"></div>`+skyline(t,2,37,1480,420,'#6f9ccc',true);
 h+=`<div style="position:absolute;left:0;right:0;top:1440px;height:8px;background:linear-gradient(90deg,transparent,#ffffffaa,transparent)"></div>`;return h}
// ---------- particles
function dust(t){let h='';for(let i=0;i<28;i++){const ph=(t/TL.dur*(1+Math.floor(R(i)*2))+R(i+5))%1,x=R(i+3)*1080+Math.sin(2*Math.PI*t/TL.dur+i)*20,y=1500-ph*1500;h+=`<div style="position:absolute;left:${x.toFixed(0)}px;top:${y.toFixed(0)}px;width:${(3+R(i)*5).toFixed(1)}px;height:${(3+R(i)*5).toFixed(1)}px;border-radius:50%;background:#ffffff;opacity:${(.25+.4*Math.sin(ph*Math.PI)).toFixed(2)}"></div>`}return h}
function bursts(t){let h='';for(const b of BURSTS){const q=(t-b.t)/.8;if(q<0||q>1)continue;for(let i=0;i<18;i++){const a=i/18*6.283+R(i+b.t*10),r=ez(q)*(160+R(i+3)*160),x=b.x+Math.cos(a)*r,y=b.y+Math.sin(a)*r+q*q*80;
  h+=`<div style="position:absolute;left:${x.toFixed(0)}px;top:${y.toFixed(0)}px;width:${(14*(1-q)+3).toFixed(1)}px;height:${(14*(1-q)+3).toFixed(1)}px;border-radius:50%;background:${b.col};box-shadow:0 0 12px ${b.col};opacity:${(1-q).toFixed(2)}"></div>`}}return h}
// ---------- SCENES
// ---------- code-drawn objects (cartoon style, thick ink outline)
const INK='#16202b';
function storeSVG(x,y,w,o={}){const h=w*.82,g=o.gray||0,lit=o.lit??1,op=o.op??1;if(op<=.001||w<2)return'';
 const sw=Math.max(2,w/70);
 return `<svg viewBox="0 0 400 330" width="${w.toFixed(1)}" height="${h.toFixed(1)}" style="position:absolute;left:0;top:0;transform:translate(${(x-w/2).toFixed(1)}px,${(y-h/2).toFixed(1)}px) rotate(${(o.rot||0).toFixed(2)}deg);opacity:${op.toFixed(3)};filter:grayscale(${g.toFixed(2)}) brightness(${(1-g*.25).toFixed(2)}) drop-shadow(0 ${(w/26).toFixed(0)}px ${(w/16).toFixed(0)}px #000a);overflow:visible">
 <g stroke="${INK}" stroke-width="${(sw*400/w).toFixed(1)}" stroke-linejoin="round">
 <rect x="20" y="70" width="360" height="250" rx="10" fill="#2f6fd6"/>
 <rect x="20" y="70" width="360" height="40" fill="#1f56b3"/>
 <rect x="60" y="8" width="280" height="78" rx="16" fill="#ffc94a"/>
 <rect x="45" y="150" width="140" height="120" rx="6" fill="${lit?'#ffe9a8':'#33414f'}"/>
 <rect x="215" y="150" width="140" height="120" rx="6" fill="${lit?'#ffe9a8':'#33414f'}"/>
 <rect x="170" y="200" width="60" height="120" rx="4" fill="#1b3f86"/>
 </g>
 <text x="200" y="66" text-anchor="middle" font-family="P,Arial" font-weight="700" font-size="54" fill="${INK}">VIDEO</text>
 ${lit?[0,1,2,3,4,5].map(i=>`<rect x="${58+(i%3)*42}" y="${165+Math.floor(i/3)*52}" width="30" height="42" rx="3" fill="${['#ff5b4a','#3ddc84','#60a5fa','#ffc94a','#c084fc','#ff8a3d'][i]}" stroke="${INK}" stroke-width="3"/><rect x="${228+(i%3)*42}" y="${165+Math.floor(i/3)*52}" width="30" height="42" rx="3" fill="${['#60a5fa','#ff8a3d','#ff5b4a','#3ddc84','#ffc94a','#c084fc'][i]}" stroke="${INK}" stroke-width="3"/>`).join(''):''}
 <rect x="20" y="104" width="360" height="14" fill="#ffffff55"/>
 </svg>`}
function envSVG(x,y,w,o={}){const h=w*.68,op=o.op??1;if(op<=.001||w<2)return'';const disc=o.disc??.5;
 return `<svg viewBox="0 0 300 204" width="${w.toFixed(1)}" height="${h.toFixed(1)}" style="position:absolute;left:0;top:0;transform:translate(${(x-w/2).toFixed(1)}px,${(y-h/2).toFixed(1)}px) rotate(${(o.rot||0).toFixed(2)}deg);opacity:${op.toFixed(3)};filter:drop-shadow(0 ${(w/22).toFixed(0)}px ${(w/14).toFixed(0)}px #000a)${o.glow?` drop-shadow(0 0 ${o.glow}px #ff3b3b)`:''};overflow:visible">
 <g stroke="${INK}" stroke-width="7" stroke-linejoin="round">
 <circle cx="150" cy="${(100-disc*120).toFixed(1)}" r="78" fill="#dfe7f2"/><circle cx="150" cy="${(100-disc*120).toFixed(1)}" r="58" fill="none" stroke="#ffffff" stroke-width="5" stroke-dasharray="36 28" opacity=".8"/><circle cx="150" cy="${(100-disc*120).toFixed(1)}" r="20" fill="#fff"/>
 <rect x="8" y="40" width="284" height="158" rx="12" fill="#e5232e"/>
 <path d="M8 60 L150 140 L292 60" fill="none"/></g>
 <rect x="8" y="40" width="284" height="18" fill="#ffffff33"/>
 <text x="150" y="185" text-anchor="middle" font-family="P,Arial" font-weight="700" font-size="30" fill="#fff">DVD</text>
 </svg>`}
function tvSVG(x,y,w,o={}){const h=w*.72,op=o.op??1;if(op<=.001||w<2)return'';const pl=o.play??1;
 return `<svg viewBox="0 0 400 290" width="${w.toFixed(1)}" height="${h.toFixed(1)}" style="position:absolute;left:0;top:0;transform:translate(${(x-w/2).toFixed(1)}px,${(y-h/2).toFixed(1)}px) rotate(${(o.rot||0).toFixed(2)}deg);opacity:${op.toFixed(3)};filter:drop-shadow(0 ${(w/22).toFixed(0)}px ${(w/14).toFixed(0)}px #000a) drop-shadow(0 0 ${(w/10).toFixed(0)}px #ff3b3b88);overflow:visible">
 <g stroke="${INK}" stroke-width="8" stroke-linejoin="round">
 <rect x="10" y="10" width="380" height="230" rx="18" fill="#1d2632"/>
 <rect x="28" y="26" width="344" height="198" rx="8" fill="#b3121d"/>
 <path d="M170 280 L230 280 L215 240 L185 240 Z" fill="#1d2632"/></g>
 <rect x="28" y="26" width="344" height="198" rx="8" fill="url(#tvg)"/>
 <defs><radialGradient id="tvg"><stop offset="0" stop-color="#ff5b4a"/><stop offset="1" stop-color="#7a0a12"/></radialGradient></defs>
 <g transform="translate(200 125) scale(${pl.toFixed(3)})"><circle r="56" fill="#ffffff" stroke="${INK}" stroke-width="7"/><path d="M-16 -28 L30 0 L-16 28 Z" fill="#e5232e"/></g>
 </svg>`}
// ---------- SCENES
function hookTitle(t,t0=-9){return KT(540,200,'WHY YOU SHOULD NEVER',t,t0,{size:62})+KT(540,320,'LAUGH AT A',t,t0+.2,{size:110,col:C.gold})+KT(540,445,'SMALL IDEA',t,t0+.35,{size:120,col:'#ff4f5e',glow:'#ff4f5e66'})}
function chartUp(t,q,x0,y0,w,h,col){const pts=[];for(let i=0;i<=50;i++){const f=i/50,v=.04+.9*Math.pow(f,3.2)+Math.sin(i*1.7)*.012;pts.push([x0+f*w,y0-v*h])}
 const m=Math.max(2,Math.round(q*51)),d='M'+pts.slice(0,m).map(p=>p[0].toFixed(0)+','+p[1].toFixed(0)).join(' L'),lp=pts[m-1];
 return {svg:`<svg width="1080" height="1920" style="position:absolute;left:0;top:0"><path d="${d} L${lp[0].toFixed(0)},${y0} L${x0},${y0} Z" fill="${col}22" /><path d="${d}" fill="none" stroke="${col}" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" style="filter:drop-shadow(0 0 14px ${col})" /></svg>`,lp}}
function tagObj(x,y,w,txt,o={}){if(w<=1)return'';return obj('tag',x,y,w,{rot:o.rot||0})+`<div style="position:absolute;left:${x}px;top:${y+w*.1}px;transform:translate(-50%,-50%) rotate(${(o.rot||0)-90}deg);font:700 ${(w*.11).toFixed(0)}px P;color:${INK};white-space:nowrap">${txt}</div>`}
const ANIM={
 hero(t,k){const sp=SP(k),a=S(k),D=DU(k);let h='';const p=k===0?1:el(cl(t,a-.25,a+.35));
  h+=shadow(330,1450,640,.8)+storeSVG(330,1180+fl(t,1,3),600);
  h+=shadow(830,1450,260,.9)+envSVG(830,1340+fl(t,2,8),240,{rot:-8+fl(t,3,3),disc:.35});
  // laughing emojis float up from the big store (loop-safe)
  for(let i=0;i<6;i++){const ph=((t/TL.dur)*3+i/6)%1;h+=`<div style="position:absolute;left:${(160+R(i)*360).toFixed(0)}px;top:${(1000-ph*420).toFixed(0)}px;font-size:${(44+R(i+3)*36).toFixed(0)}px;opacity:${Math.sin(ph*Math.PI).toFixed(2)}">😂</div>`}
  h+=obj('samthink',860,1060+fl(t,5,4),300*p);
  if(k===0){const q=1-cl(t,a+D*.86,a+D*.98);if(q>0)h+=`<div style="opacity:${q.toFixed(3)}">${hookTitle(t)}</div>`}
  if(sp.choice){const end=TL.dur,out=1-cl(t,end-.6,end-.2);
   h+=`<div style="opacity:${out.toFixed(3)}">`+KT(540,230,'WOULD YOU HAVE LAUGHED?',t,a+.05,{size:70})+pill(540,400,'😂 YES',{p:cl(t,a+D*.15,a+D*.3),size:52,bg:C.red2,fg:'#fff'})+pill(540,540,'🤔 NO WAY',{p:cl(t,a+D*.35,a+D*.5),size:52,bg:'#fff'})+`</div>`;
   const tin=cl(t,end-.5,end-.06);if(tin>0)h+=`<div style="opacity:${tin.toFixed(3)}">${hookTitle(t)}</div>`}
  return h},
 offer(t,k){const a=S(k),D=DU(k);let h='';
  h+=shadow(540,1450,560,.9)+envSVG(540,1120+fl(t,1,6),520,{rot:fl(t,2,2),disc:lerp(0,.45,ez(cl(t,a+.1,a+.6)))});
  const tq=el(cl(t,a+D*.45,a+D*.75));h+=tagObj(800,820+fl(t,3,6),lerp(0,330,tq),'$50 MILLION',{rot:18});
  h+=TX(540,270,money(5e7*sg(t,a+D*.5,a+D*.9)),{size:118,col:C.gold});
  h+=pill(540,410,'📅 2000 · price for all of Netflix',{p:cl(t,a,a+.3),size:40,dot:'#e5232e'});return h},
 giant(t,k){const a=S(k),D=DU(k);let h='';const q=sg(t,a+.05,a+D*.85);
  const N=30,n=Math.round(q*N);
  for(let i=0;i<n;i++){const c=i%5,r=Math.floor(i/5),pp=el(cl(t,a+.05+i*(D*.8/N),a+.05+i*(D*.8/N)+.3));h+=storeSVG(140+c*200,720+r*140+fl(t,i,3),170*pp)}
  h+=TX(540,270,MG.fmt(Math.round(9000*q),0),{size:150,col:C.gold,glow:'#ffc94a66'});
  h+=pill(540,420,'🏬 Blockbuster stores',{p:cl(t,a,a+.3),size:44,bg:'#2f6fd6',fg:'#fff'});return h},
 tiny(t,k){const a=S(k),D=DU(k);let h='';
  // one envelope slides in, a DVD slips out, red loss counter
  const ex=lerp(1300,540,ez(cl(t,a,a+.5)));
  h+=shadow(540,1440,520,.9)+envSVG(ex,1120+fl(t,1,6),500,{rot:-6+fl(t,2,2),disc:.15+.4*sg(t,a+D*.2,a+D*.5)});
  h+=pill(540,410,'📬 Netflix 2000: ~300,000 subscribers',{p:cl(t,a+.1,a+.4),size:38});
  h+=TX(540,270,'−$'+Math.round(57*sg(t,a+D*.55,a+D*.92))+' MILLION',{size:118,col:C.red,p:cl(t,a+D*.5,a+D*.6),glow:'#ff5b4a55'});
  h+=obj('samsad',190,1290+fl(t,4,4),lerp(0,320,el(cl(t,a+D*.6,a+D*.85))));return h},
 laugh(t,k){const a=S(k),D=DU(k);let h='';
  h+=shadow(360,1450,560,.8)+storeSVG(360,1170+fl(t,1,3),540);
  h+=shadow(860,1450,220,.9)+envSVG(860,1340,200,{rot:-10,disc:.3});
  h+=tagObj(830,1080,lerp(330,220,ez(cl(t,a,a+.4))),'$50 MILLION',{rot:18});
  h+=stamp(830,1090,'NO!',cl(t,a+D*.12,a+D*.22),C.red,-12,90);
  for(let i=0;i<8;i++){const q=cl(t,a+D*(.45+i*.05),a+D*(.45+i*.05)+.45);if(q<=0)continue;h+=`<div style="position:absolute;left:${(140+R(i+11)*800).toFixed(0)}px;top:${(1000-ez(q)*300-R(i)*200).toFixed(0)}px;font-size:${(70*el(Math.min(1,q*1.4))).toFixed(0)}px;transform:rotate(${(R(i)*30-15).toFixed(0)}deg)">😂</div>`}
  h+=KT(540,270,'"NO THANKS."',t,a+.1,{size:110,col:C.cream});
  h+=pill(540,410,'Blockbuster CEO, 2000',{p:cl(t,a+.2,a+.5),size:40,bg:C.ink,fg:'#fff'});return h},
 bust(t,k){const a=S(k),D=DU(k);let h='';const g=sg(t,a+.1,a+D*.6);
  h+=shadow(540,1450,700,.9)+storeSVG(540,1140+fl(t,1,2),680,{gray:g,lit:g<.5?1:0});
  // boards across the windows
  const bq=el(cl(t,a+D*.35,a+D*.6));if(bq>0){h+=`<div style="position:absolute;left:${(300).toFixed(0)}px;top:1160px;width:${(480*bq).toFixed(0)}px;height:46px;background:#a07040;border:6px solid ${INK};border-radius:6px;transform:rotate(-8deg);transform-origin:0 50%"></div><div style="position:absolute;left:300px;top:1250px;width:${(480*bq).toFixed(0)}px;height:46px;background:#b07a48;border:6px solid ${INK};border-radius:6px;transform:rotate(7deg);transform-origin:0 50%"></div>`}
  h+=stamp(540,880,'BANKRUPT',cl(t,a+D*.45,a+D*.6),C.red,-8,96);
  h+=TX(540,270,'2010',{size:170,col:C.red,p:cl(t,a,a+.3),glow:'#ff5b4a66'});
  h+=pill(540,430,'9,000 stores → 1 left (Bend, Oregon)',{p:cl(t,a+D*.7,a+D*.85),size:38,bg:C.ink,fg:'#fff'});return h},
 boom(t,k){const a=S(k),D=DU(k);let h='';const q=sg(t,a+.1,a+D*.85);
  const c=chartUp(t,q,100,1450,880,820,C.green);h+=c.svg;
  // envelope morphs into a TV on the tip of the chart
  const m=ei(cl(t,a+D*.25,a+D*.55)),tx=lerp(540,c.lp[0]-120,ez(q)),ty=lerp(1150,Math.max(760,c.lp[1]+40),ez(q));
  h+=envSVG(tx,ty,lerp(420,0,m),{op:1-m,rot:-6});
  h+=tvSVG(tx,ty,lerp(0,440,el(m)),{play:bo(cl(t,a+D*.5,a+D*.7))});
  const v=250*sg(t,a+D*.35,a+D*.88),hit=cl(t,a+D*.88,a+D*.92)*(1-cl(t,a+D*.92,a+D));
  h+=TX(540,270,'$'+Math.round(v)+' BILLION',{size:122,col:C.green2,glow:'#3ddc8488',s:1+.12*hit});
  h+=pill(540,420,'📈 Netflix today',{p:cl(t,a,a+.3),size:44,bg:'#e5232e',fg:'#fff'});return h}
};
const GRADE={hero:'#ffffff00',offer:'#ffc94a0a',giant:'#2f6fd60a',tiny:'#ff5b4a0a',laugh:'#ffc94a08',bust:'#14202c22',boom:'#3ddc840a'};

function fgLayer(t){let h='';const N=TL.lines.length;
 for(let k=0;k<N;k++){const ty=SP(k).type;const hin=ty==='samyell',hout=k+1<N&&SP(k+1).type==='samyell';
  const a=k===0?-1:(hin?S(k)-.05:S(k)-.2),b=k+1<N?(hout?S(k+1)-.05:S(k+1)+.2):TL.dur+1;if(t<a||t>=b)continue;
  const qi=(k===0||hin)?1:ei(cl(t,a,a+.32)),qo=(k+1<N&&!hout)?ei(cl(t,b-.32,b)):0;const dx=(1-qi)*1150-qo*1150,blur=Math.abs(dx)>4?Math.min(16,Math.abs(dx)/36):0;
  const st=k===0?0:S(k),en=k+1<N?S(k+1):TL.dur,u=cl(t,st,en),z=1+.06*u*(k+1<N?1:1-ei(cl(t,TL.dur-.7,TL.dur-.05)));
  h+=`<div style="position:absolute;inset:0;transform:translateX(${dx.toFixed(1)}px) scale(${z.toFixed(4)});transform-origin:540px 900px;${blur?`filter:blur(${blur.toFixed(1)}px);`:''}">${ANIM[ty](t,k)}</div>`}
 return h}
function camera(t){let sx=0,sy=0,rot=0,z=1;for(const s of SHAKES){const q=(t-s.t)/s.d;if(q<0||q>1)continue;const a=s.a*(1-q)*(1-q);sx+=Math.sin(t*90+s.t)*a;sy+=Math.cos(t*77+s.t*3)*a;rot+=Math.sin(t*60)*a*.04}
 for(const p of PUNCH){const q=(t-p.t)/.35;if(q<0||q>1)continue;z+=p.a*Math.sin(q*Math.PI)}
 return `translate(${sx.toFixed(2)}px,${sy.toFixed(2)}px) rotate(${rot.toFixed(3)}deg) scale(${z.toFixed(4)})`}
function gradeAt(t){const N=TL.lines.length;let k=0;for(let i=0;i<N;i++)if(t>=S(i)-.2)k=i;return GRADE[SP(k).type]||'#0000'}
function draw(t){if(!TL)return;
 $('sky').innerHTML=sky(t);
 const fh=fgLayer(t);if(fh!==$('fg')._h){$('fg').innerHTML=fh;$('fg')._h=fh}
 $('cam').style.transform=camera(t);
 $('fx').innerHTML=dust(t)+bursts(t);
 $('grade').innerHTML=`<div style="position:absolute;inset:0;background:${gradeAt(t)}"></div><div style="position:absolute;inset:0;background:radial-gradient(ellipse at 50% 45%,transparent 60%,#0a2a5044 100%)"></div>`;
 const c=t>=TL.lines[TL.lines.length-1].end-.02?'':MG.captions(t,{y:1570,size:66,maxWords:3,stageW:1080,w:940,upper:true});if(c!==$('cap')._h){$('cap').innerHTML=c;$('cap')._h=c}
 MG.grainTick(t)}
window.setTimeline=tl=>{MG.TL=TL=tl;MG.preload(['samthink','samsad','tag'].map(IM));
 const a=i=>S(i),d=i=>DU(i);SHAKES=[];PUNCH=[];BURSTS=[];
 SHAKES.push({t:a(0)+.05,d:.35,a:10});
 PUNCH.push({t:a(1)+d(1)*.6,a:.05});
 PUNCH.push({t:a(2)+d(2)*.85,a:.05});
 PUNCH.push({t:a(3)+d(3)*.6,a:.05});
 SHAKES.push({t:a(4)+d(4)*.15,d:.4,a:14});PUNCH.push({t:a(4)+d(4)*.15,a:.06});
 SHAKES.push({t:a(5)+d(5)*.48,d:.5,a:16});PUNCH.push({t:a(5)+d(5)*.48,a:.06});
 SHAKES.push({t:a(6)+d(6)*.88,d:.5,a:18});PUNCH.push({t:a(6)+d(6)*.88,a:.07});BURSTS.push({t:a(6)+d(6)*.89,x:540,y:280,col:C.green});
 Promise.all([document.fonts.load('700 50px P'),document.fonts.load('500 50px P')]).then(()=>{fontsOk=true},()=>{fontsOk=true})};
Object.defineProperty(window,'ready',{configurable:true,get(){return imgReady&&fontsOk},set(v){imgReady=v}});
window.sfxEvents=()=>{const ev=[],N=TL.lines.length,add=(k,t,o={})=>ev.push(Object.assign({k,t:+t.toFixed(3)},o));
 for(let i=1;i<N;i++)add(i%2?'whoosh':'swish',S(i)-.22,{d:.45});
 for(let k=0;k<N;k++){const sp=SP(k),ty=sp.type,a=S(k),d=DU(k);
  if(ty==='hero'&&k===0){add('impact',a+.05)}
  if(ty==='hero'&&sp.choice){add('pop',a+d*.17);add('pop',a+d*.37)}
  if(ty==='offer'){add('pop',a+d*.5);for(let i=0;i<6;i++)add('tick',a+d*(.52+i*.06),{f:1000+i*100});add('cash',a+d*.9)}
  if(ty==='giant'){for(let i=0;i<10;i++)add('pop',a+d*(.06+i*.08));add('ding',a+d*.86)}
  if(ty==='tiny'){add('swish',a+.05,{d:.5});add('tick',a+d*.6,{f:500});add('pop',a+d*.7)}
  if(ty==='laugh'){add('impact',a+d*.15);add('pop',a+d*.45);add('pop',a+d*.6)}
  if(ty==='bust'){add('impact',a+d*.48)}
  if(ty==='boom'){for(let i=0;i<6;i++)add('tick',a+d*(.35+i*.08),{f:900+i*120});add('pop',a+d*.55);add('impact',a+d*.88);add('cash',a+d*.9)}}
 ev.sort((a,b)=>a.t-b.t);const out=[];for(const e of ev){if(e.t<0)e.t=0;if(!out.find(o=>o.k==e.k&&Math.abs(o.t-e.t)<.12))out.push(e)}return out};
window.draw=draw;
MG.finish($('stage'),1080,1920,.04,'#0a2a5022',65);
