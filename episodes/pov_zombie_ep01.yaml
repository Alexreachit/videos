# POV-360-Episode im Stil der Referenz: ein Schauplatz = ein 360°-Panorama (gratis via Gemini).
# Kamera: [t, yaw, pitch, fov, ease]  yaw 0 = Bildmitte des Panoramas, + = rechts; pitch + = hoch
# Panorama garage_b2: Mitte (yaw 0) = Ausgang mit 2 Zombies, yaw ~-40/-30 = Einkaufswagen + Pfütze,
# yaw ~-75 = Autos links, yaw ~+80 = Auto mit offener Tür rechts.
id: pov_zombie_ep01
title: "Ebene -2 · Teil 1"
badge: "TEIL 1"
clock: "23:47"
width: 720
height: 1280
fps: 30
grade: night
date: "Dienstag, 10. November"
arms:
  image: panos/hands_phone.jpg   # Arme/Handy vor Grün (Gemini) -> Gelenkmodell (cine/arms.py)
# Arm-Posen pro Shot: [t, pose, übergangsdauer]
#   rechts: unten | halten | lesen | zeigen | weg     links: unten | bereit | abwehr | greifen | weg

shots:
  - pano: panos/garage_b2.jpg
    duration: 7
    transition: blink
    arms:
      right: [[0, unten], [2.6, lesen, 0.55], [4.4, halten, 0.6]]
      left:  [[0, unten], [1.2, bereit, 0.7]]
    camera:
      - [0.0, -38, -42, 118]          # aufwachen, Blick auf Pfütze und Einkaufswagen
      - [1.8, -38, -18, 118]
      - [3.6, -80, 0, 116]            # links: Autos
      - [5.6, 78, 0, 116]             # rechts: Auto mit offener Tür
      - [7.0, 60, 0, 114]
    notify:
      - {t: 2.4, until: 6.8, from: "UNBEKANNT", text: "Bleib ruhig. Mach kein Licht an."}
    subs:
      - [0.3, 2.2, "Wo … bin ich?", [120, 190, 255]]
      - [4.2, 6.9, "Wer schreibt mir um diese Uhrzeit?", [120, 190, 255], 0.22]   # über dem Handy
    sfx:
      - [breath, 0.0, -10, 3.0]
      - [click, 2.4, -8]
      - [heartbeat, 2.4, -14, 4.6]

  - pano: panos/garage_b2.jpg
    duration: 8
    arms:
      right: [[0, halten], [4.9, unten, 0.5], [6.0, halten, 0.45]]   # Blick bleibt auf den Zombies
      left:  [[0, bereit], [5.2, abwehr, 0.35]]
    camera:
      - [0.0, 60, 0, 114]
      - [2.5, 2, 0, 108]              # langsam zur Mitte: Ausgang
      - [5.0, 0, 2, 62]               # Blick fokussiert sich auf die zwei Gestalten
      - [8.0, 0, 2, 52, linear]
    flicker: 0.55
    flicker_at: [[3.0, 4.6]]
    notify:
      - {t: 5.6, until: 8.0, from: "UNBEKANNT", text: "Die hören dich. Nicht bewegen."}
    subs:
      - [0.4, 2.6, "Da ist der Ausgang …", [120, 190, 255]]
      - [5.0, 8.0, "Wer steht da?", [255, 90, 90], 0.25]   # über den Zombies, nicht auf dem Handy
    sfx:
      - [heartbeat, 0.0, -8, 8.0]
      - [growl, 5.2, -4, 2.2]
      - [stinger, 4.9, -6]

  - pano: panos/garage_b2.jpg
    duration: 6
    arms:
      right: [[0, lesen], [0.4, unten, 0.3], [1.35, lesen, 0.45], [3.4, halten, 0.5]]
      left:  [[0, abwehr], [3.2, greifen, 0.7]]
    camera:
      - [0.0, 0, 2, 52]
      - [0.5, 0, 0, 100, snap]        # Schreck: Blick weitet sich
      - [2.4, 80, -4, 112, snap]      # Kopfruck nach rechts zum offenen Auto
      - [6.0, 82, -6, 96]
    notify:
      - {t: 1.2, until: 6.0, from: "UNBEKANNT", text: "Das Auto rechts. Die Tür ist offen."}
    subs:
      - [3.0, 6.0, "Ich muss mich entscheiden.", [120, 190, 255], 0.25]
    sfx:
      - [growl, 0.0, -6, 1.8]
      - [click, 1.2, -8]
      - [breath, 2.0, -8, 4.0]

end_card:
  duration: 4
  question: "WAS WÜRDEST\nDU TUN?"
  options: ["AN DEN ZOMBIES VORBEI", "INS AUTO VERSTECKEN"]
