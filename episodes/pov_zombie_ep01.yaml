# POV-360-Episode im Stil der Referenz: ein Schauplatz = ein 360°-Panorama (gratis via Gemini).
# Kamera: [t, yaw, pitch, fov, ease]  yaw 0 = Bildmitte des Panoramas, + = rechts; pitch + = hoch
id: pov_zombie_ep01
title: "Ebene -2 · Teil 1"
badge: "TEIL 1"
clock: "23:47"
width: 720
height: 1280
fps: 30
grade: night

shots:
  - pano: panos/garage_b2.jpg
    duration: 7
    transition: blink
    camera:
      - [0.0, -15, -35, 120]          # Blick nach unten, langsam aufwachen
      - [1.6, -15, -5, 118]
      - [3.4, 55, 0, 118]             # nach rechts umsehen
      - [5.2, -60, 5, 118]            # nach links
      - [7.0, 0, 0, 115]
    notify:
      - {t: 2.2, until: 6.6, from: "UNBEKANNT", text: "Bleib ruhig. Mach kein Licht an."}
    subs:
      - [0.3, 2.0, "Wo … bin ich?"]
      - [4.0, 6.8, "Wer schreibt mir um diese Uhrzeit?"]
    sfx:
      - [breath, 0.0, -10, 3.0]
      - [heartbeat, 2.0, -12, 5.0]
      - [click, 2.2, -8]

  - pano: panos/garage_b2.jpg
    duration: 8
    walk: 0.6
    camera:
      - [0.0, 0, 0, 115]
      - [4.0, 8, -2, 108, linear]    # langsam auf den Ausgang zu
      - [5.2, 150, 3, 118, snap]     # Geräusch hinten -> Kopfruck
      - [8.0, 165, 0, 104]
    flicker: 0.6
    flicker_at: [[5.4, 7.2]]
    notify:
      - {t: 0.6, until: 3.6, from: "UNBEKANNT", text: "Nicht umdrehen."}
    subs:
      - [3.8, 5.2, "Was war das?"]
      - [6.0, 8.0, "Oh nein.", [255, 90, 90]]
    sfx:
      - [footsteps, 0.2, -12, 4.5]
      - [metal, 5.0, -4]
      - [growl, 6.0, -2, 2.0]
      - [heartbeat, 5.0, -4, 3.0]

  - pano: panos/garage_b2.jpg
    duration: 6
    walk: 1.0
    camera:
      - [0.0, 165, 0, 104]
      - [0.5, 10, -3, 122, snap]      # weg und rennen
      - [4.5, 0, -2, 112, linear]
      - [6.0, 0, 2, 100]
    notify:
      - {t: 3.2, until: 6.0, from: "UNBEKANNT", text: "Treppenhaus links. JETZT."}
    subs:
      - [0.6, 2.4, "Lauf!"]
    sfx:
      - [footsteps, 0.4, -4, 5.4]
      - [breath, 0.4, -8, 5.4]
      - [growl, 2.5, -6, 1.6]

end_card:
  duration: 4
  question: "WAS WÜRDEST\nDU TUN?"
  options: ["TREPPENHAUS LINKS", "ZURÜCK INS AUTO"]
